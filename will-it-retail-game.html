  <style>
/* =============================================
   CANONICAL SHORT-FORM SAFE ZONE
   ---------------------------------------------
   Source of truth for safe-area placement across TikTok / Instagram Reels /
   YouTube Shorts. Authoritative reference canvas is 1080×1920 (9:16).
   All values below are derived from that canonical pixel rect and expressed
   as percentages so they work at any viewport size.
   Spec (pixels at 1080×1920):
     safe:        x=60   y=250   w=840   h=1330
     unsafe top:    h=250            (13.02% of height)
     unsafe bot:    h=340 from bot   (17.71% of height)
     unsafe right:  w=180 from right (16.67% of width)
     unsafe left:   none defined, but safe x=60 implies a 5.56% buffer
   Rules:
     - Critical text MUST stay inside the safe rect
     - Subtitles above y=1350 (i.e. above 70.31% from top)
     - Center-weight compositions (avoid right edge for game UI)
   Any element placed outside the safe zone is a layout violation. The
   `?safezone=1` URL param overlays the unsafe zones in red for visual QA.
   ============================================= */
:root{
  --wir-safe-top:    13.02%;  /* 250/1920 */
  --wir-safe-bottom: 17.71%;  /* 340/1920 */
  --wir-safe-left:    5.56%;  /*  60/1080 */
  --wir-safe-right:  16.67%;  /* 180/1080 */
}

/* =============================================
   Full-screen game viewport overrides for SSG main wrapper
   ============================================= */
body { padding: 0 !important; margin: 0 !important; overflow: hidden !important; background:#000 !important; }
main, .main { padding: 0 !important; margin: 0 !important; max-width: none !important; width:100% !important; height:100vh !important; display:flex !important; align-items:center !important; justify-content:center !important; }

* { margin:0; padding:0; box-sizing:border-box; }
html, body {
  width:100%; height:100%; overflow:hidden;
  background:#000;
  font-family:'Inter','Helvetica Neue',Arial,sans-serif;
  user-select:none; -webkit-user-select:none; touch-action:none;
}

/* =============================================
   9:16 VIEWPORT — everything lives inside this
   ============================================= */
#viewport{
  position:relative;
  aspect-ratio:9/16;
  height:100vh;
  max-height:100vh;
  max-width:calc(100vh * 9 / 16);
  background:#0a0a0a;
  overflow:hidden;
}

/* =============================================
   PROGRESS BAR — full width, top of viewport
   ============================================= */
#progress-bar{
  position:absolute;
  top:0;left:0;right:0;
  height:6px;
  background:rgba(255,255,255,0.06);
  z-index:50;
}
#progress-fill{
  position:absolute;
  top:0;right:0;
  height:100%;width:100%;
  background:#22c55e;
  transition:width 0.4s linear,background-color 0.8s;
}

/* =============================================
   INTRO SCREEN
   ============================================= */
#intro{
  position:absolute;inset:0;z-index:100;
  background:#0a0a0a;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
}
#intro-bg{
  position:absolute;inset:0;
  background:url("img/wir/album-grid-bg.jpg") center/cover no-repeat;
  opacity:0.3;
}
#intro-vignette{
  position:absolute;inset:0;
  background:radial-gradient(ellipse at center,transparent 10%,#0a0a0a 65%);
  z-index:1;
}
#intro-content{
  position:relative;z-index:2;
  text-align:center;width:80%;
}
.intro-word{
  font-size:10vh;
  font-weight:900;color:white;
  opacity:0;transform:scale(0);
  line-height:1.1;
  position:absolute;width:100%;
  top:50%;left:0;margin-top:-0.55em;
  white-space:nowrap;
}
@keyframes wordPop{
  0%{opacity:1;transform:scale(0);}
  60%{transform:scale(1.08);}
  100%{opacity:1;transform:scale(1);}
}
@keyframes wordFade{
  0%{opacity:1;transform:scale(1);}
  100%{opacity:0;transform:scale(1.6);}
}
#play-btn{
  position:absolute;bottom:28%;left:50%;transform:translateX(-50%);
  padding:2vh 6vh;
  font-size:2.2vh;font-weight:900;letter-spacing:3px;
  color:white;
  background:linear-gradient(135deg,#FF2D55,#FF9500);
  border:none;border-radius:60px;cursor:pointer;
  opacity:0;z-index:3;
  transition:transform 0.2s;
}
#play-btn:hover{transform:translateX(-50%) scale(1.06);}
@keyframes fadeIn{to{opacity:1;}}

/* =============================================
   GAME SCREEN
   ============================================= */
#game{display:none;position:absolute;inset:0;}

/* --- Timer + Header: top right of safe area --- */
#timer-wrap{
  position:absolute;
  /* Inside canonical safe zone (top 13.02%, right 16.67%) */
  top:var(--wir-safe-top);right:var(--wir-safe-right);
  text-align:right;z-index:51;
}
#timer, #song-counter{
  font-size:5vh;font-weight:900;
  color:#22c55e;font-variant-numeric:tabular-nums;
}
#game-header{
  margin-top:0.3vh;
  text-align:right;
}
#game-title{
  font-size:1.6vh;font-weight:900;
  color:rgba(255,255,255,0.4);letter-spacing:3px;
}
#ep-info{
  font-size:1.2vh;font-weight:700;
  color:rgba(255,255,255,0.25);margin-top:0.2vh;
}

/* --- PIP zone --- */
#pip-zone{
  position:absolute;
  /* Inside canonical safe zone (left 5.56%) */
  top:15.5%;left:var(--wir-safe-left);
  width:15vh;height:12vh;
  border:2px dashed rgba(255,255,255,0.1);
  border-radius:10px;
  display:flex;align-items:center;justify-content:center;
}
#pip-label{
  font-size:1.1vh;font-weight:700;
  color:rgba(255,255,255,0.12);
  text-transform:uppercase;letter-spacing:2px;
}

/* =============================================
   TIERS
   ============================================= */
#tiers{
  position:absolute;
  /* Taller tier list: 26%-72% (46% tall, 9.2% per row) — leaves a catch
     zone of 72-82% for the falling album to rest in. */
  top:26%;left:var(--wir-safe-left);right:18%;
  height:46%;
  display:flex;flex-direction:column;
  justify-content:space-between;
}
.tier-row{
  display:flex;align-items:stretch;
  /* Each tier: 18.5% of #tiers (46% viewport) = 8.5% viewport — and with
     gap accounted by space-between, visual row height ~ 9.2% viewport. */
  height:18.5%;
  border-radius:4px;overflow:hidden;
  transition:transform 0.18s, box-shadow 0.18s;
}
.tier-label{
  width:7vh;min-width:7vh;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  font-weight:900;font-size:3.2vh;color:white;
}
.tier-sublabel{display:none;}
.tier-drop{
  flex:1;
  background:rgba(255,255,255,0.025);
  display:flex;flex-wrap:wrap;align-items:center;
  padding:0.4vh 0.6vh;gap:0.4vh;
  transition:background 0.18s, box-shadow 0.18s, transform 0.18s;
}
/* While the player is holding an album, all tiers light up as valid targets */
.tier-drop.active-target{
  background:rgba(255,255,255,0.08);
  box-shadow:inset 0 0 0 2px rgba(255,255,255,0.18);
}
/* The tier currently under the cursor */
.tier-drop.hover-target{
  background:rgba(255,255,255,0.15);
  box-shadow:inset 0 0 0 2px rgba(255,255,255,0.45);
  transform:scale(1.012);
}
/* Old drag-over class is unused now but kept harmless for safety */
.tier-drop.drag-over{background:rgba(255,255,255,0.07);}

/* =============================================
   STAGING (removed — drop physics replaces the staged-row metaphor)
   The element still exists in the HTML for backwards-compat but is hidden.
   ============================================= */
#staging{display:none !important;}

/* =============================================
   DROP STAGE — holds the currently falling / held album
   Sits at the viewport scope so absolutely-positioned children use
   viewport-relative coords from physicsStep().
   ============================================= */
#drop-stage{
  position:absolute;inset:0;
  pointer-events:none; /* only the album itself is interactive */
  z-index:60;
}
.drop-album{
  position:absolute;
  border-radius:6px;
  overflow:visible;
  cursor:grab;
  pointer-events:auto;
  box-shadow:0 6px 24px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,255,255,0.06);
  transition:transform 0.12s ease-out;
  will-change:transform, left, top;
  user-select:none;-webkit-user-select:none;
}
.drop-album img{
  display:block;width:100%;height:100%;object-fit:cover;border-radius:6px;
  pointer-events:none;
}
.drop-label{
  position:absolute;bottom:-2.2vh;left:50%;transform:translateX(-50%);
  white-space:nowrap;text-align:center;pointer-events:none;
  text-shadow:0 1px 6px rgba(0,0,0,0.9);
}
.dl-title{display:block;font-size:1.1vh;font-weight:700;color:white;}
.dl-artist{display:block;font-size:0.85vh;font-weight:400;color:rgba(255,255,255,0.6);}
.drop-album.settled{
  animation:settledPulse 1.6s ease-in-out infinite;
}
@keyframes settledPulse{
  0%,100%{box-shadow:0 6px 24px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,255,255,0.18), 0 0 14px rgba(255,255,255,0.10);}
  50%   {box-shadow:0 6px 24px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,255,255,0.32), 0 0 24px rgba(255,255,255,0.22);}
}
/* The "picked up" state — 3x scale + strong pulsing rose glow */
.drop-album.picked-up{
  cursor:grabbing;
  transform:scale(3);
  transform-origin:center center;
  z-index:200;
  animation:pickedGlow 0.9s ease-in-out infinite;
}
@keyframes pickedGlow{
  0%,100%{box-shadow:0 0 24px rgba(255,45,85,0.65), 0 0 60px rgba(255,45,85,0.35), 0 0 0 2px rgba(255,255,255,0.7);}
  50%   {box-shadow:0 0 36px rgba(255,45,85,0.95), 0 0 100px rgba(255,45,85,0.55), 0 0 0 3px rgba(255,255,255,0.95);}
}
.drop-album.picked-up .drop-label{display:none;}
.drop-album.skipped{
  animation:skipFade 0.6s ease-in forwards;
  pointer-events:none;
}
@keyframes skipFade{
  0%  {opacity:1;}
  100%{opacity:0;transform:scale(0.7);}
}

/* =============================================
   SONG CARDS
   ============================================= */
.song-card{
  width:8vh;height:8vh;
  border-radius:4px;overflow:hidden;
  position:relative;cursor:grab;
  transition:transform 0.12s,box-shadow 0.12s;
  flex-shrink:0;
}
.song-card img{width:100%;height:100%;object-fit:cover;pointer-events:none;}
.song-card:hover{transform:scale(1.06);box-shadow:0 0 15px rgba(255,255,255,0.15);}
.card-label{
  position:absolute;bottom:0;left:0;right:0;
  background:linear-gradient(transparent,rgba(0,0,0,0.85));
  padding:0.3vh 0.4vh 0.2vh;pointer-events:none;
}
.card-title{
  font-size:0.75vh;font-weight:700;color:white;
  display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.card-artist{
  font-size:0.6vh;font-weight:400;color:rgba(255,255,255,0.55);
  display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}

/* Cards in tiers — slightly bigger than before since rows are taller */
.tier-drop .song-card{width:6.5vh;height:6.5vh;}
.tier-drop .card-label{display:none;}
/* Settled-in-tier card has a brief land animation */
.tier-drop .song-card.placed{animation:placedLand 0.3s cubic-bezier(0.34,1.56,0.64,1);}
@keyframes placedLand{0%{transform:scale(0.4);opacity:0.6;}100%{transform:scale(1);opacity:1;}}

/* =============================================
   GHOST (drag preview)
   ============================================= */
#ghost{
  position:fixed;
  width:10vh;height:10vh;
  border-radius:8px;overflow:hidden;
  pointer-events:none;z-index:999;
  display:none;
  box-shadow:0 0 30px rgba(255,45,85,0.5);
  transition:box-shadow 0.15s;
}
#ghost img{width:100%;height:100%;object-fit:cover;}
#ghost-label{
  position:absolute;bottom:-2vh;left:50%;
  transform:translateX(-50%);
  white-space:nowrap;
  font-size:1.2vh;font-weight:700;color:white;
  text-shadow:0 1px 6px rgba(0,0,0,0.9);
}

/* =============================================
   EFFECTS
   ============================================= */
@keyframes shake{
  0%,100%{transform:translateX(0);}
  25%{transform:translateX(-4px);}
  75%{transform:translateX(4px);}
}
#flash-overlay{
  position:absolute;inset:0;
  background:white;opacity:0;
  pointer-events:none;z-index:90;
}
@keyframes flash{0%{opacity:0.3;}100%{opacity:0;}}

.emoji-particle{
  position:fixed;pointer-events:none;z-index:997;
  font-size:3vh;
  animation:emojiPop 1.3s ease-out forwards;
}
@keyframes emojiPop{
  0%{opacity:1;transform:scale(0) translateY(0);}
  30%{opacity:1;transform:scale(1.4) translateY(-3vh);}
  100%{opacity:0;transform:scale(0.6) translateY(-12vh);}
}
#combo-text{
  position:absolute;top:28%;left:50%;
  transform:translate(-50%,-50%);
  font-size:6vh;font-weight:900;
  color:#FF9500;opacity:0;pointer-events:none;z-index:96;
  text-shadow:0 0 30px rgba(255,149,0,0.5);
}
@keyframes comboFlash{
  0%{opacity:1;transform:translate(-50%,-50%) scale(0.5);}
  50%{transform:translate(-50%,-50%) scale(1.2);}
  100%{opacity:0;transform:translate(-50%,-50%) scale(1);}
}

/* =============================================
   END SCREEN
   ============================================= */
#end-screen{
  display:none;position:absolute;inset:0;z-index:101;
  background:rgba(10,10,10,0.95);
  flex-direction:column;align-items:center;justify-content:center;
}
#end-screen h2{font-size:6vh;font-weight:900;color:white;margin-bottom:1vh;}
#end-screen p{font-size:2vh;color:rgba(255,255,255,0.5);margin-bottom:3vh;}
#replay-btn{
  padding:1.6vh 5vh;font-size:2vh;font-weight:900;
  color:white;background:linear-gradient(135deg,#FF2D55,#FF9500);
  border:none;border-radius:50px;cursor:pointer;
  transition:transform 0.2s;
}
#replay-btn:hover{transform:scale(1.06);}

/* =============================================
   SAFE-ZONE DEBUG OVERLAY (?safezone=1)
   Visualizes the three unsafe zones (top/bottom/right) in red so you can
   verify layout compliance and check what platform UI will cover. Inactive
   by default — body.show-safezone class is set when ?safezone=1 is present.
   ============================================= */
.safezone-overlay{
  position:absolute;inset:0;pointer-events:none;
  display:none;z-index:200;
}
body.show-safezone .safezone-overlay{display:block;}
.safezone-zone{
  position:absolute;
  background:rgba(255,45,85,0.18);
  border:1px dashed rgba(255,45,85,0.7);
  color:rgba(255,255,255,0.7);
  font-size:1.1vh;font-weight:700;
  font-family:Inter,sans-serif;
  letter-spacing:2px;text-transform:uppercase;
  display:flex;align-items:center;justify-content:center;
}
.safezone-zone.top   {top:0;left:0;right:0;height:var(--wir-safe-top);}
.safezone-zone.bottom{bottom:0;left:0;right:0;height:var(--wir-safe-bottom);}
.safezone-zone.right {top:0;bottom:0;right:0;width:var(--wir-safe-right);}
.safezone-frame{
  position:absolute;
  top:var(--wir-safe-top);
  bottom:var(--wir-safe-bottom);
  left:var(--wir-safe-left);
  right:var(--wir-safe-right);
  border:2px dashed rgba(34,197,94,0.7);
  pointer-events:none;
}
  </style>
</head>
<body>
  

  <main>
  <div id="viewport">
  <div id="progress-bar"><div id="progress-fill"></div></div>

  <!-- INTRO -->
  <div id="intro">
    <div id="intro-bg"></div>
    <div id="intro-vignette"></div>
    <div id="intro-content">
      <div id="intro-words"></div>
    </div>
    <button id="play-btn" onclick="startGame()">PLAY</button>
  </div>

  <!-- GAME -->
  <div id="game">
    <div id="timer-wrap">
      <div id="song-counter">0/5</div>
      <div id="game-header">
        <div id="game-title">WILL IT RETAIL?</div>
        <div id="ep-info">EP 1 — DWELL TIME</div>
      </div>
    </div>
    <div id="pip-zone"><span id="pip-label">PIP</span></div>
    <div id="tiers"></div>
    <!-- Drop stage holds the currently falling/held album -->
    <div id="drop-stage"></div>
  </div>

  <div id="flash-overlay"></div>

  <!-- SAFE-ZONE DEBUG OVERLAY — toggled by ?safezone=1 -->
  <div class="safezone-overlay" aria-hidden="true">
    <div class="safezone-zone top">unsafe — top (status / account)</div>
    <div class="safezone-zone bottom">unsafe — bottom (captions / engagement bar)</div>
    <div class="safezone-zone right">unsafe — right (like / comment / share)</div>
    <div class="safezone-frame"></div>
  </div>

  <div id="end-screen">
    <h2 id="end-title"></h2>
    <p id="end-sub"></p>
    <button id="replay-btn" onclick="location.reload()">PLAY AGAIN</button>
  </div>
</div>


<script>
// SONGS is loaded from /data/wir/episodes.json based on the ?ep= URL param.
// See will-it-retail/build-episodes.py for the data pipeline. The game UI
// must not assume any particular episode — only the data shape:
//   { episodes: [{ id, number, title, format, songs: [{title,artist,art,preview}] }] }
let SONGS = [];
let CURRENT_EP = null;

const TIERS = [
  {id:'S',label:'S',sub:'OPTIMAL',color:'#FF2D55'},
  {id:'A',label:'A',sub:'STRONG',color:'#FF9500'},
  {id:'B',label:'B',sub:'ADEQUATE',color:'#8B7500'},
  {id:'C',label:'C',sub:'RISKY',color:'#30B0C7'},
  {id:'D',label:'D',sub:'HARMFUL',color:'#9B956B'},
];

const EMOJIS={
  S:['🎉','✨','🌟','⭐','🎊','💎','🔥'],
  A:['😊','😄','🙂','😁','🤩'],
  B:['👍','💪','✅','👌'],
  C:['😐','😑','🫤','😶','😒'],
  D:['💀','👎','😬','🚫','💩','☠️'],
};

// ========== STATE ==========
// New mechanic: songs DROP one at a time with physics. Preview audio plays
// for the full clip duration; missing the clip = buzzer + skip. Pick up by
// clicking the settled album (3x scale + glow), drag to a tier to place.
let audioCtx;
let gameStarted=false;
let queueIndex=0;
const placements=[]; // {song, tier} per song (tier=null = skipped on timeout)
let currentAudio=null;     // <Audio> playing the current drop
let timeoutTimer=null;     // fallback for songs without preview URL
let DROP=null;             // current drop: {song, el, x, y, vx, vy, settled, picked, placed}
let physicsInterval=null;  // setInterval id (not rAF — survives tab-hidden / iframe)
let lastPlaceTime=0,comboCount=0;
const GRAVITY=0.55;        // px per frame squared (scaled by vh below)
const BOUNCE=0.55;         // energy retained per bounce
const SETTLE_THRESHOLD=0.6;
const ALBUM_VH=12;         // falling album size, vh
const FLOOR_VH_FROM_TOP=82.29; // safe-bottom boundary

// ========== AUDIO ==========
function getAudioCtx(){
  if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended')audioCtx.resume();
  return audioCtx;
}

function playThump(){
  const ctx=getAudioCtx();
  const osc=ctx.createOscillator();
  const gain=ctx.createGain();
  osc.type='sine';
  osc.frequency.setValueAtTime(55,ctx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(28,ctx.currentTime+0.15);
  gain.gain.setValueAtTime(0.5,ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.2);
  osc.connect(gain);gain.connect(ctx.destination);
  osc.start();osc.stop(ctx.currentTime+0.25);
  const bufSize=Math.floor(ctx.sampleRate*0.025);
  const buf=ctx.createBuffer(1,bufSize,ctx.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<bufSize;i++)d[i]=(Math.random()*2-1)*(1-i/bufSize)*0.35;
  const ns=ctx.createBufferSource();ns.buffer=buf;
  const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=180;
  ns.connect(lp);lp.connect(ctx.destination);ns.start();
}

function playTick(){
  const ctx=getAudioCtx();
  const bufSize=Math.floor(ctx.sampleRate*0.006);
  const buf=ctx.createBuffer(1,bufSize,ctx.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<bufSize;i++){d[i]=(Math.random()*2-1)*Math.pow(1-i/bufSize,4)*0.1;}
  const ns=ctx.createBufferSource();ns.buffer=buf;
  const bp=ctx.createBiquadFilter();bp.type='bandpass';bp.frequency.value=4500;bp.Q.value=6;
  const g=ctx.createGain();g.gain.value=0.5;
  ns.connect(bp);bp.connect(g);g.connect(ctx.destination);ns.start();
  const osc=ctx.createOscillator();const g2=ctx.createGain();
  osc.type='sine';osc.frequency.value=2800;
  g2.gain.setValueAtTime(0.05,ctx.currentTime);
  g2.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.015);
  osc.connect(g2);g2.connect(ctx.destination);
  osc.start();osc.stop(ctx.currentTime+0.02);
}

function playDrop(tier){
  const ctx=getAudioCtx();const osc=ctx.createOscillator();const gain=ctx.createGain();
  const freqs={S:880,A:660,B:440,C:330,D:220};
  osc.type='sine';osc.frequency.setValueAtTime(freqs[tier]||440,ctx.currentTime);
  osc.frequency.exponentialRampToValueAtTime((freqs[tier]||440)*1.5,ctx.currentTime+0.08);
  gain.gain.setValueAtTime(0.2,ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.25);
  osc.connect(gain);gain.connect(ctx.destination);osc.start();osc.stop(ctx.currentTime+0.3);
}

function playGrab(){
  const ctx=getAudioCtx();const osc=ctx.createOscillator();const gain=ctx.createGain();
  osc.type='sine';osc.frequency.value=600;
  gain.gain.setValueAtTime(0.05,ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.07);
  osc.connect(gain);gain.connect(ctx.destination);osc.start();osc.stop(ctx.currentTime+0.08);
}

function playCombo(){
  const ctx=getAudioCtx();
  [0,0.08,0.16].forEach((t,i)=>{
    const osc=ctx.createOscillator();const gain=ctx.createGain();
    osc.type='triangle';osc.frequency.value=880*(i+1)/2;
    gain.gain.setValueAtTime(0.1,ctx.currentTime+t);
    gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+t+0.15);
    osc.connect(gain);gain.connect(ctx.destination);
    osc.start(ctx.currentTime+t);osc.stop(ctx.currentTime+t+0.2);
  });
}

function playClear(){
  const ctx=getAudioCtx();
  [0,0.1,0.2,0.3,0.4].forEach((t,i)=>{
    const osc=ctx.createOscillator();const gain=ctx.createGain();
    osc.type='sine';osc.frequency.value=440*Math.pow(2,i/3);
    gain.gain.setValueAtTime(0.12,ctx.currentTime+t);
    gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+t+0.3);
    osc.connect(gain);gain.connect(ctx.destination);
    osc.start(ctx.currentTime+t);osc.stop(ctx.currentTime+t+0.35);
  });
}

function playBuzzer(){
  const ctx=getAudioCtx();const osc=ctx.createOscillator();const gain=ctx.createGain();
  osc.type='sawtooth';osc.frequency.value=110;
  gain.gain.setValueAtTime(0.4,ctx.currentTime);
  gain.gain.setValueAtTime(0.4,ctx.currentTime+0.6);
  gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.9);
  osc.connect(gain);gain.connect(ctx.destination);osc.start();osc.stop(ctx.currentTime+1);
}

// (previewSong removed — audio is now lifecycle-managed by the drop sequence)

// ========== INTRO ==========
function runIntro(){
  const words=['WILL','IT','RETAIL?'];
  const container=document.getElementById('intro-words');
  let delay=400;
  words.forEach((w,i)=>{
    setTimeout(()=>{
      const prev=container.querySelector('.intro-word');
      if(prev)prev.style.animation='wordFade 0.2s ease-in forwards';
      setTimeout(()=>{
        container.innerHTML='';
        const el=document.createElement('div');
        el.className='intro-word';
        el.textContent=w;
        el.style.animation='wordPop 0.3s cubic-bezier(0.34,1.56,0.64,1) forwards';
        container.appendChild(el);
        playThump();
      },i===0?0:250);
    },delay+i*750);
  });
  setTimeout(()=>{
    document.getElementById('play-btn').style.animation='fadeIn 0.6s ease-out forwards';
  },delay+words.length*750+500);
}

function startGame(){
  getAudioCtx();
  document.getElementById('intro').style.display='none';
  document.getElementById('game').style.display='block';
  gameStarted=true;
  queueIndex=0;
  placements.length=0;
  buildTiers();
  updateCounter();
  // Brief beat then first drop
  setTimeout(dropNext, 400);
}

// ========== BUILD ==========
function buildTiers(){
  const container=document.getElementById('tiers');
  container.innerHTML='';
  TIERS.forEach(t=>{
    const row=document.createElement('div');row.className='tier-row';
    const label=document.createElement('div');label.className='tier-label';
    label.style.background=t.color;
    label.innerHTML=t.label+'<span class="tier-sublabel">'+t.sub+'</span>';
    const drop=document.createElement('div');drop.className='tier-drop';drop.dataset.tier=t.id;
    row.appendChild(label);row.appendChild(drop);container.appendChild(row);
  });
}

function updateCounter(){
  document.getElementById('song-counter').textContent=
    Math.min(queueIndex+1,SONGS.length)+'/'+SONGS.length;
}

// ========== DROP SEQUENCE ==========
// One song at a time: spawn album above viewport, gravity + bounce, settle.
// Audio starts at spawn; if it ends before you place it -> buzzer + skip.
function dropNext(){
  if(queueIndex>=SONGS.length){endGame();return;}
  const song=SONGS[queueIndex];
  updateCounter();
  spawnDrop(song);
  startCurrentAudio(song);
}

function spawnDrop(song){
  // Clear any leftover element
  const stage=document.getElementById('drop-stage');
  stage.innerHTML='';
  const vp=document.getElementById('viewport').getBoundingClientRect();
  const albumPx=vp.height*ALBUM_VH/100;
  // Spawn x: center ± 12% jitter, kept inside safe-x
  const safeLeftPx=vp.width*0.0556;
  const safeRightPx=vp.width*0.8333;
  const usableW=safeRightPx-safeLeftPx-albumPx;
  const jitter=(Math.random()*0.24-0.12)*usableW;
  const x=safeLeftPx + usableW*0.5 + jitter;
  const el=document.createElement('div');
  el.className='drop-album';
  el.innerHTML='<img src="'+song.art+'" alt="'+song.title+' by '+song.artist+'"><div class="drop-label"><span class="dl-title">'+song.title+'</span><span class="dl-artist">'+song.artist+'</span></div>';
  el.style.width=albumPx+'px';
  el.style.height=albumPx+'px';
  el.style.left=x+'px';
  el.style.top=(-albumPx*1.2)+'px';
  stage.appendChild(el);
  DROP={song,el,
    x:x, y:-albumPx*1.2,
    vx:(Math.random()*2-1)*1.5,
    vy:0,
    w:albumPx, h:albumPx,
    settled:false, picked:false, placed:false,
    vpW:vp.width, vpH:vp.height,
  };
  el.addEventListener('pointerdown',onAlbumPointerDown);
  startPhysics();
}

function startPhysics(){
  stopPhysics();
  // ~60fps via setInterval (rAF stalls when iframe/tab is hidden, which we
  // observed in preview and which would also bite a backgrounded recording).
  physicsInterval = setInterval(physicsStep, 16);
}
function stopPhysics(){
  if(physicsInterval){clearInterval(physicsInterval);physicsInterval=null;}
}

function physicsStep(){
  if(!DROP||DROP.placed){stopPhysics();return;}
  if(DROP.picked){return;}  // no physics while held — pointermove moves it
  // Apply gravity
  DROP.vy += GRAVITY * (DROP.vpH/800); // scale by viewport so motion is uniform
  DROP.x += DROP.vx;
  DROP.y += DROP.vy;
  // Floor (catch zone top = bottom of safe area)
  const floorY = DROP.vpH * (FLOOR_VH_FROM_TOP/100) - DROP.h;
  if(DROP.y >= floorY){
    DROP.y = floorY;
    if(Math.abs(DROP.vy) < SETTLE_THRESHOLD){
      DROP.vy = 0;
      if(Math.abs(DROP.vx) < SETTLE_THRESHOLD){
        DROP.vx = 0;
        if(!DROP.settled){
          DROP.settled = true;
          DROP.el.classList.add('settled');
        }
        stopPhysics();
      }
    } else {
      DROP.vy *= -BOUNCE;
      DROP.vx *= 0.85;
      playThud();
    }
  }
  // Side walls = canonical safe-x bounds
  const leftWall = DROP.vpW * 0.0556;
  const rightWall = DROP.vpW * 0.8333 - DROP.w;
  if(DROP.x < leftWall){DROP.x = leftWall; DROP.vx *= -BOUNCE;}
  if(DROP.x > rightWall){DROP.x = rightWall; DROP.vx *= -BOUNCE;}
  DROP.el.style.left = DROP.x + 'px';
  DROP.el.style.top = DROP.y + 'px';
}

function playThud(){
  const ctx=getAudioCtx();
  const osc=ctx.createOscillator();const gain=ctx.createGain();
  osc.type='sine';osc.frequency.setValueAtTime(120,ctx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(50,ctx.currentTime+0.1);
  gain.gain.setValueAtTime(0.18,ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.18);
  osc.connect(gain);gain.connect(ctx.destination);
  osc.start();osc.stop(ctx.currentTime+0.2);
}

// ========== AUDIO LIFECYCLE (per drop) ==========
function startCurrentAudio(song){
  stopCurrentAudio();
  const fill=document.getElementById('progress-fill');
  fill.style.transition='width 0.1s linear, background-color 0.6s';
  fill.style.width='100%';
  fill.style.background='#22c55e';
  if(!song.preview){
    // No preview available — give the player 15s default
    timeoutTimer=setTimeout(onClipEnded, 15000);
    // Drain the bar over 15s for visual urgency
    requestAnimationFrame(()=>{fill.style.transition='width 15s linear, background-color 0.6s';fill.style.width='0%';});
    return;
  }
  const a=new Audio(song.preview);
  a.volume=0.45;
  a.preload='auto';
  currentAudio=a;
  a.addEventListener('ended', onClipEnded);
  a.addEventListener('timeupdate', updateClipProgress);
  a.play().catch(()=>{});
}

function stopCurrentAudio(){
  if(currentAudio){
    try{currentAudio.pause();}catch(e){}
    currentAudio.removeEventListener('ended', onClipEnded);
    currentAudio.removeEventListener('timeupdate', updateClipProgress);
    currentAudio=null;
  }
  if(timeoutTimer){clearTimeout(timeoutTimer);timeoutTimer=null;}
}

function updateClipProgress(){
  if(!currentAudio||!currentAudio.duration)return;
  const pct=1 - (currentAudio.currentTime/currentAudio.duration);
  const fill=document.getElementById('progress-fill');
  fill.style.width = (pct*100) + '%';
  if(pct<=0.22)fill.style.background='#ef4444';
  else if(pct<=0.44)fill.style.background='#FF9500';
  else if(pct<=0.67)fill.style.background='#eab308';
  else fill.style.background='#22c55e';
}

function onClipEnded(){
  // Clip ran out before placement -> buzzer + skip
  if(!DROP||DROP.placed)return;
  playBuzzer();
  document.getElementById('game').style.animation='shake 0.4s ease-in-out';
  setTimeout(()=>document.getElementById('game').style.animation='',450);
  // Fade out the album visually then remove
  DROP.placed=true; // prevent re-place
  DROP.el.classList.add('skipped');
  placements.push({song:DROP.song,tier:null});
  stopCurrentAudio();
  setTimeout(()=>{
    if(DROP&&DROP.el)DROP.el.remove();
    DROP=null;
    queueIndex++;
    dropNext();
  }, 700);
}

// ========== PICKUP / DRAG / PLACE ==========
function onAlbumPointerDown(e){
  if(!DROP||DROP.placed)return;
  // Allow pickup even mid-fall (you can grab it before it lands)
  e.preventDefault();
  DROP.picked=true;
  DROP.vx=0;DROP.vy=0;
  DROP.el.classList.add('picked-up');
  document.querySelectorAll('.tier-drop').forEach(d=>d.classList.add('active-target'));
  playGrab();
  // Position so cursor is centered on the (now 3x) album
  movePickedToPointer(e.clientX, e.clientY);
}

function movePickedToPointer(x,y){
  if(!DROP||!DROP.picked)return;
  const w = DROP.w*3, h = DROP.h*3;
  DROP.x = x - w/2;
  DROP.y = y - h/2;
  DROP.el.style.left = DROP.x + 'px';
  DROP.el.style.top  = DROP.y + 'px';
  // Update target tier highlight
  const hover = getTierUnderPoint(x, y);
  document.querySelectorAll('.tier-drop').forEach(d=>{
    d.classList.toggle('hover-target', d===hover);
  });
}

document.addEventListener('pointermove', (e)=>{
  if(!DROP||!DROP.picked)return;
  e.preventDefault();
  movePickedToPointer(e.clientX, e.clientY);
});

document.addEventListener('pointerup', (e)=>{
  if(!DROP||!DROP.picked)return;
  const tierDrop = getTierUnderPoint(e.clientX, e.clientY);
  if(tierDrop){
    placeInTier(tierDrop, e.clientX, e.clientY);
  } else {
    // Released over no tier -> let it fall again
    DROP.picked=false;
    DROP.el.classList.remove('picked-up');
    document.querySelectorAll('.tier-drop').forEach(d=>d.classList.remove('active-target','hover-target'));
    DROP.settled=false;
    DROP.el.classList.remove('settled');
    DROP.vy = 0;
    startPhysics();
  }
});

function placeInTier(tierDrop, x, y){
  if(!DROP||DROP.placed)return;
  DROP.placed = true;
  stopCurrentAudio();
  document.querySelectorAll('.tier-drop').forEach(d=>d.classList.remove('active-target','hover-target'));
  const tier = tierDrop.dataset.tier;
  // Create permanent placed card
  const card = document.createElement('div');
  card.className = 'song-card placed';
  card.innerHTML = '<img src="'+DROP.song.art+'" alt="'+DROP.song.title+'">';
  tierDrop.appendChild(card);
  // Remove the falling album element
  DROP.el.remove();
  placements.push({song: DROP.song, tier});
  // FX
  playDrop(tier); flashScreen(); spawnEmojis(x, y, tier);
  if(tier==='D'){
    document.getElementById('game').style.animation='shake 0.3s ease-in-out';
    setTimeout(()=>document.getElementById('game').style.animation='',350);
  }
  const now=Date.now();
  if(now-lastPlaceTime<2500){comboCount++;if(comboCount>=2)showCombo(comboCount);}
  else{comboCount=1;}
  lastPlaceTime=now;
  DROP=null;
  queueIndex++;
  // Beat then next drop
  setTimeout(dropNext, 700);
}

function getTierUnderPoint(x,y){
  const drops=document.querySelectorAll('.tier-drop');
  for(const d of drops){
    const r=d.getBoundingClientRect();
    if(x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom)return d;
  }return null;
}

// (Old DRAG / staging-tap listeners removed — pickup is now album-element-scoped)

// ========== EFFECTS ==========
function flashScreen(){
  const el=document.getElementById('flash-overlay');
  el.style.opacity='0.3';el.style.animation='flash 0.2s ease-out forwards';
  setTimeout(()=>{el.style.animation='';el.style.opacity='0';},250);
}

function spawnEmojis(x,y,tier){
  const set=EMOJIS[tier]||EMOJIS.B;
  const count=tier==='S'?8:tier==='D'?6:4;
  for(let i=0;i<count;i++){
    const el=document.createElement('div');el.className='emoji-particle';
    el.textContent=set[Math.floor(Math.random()*set.length)];
    el.style.left=(x+Math.random()*80-40)+'px';
    el.style.top=(y+Math.random()*50-25)+'px';
    document.body.appendChild(el);setTimeout(()=>el.remove(),1400);
  }
}

function showCombo(n){
  playCombo();const el=document.getElementById('combo-text');
  el.textContent=n+'x COMBO';
  el.style.animation='comboFlash 0.8s ease-out forwards';
  setTimeout(()=>{el.style.animation='';},900);
}

function endGame(){
  gameStarted=false;
  stopCurrentAudio();
  stopPhysics();
  const placed=placements.filter(p=>p.tier).length;
  const skipped=placements.length - placed;
  const title = placed===SONGS.length ? 'CLEAR!' : (placed===0 ? 'TIME’S UP' : 'DONE');
  document.getElementById('end-title').textContent=title;
  document.getElementById('end-sub').textContent=placed+' placed · '+skipped+' missed';
  if(placed===SONGS.length){playClear();}
  setTimeout(()=>{document.getElementById('end-screen').style.display='flex';},600);
}

// ========== EPISODE LOADER ==========
// Reads ?ep=N from URL (default 1), fetches episodes.json, populates SONGS,
// updates the game header, then kicks off the intro. Single code path —
// ep-1 uses the same loader as every other episode.
function getEpParam(){
  const params=new URLSearchParams(window.location.search);
  const raw=params.get('ep');
  if(!raw)return 1;
  const n=parseInt(raw,10);
  return isNaN(n)?1:n;
}

async function loadEpisode(){
  const epNum=getEpParam();
  let data;
  try{
    const resp=await fetch('data/wir/episodes.json',{cache:'no-store'});
    if(!resp.ok)throw new Error('HTTP '+resp.status);
    data=await resp.json();
  }catch(e){
    showLoadError('Could not load episode data: '+e.message);
    return;
  }
  const ep=(data.episodes||[]).find(x=>x.number===epNum);
  if(!ep){
    showLoadError('Episode '+epNum+' not found. Available: '+
      (data.episodes||[]).map(x=>x.number).join(', '));
    return;
  }
  CURRENT_EP=ep;
  SONGS=ep.songs||[];
  // Update header text dynamically (game-title + ep-info)
  const titleEl=document.getElementById('game-title');
  const epInfoEl=document.getElementById('ep-info');
  if(titleEl)titleEl.textContent='WILL IT RETAIL?';
  if(epInfoEl)epInfoEl.textContent='EP '+ep.number+' — '+ep.title.toUpperCase();
  // Preload art for snappier card render
  SONGS.forEach(s=>{const i=new Image();i.src=s.art;});
  // Kick off intro now that data is ready
  runIntro();
}

function showLoadError(msg){
  const intro=document.getElementById('intro');
  if(!intro)return;
  intro.innerHTML='<div style="color:#fff;text-align:center;padding:4vh;font-size:2vh;line-height:1.5;font-family:Inter,sans-serif;">'+msg+'</div>';
}

// Toggle safe-zone debug overlay via ?safezone=1
if(new URLSearchParams(window.location.search).get('safezone')==='1'){
  document.body.classList.add('show-safezone');
}

setTimeout(loadEpisode,100);
