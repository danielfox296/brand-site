  <style>
/* WIR Notes — companion window pulled up next to the recording surface. */
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  background: #0a0a0a; color: #eaeaea;
  font-family: 'Inter','Helvetica Neue',Arial,sans-serif;
  min-height: 100vh;
}
body { padding: 0 !important; margin: 0 !important; }
main, .main { padding: 0 !important; margin: 0 !important; max-width: none !important; width: 100% !important; }

.notes-wrap {
  max-width: 640px;
  margin: 0 auto;
  padding: 26px 22px 80px;
}

.notes-head {
  border-bottom: 1px solid #222;
  padding-bottom: 14px;
  margin-bottom: 22px;
}
.notes-eyebrow {
  font-size: 11px;
  font-weight: 700;
  color: #ff2d55;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  margin-bottom: 4px;
}
.notes-head h1 {
  font-size: 22px;
  font-weight: 800;
  margin: 0;
  letter-spacing: 0.01em;
  color: #fff;
}

.song-block {
  padding: 18px 0;
  border-bottom: 1px solid #181818;
}
.song-block:last-child { border-bottom: none; }

.song-head {
  display: flex;
  align-items: baseline;
  gap: 10px;
  margin-bottom: 10px;
  flex-wrap: wrap;
}
.song-num {
  font-size: 11px;
  font-weight: 700;
  color: #555;
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.08em;
}
.song-title {
  font-size: 17px;
  font-weight: 700;
  color: #fff;
}
.song-artist {
  font-size: 13px;
  color: #888;
  font-weight: 500;
}

.notes-list {
  margin: 0;
  padding: 0;
  list-style: none;
}
.notes-list li {
  display: flex;
  gap: 10px;
  align-items: flex-start;
  padding: 4px 0;
  font-size: 14px;
  line-height: 1.5;
}
.notes-list li .sign {
  flex-shrink: 0;
  width: 16px;
  font-weight: 800;
  font-size: 13px;
  font-family: 'SF Mono', Menlo, monospace;
  margin-top: 2px;
}
.notes-list li.pro .sign { color: #22c55e; }
.notes-list li.con .sign { color: #ef4444; }
.notes-list li .text { color: #d8d8d8; }

.notes-empty, .notes-error {
  color: #777;
  font-size: 14px;
  padding: 40px 0;
  text-align: center;
}
.notes-error { color: #ef4444; }

/* Inline citation chip — clickable, jumps to the study card below */
.cite-chip {
  color: #ff8aa0;
  text-decoration: none;
  border-bottom: 1px dotted rgba(255, 138, 160, 0.45);
  cursor: pointer;
  transition: color 0.12s, border-color 0.12s;
}
.cite-chip:hover { color: #fff; border-bottom-color: #fff; }
.cite-chip:target,
.study-card:target { /* visual ping when scrolled-to */ }

/* "Cited studies" block — one card per unique citation in the episode. */
.notes-studies {
  margin-top: 36px;
  padding-top: 22px;
  border-top: 1px solid #222;
}
.studies-head {
  font-size: 11px;
  font-weight: 700;
  color: #ff2d55;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  margin: 0 0 14px;
}
.study-card {
  padding: 14px 16px;
  background: #131313;
  border: 1px solid #1f1f1f;
  border-radius: 6px;
  margin-bottom: 10px;
  scroll-margin-top: 16px; /* offset when jumped via #anchor */
}
.study-card:target {
  border-color: #ff2d55;
  box-shadow: 0 0 0 1px rgba(255, 45, 85, 0.5);
}
.study-key {
  font-size: 11px;
  font-weight: 700;
  color: #ff8aa0;
  letter-spacing: 0.08em;
  font-family: 'SF Mono', Menlo, monospace;
  margin-bottom: 6px;
}
.study-title {
  font-size: 15px;
  font-weight: 700;
  color: #fff;
  line-height: 1.35;
  margin-bottom: 6px;
}
.study-citation {
  font-size: 12px;
  color: #888;
  font-style: italic;
  margin-bottom: 8px;
}
.study-summary {
  font-size: 13px;
  color: #c8c8c8;
  line-height: 1.5;
  margin-bottom: 8px;
}
.study-stat {
  font-size: 13px;
  color: #d8d8d8;
  line-height: 1.5;
  padding: 8px 10px;
  background: #0d0d0d;
  border-left: 2px solid #22c55e;
  border-radius: 0 3px 3px 0;
}
.study-stat .stat-label {
  display: block;
  font-size: 10px;
  font-weight: 700;
  color: #22c55e;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  margin-bottom: 4px;
}
.study-card.missing {
  border-color: #4a2222;
}
.study-card.missing .study-meta {
  font-size: 12px;
  color: #888;
}

.notes-foot {
  margin-top: 26px;
  padding-top: 14px;
  border-top: 1px solid #1a1a1a;
  font-size: 12px;
  color: #555;
  display: flex;
  justify-content: space-between;
}
.notes-foot a {
  color: #888;
  text-decoration: none;
}
.notes-foot a:hover { color: #fff; }

<body>
  

  <main>
  <div class="notes-wrap">
  <div class="notes-head">
    <div class="notes-eyebrow" id="notes-eyebrow">WIR — Loading…</div>
    <h1 id="notes-title">&nbsp;</h1>
  </div>
  <div id="notes-body">
    <div class="notes-empty">Loading…</div>
  </div>
  <div id="notes-studies" class="notes-studies" hidden>
    <h2 class="studies-head">Cited studies</h2>
    <div id="studies-list"></div>
  </div>
  <div class="notes-foot">
    <span id="notes-foot-left">Companion window</span>
    <a href="wir-studio.html" target="_blank">↗ Studio</a>
  </div>
</div>

<script>
(async()=>{
  function escapeHtml(s){return (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
  const params = new URLSearchParams(location.search);
  const epNum = parseInt(params.get('ep')||'1', 10);
  const body = document.getElementById('notes-body');
  const eyebrow = document.getElementById('notes-eyebrow');
  const title = document.getElementById('notes-title');
  const footLeft = document.getElementById('notes-foot-left');
  const studiesWrap = document.getElementById('notes-studies');
  const studiesList = document.getElementById('studies-list');

  let data, studies = {};
  try{
    const [respEps, respStudies] = await Promise.all([
      fetch('data/wir/episodes.json', {cache: 'no-store'}),
      fetch('data/wir/studies.json', {cache: 'no-store'}),
    ]);
    data = await respEps.json();
    studies = await respStudies.json();
  }catch(e){
    body.innerHTML = '<div class="notes-error">Failed to load: '+escapeHtml(e.message)+'</div>';
    return;
  }
  const ep = (data.episodes||[]).find(e => e.number === epNum);
  if(!ep){
    body.innerHTML = '<div class="notes-error">Episode '+epNum+' not found.</div>';
    return;
  }
  document.title = 'EP '+epNum+' — '+ep.title+' · WIR Notes';
  eyebrow.textContent = 'EP '+String(epNum).padStart(2,'0')+' · '+ep.format;
  title.textContent = ep.title;
  footLeft.textContent = 'EP '+epNum;

  const notes = ep.notes || [];
  if(notes.length === 0){
    body.innerHTML = '<div class="notes-empty">No commentary written yet for this episode.</div>';
    return;
  }

  // Citation pattern matches "(Author Year)" — accent-letter aware so
  // "(Doucé 2020)" parses correctly. Year is 4 digits.
  const CITE_RE = /\(([A-Za-zÀ-ÿ&\.\s\-]+?\s\d{4})\)/g;
  const citedKeys = new Set();
  function chipify(text){
    // Replace each "(Author Year)" inline with a clickable chip that
    // scrolls to the matching study card below.
    return escapeHtml(text).replace(CITE_RE, (m, key) => {
      const cleanKey = key.trim();
      citedKeys.add(cleanKey);
      const anchorId = 'study-' + cleanKey.replace(/[^A-Za-z0-9]+/g,'-').toLowerCase();
      return '<a class="cite-chip" href="#'+anchorId+'">'+escapeHtml(cleanKey)+'</a>';
    });
  }

  body.innerHTML = notes.map((n, i) => {
    const pros = (n.pros||[]).map(t => '<li class="pro"><span class="sign">+</span><span class="text">'+chipify(t)+'</span></li>').join('');
    const cons = (n.cons||[]).map(t => '<li class="con"><span class="sign">−</span><span class="text">'+chipify(t)+'</span></li>').join('');
    return ''
      + '<div class="song-block">'
      +   '<div class="song-head">'
      +     '<span class="song-num">'+String(i+1).padStart(2,'0')+'</span>'
      +     '<span class="song-title">'+escapeHtml(n.title)+'</span>'
      +     '<span class="song-artist">'+escapeHtml(n.artist)+'</span>'
      +   '</div>'
      +   '<ul class="notes-list">'+pros+cons+'</ul>'
      + '</div>';
  }).join('');

  // Render the "Cited studies" section — one card per study actually
  // referenced in this episode's bullets, in the order their author tag
  // first appears across the episode (loosely matches the listening order).
  const orderedKeys = Array.from(citedKeys).sort((a,b)=>{
    // Sort by year asc, then author alphabetically — easy to scan
    const ya = parseInt(a.split(' ').pop(),10), yb = parseInt(b.split(' ').pop(),10);
    if(ya !== yb) return ya - yb;
    return a.localeCompare(b);
  });
  if(orderedKeys.length === 0){
    studiesWrap.hidden = true;
  } else {
    studiesWrap.hidden = false;
    studiesList.innerHTML = orderedKeys.map(key => {
      const s = studies[key];
      const anchorId = 'study-' + key.replace(/[^A-Za-z0-9]+/g,'-').toLowerCase();
      if(!s){
        return '<div class="study-card missing" id="'+anchorId+'"><div class="study-key">'+escapeHtml(key)+'</div><div class="study-meta">No record in studies.json — citation may be malformed.</div></div>';
      }
      return ''
        + '<div class="study-card" id="'+anchorId+'">'
        +   '<div class="study-key">'+escapeHtml(key)+'</div>'
        +   (s.title ? '<div class="study-title">'+escapeHtml(s.title)+'</div>' : '')
        +   (s.citation ? '<div class="study-citation">'+escapeHtml(s.citation)+'</div>' : '')
        +   (s.summary ? '<div class="study-summary">'+escapeHtml(s.summary)+'</div>' : '')
        +   (s.killer_stat ? '<div class="study-stat"><span class="stat-label">Killer stat</span>'+escapeHtml(s.killer_stat)+'</div>' : '')
        + '</div>';
    }).join('');
  }
})();
</script>
  </main>

  <script>
    // Navigation active state
    const navLinks = document.querySelectorAll('.nav-links a');
    navLinks.forEach(link => {
      if (link.href === window.location.href) {
        link.classList.add('active');
        link.setAttribute('aria-current', 'page');
      }
    });

    // Intersection Observer for fade-up animations
    const observerOptions = {
      threshold: 0.1,
      rootMargin: '0px 0px -50px 0px'
    };

    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
          observer.unobserve(entry.target);
        }
      });
    }, observerOptions);

    document.querySelectorAll('.fade-up, .fade-in').forEach(el => {
      observer.observe(el);
    });

    // Mobile menu toggle
    const menuToggle = document.querySelector('.mobile-menu-toggle');
    const navLinksEl = document.querySelector('.nav-links');
    if (menuToggle && navLinksEl) {
      menuToggle.addEventListener('click', () => {
        const isOpen = navLinksEl.classList.toggle('mobile-open');
        menuToggle.textContent = isOpen ? '✕' : '☰';
        menuToggle.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
      });
    }

    // Nav dropdown toggle (mobile)
    document.querySelectorAll('.nav-dropdown-trigger').forEach(trigger => {
      trigger.addEventListener('click', (e) => {
        e.preventDefault();
        const dropdown = trigger.closest('.nav-dropdown');
        dropdown.classList.toggle('open');
      });
    });

    // Accordion toggle
    document.querySelectorAll('.accordion-trigger').forEach(trigger => {
      trigger.addEventListener('click', () => {
        const accordion = trigger.parentElement;
        const isOpen = accordion.getAttribute('data-open') === 'true';
        accordion.setAttribute('data-open', isOpen ? 'false' : 'true');
        trigger.setAttribute('aria-expanded', isOpen ? 'false' : 'true');
      });
    });

  </script>
</body>
