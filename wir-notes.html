  <!-- First-touch signup attribution. Stamps a `.entuned.co` cookie on the
       FIRST page view so the original source (referrer + UTM) survives the
       entuned.co -> app.entuned.co/start hop. The dashboard's /start reads the
       same cookie (same name + shape) and forwards it to the server. Runs
       early + first-touch-wins so it never overwrites the true upstream. -->
  <script>
    (function () {
      try {
        if (/(?:^|; )entuned_attr=/.test(document.cookie)) return;
        var p = new URLSearchParams(window.location.search);
        var payload = {
          r: document.referrer || undefined,
          lp: (window.location.pathname + window.location.search) || undefined,
          us: p.get('utm_source') || undefined,
          um: p.get('utm_medium') || undefined,
          uc: p.get('utm_campaign') || undefined,
          ut: p.get('utm_term') || undefined,
          un: p.get('utm_content') || undefined,
          t: new Date().toISOString()
        };
        var host = window.location.hostname;
        var domain = (host === 'entuned.co' || /\.entuned\.co$/.test(host)) ? '; domain=.entuned.co' : '';
        document.cookie = 'entuned_attr=' + encodeURIComponent(JSON.stringify(payload)) +
          '; path=/' + domain + '; max-age=' + (30 * 24 * 60 * 60) + '; SameSite=Lax';
      } catch (e) { /* best-effort */ }
    })();
  </script>

/* WIR Notes — companion window pulled up next to the recording surface. */
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  background: #0a0a0a; color: #eaeaea;

main, .main { padding: 0 !important; margin: 0 !important; max-width: none !important; width: 100% !important; }

}

}

}

.notes-list {

  padding: 0;
  list-style: none;
}
.notes-list li {
  display: flex;

/* Inline citation chip — looks like a pill, click pops modal */
.cite-chip {
  display: inline-block;
  background: rgba(255, 45, 85, 0.12);
  color: #ff8aa0;
  border: 1px solid rgba(255, 45, 85, 0.28);
  border-radius: 999px;
  padding: 1px 8px;
  font-size: 11px;
  font-weight: 600;
  font-family: inherit;
  letter-spacing: 0.02em;
  cursor: pointer;
  vertical-align: baseline;
  line-height: 1.4;
  transition: background 0.12s, color 0.12s, border-color 0.12s;
  margin-left: 4px;
}
.cite-chip:hover { background: rgba(255, 45, 85, 0.22); color: #fff; border-color: #ff2d55; }

/* Modal — fixed overlay, centered card. Designed for the 520px popup. */
.cite-modal {
  position: fixed;
  inset: 0;
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.cite-modal[hidden] { display: none; }
.cite-modal-backdrop {
  position: absolute;
  inset: 0;
  background: rgba(0, 0, 0, 0.78);
  backdrop-filter: blur(2px);
  -webkit-backdrop-filter: blur(2px);
}
.cite-modal-card {
  position: relative;
  background: #141414;
  border: 1px solid #2a2a2a;
  border-radius: 8px;
  padding: 22px 22px 18px;
  max-width: 480px;
  width: 100%;
  max-height: 80vh;
  overflow-y: auto;

}
.cite-modal-close {

  right: 8px;

  border: none;
  color: #777;
  font-size: 24px;
  line-height: 1;
  width: 30px;
  height: 30px;
  cursor: pointer;
  border-radius: 4px;
  font-family: inherit;
}
.cite-modal-close:hover { color: #fff; background: rgba(255, 255, 255, 0.08); }

body.modal-open { overflow: hidden; }

  <main>
  <div class="notes-wrap">
  <div class="notes-head">
    <div class="notes-eyebrow" id="notes-eyebrow">WIR — Loading…</div>
    <h1 id="notes-title">&nbsp;</h1>
  </div>
  <div id="notes-body">
    <div class="notes-empty">Loading…</div>
  </div>
  <div class="notes-foot">
    <span id="notes-foot-left">Companion window</span>
    <a href="wir-studio.html" target="_blank">↗ Studio</a>
  </div>
</div>

<!-- Citation modal — populated and toggled by the script below. -->
<div id="cite-modal" class="cite-modal" hidden aria-hidden="true" role="dialog">
  <div class="cite-modal-backdrop" data-close="1"></div>
  <div class="cite-modal-card">
    <button class="cite-modal-close" type="button" aria-label="Close" data-close="1">×</button>
    <div id="cite-modal-body"></div>
  </div>
</div>

<script>
(async()=>{
  function escapeHtml(s){return (s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
  const params = new URLSearchParams(location.search);
  const epNum = parseInt(params.get('ep')||'1', 10);
  const body = document.getElementById('notes-body');
  const eyebrow = document.getElementById('notes-eyebrow');
  const title = document.getElementById('notes-title');
  const footLeft = document.getElementById('notes-foot-left');
  const modal = document.getElementById('cite-modal');
  const modalBody = document.getElementById('cite-modal-body');

  let data, studies = {};
  try{
    const [respEps, respStudies] = await Promise.all([
      fetch('data/wir/episodes.json', {cache: 'no-store'}),
      fetch('data/wir/studies.json', {cache: 'no-store'}),
    ]);
    data = await respEps.json();
    studies = await respStudies.json();
  }catch(e){
    body.innerHTML = '<div class="notes-error">Failed to load: '+escapeHtml(e.message)+'</div>';
    return;
  }
  const ep = (data.episodes||[]).find(e => e.number === epNum);
  if(!ep){
    body.innerHTML = '<div class="notes-error">Episode '+epNum+' not found.</div>';
    return;
  }
  document.title = 'EP '+epNum+' — '+ep.title+' · WIR Notes';
  eyebrow.textContent = 'EP '+String(epNum).padStart(2,'0')+' · '+ep.format;
  title.textContent = ep.title;
  footLeft.textContent = 'EP '+epNum;

  const notes = ep.notes || [];
  if(notes.length === 0){
    body.innerHTML = '<div class="notes-empty">No commentary written yet for this episode.</div>';
    return;
  }

  // Citation pattern matches "(Author Year)" — accent-letter aware so
  // "(Doucé 2020)" parses correctly. Year is 4 digits.
  const CITE_RE = /\(([A-Za-zÀ-ÿ&\.\s\-]+?\s\d{4})\)/g;
  function chipify(text){
    // Replace each "(Author Year)" inline with a clickable chip. Click
    // pops the study details into the modal — no scrolling, no nav.
    return escapeHtml(text).replace(CITE_RE, (m, key) => {
      const cleanKey = key.trim();
      return '<button type="button" class="cite-chip" data-cite="'+escapeHtml(cleanKey)+'">'+escapeHtml(cleanKey)+'</button>';
    });
  }

  body.innerHTML = notes.map((n, i) => {
    const pros = (n.pros||[]).map(t => '<li class="pro"><span class="sign">+</span><span class="text">'+chipify(t)+'</span></li>').join('');
    const cons = (n.cons||[]).map(t => '<li class="con"><span class="sign">−</span><span class="text">'+chipify(t)+'</span></li>').join('');
    return ''
      + '<div class="song-block">'
      +   '<div class="song-head">'
      +     '<span class="song-num">'+String(i+1).padStart(2,'0')+'</span>'
      +     '<span class="song-title">'+escapeHtml(n.title)+'</span>'
      +     '<span class="song-artist">'+escapeHtml(n.artist)+'</span>'
      +   '</div>'
      +   '<ul class="notes-list">'+pros+cons+'</ul>'
      + '</div>';
  }).join('');

  // Modal open/close handlers — click chip to open, click backdrop / X /
  // press ESC to close. Modal content is rendered fresh from studies.json
  // for whichever citation was clicked.
  function openCite(key){
    const s = studies[key];
    if(!s){
      modalBody.innerHTML = ''
        + '<div class="study-key">'+escapeHtml(key)+'</div>'
        + '<div class="study-missing">No record found for this citation. The shorthand may be malformed in studies.json.</div>';
    } else {
      modalBody.innerHTML = ''
        + '<div class="study-key">'+escapeHtml(key)+'</div>'
        + (s.title    ? '<div class="study-title">'+escapeHtml(s.title)+'</div>' : '')
        + (s.citation ? '<div class="study-citation">'+escapeHtml(s.citation)+'</div>' : '')
        + (s.summary  ? '<div class="study-summary">'+escapeHtml(s.summary)+'</div>' : '')
        + (s.killer_stat ? '<div class="study-stat"><span class="stat-label">Killer stat</span>'+escapeHtml(s.killer_stat)+'</div>' : '');
    }
    modal.hidden = false;
    modal.setAttribute('aria-hidden','false');
    document.body.classList.add('modal-open');
  }
  function closeCite(){
    modal.hidden = true;
    modal.setAttribute('aria-hidden','true');
    document.body.classList.remove('modal-open');
  }
  document.addEventListener('click', (e)=>{
    const chip = e.target.closest('.cite-chip');
    if(chip){
      e.preventDefault();
      openCite(chip.dataset.cite);
      return;
    }
    if(e.target.closest('[data-close="1"]')){
      closeCite();
    }
  });
  document.addEventListener('keydown', (e)=>{
    if(e.key === 'Escape' && !modal.hidden) closeCite();
  });
})();
</script>
  </main>

  <script>
    // Navigation active state
    const navLinks = document.querySelectorAll('.nav-links a');
    navLinks.forEach(link => {
      if (link.href === window.location.href) {
        link.classList.add('active');
        link.setAttribute('aria-current', 'page');
      }
    });

    // Intersection Observer for fade-up animations
    const observerOptions = {
      threshold: 0.1,
      rootMargin: '0px 0px -50px 0px'
    };

    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
          observer.unobserve(entry.target);
        }
      });
    }, observerOptions);

    document.querySelectorAll('.fade-up, .fade-in').forEach(el => {
      observer.observe(el);
    });

    // Mobile menu toggle
    const menuToggle = document.querySelector('.mobile-menu-toggle');
    const navLinksEl = document.querySelector('.nav-links');
    if (menuToggle && navLinksEl) {
      menuToggle.addEventListener('click', () => {
        const isOpen = navLinksEl.classList.toggle('mobile-open');
        menuToggle.textContent = isOpen ? '✕' : '☰';
        menuToggle.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
      });
    }

    // Nav dropdown toggle (mobile)
    document.querySelectorAll('.nav-dropdown-trigger').forEach(trigger => {
      trigger.addEventListener('click', (e) => {
        e.preventDefault();
        const dropdown = trigger.closest('.nav-dropdown');
        dropdown.classList.toggle('open');
      });
    });

    // Accordion toggle
    document.querySelectorAll('.accordion-trigger').forEach(trigger => {
      trigger.addEventListener('click', () => {
        const accordion = trigger.parentElement;
        const isOpen = accordion.getAttribute('data-open') === 'true';
        accordion.setAttribute('data-open', isOpen ? 'false' : 'true');
        trigger.setAttribute('aria-expanded', isOpen ? 'false' : 'true');
      });
    });

  </script>
