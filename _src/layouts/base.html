<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/png" sizes="32x32" href="{{css_path}}img/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="{{css_path}}img/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="192x192" href="{{css_path}}img/favicon-192x192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="{{css_path}}img/apple-touch-icon.png">
  <link rel="manifest" href="{{css_path}}site.webmanifest">
  <link rel="canonical" href="{{canonical_url}}">
  <meta name="robots" content="{{robots}}">
  <title>{{title}}</title>
  {{meta_description}}
  <meta name="theme-color" content="#20201c">

  <!-- Open Graph -->
  {{og_tags}}

  <!-- Twitter Card -->
  {{twitter_tags}}

  <!-- Structured Data -->
  {{schema_json}}

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap">
  <link rel="stylesheet" href="{{css_path}}styles.css">
  {{page_style}}
</head>
<body>
  <main>
  {{content}}
  </main>

  {{footer}}

  <!-- Google Analytics (GA4) — loaded after page content -->
  <script defer src="https://www.googletagmanager.com/gtag/js?id=G-SGMVDBYXFG"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-SGMVDBYXFG');
  </script>

</body>
</html>
