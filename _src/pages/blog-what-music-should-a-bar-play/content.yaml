title: "What Music Should a Bar Play? Why the Volume Matters More Than the Song"
slug: "what-music-should-a-bar-play"
eyebrow: "FIELD NOTES"
dek: "Researchers turned the music up in real bars and watched the drinking change. The lever wasn't which songs were playing — it was the dial on the wall. Which is exactly why it's worth setting on purpose."
