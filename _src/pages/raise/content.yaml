h1_1: Retail audio, taken seriously.
h2_1: Daniel Fox
btn_1: Get in Touch
p_1: Entuned deploys original AI-produced music in retail stores and uses existing behavioral analytics to prove whether retail audio moves the numbers. The pilot is free. The evidence is the asset.
p_2: Every retail chain plays music. Almost none of them know if it is working. The academic literature shows music drives dwell time, willingness to pay, and ticket size. The commercial evidence has never been built at scale. We are building it.
p_3: Generative AI music hit commercial quality in 2024. Original compositions, no licensing costs, no catalog constraints. Retail analytics platforms opened store-level behavioral data over API. The sensor layer already exists in thousands of stores. Nobody was acting on it through the audio surface.
p_4: The incumbent category sells catalogs and dayparting. None of it ties to retail outcomes. The gap sits in plain sight. A provisional patent was filed in April 2026.
p_5: Three to five pilot partners. Treatment and control store pairs across twelve months. At the end, we either have statistically significant proof that retail audio moves the numbers, or we have a clean answer that the thesis does not hold in the conditions we tested. Either outcome is worth the raise.
p_6: Founder and CEO. Music producer, music theoretician, two-time founder.
p_7: This page is confidential and provided for investment evaluation purposes only. Not for distribution. &nbsp;·&nbsp; <a href="index.html">entuned.co</a>
