- type: video
- type: prose
  body: 'Yes — music can increase customer spending by 8–15% depending on tempo, volume, genre, and context. In one famous study, playing French music made customers buy French wine at a 5:1 ratio, and 86% had no idea the music influenced their choice.

    In this video I break down exactly how music moves the register — from cultural priming (the wine study) to volume effects ($3.05 more per check from softer music) to the tempo-mode interaction that produced a 12% spending lift — drawing on 43,676 transactions of real sales data.

    '
- type: prose
  body: 'Here’s a stat that should make every retailer uncomfortable: a single change to your store’s audio environment — one that costs you almost nothing — has been shown to increase daily gross sales by 38%. And the wildest part? Not a single customer noticed it was happening.'
- type: subhead
  text: The Foundational Study
- type: prose
  body: That number comes from the very first controlled experiment on music and retail spending, published in the Journal of Marketing back in 1982. Researchers ran a two-month study in a supermarket — alternating days of slow-tempo background music, fast-tempo music, and no music at all. The results weren’t subtle. Slow music days averaged $16,740 in daily sales. Fast music days? $12,113. That’s a $4,627-per-day gap. And when 216 shoppers were surveyed, the overwhelming majority had no idea what music had been playing, or even that music was playing at all. This wasn’t persuasion. This was environmental architecture.
- type: subhead
  text: It’s Not Just Grocery Stores
- type: prose
  body: Now, you might think — okay, supermarkets, big volume, maybe it’s a fluke. But the research kept coming. A study published in the Journal of Retailing and Consumer Services looked at 550 shoppers across multiple retail environments and found that stores playing music — any music — saw customers stay an average of 8 minutes longer and spend more compared to stores operating in silence. Eight minutes. In retail, that’s an eternity. And that extra dwell time converts directly into dollars.
- type: subhead
  text: Why This Works
- type: prose
  body: 'So what’s actually happening here? A landmark study in the Journal of Retailing introduced a framework that explains it: your store environment creates an emotional state in the first five minutes of a visit. And that emotional state — specifically the “pleasure” dimension — directly predicts how much unplanned spending happens. This was confirmed with actual purchase data, not just surveys. Shoppers who felt more pleasant in the first five minutes bought things they didn’t plan to buy. Environment creates emotion. Emotion creates spending. Music is the single cheapest lever you have to shift that emotional state.'
- type: subhead
  text: What Kind of Spending?
- type: prose
  body: 'But here’s where it gets interesting. Research out of Marketing Letters tested what happens when you combine tempo with musical mode — major key versus minor key. Slow tempo in a minor key produced roughly a 12% lift in spending. But here’s the kicker: switch to a major key and the tempo effect disappeared entirely. The emotional character of the music matters as much as the speed. You can’t just throw on a “chill playlist” and expect results. The specific combination of musical properties is what moves the needle. And a study in Perceptual and Motor Skills found that in restaurant settings, simply playing softer music increased the average check by about $3.05 — roughly 15% more per table. Genre didn’t even matter. Volume alone was enough to shift spending behavior.'
- type: subhead
  text: The Entuned Connection
- type: prose
  body: 'This is exactly why we built Entuned. Most retailers are still picking playlists the way they pick paint colors — based on personal taste. But the research is clear: specific musical properties drive specific spending outcomes. Our platform uses this body of research to generate music that’s engineered for your store’s context — tempo, mode, energy, all of it calibrated to what the data says actually works. And because it’s generative, you’re never stuck on a playlist that gets stale.'
- type: transcript
  chapters: *id001
- type: subhead
  level: 2
  text: Can music actually make customers spend more?
- type: prose
  body: 'Yes. A 1999 study in the Journal of Applied Psychology showed French music made customers buy French wine at a 5:1 ratio — and 86% had no idea. A 2003 study found softer music increased restaurant checks by ~15%. A 2012 study found slow tempo in a minor key lifted sales by 12%. The effect is real and replicated across settings.

    '
- type: subhead
  level: 2
  text: Isn't this just correlation? Maybe people who spend more happen to like certain music?
- type: prose
  body: 'These are controlled experiments, not observational studies. Researchers held everything constant — same products, same prices, same staff — and changed only the music. The 1999 wine study alternated French and German music on different days with the same display. The spending difference tracked the music, not the customers.

    '
- type: subhead
  level: 2
  text: What should I actually change in my store?
- type: prose
  body: 'Three things to try: (1) Lower your volume slightly — the research shows softer music increases check size. (2) If you sell premium or pleasure-oriented products, test classical or jazz — it raises perceived value. (3) Match your music''s cultural associations to your product positioning. For a system that manages these variables automatically, try Entuned free at entuned.co. Full citations in the description. This is video 2 of 50 in this series.

    '
