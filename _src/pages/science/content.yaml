eyebrow_1: Four Decades of Evidence
btn_1: "Start Free"
btn_2: "Talk to Enterprise"
p_1: "Forty years of research says music changes how customers shop. Most shop owners have never seen it. Here's what the studies measured, what we measured in our pilot, and where the evidence stops."
p_2: "Your stores track foot traffic, conversion, dwell time, and basket size. You have opinions about lighting, layout, signage, and staffing. The audio is the one variable that reaches every customer within three seconds of the door, and almost nobody measures it."
p_3: "Researchers have measured it for thirty years. Ron Milliman ran the original grocery-store experiment in 1982 and found shoppers moved more slowly and spent more when the tempo dropped. Charles Areni and David Kim followed with a wine cellar study in 1993. Adrian North and his collaborators kept going through the nineties and two thousands. The published record is deep, specific, and retailer-relevant."
p_4: "Published studies have linked specific musical choices to dwell time, willingness to pay, and purchase behavior. Entuned starts from that research. Every track we deliver is built for your customer and your store, not pulled from a catalog of somebody else's taste."
p_5: "Every claim below traces back to a named researcher, a real sample size, and an effect magnitude you can look up. Read the papers. Argue with the methods. Then decide what to do with your store soundtrack."
p_6: "Engineered audio in your store. Free forever on Entuned Free &mdash; no credit card, no time limit, no auto-renew. Upgrade to Core or Professional when you want music tailored to a specific customer profile."

card_title_1: Dwell Time Increase
card_text_1: "Milliman (1982) found that slower music increased grocery dwell time by 38 percent. Knoferle and colleagues (2011) later showed the lift depends on more than tempo alone. The research is specific about what works and what does not, and most store music providers have never read any of it."
card_title_2: Willingness to Pay
card_text_2: "Areni and Kim (1993) found that classical music in a wine cellar nearly doubled average transaction value. North, Hargreaves, and McKendrick (1999) found that French music tripled French wine sales. Customers spent more when the music matched the context."
card_title_3: Familiarity Hurts
card_text_3: "Yalch and Spangenberg (2000) found that familiar music drove shoppers out of a department store 8 percent faster. Customers reported enjoying the familiar music more, but they left sooner. Original music avoids that trap."
card_title_4: Transaction Value Lift
card_text_4: "Areni and Kim (1993) measured average transaction value rising from $6.93 to $12.31 when the wine cellar played classical music. Customers bought more expensive bottles, not more bottles. The audio shifted what people perceived the room was selling."

cite_1: Milliman (1982)
cite_desc_1: "Slower music increased grocery store dwell time by 38 percent and daily gross receipts by 32 percent. The foundational paper linking tempo to shopping behavior."
cite_2: Areni & Kim (1993)
cite_desc_2: "Classical music in a wine cellar nearly doubled average transaction value. Shoppers chose more expensive bottles, not more bottles."
cite_3: North, Hargreaves & McKendrick (1999)
cite_desc_3: "French music tripled French wine sales over two weeks. German music doubled German wine sales. Shoppers denied that the music influenced them."
cite_4: Yalch & Spangenberg (2000)
cite_desc_4: "Familiar music drove shoppers out of a department store 8 percent faster. They reported liking it more but left sooner."
cite_5: Knoferle et al. (2011)
cite_desc_5: "Showed that tempo alone does not predict sales. The interaction between musical choices matters more than any single variable."
cite_6: Andersson et al. (2012)
cite_desc_6: "Ran 601 real transactions and found that music mismatched to the store reduced willingness to pay. Getting the music wrong costs money."

