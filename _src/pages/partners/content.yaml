# partners — editable text content

eyebrow_1: "PARTNER PROGRAM"
h1_1: "Your clients control every variable in the store. Except what&rsquo;s playing."
subline_1: "Entuned composes original music around a store&rsquo;s customer psychology. Refer your retail clients, earn 20% recurring commission on every subscription."

# Section 1 — The Gap
eyebrow_2: "THE PROBLEM"
h2_1: "The audio is always the afterthought."
p_1: "Lighting gets a plan. Fixtures get a budget. Product placement follows a merchandising strategy. Visual elements are deliberate down to the paint color."
p_2: "The music is a Spotify playlist someone made three months ago."
p_3: "Research going back to Milliman (1982) has consistently shown that in-store music changes customer behavior. Tempo affects how long people stay. Genre congruence with brand identity affects what they spend. Environmental fit shifts how customers perceive the store itself."
p_4: "Almost nobody in independent retail treats audio as a controllable variable. Your clients are leaving a behavioral lever on the floor."

# Section 2 — What Entuned Does
eyebrow_3: "THE PLATFORM"
h2_2: "Original music, composed around customer psychology."
p_5: "Entuned profiles a store&rsquo;s ideal customer psychographically, then composes original music targeting that profile. Tempo, mode, instrumentation, genre congruence, lyrical density. Every parameter maps to a specific behavioral outcome."
p_6: "No playlist. No catalog. No licensed tracks carrying someone else&rsquo;s brand associations."
p_7: "Original music, built from customer psychology, with no licensing liability. Plays in-browser. No hardware. No app install. $99/month per location."
step_1: "Profile the store&rsquo;s ideal customer (psychographic, not demographic)"
step_2: "Translate that psychology into musical parameters (tempo, mode, instrumentation, genre congruence)"
step_3: "Compose original music targeting those parameters"
step_4: "Stream continuously in-store via web player"

