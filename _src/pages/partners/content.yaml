# Section 7 — FAQ
faq_1_q: "How does commission work?"
faq_1_a: "You earn 20% of the monthly subscription for every client who signs up through your referral link and converts to paid after the free period. Commission is recurring for as long as the client stays subscribed."
faq_2_q: "When do I get paid?"
faq_2_a: "Monthly, after the client&rsquo;s payment processes. Minimum payout threshold: $50. Paid via Stripe Connect or PayPal."
faq_3_q: "What if my client cancels?"
faq_3_a: "Commission stops when the subscription stops. If they resubscribe, commission resumes."
faq_4_q: "Do I need to be technical?"
faq_4_a: "No. You make the introduction. Entuned handles everything from onboarding to support. The player runs in-browser with no hardware required."
faq_5_q: "What does Core include that Free doesn&rsquo;t?"
faq_5_a: "Core includes psychographic profiling of the store&rsquo;s ideal customer and music composed to match that profile. The Free tier uses broad behavioral modes without ICP customization."
faq_6_q: "Can I white-label Entuned?"
faq_6_a: "Not currently. We&rsquo;re open to discussing that with high-volume partners."
