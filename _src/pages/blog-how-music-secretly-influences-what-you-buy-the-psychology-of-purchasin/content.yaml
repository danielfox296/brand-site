- type: video
- type: prose
  body: 'Music influences purchasing decisions through four pathways: tempo drives variety-seeking behavior, cultural cues prime product selection, emotional state triggers impulse buys, and volume shifts cognitive mode. A 2019 study found that low-volume music (55 dB) led customers to make healthier food choices by activating more deliberate thinking.

    In this video I break down how music shapes the structure of purchasing decisions — from a 2023 Frontiers in Psychology study on tempo and variety-seeking to the tempo-mode interaction where two songs at the same BPM produce opposite sales effects depending on key signature.

    '
- type: prose
  body: French music plays in a grocery store. French wine outsells German wine. The music switches to German oompah. German wine outsells French. And when you ask the shoppers why they chose what they chose — the overwhelming majority say the music had nothing to do with it. This is how music influences purchasing decisions. Not through persuasion. Through priming. And you never see it coming.
- type: subhead
  text: The Invisible Hand
- type: prose
  body: 'That wine study, published in the Journal of Applied Psychology in 1999, remains the single cleanest demonstration of music-driven purchasing behavior in the literature. The design was elegant: equal shelf space, matched prices, alternating music days. The effect was massive. But the mechanism is what matters — music activated cultural associations that made one origin feel more “right” than the other. This is priming. The music didn’t say “buy French.” It made French feel obvious. And that distinction — between suggestion and environmental priming — is the entire reason most retailers get this wrong. They think music is decoration. It’s actually architecture.'
- type: subhead
  text: Classical Music and Price Anchoring
- type: prose
  body: 'Here’s another version of the same mechanism. A study published in Advances in Consumer Research put classical music in a wine store. Customers didn’t buy more wine — same number of bottles either way. But they bought significantly more expensive bottles. The classical music shifted the perceived quality of the environment upward, and customers’ purchasing decisions followed. They reached for the higher shelf. Recent research published in Marketing Letters in 2025 extended this even further: classical music raised the maximum price people were willing to pay for hedonic products — but only when the music also produced high pleasure. If the classical music felt stuffy or unpleasant, the effect collapsed. The music has to feel good AND signal quality. Both.'
- type: subhead
  text: Emotional State Drives the Decision
- type: prose
  body: 'The deeper mechanism was mapped by research in Psychology and Marketing in 1997: environment shapes emotion, and emotion shapes purchase behavior. This isn’t hand-wavy — it’s a tested causal chain. Specifically, the emotional state of the shopper mediates the relationship between store atmosphere and buying behavior. Impulse purchases aren’t random — they’re emotional responses to sensory conditions. A follow-up framework from the Journal of Retailing showed this with actual spending data: the pleasure a customer feels within the first five minutes of entering a store predicts how much unplanned spending they’ll do. Not what they planned to buy — what they didn’t plan to buy. That’s the purchasing decision music is really influencing. Not whether someone buys the thing they came for. Whether they buy the three things they didn’t.'
- type: subhead
  text: Tempo, Mode, and the 12% Lift
- type: prose
  body: But not all music influences decisions equally. Research published in Marketing Letters tested specific combinations of tempo and musical mode on actual retail sales. Slow tempo combined with minor key produced roughly a 12% lift. But switch to a major key — keep everything else the same — and the tempo effect vanished entirely. The emotional character of the music modulates its commercial power. This means the difference between music that drives purchasing and music that does nothing can come down to a single musical property that most retailers have never heard of.
- type: subhead
  text: The Entuned Connection
- type: prose
  body: This is why we built Entuned as a generative platform, not a playlist tool. Purchasing decisions are influenced by specific, measurable musical properties — tempo, mode, cultural associations, emotional valence. You can’t reliably control these properties by picking songs off a streaming service. But you can engineer them. Entuned generates music with these variables dialed in, so your store’s audio is working on purchasing behavior at the level the research says actually matters.
- type: transcript
  chapters: *id001
- type: subhead
  level: 2
  text: How does music influence what customers buy?
- type: prose
  body: 'Music shapes purchasing through four pathways: (1) Fast tempo triggers variety-seeking — customers buy across more categories (Sun et al., 2023). (2) Cultural cues prime product selection — French music drove French wine purchases over German (North et al., 1999). (3) Emotional state drives impulse buying — pleasure in the first 5 minutes predicts unplanned spending (Donovan et al., 1994). (4) Volume shifts cognitive mode — low volume (55 dB) leads to more deliberate, healthier choices (Biswas et al., 2019).

    '
- type: subhead
  level: 2
  text: Two songs at the same tempo can really have opposite effects?
- type: prose
  body: 'Yes. A 2012 Marketing Letters study found that slow tempo in a minor key produced a 12% sales lift, but the same slow tempo in a major key produced zero lift. The harmonic character (major vs. minor key) modulates whether tempo effects even work. Any system that only tracks BPM is missing half the equation.

    '
- type: subhead
  level: 2
  text: How do I use this in my store without a music theory degree?
- type: prose
  body: 'Focus on what''s actionable: (1) If you want customers to explore your range, uptempo helps. If you want them to commit to premium items, go slower. (2) Turn volume down slightly — it shifts customers toward more deliberate purchasing. (3) For a system that manages tempo, mode, and volume together based on the research, try Entuned free at entuned.co. Full citations in the description. This is video 6 of 50 in this series.

    '
