# for-apparel — editable text content
# Operator-buyer reframing per migration plan.
# Covers off-price apparel and footwear (Cato, K&G, TJX, Famous Footwear, Shoe Palace).

hero:
  eyebrow: "For apparel &amp; footwear retail"
  h1: "Music that works for the first 10 seconds."
  subline: "Apparel customers decide on sensory evidence in the first ten seconds. Entuned produces original music tuned to your customer&rsquo;s pace, energy, and identity &mdash; engineered to win the threshold moment. Running 5&ndash;50 stores? Start a measured pilot &mdash; twelve weeks, no cost, read in your own reporting. Single store? Stream Entuned Free, no card."

# The gap
gap:
  eyebrow: "The Gap"
  h2: "Audio is doing work in the room. Almost nobody chose what."
  p1: "Off-price apparel and multi-decision footwear share an operating shape: high foot traffic, conversion as the load-bearing metric, fitting-room dwell that varies by category and weather, and a shopper who is comparing options against price-relative-to-what-else-is-on-the-rack. The store environment shaping those decisions is being delivered by an audio vendor who has never been in your store."
  p2: "Your visual merchandising team is well-staffed. Your real estate team has a model. Store ops owns staffing rotation. The audio environment those teams operate inside is whatever the music vendor sent over."

# What changes per tier
tiers:
  eyebrow: "Three places to start"
  h2: "Three places to start, sized to where you are."

  card1_title: "Entuned Free"
  card1_text: "Free, indefinite. Pick Linger or Lift Energy from the floor of one store. The catalogue starts streaming through the speakers you already have. Useful as the first look in a single location before a multi-store Ideal Customer Profile (ICP) build."

  card2_title: "Boost ($99/location/mo)"
  card2_text: "Music tailored to your single Ideal Customer Profile. For most apparel retailers, that is the customer your buyers are already merchandising for — same person, just specified to the music engine on purpose. About 420 tracks in the first month, refreshed against what holds the floor and culled against what doesn't."

  card3_title: "Professional ($399/location/mo)"
  card3_text: "POS integration. Outcome Scheduling against your traffic profile (lunchtime browsers, evening conversion, weekend volume). Multiple ICPs for stores that draw distinct customer types across the day. Self-improving refinement against your basket and conversion data."

  card4_title: "Enterprise"
  card4_text: "Multi-fleet rollouts across regions and formats. Custom ICP design and brand voice consultation. Performance guarantees where lift can be cleanly measured against your existing reporting. Standard entry shape is a 12-week pilot in matched test and control stores."

# What the research says
research:
  eyebrow: "Forty years of evidence"
  h2: "Forty years of evidence on the levers that matter for high-traffic apparel."

  card1_title: "Tempo affects pace and basket."
  card1_text: "Milliman (1982) measured slower music increasing dwell. Knoferle et al. (2012) showed the effect depends on tempo paired with the right tonal choice — most catalogue vendors have the thermostat without the room."

  card2_title: "Music customers read as theirs moves what they spend."
  card2_text: "Areni and Kim (1993) found that in a wine cellar, customers chose more expensive bottles &mdash; not more of them &mdash; when the music matched the customer profile. North, Shilcock and Hargreaves (2003) found the same prestige-fit effect lifted spend per head in a restaurant. Same items on the rack, different customer read."

  card3_title: "Familiar songs cut perceived dwell."
  card3_text: "Yalch and Spangenberg (2000) found that familiar music made shoppers leave sooner. They reported enjoying it more. They left faster. Catalogue vendors play familiar songs because complaints are minimized — that is the wrong objective for conversion."

  card4_title: "Mismatched music forfeits the lift."
  card4_text: "Music that fits the customer category lifts what shoppers will pay; music that clashes gives that lift back (Areni and Kim 1993; North, Shilcock and Hargreaves 2003). Neutral is not the baseline. The audio environment is doing work in the room whether you chose its effect or not."

