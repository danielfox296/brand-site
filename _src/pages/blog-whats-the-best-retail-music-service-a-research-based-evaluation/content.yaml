  text: What's the best retail music service?
- type: prose
  body: 'The one that checks five research-backed boxes: (1) real-time adaptability to store conditions, (2) independent control over multiple music parameters, (3) genuine brand congruence built into the system, (4) avoidance of familiar-music time distortion, and (5) measurement tools that tie music changes to sales outcomes. Most services check one or two.

    '
- type: subhead
  level: 2
  text: Don't bigger catalogs mean better music?
- type: prose
  body: 'No. Catalog size is table stakes. A 2017 study of 43,000+ baskets showed that the optimal music changes based on crowd density — something a fixed catalog can''t respond to. And a 2000 study found familiar music (the selling point of big catalogs) actually distorts time perception in ways that hurt retailers.

    '
- type: subhead
  level: 2
  text: How do I actually decide?
- type: prose
  body: 'Run any service through the five criteria in this video. Ask: can it adapt in real time? Can I control tempo, mode, and energy independently? Does it match my brand without a curator guessing? Does it avoid familiarity distortion? Can I see what the music is doing to my numbers? Entuned was built against these criteria — try the free tier at entuned.co and score it yourself. Full citations in the description. This is video 34 of 50 in this series.

    '
