  eyebrow: "Pricing"
  headline: "Four tiers. Free forever, then $99 per location, per month."
  subhead: "Free indefinitely on Entuned Free. $99 per location on Boost. $399 per location on Pro. Enterprise negotiated for chains. No credit card to start."

