  q2: "Do I need special hardware?"
  a2: "No. Entuned streams through your existing in-store audio system."
  q3: "What about music licensing?"
  a3: "All music is generated by Entuned. You're fully cleared for commercial in-store use — no PRO fees, no catalog licensing, no legal exposure."
  q4: "Can I cancel?"
  a4: "Yes, monthly. No long-term contract on the Founding plan."
  q5: "I have 5+ locations — should I do Founding or Pilot?"
  a5: "Pilot. It's structured around measuring lift across locations, which is where the real value of Entuned shows up. Founding is for retailers who want in now without the pilot overhead."

