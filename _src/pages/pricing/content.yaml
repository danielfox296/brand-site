faq:
  header: "Questions"
  q1: "Why is Founding pricing so much lower than standard?"
  a1: "The first 20 locations help us refine the product across real retail environments. In exchange for deploying early, you lock in $99 per location per month for 12 months. After 20 locations, standard pricing takes effect."
  q2: "Do I need special hardware?"
  a2: "No. Entuned streams through your existing in-store audio system."
  q3: "What about music licensing?"
  a3: "All music is generated by Entuned. You are fully cleared for commercial in-store use. No PRO fees, no catalog licensing, no legal exposure."
  q4: "Can I cancel?"
  a4: "Yes, monthly. No long-term contract on the Founding plan."
  q5: "I have 5 or more locations. Should I do Founding or Pilot?"
  a5: "Pilot. It is structured around measuring lift across locations, which is where the real value of Entuned shows up. Founding is for retailers who want in now without the pilot overhead."

