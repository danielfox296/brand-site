# How it ramps
ramps:
  header: "How the tiers stack."
  body1: "Essentials proves the system works on your floor. Core proves it works for your customer. Professional proves the lift in the report your CFO already runs. Each tier is a step deeper into the same engine — never a different product."
  body2: "Most operators start on Essentials, move to Core within their first paid quarter, and graduate to Professional once they want the music tied to data they can audit."

# Indemnification callout
indemnification:
  eyebrow: "Licensing"
  header: "PRO-free, fully indemnified — at every tier."
  body: "Every Entuned subscription includes a written indemnification certificate. No ASCAP, BMI, SESAC, or SoundExchange royalties. No public performance license required. If a performing rights organization questions what is playing in your store, you have documentation in hand."
  cta_label: "Read the licensing details →"
  cta_url: "licensing.html"

# FAQ
faq:
  header: "Questions"
  q1: "Why is Essentials actually free?"
  a1: "Because the most expensive moment in the buyer relationship is the gate. The Essentials catalogue is real and indefinite. The structural difference at Core is not artificial scarcity — it is that Core music is built around your specific customer rather than a general catalogue. Most operators move to Core when their floor is ready for that level of specificity."
  q2: "Do I need special hardware?"
  a2: "No. Entuned streams through whatever audio system you already have — Sonos, AirPlay, Bluetooth, line-in, or a hardwired speaker rig."
  q3: "What about music licensing and PRO fees?"
  a3: "All audio Entuned delivers is original and commercial-use cleared. No PRO fees, no catalogue licensing, no public-performance exposure. Every subscription includes a written indemnification certificate. <a href=\"licensing.html\">Full details on the licensing page</a>."
  q4: "Can I cancel?"
  a4: "Yes, monthly. No long-term contract on Core or Professional. Enterprise pricing is negotiated as part of the agreement."
  q5: "What's the difference between Core and Professional?"
  a5: "Core builds music around one Ideal Customer Profile and gives you manual outcome control. Professional adds POS integration, multiple ICPs (Professional tailors music to each distinct customer type your store serves, instead of averaging them into a single profile), day-parting, interstitial messaging, and self-improving refinement that compounds against your store's data over weeks. Most single-store operators start on Core. Multi-store operators with a real measurement stack start on Professional."
  q6: "I already pay Soundtrack Your Brand or Mood Media. How does this compare?"
  a6: "Those vendors license catalogue music from PROs and pass the cost through your subscription. The catalogue was written for an artist's self-expression, not for your store's customer. Entuned generates original music engineered to specific parameters — tempo, key, lyrical density, energy arc — against the customer your store is built to serve. Different product, different lever."

