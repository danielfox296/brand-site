# How it ramps
ramps:
  header: "How Entuned tiers stack up."
  body1: "Entuned Free gives your sales floor three mood modes — Chill, Steady, Upbeat — on the shared catalogue, free. Our Boost offering gets you the full suite of research-backed outcomes engineered for your location's specific ICP. Professional hooks in to your POS to get more effective over time. Each tier is a step deeper, not a different product."
  body2: "Most shop owners start on Entuned Free, move to Boost within their first paid quarter, and graduate to Professional once they want the music tied to data they can audit."

# Indemnification callout
indemnification:
  eyebrow: "Licensing"
  header: "PRO-free, fully indemnified — at every tier."
  body: "Every Entuned subscription includes an indemnification certificate. No ASCAP, BMI, SESAC, or SoundExchange royalties. No public performance license required. If a performing rights organization questions what is playing in your store, documentation is available immediately."
  cta_label: "Read the licensing details →"
  cta_url: "licensing.html"

# FAQ
faq:
  header: "Questions"
  q1: "Why is Entuned Free actually free?"
  a1: "The Entuned Free catalogue is real and yours forever — no trial clock, no credit card, no expiration. It is also shared: every free store streams the same broad catalogue, tuned to retail moods rather than to any one store. Some tracks won't sound like your brand — that's the limit that matters on Free. Boost removes it: answer seven questions about your customer and the music is built around them. The upgrade moment is usually the first time you catch yourself thinking 'that song isn't us.'"
  q2: "Do I need special hardware?"
  a2: "No. Entuned streams through whatever audio system you already have — Sonos, AirPlay, Bluetooth, line-in, or a hardwired speaker rig."
  q3: "What about music licensing and PRO fees?"
  a3: "All audio Entuned delivers is original and commercial-use cleared. No PRO fees, no catalogue licensing, no public-performance exposure. Every subscription includes a written indemnification certificate. <a href=\"licensing.html\">Full details on the licensing page</a>."
  q4: "Can I cancel?"
  a4: "Yes, monthly. No long-term contract on Boost or Professional. Enterprise pricing is negotiated as part of the agreement."
  q5: "What's the difference between Boost and Professional?"
  a5: "Our Boost offering builds music around one Ideal Customer Profile and gives you all manual outcome control. Professional adds POS integration, multiple ICPs (Professional tailors music to each distinct customer type your store serves, instead of a single profile), Outcome Scheduling, scheduled interstitial promotional messaging, and self-improving refinement that compounds using your store's POS data. Most single-store shop owners start free, then move to Boost when they want the music built around their specific customer profile. Multi-location retailers with a real measurement stack tend to land on Professional."
  q6: "I already pay Soundtrack Your Brand or Mood Media. How does this compare?"
  a6: "Those vendors license catalogue music and pass the cost through your subscription. The catalogue was written for an artist's self-expression, not for your store's customer. Entuned generates original music engineered to specific parameters — tempo, key, lyrics, all for the customer your store is built to serve. Entuned is a different product, a sales lever. See the side-by-side comparisons: <a href=\"mood-media-alternative.html\">Mood Media</a>, <a href=\"soundtrack-your-brand-alternative.html\">Soundtrack Your Brand</a>, and <a href=\"pandora-for-business-alternative.html\">Pandora for Business</a>."

