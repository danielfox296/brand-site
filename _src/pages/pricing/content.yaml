# pricing — editable text content
#
# CHECKOUT URLS
# Both paid tiers now route through the Entuned server's `/billing/checkout`
# endpoint, which creates a Stripe Checkout Session on the fly and 303s the
# browser to it. This replaces the previous no-code Stripe Payment Links so
# the post-checkout flow can create an Account + Location + Subscription
# server-side via the `checkout.session.completed` webhook.
#
# Server: api.entuned.co (Railway). The success_url comes back to
# {APP_URL}/welcome?session={CHECKOUT_SESSION_ID} (i.e. the customer
# dashboard at app.entuned.co), and the cancel_url returns here.
#
# To roll back to no-code Payment Links, swap these strings back to the
# `https://buy.stripe.com/...` URLs that previously lived here.

stripe_payment_link: "https://api.entuned.co/billing/checkout?tier=core"
stripe_pro_payment_link: "https://api.entuned.co/billing/checkout?tier=pro"
contact_enterprise_url: "contact.html?topic=enterprise"
# Free-tier self-onboard. Magic-link / Google sign-in. No card required.
essentials_signup_url: "https://app.entuned.co/start"
# Multi-location pilot — secondary door for 5–50-door operators (Free-first hierarchy, 2026-07-11).
pilot_url: "pilot.html"

# Pilot band — sits below the self-serve tier grid.
pilot:
  eyebrow: "Running 5 to 50 locations?"
  headline: "Prefer proof before a tier? Run a measured pilot."
  body: "For a multi-location operator the question isn't which tier — it's what the audio does to behavior across your doors. We engineer original music for a subset of your stores, run it twelve weeks against matched control locations, and Daniel reads the result from the numbers your stores already produce. The pilot is free and sits outside the self-serve tiers above: no card, no subscription, a conversation."
  cta_label: "Start a measured pilot"

