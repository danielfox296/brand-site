<!-- JSON-LD Product schema for SERP rich results and AI citations -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",

    "@type": "Brand",
    "name": "Entuned"

      "@type": "Offer",
      "name": "Entuned Core",

      "priceCurrency": "USD",

    {
      "@type": "Offer",
      "name": "Entuned Pro",
      "price": "399",
      "priceCurrency": "USD",
      "description": "Per location, per month. Includes Lift Reports and outcome measurement on Pro.",

    },
    {
      "@type": "Offer",
      "name": "Entuned Enterprise",

      "url": "https://entuned.co/contact.html"
    }
  ]
}
