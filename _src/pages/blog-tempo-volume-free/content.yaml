title: "Tempo and Volume Are Free. The Revenue Isn't."
slug: "tempo-volume-free"
eyebrow: "FIELD NOTES"
dek: "Every retailer already has a volume knob. The part that moves revenue costs money, and most stores never get there."
date: "2026-03-01"
last_updated: "2026-04-15"
author:
  name: "Daniel Fox"
  role: "Founder & CEO"
