sections:
  - type: key_takeaways
    items:
      - "Tempo controls pace and volume controls arousal -- both are free interventions any retailer can make tomorrow"
      - "The free levers create conditions for selling but do not sell product on their own"
      - "Aligning music to customer identity and measuring the effect is where the revenue lives"

  - type: prose
    body: |
      Every retailer already has a volume knob and access to playlists at any tempo. They can slow their customers down tomorrow morning at zero cost. Drop the BPM below 75. Bring the volume down until conversations happen at normal speaking level. The customers will walk slower, stay longer, and feel less rushed. The [research on this](../blog/science-of-tempo-retail.html) is clear, replicated, and old enough to have grandchildren.

      If that were the whole story, there would be no market for what Entuned does. Every store would turn the tempo down, collect the dwell time lift, and move on. The reason there is a market is that dwell time and revenue are not connected by a straight line, and the variables that connect them are not free.

  - type: subhead
    level: 2
    text: "What the Free Levers Actually Do"

  - type: prose
    body: |
      Tempo controls pace. Volume controls arousal. Mode (major versus minor) shifts emotional direction. These three variables together give you a reliable thermostat for the physical and emotional state of the room. You can make the room calmer, slower, warmer, or brighter using nothing but a playlist swap and a volume adjustment.

  - type: stat_callout
    number: "< 75 BPM"
    label: "Tempo threshold for slowing customer pace in-store"
    source: "Milliman, 1982; replicated across multiple studies"
    accent: teal

  - type: prose
    body: |
      This is genuinely useful. A store that is too loud, too fast, and too bright is working against itself in ways that cost real money in shortened visits and reduced comfort. Fixing those basics is the equivalent of turning on the lights and setting the thermostat to a reasonable temperature. You should do it. It does not require a vendor. It does not require technology.

      But the thermostat does not sell product. It creates the conditions under which selling might happen. The conditions are necessary but not sufficient.

  - type: subhead
    level: 2
    text: "What Is Not Free"

  - type: pullquote
    text: "The free levers give you better conditions. The hard work of aligning music to customer identity is what turns those conditions into commercial outcomes."
    accent: teal

  - type: prose
    body: |
      The variables that convert dwell time into purchase behavior are the ones that align the music with the customer's identity. They determine whether the music feels like it belongs to your customer's world, whether it signals the right identity, and whether it moves the customer from browsing to buying. Those variables require knowing who the customer is at a level of specificity that genre tags don't reach. They require generating or selecting music against that specification. And they require [measuring whether the alignment is working](../blog/measure-roi-retail-music.html), which means correlating tagged musical variables with commercial outcomes over time.

      That is what costs money. That is what requires infrastructure. And that is where the revenue effect actually lives.

  - type: stat_callout
    number: "8-12%"
    label: "Willingness-to-pay lift from music aligned to customer identity"
    source: "Areni & Kim, 1993; replicated by North, Hargreaves & McKendrick, 1999"
    accent: gold

  - type: subhead
    level: 2
    text: "What Should Retailers Be Skeptical Of?"

  - type: prose
    body: |
      If someone tells you that slowing your tempo will increase sales by 38%, they are citing a single 1982 study that does not replicate cleanly at scale. If someone tells you that the right playlist will transform your business, ask them how they know it is the right playlist and [what they are measuring](../blog/how-to-measure-if-your-store-music-is-working.html) to prove it.

      The honest version is: the free levers give you better conditions. The hard work of aligning music to customer identity, measuring the effect, and iterating based on evidence is what turns those conditions into commercial outcomes. The first part is a knob. The second part is an engine. Entuned builds the engine.

