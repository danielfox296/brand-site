- type: video
- type: prose
  body: 'Music tempo does not have a simple fast-or-slow effect on retail sales. A 140-store field study (EMAC 2025) found no overall tempo effect — but tempo interacts with musical key, crowd density, and customer loyalty to produce effects ranging from 8% to 38% sales lifts under specific conditions.


    In this video I break down four decades of tempo research — from the foundational 1982 grocery store study to a 2025 field experiment across 140 stores — and show you why tempo is a conditional lever, not a universal switch.

    '
- type: transcript
  chapters: *id001
- type: subhead
  level: 2
  text: How does tempo affect shoppers?
- type: prose
  body: 'Tempo doesn''t work as a simple fast-or-slow toggle. A 2025 field study across 140 stores found no universal tempo effect on sales. But tempo interacts with musical key, crowd density, and customer loyalty — slow tempo in a minor key lifted sales ~12%, and fast tempo in crowded stores boosted spending ~8%.

    '
- type: subhead
  level: 2
  text: So tempo doesn't matter at all?
- type: prose
  body: 'It matters a lot — it''s just conditional. Tempo works on engaged customers (loyalty members responded, casual shoppers didn''t). And it interacts with mode: slow tempo in a major key had zero effect, while slow tempo in a minor key drove a measurable lift. Tempo is a fine-tuning instrument, not a blunt force tool.

    '
- type: subhead
  level: 2
  text: What should I actually do with my store's music tempo?
- type: prose
  body: 'Match tempo to context. Crowded store? Uptempo reduces stress and lifts spending. Quiet store with regulars? Slow tempo in a minor key earns its keep. Stop thinking about tempo in isolation — it interacts with key, density, and your customer base. A system like Entuned (entuned.co, free tier) adapts to these variables automatically. Full citations in the description. This is video 11 of 50 in this series.

    '
