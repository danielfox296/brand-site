btn_1: "Talk to Enterprise"
p_1: "That&rsquo;s the single-store evidence we have so far. Full pilot data in your fleet, your reporting stack, your terms &mdash; structured as a 12-week test against matched control stores."
p_2: "Every Enterprise pilot is a controlled test. Matched test and control stores, or before-and-after for single locations, over 12 weeks with weekly reporting. We track dwell, average transaction value, items per transaction, foot traffic, and return visits. The retailer sees every number we see."
p_3: "Each published case study includes the retail category, the pilot setup, how we measured it, and what happened. No vanity metrics. No cherry-picked weeks. Clean comparisons from real stores."
p_anchor: "Entuned is currently running a deployment with a major mid-market men's fashion retailer with 80+ stores. Multi-store rollout of engineered audio against a real Ideal Customer Profile. Pilot data accumulating; brand name not yet authorized for public reference. Specific outcome data will be published once the dataset clears the threshold for clean attribution and naming consent is granted."
p_5: "We are looking for retail operators who want to know exactly what their in-store audio is doing to store performance. Enterprise pilot partners get the full measurement against their existing reporting and co-publishing rights on the results."
