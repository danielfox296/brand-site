h1_1: Self-onboard is launching soon.
subline: Drop your email and we'll send you the link the day Entuned Free opens to self-serve. No card, no commitment, no waitlist queue — just one notification when the door is open.

h2_2: What you'll get the moment it opens.
p_3: Three minutes from clicking the link to music in your store. Pick one outcome — Increase Dwell or Infuse Energy — and the music starts streaming through whatever speakers you already have. Free, indefinite, no card. Original music, PRO-indemnified the moment it plays.

h2_3: Get the link when it ships.
p_4: Email is required. The rest is optional and helps us prioritize who we reach out to about Core or Professional if your situation calls for it.

h3_thanks: You're on the notification list.
p_thanks: We'll send the link the day Entuned Free goes self-serve. Should be days, not weeks.

h2_4: Multi-location operator? Don't wait.
p_5: Operators with five or more stores typically deploy on Professional or Enterprise — both available now, no notification needed. Talk to sales and we can have music in your stores within the week.
