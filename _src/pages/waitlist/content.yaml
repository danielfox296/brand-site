# waitlist — editable text content

h1_1: Essentials opens in waves.
subline: Free outcome-tuned music for your floor. We are letting operators in as cohort capacity allows. Get on the list and we will bring you in when your wave opens.

h2_1: What you get when your wave opens.
p_1: Essentials is the free tier. You pick one outcome — Increase Dwell or Infuse Energy — and the music starts streaming through whatever speakers you already have. No card required, no time limit, indefinite access.
li_1: 100+ song library
li_2: Two outcome modes — Increase Dwell, Infuse Energy
li_3: One mode active at a time, manually selected
li_4: General catalogue, not customized for your customer
li_5: PRO-indemnified from day one

p_2: Want music tailored to your specific customer? Core ($99/mo) builds the catalogue around your Ideal Customer Profile. Professional ($399/mo) adds POS-driven self-improving refinement. Both unlock when your wave opens.

h2_2: While you wait, we will send you what we have learned about retail audio.
p_3: A short email roughly twice a week. What the research says about how music affects customer behavior. What your current vendor is doing on your floor today. The parameter-level decisions Entuned makes when it generates music for a specific outcome. By the time your wave opens, you will know why the music in your store is doing what it does and what to expect from changing it.

h2_3: Get on the list.
p_4: Email is required. The rest helps us prioritize cohort openings against the kind of operator we are letting in next.

h3_thanks: You are on the list.
p_thanks: We will start the education sequence within a day. Your wave opens when we have capacity for your operator profile. Watch for the signup link.

h2_4: Multi-location operator? Skip the wait.
p_5: Operators with five or more stores typically deploy on Professional or Enterprise. Talk to sales and we can have music in your stores within the week, with self-improving refinement and POS integration in place from the start.
btn_sales: Talk to Sales

h2_5: What you are signing up for.
p_6: We do not sell or share your email. The education sequence is the only contact we initiate. When your wave opens, we send one signup link. Unsubscribe at any time.
