<style>
input:invalid:not(:placeholder-shown),
textarea:invalid:not(:placeholder-shown),
select:invalid:not(:placeholder-shown) {
  border-color: #e74c3c;
}
input:valid:not(:placeholder-shown),
textarea:valid:not(:placeholder-shown) {
  border-color: #27ae60;
}
.form-success {
  background: rgba(39, 174, 96, 0.1);
  border: 1px solid rgba(39, 174, 96, 0.3);
  border-radius: 8px;
  padding: 2.5rem;
  text-align: center;
  display: none;
}
.form-success.visible { display: block; }
</style>

<!-- HERO -->
<section class="hero hero-alt">
  <div class="container">
    <h1>{{content.h1_1}}</h1>
    <p class="subline">{{content.subline}}</p>
  </div>
</section>

<!-- WHAT YOU'LL GET -->
<section class="section">
  <div class="container">
    <h2 class="fade-up">{{content.h2_2}}</h2>
    <p class="fade-up">{{content.p_3}}</p>
  </div>
</section>

<!-- FORM -->
<section class="section" style="background: rgba(80, 146, 156, 0.08);">
  <div class="container" style="max-width: 640px;">
    <h2 class="fade-up">{{content.h2_3}}</h2>
    <p class="fade-up" style="margin-bottom: 2.5rem;">{{content.p_4}}</p>

    <form class="fade-up" action="https://formspree.io/f/xgopwepl" method="POST" id="waitlist-form">

      <input type="hidden" name="topic" value="waitlist">
      <input type="hidden" name="source" value="waitlist-signup">

      <div class="form-group">
        <label for="waitlist-email">Email</label>
        <input type="email" id="waitlist-email" name="email" required placeholder="jane@company.com">
      </div>

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
        <div class="form-group">
          <label for="waitlist-first">First name <span style="opacity: 0.4; font-weight: 400;">(optional)</span></label>
          <input type="text" id="waitlist-first" name="first_name" placeholder="Jane">
        </div>
        <div class="form-group">
          <label for="waitlist-last">Last name <span style="opacity: 0.4; font-weight: 400;">(optional)</span></label>
          <input type="text" id="waitlist-last" name="last_name" placeholder="Doe">
        </div>
      </div>

      <div class="form-group">
        <label for="waitlist-company">Company <span style="opacity: 0.4; font-weight: 400;">(optional)</span></label>
        <input type="text" id="waitlist-company" name="company" placeholder="Acme Retail">
      </div>

      <div class="form-group">
        <label for="waitlist-locations">Number of locations <span style="opacity: 0.4; font-weight: 400;">(optional)</span></label>
        <input type="number" id="waitlist-locations" name="num_locations" placeholder="1" min="1">
      </div>

      <!-- Honeypot -->
      <input type="text" name="_gotcha" style="display:none">

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">Notify Me When It Ships</button>

      <div id="form-status" style="text-align: center; margin-top: 1.5rem; display: none;"></div>
    </form>

    <div class="form-success" id="form-success">
      <h3 style="color: #50929c; margin-bottom: 1rem;">{{content.h3_thanks}}</h3>
      <p>{{content.p_thanks}}</p>
    </div>
  </div>
</section>

<!-- WHAT YOU'RE SIGNING UP FOR -->
<section class="section">
  <div class="container">
    <h2 class="fade-up">{{content.h2_5}}</h2>
    <p class="fade-up">{{content.p_6}}</p>
    <p class="fade-up" style="margin-top: 1rem;">{{content.p_licensing}}</p>
  </div>
</section>

<!-- MULTI-LOCATION CTA -->
<section class="section" style="background: rgba(80, 146, 156, 0.08);">
  <div class="container" style="text-align: center;">
    <h2 style="margin-bottom: 1rem;">{{content.h2_4}}</h2>
    <p class="fade-up" style="font-size: 1.05rem; opacity: 0.85; margin-bottom: 2.5rem; max-width: 640px; margin-left: auto; margin-right: auto;">{{content.p_5}}</p>
    <a href="contact.html?topic=enterprise" class="btn btn-secondary">{{content.btn_sales}}</a>
  </div>
</section>

<script>
(function() {
  var form = document.getElementById('waitlist-form');
  var status = document.getElementById('form-status');
  if (!form) return;

  form.addEventListener('submit', function(e) {
    e.preventDefault();
    var btn = form.querySelector('button[type="submit"]');
    btn.textContent = 'Sending...';
    btn.disabled = true;

    fetch(form.action, {
      method: 'POST',
      body: new FormData(form),
      headers: { 'Accept': 'application/json' }
    }).then(function(response) {
      if (response.ok) {
        form.style.display = 'none';
        var successDiv = document.getElementById('form-success');
        if (successDiv) successDiv.classList.add('visible');
      } else {
        throw new Error('Form submission failed');
      }
    }).catch(function() {
      status.style.display = 'block';
      status.style.color = '#E24B4A';
      status.textContent = 'Something went wrong. Please try again shortly.';
      btn.textContent = 'Notify Me When It Ships';
      btn.disabled = false;
    });
  });
})();
</script>
