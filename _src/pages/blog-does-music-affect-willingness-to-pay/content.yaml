- type: video
- type: prose
  body: 'Music can increase the maximum price a customer is willing to pay — but only for hedonic (pleasure-driven) products. A 2025 Marketing Letters study found classical music raised willingness to pay for items like wine and artisanal goods, with zero effect on utilitarian products. Separately, soft background music increased average restaurant checks by $3.05 per person (Perceptual and Motor Skills, 2003).


    In this video I cover the classical music effect on pricing, how volume modulates spending, and why genre-brand congruence is the mechanism that makes willingness to pay shift.

    '
- type: transcript
  chapters: *id001
- type: subhead
  level: 2
  text: Does music affect willingness to pay?
- type: prose
  body: 'Yes — for hedonic (pleasure-driven) products. A 2025 study found classical music raised the maximum price customers would pay for wine, chocolate, and artisanal goods. For utilitarian products (practical necessities), classical music had zero effect. Volume matters too: soft music increased average restaurant checks by $3.05/person.

    '
- type: subhead
  level: 2
  text: So I should just play classical music?
- type: prose
  body: 'Only if it fits your brand and your products are hedonic. Classical in a wine shop works because the music matches the product category. Classical in a streetwear shop creates friction that damages perceptions. The mechanism is congruence — music and brand telling the same story — not classical music specifically.

    '
- type: subhead
  level: 2
  text: How do I use music as a pricing tool?
- type: prose
  body: 'Three moves: (1) If you sell premium hedonic products, use sophisticated instrumental music to raise the price ceiling — this is free margin. (2) Turn down the volume — loud music triggers faster, lower-value decisions. (3) Match music genre to your price positioning. Entuned (entuned.co, free tier) generates music matched to your brand''s value proposition. Full citations in the description. This is video 16 of 50 in this series.

    '
