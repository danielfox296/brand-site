# for-cosmetics — editable text content
# Page kept live for SEO continuity. Removed from primary nav and footer
# in Phase 2. The cosmetics vertical sits on the edge of the anti-ICP
# (Sephora is C-tier, Ulta B-tier per the May 2026 prospect tier list)
# so the dedicated landing page is being repositioned — not retired.

banner_text: "This vertical page is being repositioned. The current ICP framework focuses on transactional mid-market multi-store retail; cosmetics retail spans both ends of that filter and the dedicated framing is being rewritten. For specific cosmetics deployments, contact us directly."

hero:
  eyebrow: "For Cosmetics Retail"
  h1: "The audio at the tester wall is shaping the decision."
  subline: "Beauty retail lives on testing behavior, dwell, and the customer's sense of whether the brand is worth the premium. All three respond to the audio environment. The dedicated cosmetics framing here is being rewritten — talk to us in the meantime if you operate beauty retail at multi-store scale."

# What still applies
applies:
  eyebrow: "What Still Applies"
  h2: "The product works for cosmetics. The framing on this page does not."
  body: "Engineered audio applies cleanly to beauty retail at the unit-economic level — Gueguen and Jacob (2013) measured 28.6% spending lift in a sensory retail setting and the mechanism transfers. What we are reworking on this page is the ICP framing. The May 2026 prospect tier list places different cosmetics operators at different levels of fit, and the prior dedicated cosmetics framing did not capture that. Until the rewrite ships, the general framing on the homepage and the For Retail Operators page is the right entry point. Multi-store cosmetics operators on Professional or Enterprise: contact us directly."

