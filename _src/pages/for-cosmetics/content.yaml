# for-cosmetics — editable text content
# Vertical landing for cosmetics & beauty retail.
# Voice: PLG-primary, single-store and small-chain owner-operator.

hero:
  eyebrow: "For cosmetics &amp; beauty retail"
  h1: "Music to lift the tester-wall moment."
  subline: "Beauty retail lives at the tester wall. The customer&rsquo;s decision to swatch, to ask, to buy is shaped by whether the room feels like the brand. Entuned produces original music tuned to your customer and your shelf &mdash; the audio that quietly moves the trial-to-purchase conversion. Free, no credit card."

# The gap
gap:
  eyebrow: "The Gap"
  h2: "Beauty retail is sensory. The audio is the part you forgot to specify."
  p1: "The cosmetics floor is one of the most consciously designed retail rooms in the business. Every surface, swatch card, mirror, and overhead light has been chosen by someone. The lighting alone has a model. Then the speakers play whatever the satellite vendor sent over &mdash; selected by a person who has never been in your store, against a logic built around licensing compliance and complaint avoidance."
  p2: "Your customer is making a high-consideration sensory decision: is this brand worth the premium, is this finish worth the trial, is the staff worth asking. The audio environment is part of the answer she gets before you say a word. Right now it is running on a default that has nothing to do with you."

# What changes per tier
tiers:
  eyebrow: "Three places to start"
  h2: "Three places to start, sized to where you are."

  card1_title: "Entuned Free"
  card1_text: "Free, indefinite. Pick Linger from the floor of your store and the catalogue starts streaming through the speakers you already have. Useful as the first look before you decide to specify the audio more deliberately for your beauty customer."

  card2_title: "Boost ($99/location/mo)"
  card2_text: "Music tailored to your single Ideal Customer Profile. For most beauty retailers, that is the customer your buyer is already merchandising for &mdash; the considered shopper who is in your store because she wants the assortment, the staff, the room. About 420 tracks in the first month, refreshed against what holds the floor."

  card3_title: "Professional ($399/location/mo)"
  card3_text: "POS integration. Outcome Scheduling against your traffic profile (the Saturday-afternoon browse is a different mood than the Tuesday-evening replenishment run). Multiple ICPs for stores that draw distinct customer types. Self-improving refinement against your basket and dwell data."

  card4_title: "Enterprise"
  card4_text: "Multi-store rollouts where you operate more than a handful of locations. Custom ICP design and brand voice consultation. Performance terms where lift can be cleanly measured against your existing reporting."

# What the research says
research:
  eyebrow: "Forty years of evidence"
  h2: "Forty years of evidence on the audio levers that matter for sensory retail."

  card1_title: "Sensory cues lift spending in beauty contexts."
  card1_text: "Gu&eacute;guen and Jacob (2013) measured 28.6% spending lift in a sensory retail setting when the ambient cues matched the brand register. Beauty retail is the cleanest case of the mechanism &mdash; customers are already in a sensory frame the moment they walk in."

  card2_title: "Music customers read as upmarket lifts willingness to pay."
  card2_text: "Areni and Kim (1993) showed average transaction value rising from $6.93 to $12.31 in a wine cellar when the music matched the customer&rsquo;s upmarket frame. The mechanism replicates in any considered-purchase category, including the choice between a $24 and a $58 product on the same shelf."

  card3_title: "Atmosphere is part of the brand relationship."
  card3_text: "Bitner&rsquo;s 1992 servicescape framework &mdash; one of the most-cited papers in service marketing &mdash; established that the physical environment of a service business is part of what creates the customer&rsquo;s relationship with the brand. The audio is part of the servicescape. For a beauty store, it is part of whether the customer trusts the brand enough to commit to the trial."

  card4_title: "Mismatched music actively reduces basket."
  card4_text: "Andersson et al. (2012) ran 601 real transactions in a Swedish retail chain and found that music that clashes with the store&rsquo;s customer category cuts willingness to pay below the no-music baseline. Neutral is not the default. Whatever is in your speakers is doing work in the room &mdash; the only question is whether it is the work you want."

