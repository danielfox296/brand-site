  text: What should I look for in a retail music provider?
- type: prose
  body: 'Six things backed by research: (1) real-time adaptability to store conditions, (2) independent control over tempo, mode, and energy — not just preset moods, (3) genuine brand congruence beyond genre filters, (4) measurement tools that tie music to sales data, (5) clean public performance licensing, and (6) the ability to learn from your specific customers'' preferences.

    '
- type: subhead
  level: 2
  text: Can't I just pick the one with the biggest catalog?
- type: prose
  body: 'Catalog size tells you almost nothing about performance. A 2012 study showed that specific interactions between tempo and mode drive a 12% spending lift — but only if those variables are controlled independently. A provider with 10 million songs and no parametric control can''t execute on what the research shows works.

    '
- type: subhead
  level: 2
  text: What's the practical first step?
- type: prose
  body: 'Run any provider through the six-criterion checklist in this video. Most will check one or two boxes. The ones that check all six are built around the research, not just around a music library. Entuned was designed against these exact criteria — try the free tier at entuned.co and score it yourself. Full citations in the description. This is video 32 of 50 in this series.

