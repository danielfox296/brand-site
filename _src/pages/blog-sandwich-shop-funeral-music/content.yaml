title: "The Sandwich Shop Was Playing Music for a Funeral"
slug: "sandwich-shop-funeral-music"
eyebrow: "FIELD NOTES"
dek: "We got sandwiches at 4:30 on a weekday. The dining room was empty, the music was for a funeral, and nothing about the room suggested anyone was positioned to notice."
date: "2026-07-22"
last_updated: "2026-07-22"
author:
  name: "Daniel Fox"
  role: "Founder & CEO"
