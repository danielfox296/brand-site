  - type: key_takeaways
    items:
      - "The foundational framework in services marketing names music as part of the 'servicescape' — the physical environment that shapes how customers perceive and behave toward a business (Bitner, 1992)"
      - "Music style sets perceived sophistication: in one study, the same venue was rated as more upmarket and refined under classical music, and merely upbeat under pop (Wilson, 2003)"
