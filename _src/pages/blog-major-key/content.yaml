sections:
  - type: key_takeaways
    items:
      - "Major key reliably shifts valence positive — but positive valence does not reliably drive purchase behavior"
      - "Mild negative valence (wistfulness, longing) is among the most commercially interesting states in premium retail"
      - "Dorian mode produces 'noble sadness' that outperforms major mode for dwell time and engagement in premium contexts"
      - "Mode sets the emotional direction; production, groove, and cultural alignment determine whether it converts"

  - type: prose
    body: |
      Mode is the musical variable most commonly associated with emotion. Major key sounds happy. Minor key sounds sad. This is the version you learned in school, and it is roughly correct as far as it goes. Research consistently shows that major mode shifts listeners toward positive valence and minor mode shifts them toward negative valence. The effect replicates. It is real.

      Where it gets interesting for retail is that positive valence and commercial effectiveness are not the same thing.

  - type: subhead
    level: 2
    text: "The usefulness of negative valence"
    anchor: "negative-valence"

  - type: prose
    body: |
      The assumption behind most retail playlists is that customers should feel good. Upbeat, positive, bright. Major key, moderate-to-fast tempo, sunny production. This is the default because it seems obvious: happy customers buy more.

      The research says something more nuanced. Mild negative valence (the emotional territory of wistfulness, longing, bittersweet ache) is among the most commercially interesting states in premium retail. The listener in this state feels the contour of something missing. Advertising psychology has long recognized this mechanism: desire activated through the presence of lack. The product occupies the gap the emotion opened.

  - type: stat_callout
    number: "Dorian mode"
    label: "outperforms major mode for dwell time and engagement in premium retail"
    source: "Musicological research on mode and affect"
    accent: teal

  - type: prose
    body: |
      Dorian mode, which sits between major and minor, produces what musicologists call noble sadness. It has forward motion without resolution. It longs without despairing. It is underused in retail because most playlist services operate on the major=good, minor=bad assumption. But in premium and luxury contexts, where the purchase is an act of self-definition rather than necessity, Dorian and natural minor outperform major mode for dwell time and engagement.

  - type: subhead
    level: 2
    text: "Why isn't mode alone enough to drive purchase behavior?"
    anchor: "mode-not-enough"

  - type: prose
    body: |
      Mode reliably shifts valence. But valence alone does not drive purchase behavior, for the same reason [tempo alone does not drive spending](../blog/longer-visits.html). A minor-key track with warm production and a laid-back groove in a style the customer identifies with produces longing. The same minor key with cold production, fast tempo, and cultural signals that feel alien produces anxiety. Both are negative valence. One extends dwell and deepens engagement. The other empties the store.

      The mode tells you the emotional color. The production, the groove, the harmonic language, the cultural alignment tell you whether that color lands as desire or discomfort. You need the full palette, not just the key signature.

  - type: pullquote
    text: "Mode tells you the emotional color. Production, groove, and cultural alignment tell you whether that color lands as desire or discomfort."
    accent: teal

  - type: subhead
    level: 2
    text: "Mode as one variable in a compound signal"
    anchor: "compound-signal"

  - type: prose
    body: |
      Entuned specifies mode as one variable in a compound signal. The mode sets the emotional direction. Everything else determines whether the customer wants to stay in that feeling or walk away from it. For more on how these variables interact, see [luxury priming is real](../blog/luxury-priming-is-real-and-you-dont-have-to-be-a-luxury-brand-to-use-it.html) and [the silent brand signal](../blog/the-silent-brand-signal.html).

