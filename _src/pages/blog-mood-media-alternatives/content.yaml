  - type: subhead
    level: 2
    text: "How the alternatives compare"
    anchor: "alternatives"

  - type: prose
    body: |
      **Soundtrack Your Brand.** A modern, SaaS-native catalog service. Clean interface, no proprietary hardware, monthly subscription without multi-year lock-in. Approximately $35 to $50 per location per month with blanket licensing included. Well-regarded for playlist quality. Does not offer behavioral measurement or music generation. Targeting remains genre- and mood-based. For retailers migrating primarily for pricing or contract flexibility, it's a reasonable landing point.

      **Cloud Cover Music.** US-based, SMB-focused. Pricing starts at $10 to $25 per location per month. Handles licensing compliance. Designed for single-location or small multi-unit operators who need compliant background music at minimal cost. At scale, the operational limitations become visible.

      **SiriusXM for Business.** Large library across 200+ channels with inherent brand recognition. Infrastructure is legacy, operating on the same channel model as the consumer product. No behavioral measurement. Enterprise pricing is negotiated, typically $30 to $80 per location per month depending on volume.

  - type: stat_callout
    number: "$30K-$60K"
