  - type: prose
    body: |
      **AI-powered alternatives.** A new category of providers is emerging that uses AI to generate original music, target it to customer psychology rather than genre, and measure its impact on retail outcomes. These systems don't rely on licensed catalogs, which eliminates repetition and licensing costs. The targeting operates at a higher resolution than genre or mood labels. And because the music is parameterized and logged, it produces measurement data that connects what's playing to what's selling.

      Entuned is in this category. We generate original music from your customer's psychographic profile and correlate it against your performance data. The pilot is free.

  - type: subhead
    level: 2
    text: "What questions should you ask any vendor?"
    anchor: "vendor-questions"

  - type: prose
    body: |
      Before signing with any in-store music provider — whether you are leaving Mood Media or evaluating for the first time — these five questions will separate vendors who can deliver measurable value from those who cannot.

      **1. What do you measure, and what can I report on?** Any provider can tell you what is scheduled to play. Very few can tell you what behavioral outcomes the music influenced. Ask for a specific list of the metrics available in the reporting dashboard. If the answer is limited to play counts and schedule adherence, the platform does not have a measurement architecture.

      **2. What are the full contract terms, including exit provisions?** Ask for the early termination clause in writing before the sales conversation advances. Multi-year contracts with penalty clauses are common in legacy services and substantially raise the real cost of switching. A provider confident in its performance outcomes should not require multi-year lock-in to protect its revenue.

      **3. Is the music generated or licensed — and who bears the licensing liability?** This question surfaces [the true cost of licensed music](../blog/the-hidden-cost-of-your-licensing-fee.html). Catalog services either pass through PRO fees (ASCAP, BMI, SESAC) directly or embed them in subscription pricing. For a 50-location retailer, this can add $30,000 to $60,000 annually on top of the software fee. AI-generated services with no catalog have no licensing exposure. Understand what you are actually paying for.

      **4. How is the music targeted to my specific customer profile?** Genre and mood labels are demographic proxies, not behavioral specifications. Ask the vendor to explain the mechanism by which your customer psychographic data influences what plays in your store. If the answer is "you pick a channel," you are buying a playlist. If the answer involves a translatable data layer between customer psychology and musical parameters, you are buying targeting capability.

      **5. Can you show documented ROI from a comparable retailer?** Not a headline. Not a testimonial. A documented before-and-after comparison across specific metrics — dwell time, conversion rate, average basket size — at a retailer of similar format, customer base, and market position. If the vendor cannot produce this, they have not built the measurement infrastructure to generate it.

