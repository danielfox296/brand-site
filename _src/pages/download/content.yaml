p_1: Get your store's music up and running today.
p_2: The Entuned iOS app turns your iPad into the sound source for your store. Connect to your speakers, press play, and stream music built around your customer.
p_3: <strong>Real-time dashboard</strong> shows what's happening. Customer dwell, foot traffic, engagement spikes, and sales correlation. See the impact as it happens.
p_4: <strong>One-tap controls.</strong> Play, pause, volume, switch between profiles, or adjust the mood any time.
p_5: Mockup for reference
p_6: Get Entuned from the Apple App Store. iOS 16+ required.
p_7: Pair with any Bluetooth or AirPlay speaker. Works with what you already have. No special hardware.
p_8: Your custom music starts streaming right away. Real-time numbers on your dashboard.
p_9: Dwell, foot traffic, engagement, and sales correlation as it happens. Dashboard updates live.
p_10: Not a playlist. Original compositions built for your store. Infinite variety. Zero repeats.
p_11: No ASCAP. No BMI. No licensing to negotiate. No per-stream royalties. All music is original.
p_12: Works with any Bluetooth or AirPlay speaker. iPad, iPhone. Plug and play.
p_13: Every day the product learns what is working in your store. The music gets sharper week over week.
p_14: Music streams continuously. If connection drops, pre-cached tracks keep playing until reconnection.
