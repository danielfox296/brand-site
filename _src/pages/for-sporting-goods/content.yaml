# for-sporting-goods — editable text content
# Vertical landing for sporting goods, athletic, and outdoor retail.
# Voice: PLG-primary, single-store and small-chain owner-operator.

hero:
  eyebrow: "For sporting goods &amp; outdoor retail"
  h1: "Music to match the energy your customer walked in with."
  subline: "Sporting goods customers come in with intent &mdash; the run they want to do, the trip they want to take, the team kid they need to outfit. The audio in the room either matches that energy or drains it. Entuned produces original music tuned to your customer and your floor. Free, no credit card."

# The gap
gap:
  eyebrow: "The Gap"
  h2: "Mismatched energy is the silent killer in sporting goods retail."
  p1: "Sporting goods retail has a different operating shape than considered-purchase categories. The customer walks in already in motion &mdash; mentally, often physically. She is solving a problem (a 10K in three weeks, a kid that grew out of cleats, a backpack for a trip on Friday). The store either feels like a place that gets that, or it feels like a chain that happens to sell the gear."
  p2: "The audio environment is one of the loudest signals about which kind of store this is. Most sporting goods retailers leave it to the satellite vendor &mdash; selected by a person who has never been in your store, against a logic built around licensing compliance. Your wall display has been thought about. Your endcap has been thought about. The audio is on a default that has nothing to do with your customer."

# What changes per tier
tiers:
  eyebrow: "Three places to start"
  h2: "Three places to start, sized to where you are."

  card1_title: "Entuned Free"
  card1_text: "Free, indefinite. Pick Linger from the floor of your store and the catalogue starts streaming through the speakers you already have. Useful as the first look before you decide to specify the audio more deliberately for the customer your store is built around."

  card2_title: "Boost ($99/location/mo)"
  card2_text: "Music tailored to your single Ideal Customer Profile. For most sporting goods retailers, that is the customer your assortment is already built for &mdash; the runner, the climber, the team parent, the weekend rider. About 420 tracks in the first month, refreshed against what holds the floor."

  card3_title: "Professional ($399/location/mo)"
  card3_text: "POS integration. Outcome Scheduling against your traffic profile (Saturday-morning team-parent rush is a different mood than Tuesday-evening commuter run-club pickup). Multiple ICPs for stores that draw distinct customer types. Self-improving refinement against your basket and dwell data."

  card4_title: "Enterprise"
  card4_text: "Multi-store rollouts where you operate more than a handful of locations. Custom ICP design and brand voice consultation. Performance terms where lift can be cleanly measured against your existing reporting."

# What the research says
research:
  eyebrow: "Forty years of evidence"
  h2: "Forty years of evidence on the audio levers that matter for active retail."

  card1_title: "Tempo affects pace through the store."
  card1_text: "Milliman (1986) extended his earlier grocery work to a restaurant context and confirmed the mechanism: tempo affects how quickly people move through a space. In sporting goods, the right tempo keeps a high-energy customer engaged at the wall instead of moving past it."

  card2_title: "Music customers read as theirs moves willingness to pay."
  card2_text: "Areni and Kim (1993) found that in a wine cellar, customers chose more expensive bottles &mdash; not more of them &mdash; when the music matched the customer&rsquo;s frame. North, Shilcock and Hargreaves (2003) found the same prestige-fit effect lifted spend per head in a restaurant. The customer&rsquo;s willingness to step up to the better shoe is partly being shaped by the audio in the room."

  card3_title: "Atmosphere is part of the brand relationship."
  card3_text: "Bitner&rsquo;s 1992 servicescape framework established that the physical environment of a service business is part of what creates the customer&rsquo;s relationship with the brand. The audio is part of the servicescape. For a sporting goods store, it is part of whether the customer trusts you as a real specialist or treats you as a commodity shelf."

  card4_title: "Mismatched music forfeits the lift."
  card4_text: "Music that fits the customer category lifts what shoppers will pay; music that clashes gives that lift back (Areni and Kim 1993; North, Shilcock and Hargreaves 2003). Neutral is not the default. The audio in your store is doing work whether you chose its effect or not."

# CTA
cta:
  eyebrow: "Get Started"
  h2: "Hear it on your floor."
  subline: "Start free at Entuned Free in your store. Move to Boost once you want music tailored to your specific customer."
  cta_primary: "Start Free"

