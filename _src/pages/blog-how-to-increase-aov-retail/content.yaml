  - type: subhead
    level: 2
    text: "Lever 5: Friction at upsell moments"
    anchor: "friction"

  - type: prose
    body: |
      The fitting room with no associate. The accessory wall blocked by clearance fixtures. The checkout counter with no eye-level upsell display. Each is a moment where the operator has built the path for the basket to grow and then put a wall in front of it.

      Friction reduction at upsell moments is the lever that operations teams handle well when they think to look. It usually rewards a walking audit more than a strategic project.

  - type: pullquote
    text: "Same products. Same prices. Same store. The audio moved the average ticket."
    accent: teal

  - type: subhead
    level: 2
    text: "How to test this in two weeks"
    anchor: "test"

  - type: prose
    body: |
      AOV is one of the easiest retail metrics to read cleanly. Every POS reports it natively. Week-over-week comparison filters out most of the seasonal noise that makes month-over-month tricky.

      Pick a baseline week. Pull AOV by time of day and by day of week. Note any promotions, weather anomalies, staffing changes. That is your control.

      Change one variable for the next two weeks. The audio environment is the easiest because it has no operational cost and no inventory risk — no fixture moves, no restocking, no labor overhead. Pull AOV the same way at the end of week three.

      If AOV moved by more than your normal week-over-week noise band, you have a signal worth extending to a full quarter. If nothing moved, you have learned that for your customer profile and product mix, audio priming was not the binding constraint, and you can re-allocate to one of the other four levers without spending capital first.

  - type: subhead
    level: 2
    text: "Where to start this week"
    anchor: "this-week"

  - type: prose
    body: |
      Three actions, in order.

      **Pull six weeks of AOV** by time of day. Get familiar with the noise band before you start changing anything. Most operators have not actually looked at AOV at this granularity in months.

      **Walk your stores and listen.** Stand at the door for two minutes on a Saturday afternoon. Ask: does the music match the price point I want customers to anchor to? Does it sound like a $40 store or a $140 store? Did anyone choose this?

      **Run a free audio pilot.** Entuned Free gives you outcome-tuned music for no credit card, no time limit. Run it for two weeks against the baseline. If AOV moves, you have evidence. If it does not, you have learned which lever is not the binding constraint, which is also worth knowing.

