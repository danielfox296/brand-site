  - type: subhead
    level: 2
    text: "The strongest evidence in the field belongs to Soundtrack — and it proves the category, not the product"

  - type: prose
    body: |
      One vendor deserves to be taken seriously on evidence. Soundtrack Your Brand commissioned real field research with HUI Research in Sweden, and the results are the best numbers any incumbent has published. Their Gant study — in-store observations and customer surveys, not a controlled experiment — reports sales up 37% when brand-fit music replaced random music. A field experiment across 1.8 million transactions at a global restaurant chain found a 9.1% sales lift from brand-fit playlists over random hits. A third experiment found roughly 6% higher revenue when head office controlled the music instead of store staff — that one was peer-reviewed in the <em>Journal of Retailing and Consumer Services</em> in 2021.

      Read those numbers again from an operator's chair. A streaming vendor's own research says <strong>which music plays in your store is a revenue variable worth mid-single to double digits.</strong> That is the entire premise of treating audio as an engineered, measured part of the store — published by an incumbent, in their own marketing.

      Then ask what Soundtrack did with the proof. It became content for a research page, in service of selling a streaming subscription. The product doesn't engineer music toward an outcome, and nothing in it measures what the streams do to basket, conversion, or dwell in a customer's stores. The studies ran once, in someone else's stores, and the measurement never shipped. Pandora's CloudCover site then borrowed the same numbers to sell a $16.95 product the studies never tested.

  - type: pullquote
    text: "Ask any vendor on this list what the music contributed in your stores last quarter. That is where the category goes quiet."
    accent: teal

  - type: subhead
    level: 2
    text: "The two things nobody in the field sells"

  - type: prose
    body: |
      Strip the marketing and the audit reduces to two structural gaps, the same two everywhere.

      <strong>Nobody composes the variable.</strong> Every behavioral claim in the table runs through selecting leased tracks — songs whose tempo, lyrics, energy, and cultural reference were fixed by the original artist for reasons that had nothing to do with any retail floor. Curation, however scientific, can only choose among those tracks. The research levers — tempo, harmonic character, familiarity, lyrical content — are exactly the parameters a curator cannot change. Entuned composes original music to specification instead: the parameters are set on purpose, per store, per outcome. <a href="../science.html">How that works is documented here.</a>

      <strong>Nobody measures in your stores.</strong> Mood says "prove business results" and means case studies. Soundtrack proved it once, at Gant. Qsic runs closed-loop attribution — for ad campaigns. Not one product in the table will put a number next to the music in the buyer's own reporting. Entuned's answer is a <a href="../pilot.html">free twelve-week pilot</a>: a matched subset of your stores against control, read in the POS and traffic numbers you already produce, store by store.

  - type: subhead
    level: 2
    text: "What to do with this at your next vendor review"

  - type: prose
    body: |
      If you already pay one of these vendors, the audit converts directly into renewal leverage. Take your vendor's own behavioral claim — it is on their homepage — and ask them to substantiate it in your stores before the contract renews. We keep a full list of questions for that meeting in <a href="qbr-questions-music-vendor.html">What to Ask Your Music Vendor at the Next QBR</a>; questions one and eight do most of the work.

      Their answer will be a survey, a study from someone else's stores, or silence. All three are the same answer: the claim is marketing. A vendor that believed its own behavioral claim would offer to measure it. We do.

