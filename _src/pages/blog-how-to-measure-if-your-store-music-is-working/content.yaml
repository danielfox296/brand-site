  - type: prose
    body: |
      Ask any retailer what their conversion rate is and they will give you a number. Ask them what their average transaction value was last month and they have it. Ask whether the music in their store is increasing or decreasing those numbers and the conversation stops.

      The problem is not that the answer is complicated. The problem is that no data exists to answer the question. The music provider tracks what was scheduled to play. The POS system tracks what was sold. Nobody connects the two.

  - type: subhead
    level: 2
    text: "Why your music provider cannot tell you"
    anchor: "provider-gap"

  - type: prose
    body: |
      Commercial music services are built to deliver and schedule music. Their reporting tells you which songs played at which times. Schedule adherence. Play counts. Station selections. This is operational data. It confirms the service is running.

      What it does not tell you: did dwell time change when the playlist changed? Did conversion move when the tempo shifted? Did average transaction value respond to the genre rotation? Did the Thursday evening jazz experiment produce different results than the Friday morning pop selection?

      This is not a feature gap. It is an architecture gap. Connecting audio variables to business outcomes requires logging the specific musical parameters of every track (not just the song name, but the tempo, key, instrumentation, energy, and genre blend), and then correlating those parameters against concurrent sales data, foot traffic, and dwell time. For more on this architecture problem, see [the metrics your audio environment should be producing](../blog/the-metrics-your-audio-environment-should-be-producing.html).

  - type: stat_callout
    number: "34%"
    label: "increase in dwell time from slow tempo — the most consistently documented audio effect"
    source: "Milliman, 1982"
    accent: teal

  - type: prose
    body: |
      No catalog-based music service does this because no catalog-based music service controls the musical parameters at that level. They select songs. The songs have whatever characteristics the original artist gave them. There is no parameterized input to correlate against.

  - type: subhead
    level: 2
    text: "The four metrics that matter"
    anchor: "four-metrics"

  - type: prose
    body: |
      If you want to know whether your music is working, these are the four metrics to watch. Each one has a documented relationship to audio environment variables in the research literature.

      **Dwell time.** How long customers stay in the store. The most consistently documented effect of music on retail behavior. Milliman's 1982 study showed slow tempo increased dwell time by 34%. Dozens of replications since then confirm the direction, though the magnitude varies by context. Measurement requires foot traffic counting at entry and exit. If you have a RetailNext, Sensormatic, or similar system, you probably already have this data. The gap is that nobody is correlating it against what was playing when the dwell time moved.

      **Conversion rate.** The percentage of visitors who make a purchase. More sensitive to overall store execution than to any single variable, but audio environment contributes. Research shows that congruent music (music that matches customer psychology) increases purchase confidence. Incongruent music disrupts it.

  - type: stat_callout
    number: "2.5x"
    label: "increase in average wine purchase price with quality-priming music"
    source: "Areni & Kim, 1993"
    accent: gold

  - type: prose
    body: |
      **Average transaction value.** What each customer spends per purchase. The metric most directly affected by quality inference and willingness-to-pay priming. Areni and Kim showed a 2.5x increase in average wine purchase price when classical music replaced pop. The mechanism is ambient priming of quality perception.

      **Return visit frequency.** How often customers come back. The hardest to attribute to any single variable but the most valuable over time. Research found that 90% of shoppers say they are more likely to revisit a store with enjoyable atmosphere. Audio is a major component of atmosphere. A 5% increase in return visit frequency over a year produces a meaningful change in lifetime customer value.

  - type: pullquote
    text: "If you cannot answer the question 'is the music in my store helping or hurting sales,' you are making a decision that affects every customer interaction without any feedback."
    accent: teal

  - type: subhead
    level: 2
    text: "What a measurement architecture looks like"
    anchor: "measurement-architecture"

  - type: prose
    body: |
      Measuring music's effect on retail requires three components. First, parameterized music. Every track needs to be logged with its specific musical characteristics, not just a song name and artist. Tempo, key, mode, instrumentation, energy level, genre classification.

      Second, concurrent business data. Sales by hour, foot traffic, dwell time, conversion rate. Most retailers already have this from their POS and analytics systems.

      Third, a correlation engine that connects the two. When the music shifted from 72 BPM acoustic guitar at 2pm to 95 BPM electronic at 3pm, what happened to dwell time and ATV in the same window? Over enough iterations, patterns emerge. Specific musical parameters produce specific behavioral responses in your specific store with your specific customers.

      This is not possible with a catalog-based music service that rotates songs without logging or controlling their parameters. It requires music where every variable is deliberate, logged, and adjustable. For more on what this measurement gap costs you, read [how to measure the ROI of in-store music](../blog/measure-roi-retail-music.html).

  - type: subhead
    level: 2
    text: "Starting without the full architecture"
    anchor: "starting-simple"

  - type: prose
    body: |
      If you do not have a measurement system, you can still run crude tests. Pick a specific week. Note the music configuration (station, genre, approximate tempo). Record daily sales, traffic, and ATV from your POS. The next week, change one variable. Compare.

      This is not statistically rigorous. A week of data in a single store is too noisy and too short to draw firm conclusions. But it builds the muscle of treating music as a variable rather than a fixed condition. And it surfaces the question: if I had better data, would I make different music decisions?

