- type: video
- type: prose
  body: 'The right store music isn''t a genre — it''s a system. Research shows music must (1) fit your brand identity, (2) match your product''s emotional register, and (3) be liked by your target customer — but customers can''t reliably tell you what they like, because 86% don''t consciously notice the music influencing them.

    In this video I break down the five-variable framework the research gives us: brand fit, product-emotion matching, customer preference, familiarity avoidance, and cross-sensory arousal alignment — with studies from the Journal of Business Research, Journal of Services Marketing, and more.

    '
- type: transcript
  chapters: *id001
- type: subhead
  level: 2
  text: What kind of music should I play in my store?
- type: prose
  body: 'There''s no single genre answer. The research gives a framework: (1) Music must fit your brand — misfit music damages brand perception worse than silence (Beverland et al., 2006). (2) Match the emotional register to your product — sad music outsells happy music for sentimental products (Alpert & Alpert, 1990). (3) Classical raises willingness to pay, but only for hedonic/pleasure products (Grossman & Rachamim, 2025). (4) Avoid familiar hits — they shorten dwell time. (5) Match your music''s arousal level to your scent and lighting.

    '
- type: subhead
  level: 2
  text: Can't I just ask my customers what they want to hear?
- type: prose
  body: 'Unfortunately, no. A 1996 study found customer preference was the strongest predictor of behavior, but a 1999 study showed 86% of customers don''t consciously register the music that''s changing their buying patterns. They can''t reliably tell you what works because the effects are subconscious. You need to test and measure, not survey.

    '
- type: subhead
  level: 2
  text: This sounds really complicated. Is there a simpler approach?
- type: prose
  body: 'Start with brand fit — that''s the highest-stakes variable. If your music clashes with your brand identity, it''s actively hurting you. Then match energy level across senses (music + scent + lighting should agree). For a system that manages all five variables automatically, Entuned generates music matched to retail contexts. Free tier at entuned.co. Full citations in the description. This is video 5 of 50 in this series.

    '
