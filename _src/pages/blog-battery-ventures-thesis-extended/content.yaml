title: "The Battery Ventures Thesis, Extended"
slug: "battery-ventures-thesis-extended"
eyebrow: "MARKET INTEL"
dek: "Battery Ventures backed RetailNext to build the physical retail data layer. The next logical surface for that thesis is the one nobody has connected yet."
