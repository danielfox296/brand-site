h1_1: Retail Has Designed Everything Except the Most Powerful Thing
h2_1: When the Music Is Wrong
h2_2: When the Music Is Right
h2_3: Why This Gets Left to Chance
h2_4: Taste Is the Wrong Tool
meta_1: Daniel Fox &middot; April 2026 &middot; 2 min read
btn_1: Ask About a Pilot Program

p_tldr: "<strong>TL;DR:</strong> Retail environments are carefully composed. Every surface, fixture, and light is a deliberate choice. But the music gets left to personal taste, and taste is the wrong tool. Forty years of research shows music is a controllable variable with measurable effects on buying behavior. The stores that figure this out treat it the way they treat lighting."

p_1: Walk into a store that's doing it right and you feel it before you understand it.

p_2: "The light is doing something specific. Not bright, not dim. Calibrated. The kind of diffused warmth that makes everything look a little better than it would under fluorescents, including you. The surfaces are considered: wood grain here, marble there, a texture on the wall that you probably won't touch but registered anyway. The staff are dressed in a way that tells you something about the brand before they open their mouths, and the way they move through the floor, unhurried, present, is not an accident. Someone decided that."

p_3: This is what a mood board looks like when it comes to life. Every material, every fixture, every human in the room is a choice that either serves the vision or pulls against it. The best retail environments are compositions. And like any composition, one wrong note is all it takes.

p_4: Then the music comes on.

p_5: "When the music is wrong, something specific happens to a customer. They stop feeling and start thinking. The spell the environment was casting, that carefully constructed sense of belonging, of being in the right place, breaks. And when it breaks, the customer doesn't stay in the experience. They step outside it. They start critiquing what has been put in front of them."

p_6: "\"Who is in charge of this?\" is not a thought that leads to a purchase."

p_7: "You go from feeling considered to evaluating whether you are. That shift is the cost. It happens fast, faster than most retailers realize, because they're rarely standing on their own floor with fresh eyes when <a href=\"../blog/sound-check-playlist-problem.html\">the playlist</a> rolls over into something that has no business being there."

p_8: When the music is right, the customer doesn't notice it. That's how it works.

p_9: "What they notice instead is that they feel like they're in the right place. The music is doing something underneath the conscious experience, something closer to a current in a river than a song on a speaker. It carries people. Toward the back of the store, toward a second look at something, toward a mood that opens them up rather than closing them down. It can be nostalgic, pulling on something they didn't know they wanted to feel. It can be aspirational, telling them something about who they are when they're here. It can be charged with possibility, or warmth, or the particular kind of ease that makes a decision feel smaller than it is."

p_10: The customer doesn't trace any of that back to the music. They just buy the jacket.

p_11: So why does this keep getting left to chance?

p_12: "The honest answer is that most retailers trust their taste. And taste feels like enough, right up until you're three tracks into building a playlist and you've forgotten who your customer is. The intention was good. The execution defaulted, almost immediately, to personal favorites. Songs that feel right to the person building the list, which is a different person from the person standing in the store."

p_13: Nobody admits this. But the playlist tells the story.

p_14: "Beyond that, there's no outcome-based thinking in this process at all. Nobody building a retail playlist is asking how this affects how long customers stay, or how deliberately they consider the products in front of them, or how quickly they make a decision. Those questions have answers. There's <a href=\"../blog/sound-check-science-youre-ignoring.html\">forty years of research</a> on exactly this. But the playlist builder isn't a musicologist, and even if they were, they're working with no connection between the music and what the sales data actually does."

p_15: Everyone wants to be respected for their taste. Almost uniformly.

p_16: "Retail music is a game of designing for sales lift, and that game has a much more considered set of rules."

p_17: "The stores that figure this out stop thinking about music as a playlist problem and start thinking about it <a href=\"../blog/sound-designer.html\">the way they think about lighting</a>: as a <a href=\"../blog/sound-check-music-is-a-variable.html\">controllable variable</a> with measurable effects, worth getting right."

p_byline: Daniel<br>Founder, Entuned

p_bio: "<strong>Daniel Fox</strong> is the founder of Entuned, where he builds music systems engineered for retail customer psychology. Background in music theory, behavioral research, and data-driven product design. <a href=\"../about.html\">More about Daniel</a>"

p_cta: "Entuned treats music the way your store treats lighting: as a controllable variable with measurable effects. Built for your customer, measured against your data."
