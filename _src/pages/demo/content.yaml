# 02-problem
eyebrow_2: The Status Quo
h2_1: Nobody designed this music for your customer.
p_2: Alcott sells elevated everyday objects. Ceramics, textiles, small furniture. Their customers browse slowly, by design.
pullquote_1: "What music should be playing for <em>her?</em>"
bridge_1: "Right now, most stores have three options."
card_label_1: The Playlist
card_text_1: Curated for taste, not outcomes. Nobody owns the results.
card_label_2: Personal Spotify
card_text_2: Consumer license. Every play in a commercial space is a violation.
card_label_3: Big-Box Provider
card_text_3: Nothing is built for your customer.
p_3: In all three cases, the music was never designed to support customer behavior. Inviting enough not to drive people out. That is the bar.

# 03-variables
eyebrow_3: What Music Actually Does
h2_2: Every track carries decisions. Most stores make none of them.
var_key_1: Tempo
var_val_1: Slower tempos extend dwell time. Faster tempos clear the floor. Unmanaged, it defaults to whatever the artist felt.
var_key_2: "Key &amp; Mode"
var_val_2: Major keys lift mood. Minor keys create introspection. The wrong one changes what customers decide.
var_key_3: Instrumentation
var_val_3: Acoustic signals craft. Synths signal trend. Each instrument sets a brand expectation before a product is touched.
var_key_4: Lyrics
var_val_4: A lyric about leaving primes departure. A lyric about indulgence primes purchase. Words are never neutral.
var_key_5: Familiarity
var_val_5: Familiar songs make time feel faster. The customer thinks she has been there longer. She wants to leave sooner.
vars_answer_1: "Entuned makes all of it <span class=\"demo-gold\">intentional.</span>"

# 04-icp
icp_caption_1: "ICP Seed Profile &middot; Alcott &amp; Co."
eyebrow_4: The Customer
icp_name_1: Mara.
icp_line_1: She arrives on Saturday afternoons. She is in no hurry.
icp_line_2: She picks things up, puts them down, picks them up again. She is not deciding whether she can afford it. She is deciding whether it belongs in her life.
icp_line_3: She finds busy soundscapes irritating. She needs the room to feel like it has time.
ledger_key_1: Typical visit
ledger_val_1: "18&ndash;24 minutes"
ledger_key_2: Frequency
