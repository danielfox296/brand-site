# 02-problem
eyebrow_2: The Status Quo
h2_1: Nobody designed this music for your customer.
p_2: Alcott sells elevated everyday objects. Ceramics, textiles, small furniture. Their customers browse slowly, by design.
pullquote_1: "What music should be playing for <em>her?</em>"
bridge_1: "Right now, most stores have three options."
card_label_1: The Playlist
card_text_1: Curated for taste, not outcomes. Nobody owns the results.
card_label_2: Personal Spotify
card_text_2: Consumer license. Every play in a commercial space is a violation.
card_label_3: Big-Box Provider
card_text_3: Nothing is built for your customer.
p_3: In all three cases, nobody designed the music around the customer. Inviting enough not to drive people out. That is the bar.

# 03-variables
eyebrow_3: What Music Actually Does
h2_2: Every track carries decisions. Most stores make none of them.
var_key_1: Pace
var_val_1: Slower music extends dwell. Faster music clears the floor. Unmanaged, it defaults to whatever the artist felt.
var_key_2: "Feel"
var_val_2: Some music lifts mood. Some music slows a room down. The wrong choice changes what customers decide.
var_key_3: Texture
var_val_3: An acoustic sound suggests craft. A synthetic sound suggests trend. The room sets a brand expectation before anyone touches a product.
var_key_4: Lyrics
var_val_4: Words about leaving prime departure. Words about indulgence prime purchase. Lyrics are never neutral in a store.
var_key_5: Familiarity
var_val_5: A familiar song makes time feel faster. The customer thinks she has been there longer. She wants to leave sooner.
vars_answer_1: "Entuned makes all of it <span class=\"demo-gold\">intentional.</span>"

# 04-icp
icp_caption_1: "Customer Profile &middot; Alcott &amp; Co."
eyebrow_4: The Customer
icp_name_1: Mara.
icp_line_1: She arrives on Saturday afternoons. She is in no hurry.
icp_line_2: She picks things up, puts them down, picks them up again. She is not deciding whether she can afford it. She is deciding whether it belongs in her life.
icp_line_3: She finds busy rooms irritating. She needs the room to feel like it has time.
ledger_key_1: Typical visit
ledger_val_1: "18&ndash;24 minutes"
ledger_key_2: Frequency
ledger_val_2: "2&times; per month, Saturday afternoons"
ledger_key_3: Decision style
ledger_val_3: Deliberate. Needs space to feel certain.
ledger_key_4: Audio response
ledger_val_4: Responds to sound that does not compete
ledger_key_5: Peak engagement
ledger_val_5: When the room feels unhurried
icp_pullquote_1: She stays 22% longer when the room feels unhurried.
icp_chips_label_1: What the music needs to do
icp_chip_1: "Let the room breathe"
icp_chip_2: "Lift the mood without pushing"
icp_chip_3: "Stay out of her way"
icp_chip_4: "Speak to time, not to hurry"

