# 06-timeline
eyebrow_6: The Story
h2_4: "Mara's 18 minutes."
timeline_sub_1: The music shifted four times. Each shift was a decision.
track_label_1: Track 1 of 4
moment_time_1: "0:00"
moment_activity_1: Entry
moment_desc_1: Mara walks in. The music is already there. It does not announce itself.
moment_music_1: 80 BPM, acoustic texture, major key, muted voicings. No percussion. The room says welcome before she reads the price tag.
moment_instruction_1: "&#9654;&nbsp; Start the Wonder player from the beginning."
moment_time_2: "4:32"
moment_activity_2: Active Browse
moment_desc_2: She has picked up three things. The system detected movement and engagement. The music shifted.
moment_music_2: 94 BPM, light rhythmic pulse. Same temperature as Entry. Slightly more present. Keeps pace without leading.
moment_instruction_2: "&#9654;&nbsp; Skip to 4:32 in the Wonder player."
moment_time_3: "11:15"
moment_activity_3: Extended Dwell
moment_desc_3: She has not moved from the ceramics shelf in 90 seconds. The system detected it. The music slowed.
moment_music_3: 68 BPM. Major sevenths and suspended chords. No percussion. The moment belongs to her, not to the store.
moment_instruction_3: "&#9654;&nbsp; Skip to 11:15 in the Wonder player."
moment_time_4: "16:48"
moment_activity_4: Exit Approach
moment_desc_4: She started toward the door. She had not bought anything yet. The music shifted again.
moment_music_4: 87 BPM. More textural. A melodic idea that does not resolve. A question, not a conclusion.
moment_instruction_4: "&#9654;&nbsp; Skip to 16:48 in the Wonder player."

