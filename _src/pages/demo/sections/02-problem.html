<section class="demo-problem-section">
  <div class="demo-problem-inner">
    <span class="eyebrow fade-up">{{content.eyebrow_2}}</span>
    <h2 class="demo-problem-headline fade-up">{{content.h2_1}}</h2>
    <p class="demo-problem-lede fade-up">{{content.p_2}}</p>
  </div>

  <!-- Giant full-bleed pull quote -->
  <div class="demo-pullquote-full fade-up">
    <p>{{content.pullquote_1}}</p>
  </div>

  <div class="demo-problem-inner">
    <span class="demo-bridge fade-up">{{content.bridge_1}}</span>

    <!-- 3 bad options — real SVG icons, not emoji -->
    <div class="demo-options-grid">

      <div class="demo-option-card fade-up">
        <!-- Playlist icon: 3 lines + small play triangle -->
        <svg class="demo-option-icon" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
          <line x1="4" y1="9" x2="22" y2="9"/>
          <line x1="4" y1="16" x2="22" y2="16"/>
          <line x1="4" y1="23" x2="16" y2="23"/>
          <polygon points="24,13 24,23 30,18" fill="currentColor" stroke="none"/>
        </svg>
        <span class="demo-option-label">{{content.card_label_1}}</span>
        <p class="demo-option-text">{{content.card_text_1}}</p>
      </div>

      <div class="demo-option-card fade-up">
        <!-- Lock / warning icon -->
        <svg class="demo-option-icon" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="6" y="14" width="20" height="14" rx="2"/>
          <path d="M10 14v-4a6 6 0 0 1 12 0v4"/>
          <line x1="16" y1="20" x2="16" y2="23"/>
          <circle cx="16" cy="19" r="1.5" fill="currentColor" stroke="none"/>
        </svg>
        <span class="demo-option-label">{{content.card_label_2}}</span>
        <p class="demo-option-text">{{content.card_text_2}}</p>
      </div>

      <div class="demo-option-card fade-up">
        <!-- Grid / building icon -->
        <svg class="demo-option-icon" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="4" y="4" width="10" height="10" rx="1"/>
          <rect x="18" y="4" width="10" height="10" rx="1"/>
          <rect x="4" y="18" width="10" height="10" rx="1"/>
          <rect x="18" y="18" width="10" height="10" rx="1"/>
        </svg>
        <span class="demo-option-label">{{content.card_label_3}}</span>
        <p class="demo-option-text">{{content.card_text_3}}</p>
      </div>

    </div>

    <p class="demo-kicker fade-up">{{content.p_3}}</p>
  </div>
</section>
