<section class="demo-vars-section">
  <div class="demo-vars-inner">
    <span class="eyebrow fade-up">{{content.eyebrow_3}}</span>
    <h2 class="demo-vars-headline fade-up">{{content.h2_2}}</h2>

    <div class="demo-var-ledger">

      <div class="demo-var-row fade-up">
        <!-- Metronome / tempo icon -->
        <svg class="demo-var-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
          <path d="M12 20V8"/>
          <path d="M5 20 L12 4 L19 20 Z"/>
          <line x1="9" y1="12" x2="13" y2="10"/>
        </svg>
        <span class="demo-var-key">{{content.var_key_1}}</span>
        <p class="demo-var-val">{{content.var_val_1}}</p>
      </div>

      <div class="demo-var-row fade-up">
        <!-- Musical note -->
        <svg class="demo-var-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
          <path d="M9 18V5l12-2v13"/>
          <circle cx="6" cy="18" r="3"/>
          <circle cx="18" cy="16" r="3"/>
        </svg>
        <span class="demo-var-key">{{content.var_key_2}}</span>
        <p class="demo-var-val">{{content.var_val_2}}</p>
      </div>

      <div class="demo-var-row fade-up">
        <!-- Guitar / instrument silhouette -->
        <svg class="demo-var-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M9 3 L15 3 L15 8 Q18 10 18 14 Q18 19 12 19 Q6 19 6 14 Q6 10 9 8 Z"/>
          <line x1="12" y1="3" x2="12" y2="8"/>
          <circle cx="12" cy="14" r="2"/>
        </svg>
        <span class="demo-var-key">{{content.var_key_3}}</span>
        <p class="demo-var-val">{{content.var_val_3}}</p>
      </div>

      <div class="demo-var-row fade-up">
        <!-- Speech bubble -->
        <svg class="demo-var-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
        <span class="demo-var-key">{{content.var_key_4}}</span>
        <p class="demo-var-val">{{content.var_val_4}}</p>
      </div>

      <div class="demo-var-row fade-up">
        <!-- Clock -->
        <svg class="demo-var-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="9"/>
          <path d="M12 7v5l3 3"/>
        </svg>
        <span class="demo-var-key">{{content.var_key_5}}</span>
        <p class="demo-var-val">{{content.var_val_5}}</p>
      </div>

    </div>

    <!-- Gold reveal line -->
    <div class="demo-vars-answer fade-up">
      <p class="demo-vars-answer-line">{{content.vars_answer_1}}</p>
    </div>
  </div>
</section>
