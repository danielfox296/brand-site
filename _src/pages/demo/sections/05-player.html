<section class="demo-player-section">
  <div class="demo-player-inner">
    <span class="eyebrow">The Sound</span>
    <h2 class="demo-player-headline fade-up">This is what the system built for Mara.</h2>
    <p class="demo-player-sub fade-up">Four tracks. Four behavioral decisions. One 18-minute visit.</p>

    <!-- Animated waveform SVG -->
    <svg class="demo-waveform fade-up" viewBox="0 0 320 60" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <!-- 15 bars, varying heights, centered at y=30, colored with currentColor -->
      <rect class="wv-bar" x="0"   y="22" width="12" height="16" fill="currentColor" rx="2"/>
      <rect class="wv-bar" x="20"  y="14" width="12" height="32" fill="currentColor" rx="2"/>
      <rect class="wv-bar" x="40"  y="8"  width="12" height="44" fill="currentColor" rx="2"/>
      <rect class="wv-bar" x="60"  y="16" width="12" height="28" fill="currentColor" rx="2"/>
      <rect class="wv-bar" x="80"  y="4"  width="12" height="52" fill="currentColor" rx="2"/>
      <rect class="wv-bar" x="100" y="10" width="12" height="40" fill="currentColor" rx="2"/>
      <rect class="wv-bar" x="120" y="18" width="12" height="24" fill="currentColor" rx="2"/>
      <rect class="wv-bar" x="140" y="6"  width="12" height="48" fill="currentColor" rx="2"/>
      <rect class="wv-bar" x="160" y="18" width="12" height="24" fill="currentColor" rx="2"/>
      <rect class="wv-bar" x="180" y="10" width="12" height="40" fill="currentColor" rx="2"/>
      <rect class="wv-bar" x="200" y="4"  width="12" height="52" fill="currentColor" rx="2"/>
      <rect class="wv-bar" x="220" y="16" width="12" height="28" fill="currentColor" rx="2"/>
      <rect class="wv-bar" x="240" y="8"  width="12" height="44" fill="currentColor" rx="2"/>
      <rect class="wv-bar" x="260" y="14" width="12" height="32" fill="currentColor" rx="2"/>
      <rect class="wv-bar" x="280" y="22" width="12" height="16" fill="currentColor" rx="2"/>
    </svg>

    <!-- Credentials box -->
    <div class="demo-credentials fade-up">
      <span class="demo-credentials-label">Player Access</span>

      <div class="demo-credentials-row">
        <span class="demo-credentials-key">Store</span>
        <span class="demo-credentials-val">Alcott &amp; Co.</span>
        <button class="demo-copy-btn" data-copy="Alcott & Co." title="Copy" aria-label="Copy store name">
          <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true">
            <rect x="4" y="4" width="8" height="8" rx="1"/>
            <path d="M2 10V2h8"/>
          </svg>
        </button>
      </div>

      <div class="demo-credentials-row">
        <span class="demo-credentials-key">Email</span>
        <span class="demo-credentials-val">demo@alcottandco.entuned.co</span>
        <button class="demo-copy-btn" data-copy="demo@alcottandco.entuned.co" title="Copy" aria-label="Copy email">
          <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true">
            <rect x="4" y="4" width="8" height="8" rx="1"/>
            <path d="M2 10V2h8"/>
          </svg>
        </button>
      </div>

      <div class="demo-credentials-row">
        <span class="demo-credentials-key">Password</span>
        <span class="demo-credentials-val">maraishere</span>
        <button class="demo-copy-btn" data-copy="maraishere" title="Copy" aria-label="Copy password">
          <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true">
            <rect x="4" y="4" width="8" height="8" rx="1"/>
            <path d="M2 10V2h8"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Launch button -->
    <a
      href="https://play.entuned.co?email=demo%40alcottandco.entuned.co"
      target="_blank"
      rel="noopener"
      class="demo-launch-btn fade-up"
    >
      Open the Wonder Player
      <svg class="demo-launch-arrow" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <path d="M4 14 L14 4 M6 4 H14 V12"/>
      </svg>
    </a>

    <p class="demo-player-note fade-up">Opens in a new tab &nbsp;&middot;&nbsp; Return here to follow the story</p>
  </div>
</section>

<script>
// Copy buttons
document.querySelectorAll('.demo-copy-btn').forEach(function(btn) {
  btn.addEventListener('click', function() {
    var text = btn.getAttribute('data-copy');
    navigator.clipboard.writeText(text).then(function() {
      var icon = btn.querySelector('svg');
      icon.style.color = 'var(--accent)';
      setTimeout(function() { icon.style.color = ''; }, 1400);
    });
  });
});
</script>
