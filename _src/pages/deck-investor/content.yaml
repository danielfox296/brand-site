p_35: Running Entuned in treatment stores.
p_36: Existing playlist continues in control stores.
p_37: Why Free
p_38: Replaces existing streaming spend. Immediate cost relief for the pilot partner.
p_39: Churn risk stays near zero. Nobody asks to go back to paying more for worse music.
p_40: Every month of pilot operation produces proprietary evidence about whether the thesis holds.
p_41: Evidence that retail audio moves the numbers is worth more than early SaaS revenue. Monetization follows the proof.
p_42: Business Model
p_43: Free to pilot partners. Entuned replaces existing streaming spend. The value exchange is straightforward. We run the study. The retailer gets audio produced for their customer and visibility they have never had.
p_44: Post-pilot pricing is set against proven retail outcomes. The product is a measurable performance channel.
p_45: Downstream opportunities include data licensing and retailer-facing insight products as the evidence base grows.
p_46: The Market
p_47: Category sizing from Mordor Intelligence, 2025.
p_48: High-ticket retail. Existing sensor stack. Multi-location chains.
p_49: High-ticket · established music-behavior science · granular player data
