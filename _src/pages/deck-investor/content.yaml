p_6: The Problem
p_7: Chains pay for generic streaming. The music gets chosen for reasons that have nothing to do with what happens in the store.
p_8: No visibility into whether the music helps or hurts sales.
p_9: The real cost is the revenue lost every day to music that has nothing to do with the customer in front of it.
