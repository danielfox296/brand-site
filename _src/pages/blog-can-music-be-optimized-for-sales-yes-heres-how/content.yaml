- type: subhead
  level: 2
  text: Can music really be optimized for sales?
- type: prose
  body: 'Yes. The research identifies four independently controllable levers: tempo (38% sales lift in the foundational study), mode/key (12% lift when combined with tempo), volume (soft music adds $3.05 to average checks), and genre congruence (classical music lifted wine spend to 2x vs. pop). Each can be tested and tuned like any other business variable.

    '
- type: subhead
  level: 2
  text: Can't I just swap playlists and see what works?
- type: prose
  body: 'No — that''s like A/B testing a landing page where version B changes the headline, image, CTA, layout, and colors all at once. You can''t isolate what worked. Playlists bundle all variables together. Real optimization requires changing one parameter at a time while holding everything else constant — which requires a system that controls parameters independently.

    '
- type: subhead
  level: 2
  text: What does an optimization cycle actually look like?
- type: prose
  body: 'Weeks 1-2: baseline with current settings. Weeks 3-4: shift tempo, measure. Weeks 5-6: test mode/key, measure. Weeks 7-8: adjust volume, measure. After 8 weeks you have data on three variables and can implement winning combinations. Entuned automates this — try the free tier at entuned.co to start testing. Full citations in the description. This is video 37 of 50 in this series.

    '
