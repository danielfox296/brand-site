- type: video
- type: prose
  body: 'Music is the fastest emotional lever in any retail environment — faster than lighting, scent, or visual merchandising. A 1994 Journal of Retailing study found that pleasure experienced within the first five minutes of a shopping trip significantly predicted unplanned purchases, more than total time in store or number of aisles visited.


    In this video I cover the PAD model (pleasure, arousal, dominance), why "happy" music isn''t always best, and how congruence between music and other sensory elements either amplifies or cancels emotional effects.

    '
- type: transcript
  chapters: *id001
- type: subhead
  level: 2
  text: How does music influence emotions in retail?
- type: prose
  body: 'Music directly modulates the two key emotional dimensions in retail: pleasure and arousal. Tempo controls arousal (energy level), while mode, harmony, and familiarity control pleasure. A 1994 study found pleasure at the five-minute mark predicted unplanned spending better than total time in store or aisles visited. Music sets the emotional trajectory from the moment customers walk in.

    '
- type: subhead
  level: 2
  text: Shouldn't I just play happy, upbeat music?
- type: prose
  body: 'No. A 1990 study found that emotionally complex (sad/minor) music generated stronger purchase intentions in a card shop — because it matched the emotional depth of the products. A 2008 study found "liked" matters more than "happy." Customers who enjoy atmospheric or melancholic music are in a better buying state than customers hearing "happy" music they find annoying.

    '
- type: subhead
  level: 2
  text: How do I get the emotional layer right?
- type: prose
  body: 'Three rules: (1) Treat the first five minutes like prime time — that window sets the trajectory. (2) Match emotional complexity of music to your product — luxury needs depth, not pop hits. (3) Check congruence — if your scent, lighting, and music tell different stories, they cancel each other out. Entuned (entuned.co, free tier) creates coherent emotional environments grounded in 40 years of research. Full citations in the description. This is video 18 of 50 in this series.

    '
