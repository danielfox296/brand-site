<!-- Organization JSON-LD comes from build.py — the single sitewide block. Do not add one here. -->
<section class="llc">
  <div class="llc-wrap">
    <h1 class="llc-title">{{content.h1_1}}</h1>
    <p class="llc-intro">{{content.p_intro}}</p>

    <h2 class="llc-label">{{content.h2_ventures}}</h2>
    <ul class="llc-ventures">
      <li class="llc-venture">
        <a class="llc-venture-link" href="{{content.signet_url}}">
          <img class="llc-venture-logo" src="img/ventures/signet-artists.png" alt="{{content.signet_name}}" width="186" height="72">
          <span class="llc-venture-line">{{content.signet_line}}</span>
          <span class="llc-venture-domain">{{content.signet_domain}} &rarr;</span>
        </a>
      </li>
      <li class="llc-venture">
        <a class="llc-venture-link" href="{{content.fox_url}}">
          <span class="llc-venture-name">{{content.fox_name}}</span>
          <span class="llc-venture-line">{{content.fox_line}}</span>
          <span class="llc-venture-domain">{{content.fox_domain}} &rarr;</span>
        </a>
      </li>
      <li class="llc-venture">
        <a class="llc-venture-link" href="{{content.mb_url}}">
          <span class="llc-venture-name">{{content.mb_name}}</span>
          <span class="llc-venture-line">{{content.mb_line}}</span>
          <span class="llc-venture-domain">{{content.mb_domain}} &rarr;</span>
        </a>
      </li>
    </ul>
  </div>
</section>
