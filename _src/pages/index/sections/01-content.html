<!-- Organization JSON-LD comes from build.py — the single sitewide block. Do not add one here. -->
<section class="llc">
  <div class="container">
    <header class="llc-hero">
      <h1 class="llc-logo llc-rise"><img src="img/entuned-logo-ice.svg" alt="{{content.h1_1}}" width="475" height="138"></h1>
      <p class="llc-intro llc-rise">{{content.p_intro}}</p>
    </header>

    <ul class="llc-ventures">
      <li class="llc-rise">
        <a class="llc-card" href="{{content.signet_url}}">
          <span class="llc-card-name">{{content.signet_name}}</span>
          <span class="llc-card-line">{{content.signet_line}}</span>
          <span class="llc-card-foot"><span class="llc-card-domain">{{content.signet_domain}}</span><span class="llc-card-arrow" aria-hidden="true">&rarr;</span></span>
        </a>
      </li>
      <li class="llc-rise">
        <a class="llc-card" href="{{content.fox_url}}">
          <span class="llc-card-name">{{content.fox_name}}</span>
          <span class="llc-card-line">{{content.fox_line}}</span>
          <span class="llc-card-foot"><span class="llc-card-domain">{{content.fox_domain}}</span><span class="llc-card-arrow" aria-hidden="true">&rarr;</span></span>
        </a>
      </li>
      <li class="llc-rise">
        <a class="llc-card" href="{{content.mb_url}}">
          <span class="llc-card-name">{{content.mb_name}}</span>
          <span class="llc-card-line">{{content.mb_line}}</span>
          <span class="llc-card-foot"><span class="llc-card-domain">{{content.mb_domain}}</span><span class="llc-card-arrow" aria-hidden="true">&rarr;</span></span>
        </a>
      </li>
    </ul>
  </div>
</section>

<script>
  // Card glow follows the pointer. Fine pointers only; without JS the cards
  // keep their hover lift and border, just no glow.
  (function () {
    if (!window.matchMedia('(hover: hover) and (pointer: fine)').matches) return;
    document.querySelectorAll('.llc-card').forEach(function (card) {
      var frame = 0;
      card.addEventListener('pointermove', function (e) {
        if (frame) return;
        frame = requestAnimationFrame(function () {
          frame = 0;
          var r = card.getBoundingClientRect();
          card.style.setProperty('--mx', (e.clientX - r.left) + 'px');
          card.style.setProperty('--my', (e.clientY - r.top) + 'px');
        });
      }, { passive: true });
    });
  })();
</script>
