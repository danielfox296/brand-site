# index — editable text content

hero:
  h1: "The unmeasured variable in your store's P&L."
  subline: "Every store plays music. Almost no operator knows what it's doing to dwell, basket, or conversion. Entuned is music engineered to your customer and your outcome — deployed in minutes, measurable by your existing reports."
  cta_primary: "Start Free"
  cta_secondary: "See Pricing"

# Pillar 1 — Music is a behavioral variable
pillar1:
  eyebrow: "The Gap"
  h2: "The music in your store is doing something. Almost nobody chose what."
  p1: "A Soundtrack Your Brand contract auto-renews every month. A Mood Media legacy line runs in the background. Someone's Spotify Premium is plugged into the receiver. The team that picked the lighting had a plan. The team that picked the paint had a plan. The audio is whatever the vendor sent over."
  p2: "Forty years of peer-reviewed research says that's a measurable miss. Tempo affects the pace customers walk through your store (Milliman 1982). Music a customer reads as belonging to them moves their willingness to pay (Areni &amp; Kim 1993). Familiar songs cut perceived dwell (Yalch &amp; Spangenberg 2000). The variable is doing work in the room. The question is whether you chose what."

# Pillar 2 — We engineer it
pillar2:
  eyebrow: "The Lever"
  h2: "Music engineered for your customer and your outcome."
  p1: "The behavioral variable is parameterizable. Tempo, key, instrumentation, lyrical density, energy arc, and cultural reference set are all things that can be specified on purpose to fit a specific customer profile and a specific desired outcome — dwell, basket, conversion, brand reinforcement."
  p2: "Entuned starts from the customer your store is built for and produces music against those parameters. Not picked from a catalogue. Not curated from a playlist library. Engineered. The tracks are original, commercial-use cleared, and PRO-indemnified the moment they play."

# Pillar 3 — Self-improving
pillar3:
  eyebrow: "The Compound"
  h2: "Self-improving as the data accumulates."
  p1: "The Professional tier reads sales and traffic data tied to specific environmental conditions in your stores and refines the music against your store's outcomes as the dataset grows. Self-improving refinement compounds over weeks of data, not days."
  p2: "Every store running self-improving refinement adds to the proprietary behavioral dataset that improves the system for that store. The Essentials and Core tiers prove the concept on the floor. Professional proves the lift in the report."

