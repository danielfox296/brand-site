# FAQ
home_faq_h2: "Common questions, before you start."

home_faq_q1: "How much does it cost?"
home_faq_a1: 'Essentials is free, indefinite, no card. Core is $99 per location per month. Professional is $399 per location per month. Enterprise is negotiated per-store for multi-fleet rollouts. <a href="pricing.html">See full pricing →</a>'

home_faq_q2: "Do I need new hardware?"
home_faq_a2: "No. Entuned streams through whatever audio system you already have — Sonos, AirPlay, Bluetooth, line-in, hardwired. The stream plays from a URL we hand you."

home_faq_q3: "What about music licensing — am I covered?"
home_faq_a3: 'Yes. Every track Entuned plays is original, commercial-use cleared, and PRO-indemnified the moment it starts. No ASCAP, BMI, SESAC, or SoundExchange royalties. Every subscription includes a written indemnification certificate. <a href="licensing.html">Full details on the licensing page →</a>'

home_faq_q4: "What if I run multiple stores?"
home_faq_a4: 'Professional handles multi-store deployments with POS integration, day-parting, and self-improving refinement. For fleets requiring custom ICP design, performance guarantees, or white-glove rollout, talk to <a href="enterprise.html">Enterprise</a>.'

home_faq_q5: "How do I get started on Essentials?"
home_faq_a5: 'Sign in with your email or Google at <a href="https://app.entuned.co/start">app.entuned.co/start</a>. No card. You get a player URL the moment you finish.'

