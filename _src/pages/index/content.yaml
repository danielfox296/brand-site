# index — editable text content

hero:
  eyebrow: "A new design system for retail audio"
  h1: "Can the right music actually increase your sales?"
  subline: "Forty years of peer-reviewed research says yes. Tempo controls dwell time. Identity-fit music lifts what customers spend. Familiar music drives them out faster. Entuned produces original music designed for your customer and your store. Free forever, no credit card."
  cta_primary: "Start Free"

# Pillar 1 — Yes (research)
pillar1:
  eyebrow: "The short answer"
  h2: "Yes. The research is older and more specific than most shop owners realize."
  p1: "Music isn't ambient — it's a behavioral variable, peer-reviewed since 1982. Tempo controls how customers move through your store. Identity-fit music lifts what they're willing to pay. Familiar songs drive them out faster, even when they say they like it. The receipts are below."
  p2: "Most stores still play music chosen by a vendor who has never set foot inside. Visual merchandising got an intentional plan. Interior design picked the paint. The audio environment running over every customer all day is whatever the music vendor sent over. Forty years of evidence says that audio is doing measurable work in the room — the only question is whether you chose its effect."

# Pillar 2 — The mechanism (design spec)
pillar2:
  eyebrow: "The mechanism"
  h2: "Background music has been a creative endeavor for decades. We turned it into a design spec."
  p1: "Background music vendors lease songs artists wrote for other reasons — and the lyrics, tempo, energy, and cultural reference were never chosen with your retail floor in mind. Entuned produces original music to specification: your customer, your category, your outcome. Tempo tuned to your floor pace. Identity calibrated to your customer. Lyrics screened to avoid actively negative-priming the people you're trying to convert."
  p2: "The Core tier starts with the customer your store is built for. We produce music that speaks to them, motivates a shopping experience that fits, and gets out of the way. Original, commercial-use cleared, no PRO obligation passed to you. Not a playlist. Not a curated library. A design specification, executed."

# Pillar 3 — The proof (pilot + improvement)
pillar3:
  eyebrow: "The proof"
  h2: "Music that gets sharper the longer it runs."
  p1: "Free and Core deliver the concept. Pro pulls sales and traffic data from your locations and refines the music against the outcome you set — the longer it runs, the more precisely it produces what you measure. Self-improving refinement compounds over weeks and months of correlation."
  p2: "The first pilot store ran the system for one day. Conversion went from 18% to 28%. One Tuesday, one location — anecdotal until it isn't, but the kind of single-store evidence we have. The full pilot data lands in your reporting stack, your terms, structured as a 12-week test against matched control stores."

