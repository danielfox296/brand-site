# FAQ
home_faq_h2: "Common questions."

home_faq_q1: "How much does it cost?"
home_faq_a1: 'Entuned Free &mdash; no credit card, no invoice, no time limit. Entuned Core is $99 per location per month. Professional is $399 per location per month. Contact us for Enterprise pricing. <a href="pricing.html">See full pricing →</a>'

home_faq_q2: "Do I need new speakers or hardware?"
home_faq_a2: "No. Entuned streams through whatever audio system you already have — Sonos, AirPlay, Bluetooth, line-in, hardwired. The stream plays in a web browser. Internet, connected device, and speaker system required (obvi.)"

home_faq_q3: "What about music licensing — am I covered?"
home_faq_a3: 'Yes. Every song Entuned plays is original, commercial-use cleared, and PRO-indemnified the moment it starts. No ASCAP, BMI, SESAC, or SoundExchange royalties. Every subscription includes an indemnification certificate. <a href="licensing.html">Full details on the licensing page →</a>'

home_faq_q4: "What if I run multiple stores?"
home_faq_a4: 'Entuned Professional handles multi-store deployments with POS integration, Outcome Scheduling (advanced day-parting), and self-improving features. For fleets requiring custom ICP design, performance guarantees, or white-glove rollout, talk to <a href="enterprise.html">Enterprise</a>.'

home_faq_q5: "How do I get started on Entuned Free?"
home_faq_a5: 'Sign in with your email or Google at <a href="https://app.entuned.co/start">app.entuned.co/start</a>. No credit card. No Invoices You get a unique player URL the moment you finish that you can play from any tablet, mobile device or computer.'

