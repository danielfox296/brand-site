hero:
  eyebrow: "A new design system for retail audio"
  h1: "Can the right music actually increase your sales?"
  subline: "Forty years of peer-reviewed research says yes. Tempo controls dwell time. Identity-fit music lifts what customers spend. Familiar music drives them out faster. Entuned produces original music designed for your customer and your store. Free forever, no credit card."
  cta_primary: "Start Free"

# Pillar 1 — Music is a behavioral variable
pillar1:
  eyebrow: "The Gap"
  h2: "Music does something. But in retail, no one has chosen what that is."
  p1: "Stores either pay a background music provider on autopilot, run someone's personal Spotify, or playing whatever's on the radio. The store desginer had a lighting plan. Interior design picked the paint. But audio is... whatever?"
  p2: "We have forty years of peer-reviewed research, and not using music as a behavioral lever is a missed oppportunity. Tempo affects the pace customers walk through your store (Milliman 1982). When customers feel like they belong with the music, it increases their willingness to pay (Areni &amp; Kim 1993). Even familiar songs have an effect of reducing perceived dwell time (Yalch &amp; Spangenberg 2000). Music is actually working the room. But is it doing what you want?"

# Pillar 2 — We engineer it
pillar2:
  eyebrow: "Our Lever"
  h2: "Music engineered for your customer and your outcome."
  p1: "We don't just make cool sounds, we design music, tweaking each parameter to move people. Tempo, key, instrumentation, lyricals, and cultural reference set are specified on purpose to fit your customers and a specific desired outcome — Increase dwell time, Larger basket sizes, higher conversion rate, or just reinforcing the value of your brand."
  p2: "With our Core plan, Entuned starts with your customer in mind - the person your store is built for. Then we produce music that speaks to them, and motivates a great shopping experience. It's not picked from a stale catalogue. It's not even a curated a playlist or song library. We engineer it for your store ourcomes and your customer. The songs are original, cleared for commercial-use, and PRO-indemnified the moment they play."

# Pillar 3 — Self-improving
pillar3:
  eyebrow: "It Get's Even Better"
  h2: "Music that performs better the longer it runs."
  p1: "Our Pro tier pulls sales and traffic data from your stores and refines the music, optimizing for your store's outcomes the longer it runs. Depending on your scale this self-improving refinement compounds over a few weeks or months of corelation."
  p2: "The Entuned Free and Core Plans prove the concept. Professional just keeps going to optmize for to lift sales the longer you run it."

