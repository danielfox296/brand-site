p_1: Your music. Entuned builds original retail music for your customer's psychology. In published research, dwell time goes up 15-25% and basket size goes up 8-12%.
p_2: A Spotify license, a Mood Media subscription, a playlist somebody picked three years ago. The team that chose the lighting had a plan. The team that chose the paint had a plan. The music is whatever was on sale when the store opened. And the research is pretty clear about what happens next. In <a href="blog/the-familiarity-trap.html">Yalch and Spangenberg's 1990 study</a>, familiar music cut shopper dwell time by around 8%. The songs your customers already know are working against you.
p_3: Entuned takes a profile of your ideal customer, the things they value, the aesthetic they live inside, the things that move them, and generates original music around it. Original means nothing borrowed. No licensed lyrics that might describe something you'd rather your customers not think about while they're deciding on the $400 candle. The music is yours. It's built for the person you built the store for.
p_4: In-store analytics is a $1.9B industry. It counts footsteps, heat maps, dwell zones, conversion paths. None of it touches a variable you can change while the customer is still in the store. Retail audio is the one lever that responds instantly and costs nothing to adjust. We built the action layer for the measurement everyone already owns.
p_5: Music matched to your customer's psychology slows them down. In the research, dwell time increases in the range of 15 to 25%. Every extra minute is another chance for a customer to touch a product, ask a question, and finish the decision they came in to make.
p_6: Areni and Kim in 1993, then North, Hargreaves, and McKendrick in 1999, found the same thing. When music matches a customer's identity, willingness to pay goes up 8 to 12%. The price on the tag didn't change. The customer's read on the product did.
p_7: Licensed playlists come with someone else's brand attached. Someone else's lyrics, someone else's associations, someone else's fans. Those songs were written for an artist's self-expression. You picked the paint color. You specced the lighting. The music should meet the same standard, because it's doing the same work.
p_8: The founding pilot runs on your stores, your traffic, your measurement stack. You get the data. If the lift shows up, the ROI case writes itself from your own numbers. If it doesn't, you've lost nothing but background music you were going to play anyway. For the full financial framework, read <a href="blog/cfos-case-for-retail-audio.html">the CFO's case for retail audio</a>.
p_9: Mood Media, Soundtrack Your Brand, and the others work off catalogs. Millions of tracks, none of them made for your store. They do brand-fit by searching, which is the best anyone can do when the source material was written for an artist's self-expression.
p_10: Every track in those catalogs carries variables nobody can control. Lyrics that might clash with your positioning. A tempo that rushes customers out. A sonic texture that makes the product on the shelf feel cheaper. The playlist service doesn't know what's in the tracks it's selecting. It can't. The songs were never designed to be measured.
p_11: Entuned generates to spec. Every track is built for your ideal customer, your brand, and the outcomes you're trying to produce. Tempo, mode, energy arc, timbral texture, lyrical content. We set all of it. When the research says a specific parameter matters, we can hit it. When we want to test a hypothesis, we can isolate the variable and run it.
p_12: They're hitting targets they can see.
p_13: We're hitting targets they can't even aim at.
