p_1: Entuned builds original retail music made for the customer your store is built to serve. In published research, dwell time goes up fifteen to twenty-five percent and basket size goes up eight to twelve percent.
p_2: A Spotify license, a Mood Media subscription, a playlist somebody picked three years ago. The team that chose the lighting had a plan. The team that chose the paint had a plan. The music is whatever was on sale when the store opened. And the research is pretty clear about what happens next. In <a href="blog/the-familiarity-trap.html">Yalch and Spangenberg's 1990 study</a>, familiar music cut shopper dwell time by around eight percent. The songs your customers already know are working against you.
p_3: Entuned starts from who your customer actually is, then makes music around that. Original means nothing borrowed. No licensed lyrics that might describe something you would rather your customers not think about while they are deciding on the $400 candle. The music is yours. It is built for the person you built the store for.
p_4: In-store analytics is a 1.9 billion dollar industry. It counts footsteps, heat maps, dwell zones, conversion paths. None of it touches a variable you can change while the customer is still in the store. Retail audio is the one lever that can change on the same day the data flags a problem. We are filling the gap the measurement industry never filled.
p_5: Music that fits your customer slows them down. In the research, dwell time increases in the range of fifteen to twenty-five percent. Every extra minute is another chance for a customer to touch a product, ask a question, and finish the decision they came in to make.
p_6: Areni and Kim in 1993, then North, Hargreaves, and McKendrick in 1999, found the same thing. When music matches a customer's identity, willingness to pay goes up eight to twelve percent. The price on the tag did not change. The customer's read on the product did.
p_7: Licensed playlists come with someone else's brand attached. Someone else's lyrics, someone else's associations, someone else's fans. Those songs were written for an artist's self-expression. You picked the paint color. You specced the lighting. The music should meet the same standard, because it is doing the same work.
p_8: The founding pilot runs on your stores, your traffic, your measurement stack. You get the data. If the lift shows up, the ROI case writes itself from your own numbers. If it does not, you have lost nothing but background music you were going to play anyway. For the full financial picture, read <a href="blog/cfos-case-for-retail-audio.html">the CFO's case for retail audio</a>.
p_9: Mood Media, Soundtrack Your Brand, and the others work off catalogs. Millions of tracks, none of them made for your store. They do brand-fit by searching, which is the best anyone can do when the source material was written for an artist's self-expression.
p_10: Every track in those catalogs carries baggage nobody at the playlist service ever checked. Lyrics that might clash with your positioning. A pace that rushes customers out. A sonic texture that makes the product on the shelf feel cheaper. The playlist service does not know what is in the tracks it is selecting. It cannot. The songs were never designed with your store in mind.
p_11: Entuned makes music for a specific store. Every track is built for the customer you are trying to serve and the brand you are trying to hold together. When the research says something specific matters for your category, we can hit it. When we want to see what moves your numbers, we can isolate it and look.
p_12: They are hitting targets they can see.
p_13: We are hitting targets they cannot even aim at.
