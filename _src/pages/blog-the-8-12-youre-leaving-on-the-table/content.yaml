sections:
  - type: key_takeaways
    items:
      - "Music congruent with customer identity increases willingness to pay by 8-12%, replicated across product categories since 1993"
      - "The effect requires no additional foot traffic, no promotions, and no pricing changes"
      - "Generic playlists from licensing services were not built to deliver this specificity"

  - type: prose
    body: |
      There's a number buried in the retail psychology literature that doesn't get talked about much outside of academic journals. It comes from a study conducted in a wine store in the 1990s, and it's been replicated enough times since that it's probably worth paying attention to.

      When researchers played music that matched the identity and values of the customers shopping in that store, willingness to pay increased by 8 to 12 percent. Same products. Same prices on the tags. Same staff. Different music. The customers just paid more.

  - type: stat_callout
    number: "8-12%"
    label: "Willingness-to-pay increase from music congruent with customer identity"
    source: "Areni & Kim, 1993; replicated by North, Hargreaves & McKendrick, 1999"
    accent: gold

  - type: prose
    body: |
      The mechanism isn't mysterious once you understand it. Music that aligns with a customer's sense of who they are creates what psychologists call congruence. The space feels right. The brand feels like it was built for someone like them. That perception of fit extends to the products on the shelves, to the price points, to the entire transaction. Customers who feel seen by a space trust that space's judgment about value. They buy accordingly.

      The inverse is also documented. Music that mismatches customer identity produces the opposite effect. Customers leave faster. They spend less. They're less likely to return. The mechanism runs the same direction; it just runs the other way.

  - type: subhead
    level: 2
    text: "The Research Lineage"

  - type: prose
    body: |
      Areni and Kim published the foundational work on this in 1993, specifically in [wine retail](../blog/how-specialty-wine-retailers-use-music-to-sell-more-expensive-bottles.html). North, Hargreaves, and McKendrick extended it in 1999, showing that the effect held across product categories and store types. The finding has been replicated broadly enough that "does music affect willingness to pay" is no longer a research question. The research question now is which music, for which customer, and by how much.

  - type: pullquote
    text: "A playlist that could belong to any store belongs to none of them."
    accent: teal

  - type: subhead
    level: 2
    text: "Why Licensing Services Can't Deliver This"

  - type: prose
    body: |
      Most retail operations leaders have never been given a clean answer to that question. The licensing services that supply most in-store music weren't built to answer it. Mood Media and Soundtrack Your Brand are catalog businesses. They organize music into moods and genres and let operators pick. The assumption built into that model is that "upbeat" or "relaxed" or "contemporary" is a meaningful enough description of what a store needs. It isn't.

      Your customer isn't upbeat or relaxed. They're a specific person with a specific set of values, a specific aesthetic, a specific relationship with music that was formed over decades. The music that makes them feel seen is not the same music that makes a different customer in a different store feel seen.

  - type: subhead
    level: 2
    text: "How Does Music Congruence Increase Willingness to Pay?"

  - type: stat_callout
    number: "$326,400"
    label: "Annual revenue lift at 8% on $85 ATV across 4,000 monthly transactions"
    source: "Calculated from Areni & Kim research applied to mid-range specialty retail"
    accent: gold

  - type: prose
    body: |
      Run the math on what 8 to 12 percent means for your operation. Take your average transaction value. Apply 8 percent. Multiply by the number of transactions in a month across your locations. That's the number. It doesn't require more foot traffic. It doesn't require a promotion. It doesn't require a new product line. It requires music that was built for the person already standing in your store.

      The research has been sitting in journals for thirty years. The stores playing generic playlists are giving that number back every day. [Measure what you're currently leaving behind](../blog/measure-roi-retail-music.html).

