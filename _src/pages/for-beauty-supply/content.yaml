# for-beauty-supply — editable text content
# Vertical landing for beauty supply retail (multicultural haircare, professional supply,
# textured-hair specialty, salon-adjacent retail). Distinct from the cosmetics/prestige beauty page.
# Voice: PLG-primary, single-store and small-chain owner-operator.

hero:
  eyebrow: "For beauty supply retail"
  h1: "Music for the customer who knows what she came in for."
  subline: "Beauty supply runs on regulars, missions, and replenishment &mdash; the customer walked in for a specific product and the staff she trusts to talk her through it. Entuned produces original music tuned to your customer and your shelf, not the generic catalogue she hears in every other store. Free, no credit card."

# The gap
gap:
  eyebrow: "The Gap"
  h2: "Your customer knows when the music in your store wasn&rsquo;t picked for her."
  p1: "Beauty supply retail has an operating shape that prestige cosmetics does not. The customer is on a mission. She is a regular. She knows the shelves better than half the new staff. She is buying for a specific texture, a specific routine, a specific outcome &mdash; and she is reading the room for whether this store actually understands her, or whether it is generic supply with the right products on the wrong shelf."
  p2: "The music in most beauty supply stores comes from the same satellite catalogue the toy store down the strip uses. It is not aimed at her. She knows it is not aimed at her. The audio is one of the loudest signals about whether you actually built the store for the customer who is standing in it."

# What changes per tier
tiers:
  eyebrow: "Three places to start"
  h2: "Three places to start, sized to where you are."

  card1_title: "Entuned Free"
  card1_text: "Free, indefinite. Pick Linger from the floor of your store and the catalogue starts streaming through the speakers you already have. Useful as the first look before you decide to specify the audio more deliberately for your customer."

  card2_title: "Core ($99/location/mo)"
  card2_text: "Music tailored to your single Ideal Customer Profile. For most beauty supply retailers, that is the customer your buyer is already merchandising for &mdash; the regular, the texture-specific shopper, the salon professional restocking for clients. About 420 tracks in the first month, refreshed against what holds the floor."

  card3_title: "Professional ($399/location/mo)"
  card3_text: "POS integration. Outcome Scheduling against your traffic profile (Saturday-morning regulars are a different mood than Wednesday-afternoon professional restocking). Multiple ICPs for stores that draw distinct customer types. Self-improving refinement against your basket and dwell data."

  card4_title: "Enterprise"
  card4_text: "Multi-store rollouts where you operate more than a handful of locations. Custom ICP design and brand voice consultation. Performance terms where lift can be cleanly measured against your existing reporting."

# What the research says
research:
  eyebrow: "Forty years of evidence"
  h2: "Forty years of evidence on the audio levers that matter for specialty retail."

  card1_title: "Music customers read as theirs moves willingness to pay."
  card1_text: "Areni and Kim (1993) measured average transaction value rising from $6.93 to $12.31 in a wine cellar when the music matched the customer&rsquo;s frame. North et al. (1999) replicated the effect across categories. The customer&rsquo;s decision between the cheaper and the better product is partly being made by the audio in the room."

  card2_title: "Atmosphere is part of the brand relationship."
  card2_text: "Bitner&rsquo;s 1992 servicescape framework established that the physical environment of a service business is part of what creates the customer&rsquo;s relationship with the brand. The audio is part of the servicescape. For a beauty supply store, it is part of whether the customer treats your store as her store or as a backup when her real one runs out."

  card3_title: "Familiar songs cut perceived dwell."
  card3_text: "Yalch and Spangenberg (2000) found that familiar music made shoppers leave 8% sooner. Original music is unfamiliar by definition &mdash; that is part of why it works. Catalogue vendors play the songs that minimize complaints. That is exactly the wrong objective for a category that monetizes regulars."

  card4_title: "Mismatched music actively reduces basket."
  card4_text: "Andersson et al. (2012) ran 601 real transactions in a Swedish retail chain and found that music that clashes with the store&rsquo;s customer category cuts willingness to pay below the no-music baseline. Neutral is not the default. The audio in your store is doing work whether you chose its effect or not."

# CTA
cta:
  eyebrow: "Get Started"
  h2: "Hear it on your floor."
  subline: "Start free at Entuned Free in your store. Move to Core once you want music tailored to your specific customer."
  cta_primary: "Start Free"

