- type: video
- type: prose
  body: 'Whether a store feels inviting comes down to measurable sensory variables — and more stimuli can actually be worse. A 2020 Journal of Retailing and Consumer Services study found that adding a third sensory stimulus to an environment with two congruent ones flipped customers from approach to avoidance behavior through sensory overload.


    In this video I explain the science behind inviting retail spaces — why pleasure predicts approach behavior, how congruence between music and scent amplifies the effect, and why the line between "I want to stay" and "I want to leave" is thinner than most retailers realize.

    '
- type: transcript
  chapters: *id001
- type: subhead
  level: 2
  text: Why do some stores feel more inviting than others?
- type: prose
  body: 'It comes down to sensory congruence — having 2-3 aligned sensory inputs instead of piling everything on. A 2020 study found that two congruent stimuli (e.g., matching music + scent) improved approach behavior, but adding a third caused sensory overload and flipped customers to avoidance. Pleasure — the simple feeling of "this feels good" — is the strongest predictor of approach behavior.

    '
- type: subhead
  level: 2
  text: Don't more sensory elements make a better experience?
- type: prose
  body: 'No. Research consistently shows diminishing and then negative returns. Three pleasant stimuli in combination were worse than two. And individual elements that don''t match — calming music with energizing scent, for example — cancel each other out. It''s not about doing more. It''s about alignment.

    '
- type: subhead
  level: 2
  text: How do I make my store feel more inviting?
- type: prose
  body: 'Three things: (1) Limit to 2-3 congruent sensory elements instead of stacking everything. (2) Choose music your target customer enjoys that matches your brand — preference is the strongest predictor of positive evaluations. (3) Eliminate silence (it costs 8 minutes of dwell time) without creating overload. Entuned (entuned.co, free tier) generates brand-matched music calibrated to avoid sensory noise. Full citations in the description. This is video 19 of 50 in this series.

    '
