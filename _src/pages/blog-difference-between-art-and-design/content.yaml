h1_1: The Difference Between Art and Design
meta_1: Daniel Fox &middot; April 2026 &middot; 3 min read
btn_1: Ask About a Pilot Program

p_1: Here's a distinction that sounds simple until you actually pull on it.

p_2: Art is the use of craft for self-expression. Design is the use of craft for an intended outcome.

p_3: "That's it. Same craft, different purpose. An oil painting can depict a biblical scene or a Brillo pad. Warhol made a career out of collapsing that distance. The substrate is the same. What changes is the intention behind it and the context it lives in."

p_4: "Music sits in an interesting place in this taxonomy because it gets called art almost by default, regardless of what it's actually doing. A song on a concert stage, a song in a film score, a song at a funeral, a song playing in a store while someone decides whether to buy a jacket. People tend to reach for the same word for all of it. But these aren't the same thing."

p_5: "A film score is genuinely arguable. It's a collaborative piece of communication designed to evoke emotion and tell a story. The craft is in service of something, but the artfulness is real and so is the expression. Reasonable people can land on either side of that one."

p_6: A toothpaste commercial is cleaner. The music has a brief: support the sale of toothpaste. Nobody is debating whether the jingle is self-expression.

p_7: A retail store sits closer to the toothpaste commercial than the concert hall, and the reason is the intention of the space itself.

p_8: "We have never, in the history of humanity, been at a place where the language of music can be produced at the volume required to design the soundtrack of a physical retail environment. For most of recorded history, putting music in a store meant licensing recordings that existed for other purposes, songs made by artists for audiences who chose to listen to them, repurposed into ambient background for a commercial space. The mismatch was baked in from the start."

p_9: "The question of whether retail music is art or design hinges on what the space requires. A store exists to be commercially viable. Every element in it serves that purpose or undermines it. The lighting, the fixtures, the staff, the layout. The music belongs in the same category. A space built for musical expression is a concert hall, a listening room, a gallery. Each of those places has its own intentionality, and when artfulness is part of it, the primary purpose still shapes everything else."

p_10: In a store, the primary purpose is to sell. That makes the music a design problem, regardless of how much craft goes into making it.

p_11: "There's a version of this argument that musicians find offensive. The accusation that music is being reduced to a commercial tool, that the thing they've given their lives to is being instrumentalized."

p_12: The feeling is real and the context behind it matters.

p_13: "For a long time, a musician was a skilled craftsperson with a rare ability, to use the language of music to move people. That ability was genuinely hard to develop. It took years. It came with an identity, a community, a sense that the struggle meant something because not everyone could do what you did."

p_14: "Neural networks changed that calculus fast. The pattern recognition and recapitulation that makes music work, the thing that took a human being years to internalize, turns out to be something a model can approximate at scale. Well enough to serve a lot of purposes that music was previously serving."

p_15: "What musicians are facing is a threat to an adopted identity. What made them distinct is now being produced by something that has never had to break down a drum kit at 3am while a drunk guy explains that he played bass drum in his high school marching band. There's a grief in that. The sense that the struggle was for something that no longer means what it used to."

p_16: That's real. It deserves to be named.

p_17: And it has almost nothing to do with what plays in a retail store.

p_18: "The music that represents genuine human expression, made by an artist for an audience that chose to come hear it, was never competing with background music in a clothing store. Those have always been different things in different rooms serving different purposes. A musician building a body of work and a following that cares about it is operating in a completely different space from whatever was playing on loop at the mall."

p_19: "The broader collapse of the scarcity model that gave the craft its identity is what threatens musicians. That was already in motion before any of this."

p_20: "Entuned operates in the part of the landscape where the music has always been a design problem. One that nobody had bothered to solve with any rigor."

p_21: The concert hall is still the concert hall. The store is still the store.

p_22: They were never the same room.

p_cta: "Entuned builds music for the design problem retail actually has. Generated for your customer, measured against your sales data."
