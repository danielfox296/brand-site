sections:
  - type: key_takeaways
    items:
      - "Most multi-location retailers are paying for music that was not chosen with their customer in mind."
      - "The cost shows up in shorter visits, smaller baskets, and staff who quietly turn the speakers down."
      - "Your current vendor probably cannot tell you what their music is doing to your store numbers."
