  - type: prose
    body: |
      Dwell time is one of the most closely watched metrics in retail operations. Store managers track it. Regional VPs ask about it. When it drops, the conversation usually turns to layout, traffic patterns, staffing ratios, or merchandising. Those are reasonable places to look.

      The variable almost nobody considers is the [tempo of the music](../blog/science-of-tempo-retail.html) playing in the background.

  - type: subhead
    level: 2
    text: "The research goes back further than most people realize"

  - type: prose
    body: |
      Smith and Curnow published a study in 1966 in the Journal of Applied Psychology showing that the tempo of background music had a direct and measurable effect on how long customers spent in a store and how much they spent while they were there. Slower tempos correlated with longer visits. Faster tempos correlated with shorter ones. The customers weren't conscious of the effect. They just moved differently depending on what was playing.

  - type: stat_callout
    number: "1966"
    label: "Year Smith and Curnow first demonstrated the direct link between music tempo and retail dwell time"
    source: "Smith and Curnow, Journal of Applied Psychology, 1966"
    accent: teal

  - type: subhead
    level: 2
    text: "The mechanism is physiological"

  - type: prose
    body: |
      Tempo entrains the body. People unconsciously synchronize their movement pace to the rhythmic patterns they're hearing. A 120 BPM track doesn't make customers think "I should hurry up." It makes their body move at a pace that matches that energy. They browse faster. They make decisions faster. They leave faster.

      In a high-turnover environment — a coffee shop, a fast-casual restaurant — that's exactly what you want. Faster throughput is the business model. The music is doing useful work.

      In a boutique fashion store, a specialty wine shop, a home furnishings showroom, or a jewelry retailer, faster throughput is not the business model. The business model depends on customers who linger, who consider, who pick things up and put them down and pick them up again. A customer who spends twelve minutes in a luxury boutique is more likely to buy than one who spends four.

  - type: stat_callout
    number: "100-130 BPM"
    label: "Typical tempo range of contemporary pop tracks — far above optimal for premium retail dwell behavior"
    source: "Music production standards"
    accent: gold

  - type: prose
    body: |
      Caldwell and Hibbert's 2002 study in Psychology and Marketing confirmed the tempo-dwell relationship specifically in retail and restaurant environments. Slower tempos produced longer stays and higher per-visit spending. The effect size was significant enough to be operationally meaningful, not just statistically interesting.

  - type: subhead
    level: 2
    text: "Genre and tempo are not the same thing"

  - type: prose
    body: |
      What most stores are doing right now is pulling from playlists that were assembled with no reference to BPM targets and no understanding of what tempo profile serves the purchase psychology of that store's customer. The streaming services that supply most retail environments don't ask what [dwell time targets](../blog/retail-dwell-time.html) you're trying to hit. They ask what genre you want.

      Genre and tempo are not the same thing. A jazz track can run at 80 BPM or 220 BPM. A classical piece can be meditative or frantic. Genre is a descriptor of style and cultural identity. Tempo is a physiological lever. They require separate consideration, and most retail audio environments conflate them.

  - type: pullquote
    text: "The customers who are leaving your store faster than they should aren't in a rush. The music is rushing them."
    accent: teal

