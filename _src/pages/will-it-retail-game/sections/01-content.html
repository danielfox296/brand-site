<div id="viewport">
  <div id="progress-bar"><div id="progress-fill"></div></div>

  <!-- INTRO -->
  <div id="intro">
    <div id="intro-bg"></div>
    <div id="intro-vignette"></div>
    <div id="intro-content">
      <div id="intro-words"></div>
    </div>
    <button id="play-btn" onclick="startGame()">PLAY</button>
  </div>

  <!-- GAME -->
  <div id="game">
    <!-- Title bar: full-width band under progress bar -->
    <div id="title-bar">
      <div id="game-title">WILL IT RETAIL?</div>
      <div id="ep-info">EP 1 — DWELL TIME</div>
    </div>
    <!-- PIP: front-facing camera placeholder, top-left -->
    <div id="pip-zone"><span id="pip-label">CAM</span></div>
    <!-- Queue carousel: 5 pixelated boxes, top-right. Active box ejects
         leftward toward center on drop. -->
    <div id="queue-carousel"></div>
    <div id="tiers"></div>
    <!-- Drop stage holds the currently falling/held album -->
    <div id="drop-stage"></div>
    <!-- Legacy timer-wrap kept hidden for old-handler references -->
    <div id="timer-wrap" style="display:none"><div id="song-counter">0/5</div></div>
  </div>

  <div id="flash-overlay"></div>
  <div id="combo-text"></div>

  <!-- SAFE-ZONE DEBUG OVERLAY — toggled by ?safezone=1 -->
  <div class="safezone-overlay" aria-hidden="true">
    <div class="safezone-zone top">unsafe — top (status / account)</div>
    <div class="safezone-zone bottom">unsafe — bottom (captions / engagement bar)</div>
    <div class="safezone-zone right">unsafe — right (like / comment / share)</div>
    <div class="safezone-frame"></div>
  </div>

  <div id="end-screen">
    <h2 id="end-title"></h2>
    <p id="end-sub"></p>
    <button id="replay-btn" onclick="location.reload()">PLAY AGAIN</button>
  </div>
</div>


<script>
// SONGS is loaded from /data/wir/episodes.json based on the ?ep= URL param.
// See will-it-retail/build-episodes.py for the data pipeline. The game UI
// must not assume any particular episode — only the data shape:
//   { episodes: [{ id, number, title, format, songs: [{title,artist,art,preview}] }] }
let SONGS = [];
let CURRENT_EP = null;

const TIERS = [
  {id:'S',label:'S',sub:'OPTIMAL',color:'#FF2D55'},
  {id:'A',label:'A',sub:'STRONG',color:'#FF9500'},
  {id:'B',label:'B',sub:'ADEQUATE',color:'#8B7500'},
  {id:'C',label:'C',sub:'RISKY',color:'#30B0C7'},
  {id:'D',label:'D',sub:'HARMFUL',color:'#9B956B'},
];

const EMOJIS={
  S:['🎉','✨','🌟','⭐','🎊','💎','🔥'],
  A:['😊','😄','🙂','😁','🤩'],
  B:['👍','💪','✅','👌'],
  C:['😐','😑','🫤','😶','😒'],
  D:['💀','👎','😬','🚫','💩','☠️'],
};

// ========== STATE ==========
// New mechanic: songs DROP one at a time with physics. Preview audio plays
// for the full clip duration; missing the clip = buzzer + skip. Pick up by
// clicking the settled album (3x scale + glow), drag to a tier to place.
let audioCtx;
let gameStarted=false;
let queueIndex=0;
const placements=[]; // {song, tier} per song (tier=null = skipped on timeout)
let currentAudio=null;     // <Audio> playing the current drop
let timeoutTimer=null;     // fallback for songs without preview URL
let DROP=null;             // current drop: {song, el, x, y, vx, vy, settled, picked, placed}
let physicsInterval=null;  // setInterval id (not rAF — survives tab-hidden / iframe)
let lastPlaceTime=0,comboCount=0;
const GRAVITY=0.55;        // px per frame squared (scaled by vh below)
const BOUNCE=0.20;         // energy retained per bounce — aggressive damping for ~2 bounces max
const SETTLE_THRESHOLD=1.5;
const ALBUM_VH=12;         // falling album size, vh
const PICKED_SCALE=2.4;    // picked-up size relative to base (80% of the original 3x design)
// Floor moved 1 album size below the canonical safe-bottom (82.29% + 12vh).
// Lives in the unsafe bottom zone — Daniel handles that in the recording crop.
const FLOOR_VH_FROM_TOP=94.29;
let tickInterval=null;     // setTimeout id for the ticking clock

// ========== AUDIO ==========
function getAudioCtx(){
  if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended')audioCtx.resume();
  return audioCtx;
}

function playThump(){
  const ctx=getAudioCtx();
  const osc=ctx.createOscillator();
  const gain=ctx.createGain();
  osc.type='sine';
  osc.frequency.setValueAtTime(55,ctx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(28,ctx.currentTime+0.15);
  gain.gain.setValueAtTime(0.5,ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.2);
  osc.connect(gain);gain.connect(ctx.destination);
  osc.start();osc.stop(ctx.currentTime+0.25);
  const bufSize=Math.floor(ctx.sampleRate*0.025);
  const buf=ctx.createBuffer(1,bufSize,ctx.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<bufSize;i++)d[i]=(Math.random()*2-1)*(1-i/bufSize)*0.35;
  const ns=ctx.createBufferSource();ns.buffer=buf;
  const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=180;
  ns.connect(lp);lp.connect(ctx.destination);ns.start();
}

function playTick(){
  const ctx=getAudioCtx();
  const bufSize=Math.floor(ctx.sampleRate*0.006);
  const buf=ctx.createBuffer(1,bufSize,ctx.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<bufSize;i++){d[i]=(Math.random()*2-1)*Math.pow(1-i/bufSize,4)*0.1;}
  const ns=ctx.createBufferSource();ns.buffer=buf;
  const bp=ctx.createBiquadFilter();bp.type='bandpass';bp.frequency.value=4500;bp.Q.value=6;
  const g=ctx.createGain();g.gain.value=0.5;
  ns.connect(bp);bp.connect(g);g.connect(ctx.destination);ns.start();
  const osc=ctx.createOscillator();const g2=ctx.createGain();
  osc.type='sine';osc.frequency.value=2800;
  g2.gain.setValueAtTime(0.05,ctx.currentTime);
  g2.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.015);
  osc.connect(g2);g2.connect(ctx.destination);
  osc.start();osc.stop(ctx.currentTime+0.02);
}

function playDrop(tier){
  const ctx=getAudioCtx();const osc=ctx.createOscillator();const gain=ctx.createGain();
  const freqs={S:880,A:660,B:440,C:330,D:220};
  osc.type='sine';osc.frequency.setValueAtTime(freqs[tier]||440,ctx.currentTime);
  osc.frequency.exponentialRampToValueAtTime((freqs[tier]||440)*1.5,ctx.currentTime+0.08);
  gain.gain.setValueAtTime(0.2,ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.25);
  osc.connect(gain);gain.connect(ctx.destination);osc.start();osc.stop(ctx.currentTime+0.3);
}

function playGrab(){
  const ctx=getAudioCtx();const osc=ctx.createOscillator();const gain=ctx.createGain();
  osc.type='sine';osc.frequency.value=600;
  gain.gain.setValueAtTime(0.05,ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.07);
  osc.connect(gain);gain.connect(ctx.destination);osc.start();osc.stop(ctx.currentTime+0.08);
}

function playCombo(){
  const ctx=getAudioCtx();
  [0,0.08,0.16].forEach((t,i)=>{
    const osc=ctx.createOscillator();const gain=ctx.createGain();
    osc.type='triangle';osc.frequency.value=880*(i+1)/2;
    gain.gain.setValueAtTime(0.1,ctx.currentTime+t);
    gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+t+0.15);
    osc.connect(gain);gain.connect(ctx.destination);
    osc.start(ctx.currentTime+t);osc.stop(ctx.currentTime+t+0.2);
  });
}

function playClear(){
  const ctx=getAudioCtx();
  [0,0.1,0.2,0.3,0.4].forEach((t,i)=>{
    const osc=ctx.createOscillator();const gain=ctx.createGain();
    osc.type='sine';osc.frequency.value=440*Math.pow(2,i/3);
    gain.gain.setValueAtTime(0.12,ctx.currentTime+t);
    gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+t+0.3);
    osc.connect(gain);gain.connect(ctx.destination);
    osc.start(ctx.currentTime+t);osc.stop(ctx.currentTime+t+0.35);
  });
}

function playBuzzer(){
  const ctx=getAudioCtx();const osc=ctx.createOscillator();const gain=ctx.createGain();
  osc.type='sawtooth';osc.frequency.value=110;
  // Halved from 0.4 -> 0.2 per Daniel's request
  gain.gain.setValueAtTime(0.2,ctx.currentTime);
  gain.gain.setValueAtTime(0.2,ctx.currentTime+0.6);
  gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.9);
  osc.connect(gain);gain.connect(ctx.destination);osc.start();osc.stop(ctx.currentTime+1);
}

// Loud explosion-style sound for each intro word reveal (replaces playThump
// in runIntro). More dramatic + more "boom" character.
function playIntroExplosion(){
  const ctx=getAudioCtx();
  // Deep sub thud
  const sub=ctx.createOscillator(); const sg=ctx.createGain();
  sub.type='sine'; sub.frequency.setValueAtTime(110,ctx.currentTime);
  sub.frequency.exponentialRampToValueAtTime(40,ctx.currentTime+0.18);
  sg.gain.setValueAtTime(0.55,ctx.currentTime);
  sg.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.32);
  sub.connect(sg); sg.connect(ctx.destination);
  sub.start(); sub.stop(ctx.currentTime+0.36);
  // Crack transient (filtered noise)
  const buf=ctx.createBuffer(1,Math.floor(ctx.sampleRate*0.18),ctx.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<buf.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/buf.length,1.4)*0.5;
  const ns=ctx.createBufferSource(); ns.buffer=buf;
  const bp=ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=1500; bp.Q.value=1.5;
  ns.connect(bp); bp.connect(ctx.destination); ns.start();
}

// Musical chord tied to tier emotion — stacked on top of playDrop bleep and
// playExplosionSound on placement.
function playTierChord(tier){
  const ctx=getAudioCtx();
  // Major7 / minor / dissonant cluster depending on tier feel
  const recipes={
    S:{type:'sine',     notes:[523.25, 659.25, 783.99, 987.77], gain:0.16, dur:0.85}, // C major 7
    A:{type:'sine',     notes:[440.00, 554.37, 659.25],         gain:0.15, dur:0.70}, // A major
    B:{type:'triangle', notes:[392.00, 493.88, 587.33],         gain:0.13, dur:0.55}, // G major
    C:{type:'triangle', notes:[349.23, 415.30, 493.88],         gain:0.13, dur:0.70}, // F minor-ish
    D:{type:'sawtooth', notes:[207.65, 220.00, 233.08],         gain:0.10, dur:1.10}, // G#/A/A# dissonant cluster
  };
  const r=recipes[tier]||recipes.B;
  r.notes.forEach((freq, i)=>{
    const osc=ctx.createOscillator(); const g=ctx.createGain();
    osc.type=r.type; osc.frequency.value=freq;
    const start=ctx.currentTime + i*0.03; // tiny stagger -> arpeggio shimmer
    g.gain.setValueAtTime(0, start);
    g.gain.linearRampToValueAtTime(r.gain, start+0.02);
    g.gain.exponentialRampToValueAtTime(0.001, start+r.dur);
    osc.connect(g); g.connect(ctx.destination);
    osc.start(start); osc.stop(start+r.dur+0.1);
  });
}

// Per-clip ticking clock. Starts 700ms baseline, speeds to 350ms when ≤10s
// of clip remain, 175ms when ≤5s remain. Driven off currentAudio.currentTime.
function startTicking(){
  stopTicking();
  const fire=()=>{
    if(!gameStarted) return;
    playTick();
    let remain;
    if(currentAudio && currentAudio.duration){
      remain = currentAudio.duration - currentAudio.currentTime;
    } else {
      remain = 15;
    }
    let interval = 700;
    if(remain <= 5) interval = 175;
    else if(remain <= 10) interval = 350;
    tickInterval = setTimeout(fire, interval);
  };
  tickInterval = setTimeout(fire, 700);
}
function stopTicking(){
  if(tickInterval){clearTimeout(tickInterval); tickInterval=null;}
}

// (previewSong removed — audio is now lifecycle-managed by the drop sequence)

// ========== INTRO ==========
// Sped up 3x: word interval 750ms -> 250ms, fade 0.2s -> 0.07s, pop 0.3s -> 0.1s,
// fadeIn 0.6s -> 0.2s, initial delay 400ms -> 133ms. Whole intro now ~1.4s.
function runIntro(){
  const words=['WILL','IT','RETAIL?'];
  const container=document.getElementById('intro-words');
  let delay=133;
  words.forEach((w,i)=>{
    setTimeout(()=>{
      const prev=container.querySelector('.intro-word');
      if(prev)prev.style.animation='wordFade 0.07s ease-in forwards';
      setTimeout(()=>{
        container.innerHTML='';
        const el=document.createElement('div');
        el.className='intro-word';
        el.textContent=w;
        el.style.animation='wordPop 0.1s cubic-bezier(0.34,1.56,0.64,1) forwards';
        container.appendChild(el);
        playIntroExplosion();  // bigger boom than playThump
      },i===0?0:83);
    },delay+i*250);
  });
  setTimeout(()=>{
    document.getElementById('play-btn').style.animation='fadeIn 0.2s ease-out forwards';
  },delay+words.length*250+167);
}

function startGame(){
  getAudioCtx();
  document.getElementById('intro').style.display='none';
  document.getElementById('game').style.display='block';
  gameStarted=true;
  queueIndex=0;
  placements.length=0;
  buildTiers();
  buildQueue();
  updateCounter();
  // Brief beat for queue to slide in, then first drop
  setTimeout(dropNext, 5 * 120 + 500);
}

// ========== QUEUE CAROUSEL ==========
// 5 pixelated boxes representing the upcoming songs. Slides in left-to-right
// from offscreen-right on game start (staggered fade + slide for anticipation).
// Each box is "consumed" when its song begins to drop.
//
// Pixelation is done via a canvas: load the full-res album art, draw it onto
// a 14x14 canvas with imageSmoothingEnabled=false (= nearest-neighbor
// downsample), then display the canvas data URL at 100% of the box with
// image-rendering:pixelated (= nearest-neighbor upsample by the browser).
// CSS transform-scale + image-rendering does NOT pixelate — the browser
// smooth-downsamples first, then smooth-upscales. Canvas is the only reliable
// path for true pixelation of arbitrary album art.
function pixelateImage(src, sourceSize){
  return new Promise((resolve)=>{
    const img=new Image();
    img.onload=()=>{
      const c=document.createElement('canvas');
      c.width=sourceSize;c.height=sourceSize;
      const ctx=c.getContext('2d');
      ctx.imageSmoothingEnabled=false;
      ctx.drawImage(img,0,0,sourceSize,sourceSize);
      resolve(c.toDataURL('image/png'));
    };
    img.onerror=()=>resolve(src); // fallback to original on any error
    img.src=src;
  });
}

async function buildQueue(){
  const car=document.getElementById('queue-carousel');
  car.innerHTML='';
  // Pre-create boxes immediately so the slide-in stagger looks crisp even
  // before pixelation completes — img source swaps in when ready.
  const elements=SONGS.map((s,i)=>{
    const box=document.createElement('div');
    box.className='queue-box';
    box.dataset.idx=i;
    box.innerHTML='<img alt="" class="pixelated-art">';
    car.appendChild(box);
    setTimeout(()=>box.classList.add('loaded'), 250 + i*120);
    return box;
  });
  // Pixelate in parallel — 8x8 source = coarse blocky pixels per Daniel's spec
  await Promise.all(SONGS.map(async (s,i)=>{
    const dataUrl=await pixelateImage(s.art, 8);
    const img=elements[i].querySelector('img');
    if(img) img.src=dataUrl;
  }));
}

function consumeQueueBox(idx){
  const box=document.querySelector('.queue-box[data-idx="'+idx+'"]');
  if(box) box.classList.add('consumed');
}

// ========== BUILD ==========
function buildTiers(){
  const container=document.getElementById('tiers');
  container.innerHTML='';
  TIERS.forEach(t=>{
    const row=document.createElement('div');row.className='tier-row';
    const label=document.createElement('div');label.className='tier-label';
    label.style.background=t.color;
    label.innerHTML=t.label+'<span class="tier-sublabel">'+t.sub+'</span>';
    const drop=document.createElement('div');drop.className='tier-drop';drop.dataset.tier=t.id;
    row.appendChild(label);row.appendChild(drop);container.appendChild(row);
  });
}

function updateCounter(){
  document.getElementById('song-counter').textContent=
    Math.min(queueIndex+1,SONGS.length)+'/'+SONGS.length;
}

// ========== DROP SEQUENCE ==========
// One song at a time: spawn album above viewport, gravity + bounce, settle.
// Audio starts at spawn; if it ends before you place it -> buzzer + skip.
function dropNext(){
  if(queueIndex>=SONGS.length){endGame();return;}
  const song=SONGS[queueIndex];
  updateCounter();
  // Find the active queue box BEFORE consuming it, so we can use its
  // screen position as the album spawn point. Album "protrudes from the
  // right" by spawning at the box position, then animates to center-top
  // before gravity activates.
  const box=document.querySelector('.queue-box[data-idx="'+queueIndex+'"]');
  const boxRect=box?box.getBoundingClientRect():null;
  consumeQueueBox(queueIndex);
  spawnDrop(song, boxRect);
  // Audio starts slightly delayed so it kicks in as the album begins to fall
  setTimeout(()=>startCurrentAudio(song), 320);
}

function spawnDrop(song, fromRect){
  // Clear any leftover element
  const stage=document.getElementById('drop-stage');
  stage.innerHTML='';
  const vp=document.getElementById('viewport').getBoundingClientRect();
  const albumPx=vp.height*ALBUM_VH/100;

  // Spawn position:
  //   if a queue box rect was provided → spawn AT the box (so the album
  //     visually emerges from the same pixelated box that's being consumed)
  //   else → fall back to spawning at center above the viewport
  let startX, startY, startSize;
  if(fromRect){
    startX=fromRect.left - vp.left;
    startY=fromRect.top - vp.top;
    startSize=fromRect.width;
  } else {
    startX=(vp.width - albumPx) / 2;
    startY=-albumPx*1.2;
    startSize=albumPx;
  }

  const el=document.createElement('div');
  el.className='drop-album';
  el.innerHTML='<img src="'+song.art+'" alt="'+song.title+' by '+song.artist+'"><div class="drop-label"><span class="dl-title">'+song.title+'</span><span class="dl-artist">'+song.artist+'</span></div>';
  el.style.width=startSize+'px';
  el.style.height=startSize+'px';
  el.style.left=startX+'px';
  el.style.top=startY+'px';
  // Animate the "protrude" → grows to album size + moves to center-top
  el.style.transition='width 0.30s cubic-bezier(0.34, 1.56, 0.64, 1), '
                      +'height 0.30s cubic-bezier(0.34, 1.56, 0.64, 1), '
                      +'left 0.30s cubic-bezier(0.22, 1, 0.36, 1), '
                      +'top 0.30s cubic-bezier(0.22, 1, 0.36, 1)';
  stage.appendChild(el);

  // Target: center horizontally, just below the carousel (y=29%) — above
  // the tier list (33%) and well clear of the title/PIP rows above.
  const targetX=(vp.width - albumPx) / 2;
  const targetY=vp.height * 0.29;

  // Force layout then trigger transition. Use setTimeout (not rAF) — rAF
  // stalls in hidden iframes / backgrounded tabs and the size never updates.
  setTimeout(()=>{
    el.style.left=targetX+'px';
    el.style.top=targetY+'px';
    el.style.width=albumPx+'px';
    el.style.height=albumPx+'px';
  }, 20);

  // After the protrude finishes, init physics from current visual position
  setTimeout(()=>{
    el.style.transition='';
    DROP={song,el,
      x:targetX,
      y:targetY,
      vx:(Math.random()*2-1)*1.5,
      vy:0,
      w:albumPx, h:albumPx,
      settled:false, picked:false, placed:false,
      vpW:vp.width, vpH:vp.height,
    };
    el.addEventListener('pointerdown',onAlbumPointerDown);
    startPhysics();
  }, 320);
}

function startPhysics(){
  stopPhysics();
  // ~60fps via setInterval (rAF stalls when iframe/tab is hidden, which we
  // observed in preview and which would also bite a backgrounded recording).
  physicsInterval = setInterval(physicsStep, 16);
}
function stopPhysics(){
  if(physicsInterval){clearInterval(physicsInterval);physicsInterval=null;}
}

function physicsStep(){
  if(!DROP||DROP.placed){stopPhysics();return;}
  if(DROP.picked){return;}  // no physics while held — pointermove moves it
  // Apply gravity
  DROP.vy += GRAVITY * (DROP.vpH/800); // scale by viewport so motion is uniform
  DROP.x += DROP.vx;
  DROP.y += DROP.vy;
  // Floor (catch zone top = bottom of safe area)
  const floorY = DROP.vpH * (FLOOR_VH_FROM_TOP/100) - DROP.h;
  if(DROP.y >= floorY){
    DROP.y = floorY;
    if(Math.abs(DROP.vy) < SETTLE_THRESHOLD){
      DROP.vy = 0;
      if(Math.abs(DROP.vx) < SETTLE_THRESHOLD){
        DROP.vx = 0;
        if(!DROP.settled){
          DROP.settled = true;
          DROP.el.classList.add('settled');
        }
        stopPhysics();
      }
    } else {
      DROP.vy *= -BOUNCE;
      DROP.vx *= 0.85;
      playThud();
    }
  }
  // Side walls = canonical safe-x bounds
  const leftWall = DROP.vpW * 0.0556;
  const rightWall = DROP.vpW * 0.8333 - DROP.w;
  if(DROP.x < leftWall){DROP.x = leftWall; DROP.vx *= -BOUNCE;}
  if(DROP.x > rightWall){DROP.x = rightWall; DROP.vx *= -BOUNCE;}
  DROP.el.style.left = DROP.x + 'px';
  DROP.el.style.top = DROP.y + 'px';
}

function playThud(){
  const ctx=getAudioCtx();
  const osc=ctx.createOscillator();const gain=ctx.createGain();
  osc.type='sine';osc.frequency.setValueAtTime(120,ctx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(50,ctx.currentTime+0.1);
  gain.gain.setValueAtTime(0.18,ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.18);
  osc.connect(gain);gain.connect(ctx.destination);
  osc.start();osc.stop(ctx.currentTime+0.2);
}

// ========== AUDIO LIFECYCLE (per drop) ==========
function startCurrentAudio(song){
  stopCurrentAudio();
  const fill=document.getElementById('progress-fill');
  fill.style.transition='width 0.1s linear, background-color 0.6s';
  fill.style.width='100%';
  fill.style.background='#22c55e';
  if(!song.preview){
    // No preview available — give the player 15s default
    timeoutTimer=setTimeout(onClipEnded, 15000);
    // Drain the bar over 15s for visual urgency
    requestAnimationFrame(()=>{fill.style.transition='width 15s linear, background-color 0.6s';fill.style.width='0%';});
    return;
  }
  const a=new Audio(song.preview);
  a.volume=0.22;  // Halved per Daniel's request — was 0.45
  a.preload='auto';
  currentAudio=a;
  a.addEventListener('ended', onClipEnded);
  a.addEventListener('timeupdate', updateClipProgress);
  a.play().catch(()=>{});
  startTicking();  // clock ticks once audio kicks off
}

function stopCurrentAudio(){
  if(currentAudio){
    try{currentAudio.pause();}catch(e){}
    currentAudio.removeEventListener('ended', onClipEnded);
    currentAudio.removeEventListener('timeupdate', updateClipProgress);
    currentAudio=null;
  }
  if(timeoutTimer){clearTimeout(timeoutTimer);timeoutTimer=null;}
  stopTicking();
}

function updateClipProgress(){
  if(!currentAudio||!currentAudio.duration)return;
  const pct=1 - (currentAudio.currentTime/currentAudio.duration);
  const fill=document.getElementById('progress-fill');
  fill.style.width = (pct*100) + '%';
  if(pct<=0.22)fill.style.background='#ef4444';
  else if(pct<=0.44)fill.style.background='#FF9500';
  else if(pct<=0.67)fill.style.background='#eab308';
  else fill.style.background='#22c55e';
}

function onClipEnded(){
  // Clip ran out before placement -> buzzer + skip
  if(!DROP||DROP.placed)return;
  playBuzzer();
  document.getElementById('game').style.animation='shake 0.4s ease-in-out';
  setTimeout(()=>document.getElementById('game').style.animation='',450);
  // Fade out the album visually then remove
  DROP.placed=true; // prevent re-place
  DROP.el.classList.add('skipped');
  placements.push({song:DROP.song,tier:null});
  stopCurrentAudio();
  setTimeout(()=>{
    if(DROP&&DROP.el)DROP.el.remove();
    DROP=null;
    queueIndex++;
    dropNext();
  }, 700);
}

// ========== PICKUP / DRAG / PLACE ==========
function onAlbumPointerDown(e){
  if(!DROP||DROP.placed)return;
  // Allow pickup even mid-fall (you can grab it before it lands)
  e.preventDefault();
  DROP.picked=true;
  DROP.vx=0;DROP.vy=0;
  DROP.el.classList.add('picked-up');
  document.querySelectorAll('.tier-drop').forEach(d=>d.classList.add('active-target'));
  playGrab();
  // Position so cursor is centered on the (now 3x) album
  movePickedToPointer(e.clientX, e.clientY);
}

function movePickedToPointer(x,y){
  if(!DROP||!DROP.picked)return;
  // Pointer coords are window-relative but the album's left/top is relative
  // to #viewport (the centered 9:16 container). Convert to local space.
  const vp = document.getElementById('viewport').getBoundingClientRect();
  const localX = x - vp.left;
  const localY = y - vp.top;
  // transform-origin is center center, so the visual center stays at
  // (left + w/2, top + h/2) regardless of scale. Subtract base half-size.
  DROP.x = localX - DROP.w/2;
  DROP.y = localY - DROP.h/2;
  DROP.el.style.left = DROP.x + 'px';
  DROP.el.style.top  = DROP.y + 'px';
  // Update target tier highlight (tier rects are window-coord, pointer is too)
  const hover = getTierUnderPoint(x, y);
  document.querySelectorAll('.tier-drop').forEach(d=>{
    d.classList.toggle('hover-target', d===hover);
  });
}

document.addEventListener('pointermove', (e)=>{
  if(!DROP||!DROP.picked)return;
  e.preventDefault();
  movePickedToPointer(e.clientX, e.clientY);
});

document.addEventListener('pointerup', (e)=>{
  if(!DROP||!DROP.picked)return;
  const tierDrop = getTierUnderPoint(e.clientX, e.clientY);
  if(tierDrop){
    placeInTier(tierDrop, e.clientX, e.clientY);
  } else {
    // Released over no tier -> let it fall again
    DROP.picked=false;
    DROP.el.classList.remove('picked-up');
    document.querySelectorAll('.tier-drop').forEach(d=>d.classList.remove('active-target','hover-target'));
    DROP.settled=false;
    DROP.el.classList.remove('settled');
    DROP.vy = 0;
    startPhysics();
  }
});

function placeInTier(tierDrop, x, y){
  if(!DROP||DROP.placed)return;
  DROP.placed = true;
  stopCurrentAudio();
  document.querySelectorAll('.tier-drop').forEach(d=>d.classList.remove('active-target','hover-target'));
  const tier = tierDrop.dataset.tier;
  // Create permanent placed card
  const card = document.createElement('div');
  card.className = 'song-card placed';
  card.innerHTML = '<img src="'+DROP.song.art+'" alt="'+DROP.song.title+'">';
  tierDrop.appendChild(card);
  // Remove the falling album element
  DROP.el.remove();
  placements.push({song: DROP.song, tier});
  // FX: bleep + musical chord (tier-emotion) + screen flash + dramatic explosion
  playDrop(tier);
  playTierChord(tier);
  flashScreen();
  spawnEmojis(x, y, tier);
  if(tier==='D'){
    document.getElementById('game').style.animation='shake 0.3s ease-in-out';
    setTimeout(()=>document.getElementById('game').style.animation='',350);
  }
  const now=Date.now();
  if(now-lastPlaceTime<2500){comboCount++;if(comboCount>=2)showCombo(comboCount);}
  else{comboCount=1;}
  lastPlaceTime=now;
  DROP=null;
  queueIndex++;
  // Beat then next drop
  setTimeout(dropNext, 700);
}

function getTierUnderPoint(x,y){
  const drops=document.querySelectorAll('.tier-drop');
  for(const d of drops){
    const r=d.getBoundingClientRect();
    if(x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom)return d;
  }return null;
}

// (Old DRAG / staging-tap listeners removed — pickup is now album-element-scoped)

// ========== EFFECTS ==========
function flashScreen(){
  const el=document.getElementById('flash-overlay');
  el.style.opacity='0.3';el.style.animation='flash 0.2s ease-out forwards';
  setTimeout(()=>{el.style.animation='';el.style.opacity='0';},250);
}

function spawnEmojis(x,y,tier){
  // Dramatic explosion — ~5x the particle count of the original, varied
  // sizes (0.5x–4x), full 360° trajectories with random distance + rotation,
  // and a synthesized boom + sparkle layered audio.
  const set=EMOJIS[tier]||EMOJIS.B;
  const counts={S:45,A:28,B:28,C:28,D:32};
  const count=counts[tier]||25;
  playExplosionSound(tier);
  for(let i=0;i<count;i++){
    const el=document.createElement('div');
    el.className='explosion-particle';
    el.textContent=set[Math.floor(Math.random()*set.length)];
    // Trajectory: random angle 360°, biased slightly upward
    const angle=(Math.random()*Math.PI*2);
    const distance=80 + Math.random()*320;
    const dx=Math.cos(angle)*distance;
    const dy=Math.sin(angle)*distance - 30; // upward bias
    // Size: heavy variance — half are small, some are massive
    const scale=0.5 + Math.random()*Math.random()*3.5;  // squared random = more small + occasional huge
    const rotate=(Math.random()-0.5)*900;
    const duration=1300 + Math.random()*900;
    el.style.left=x+'px';
    el.style.top=y+'px';
    el.style.setProperty('--dx', dx+'px');
    el.style.setProperty('--dy', dy+'px');
    el.style.setProperty('--rot', rotate+'deg');
    el.style.setProperty('--scale', scale);
    el.style.setProperty('--dur', duration+'ms');
    document.body.appendChild(el);
    setTimeout(()=>el.remove(), duration+50);
  }
}

function playExplosionSound(tier){
  const ctx=getAudioCtx();
  // Sub-bass thud
  const sub=ctx.createOscillator(); const subG=ctx.createGain();
  sub.type='sine'; sub.frequency.setValueAtTime(80,ctx.currentTime);
  sub.frequency.exponentialRampToValueAtTime(35,ctx.currentTime+0.18);
  subG.gain.setValueAtTime(0.5,ctx.currentTime);
  subG.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.35);
  sub.connect(subG); subG.connect(ctx.destination);
  sub.start(); sub.stop(ctx.currentTime+0.4);
  // Mid transient — square for character
  const mid=ctx.createOscillator(); const midG=ctx.createGain();
  mid.type='square'; mid.frequency.value=tier==='S'?440:tier==='D'?110:220;
  midG.gain.setValueAtTime(0.18,ctx.currentTime);
  midG.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.12);
  mid.connect(midG); midG.connect(ctx.destination);
  mid.start(); mid.stop(ctx.currentTime+0.15);
  // Noise splat
  const buf=ctx.createBuffer(1,Math.floor(ctx.sampleRate*0.25),ctx.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<buf.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/buf.length,1.6)*0.35;
  const ns=ctx.createBufferSource(); ns.buffer=buf;
  const bp=ctx.createBiquadFilter(); bp.type='bandpass';
  bp.frequency.value=tier==='S'?3500:1800; bp.Q.value=2.5;
  ns.connect(bp); bp.connect(ctx.destination); ns.start();
  // Sparkle ping for S-tier
  if(tier==='S'){
    [1200, 1800, 2400, 3000].forEach((f,j)=>{
      const o=ctx.createOscillator(); const g=ctx.createGain();
      o.type='sine'; o.frequency.value=f;
      g.gain.setValueAtTime(0.08, ctx.currentTime + j*0.04);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + j*0.04 + 0.15);
      o.connect(g); g.connect(ctx.destination);
      o.start(ctx.currentTime + j*0.04); o.stop(ctx.currentTime + j*0.04 + 0.18);
    });
  }
}

function showCombo(n){
  playCombo();const el=document.getElementById('combo-text');
  el.textContent=n+'x COMBO';
  el.style.animation='comboFlash 0.8s ease-out forwards';
  setTimeout(()=>{el.style.animation='';},900);
}

function endGame(){
  gameStarted=false;
  stopCurrentAudio();
  stopPhysics();
  const placed=placements.filter(p=>p.tier).length;
  const skipped=placements.length - placed;
  const title = placed===SONGS.length ? 'CLEAR!' : (placed===0 ? 'TIME’S UP' : 'DONE');
  document.getElementById('end-title').textContent=title;
  document.getElementById('end-sub').textContent=placed+' placed · '+skipped+' missed';
  if(placed===SONGS.length){playClear();}
  // Cinematic reveal: zoom in on each tier in sequence, then show end screen
  endGameReveal();
}

function endGameReveal(){
  const game=document.getElementById('game');
  const tiers=Array.from(document.querySelectorAll('.tier-row'));
  const vp=document.getElementById('viewport').getBoundingClientRect();
  game.classList.add('reveal-mode');
  // 3x slower per Daniel (900 -> 2700) + zoomed in further (1.55 -> 2.4) +
  // transform-origin at left-center so the tier letter label stays visible.
  const DWELL=2700;
  const SCALE=2.4;
  tiers.forEach((row, i) => {
    setTimeout(()=>{
      const r=row.getBoundingClientRect();
      const rowCenterY = (r.top - vp.top) + r.height/2;
      const vpCenterY = vp.height / 2;
      const offsetY = vpCenterY - rowCenterY;
      // Scale around 0% (left edge) so the S/A/B/C/D letter on the left of
      // each row stays anchored at the viewport left edge after zoom.
      game.style.transformOrigin = '0% 50%';
      game.style.transform = `scale(${SCALE}) translateY(${offsetY}px)`;
      row.classList.add('reveal-focus');
      playTick();
    }, i * DWELL + 500);
    setTimeout(()=>{
      row.classList.remove('reveal-focus');
    }, i * DWELL + DWELL + 250);
  });
  // After the pan, zoom back out + reveal end screen
  setTimeout(()=>{
    game.style.transform='';
    setTimeout(()=>{
      game.classList.remove('reveal-mode');
      document.getElementById('end-screen').style.display='flex';
    }, 900);
  }, tiers.length * DWELL + 800);
}

// ========== EPISODE LOADER ==========
// Reads ?ep=N from URL (default 1), fetches episodes.json, populates SONGS,
// updates the game header, then kicks off the intro. Single code path —
// ep-1 uses the same loader as every other episode.
function getEpParam(){
  const params=new URLSearchParams(window.location.search);
  const raw=params.get('ep');
  if(!raw)return 1;
  const n=parseInt(raw,10);
  return isNaN(n)?1:n;
}

async function loadEpisode(){
  const epNum=getEpParam();
  let data;
  try{
    const resp=await fetch('data/wir/episodes.json',{cache:'no-store'});
    if(!resp.ok)throw new Error('HTTP '+resp.status);
    data=await resp.json();
  }catch(e){
    showLoadError('Could not load episode data: '+e.message);
    return;
  }
  const ep=(data.episodes||[]).find(x=>x.number===epNum);
  if(!ep){
    showLoadError('Episode '+epNum+' not found. Available: '+
      (data.episodes||[]).map(x=>x.number).join(', '));
    return;
  }
  CURRENT_EP=ep;
  SONGS=ep.songs||[];
  // Update header text dynamically (game-title + ep-info)
  const titleEl=document.getElementById('game-title');
  const epInfoEl=document.getElementById('ep-info');
  if(titleEl)titleEl.textContent='WILL IT RETAIL?';
  if(epInfoEl)epInfoEl.textContent='EP '+ep.number+' — '+ep.title.toUpperCase();
  // Preload art for snappier card render
  SONGS.forEach(s=>{const i=new Image();i.src=s.art;});
  // Kick off intro now that data is ready
  runIntro();
}

function showLoadError(msg){
  const intro=document.getElementById('intro');
  if(!intro)return;
  intro.innerHTML='<div style="color:#fff;text-align:center;padding:4vh;font-size:2vh;line-height:1.5;font-family:Inter,sans-serif;">'+msg+'</div>';
}

// Toggle safe-zone debug overlay via ?safezone=1
if(new URLSearchParams(window.location.search).get('safezone')==='1'){
  document.body.classList.add('show-safezone');
}

setTimeout(loadEpisode,100);
