<div id="viewport">
  <div id="progress-bar"><div id="progress-fill"></div></div>

  <!-- INTRO -->
  <div id="intro">
    <div id="intro-bg"></div>
    <div id="intro-vignette"></div>
    <div id="intro-content">
      <div id="intro-words"></div>
    </div>
    <button id="play-btn" onclick="startGame()">PLAY</button>
  </div>

  <!-- GAME -->
  <div id="game">
    <div id="timer-wrap">
      <div id="song-counter">0/5</div>
      <div id="game-header">
        <div id="game-title">WILL IT RETAIL?</div>
        <div id="ep-info">EP 1 — DWELL TIME</div>
      </div>
    </div>
    <div id="pip-zone"><span id="pip-label">PIP</span></div>
    <div id="tiers"></div>
    <!-- Drop stage holds the currently falling/held album -->
    <div id="drop-stage"></div>
  </div>

  <div id="flash-overlay"></div>
  <div id="combo-text"></div>

  <!-- SAFE-ZONE DEBUG OVERLAY — toggled by ?safezone=1 -->
  <div class="safezone-overlay" aria-hidden="true">
    <div class="safezone-zone top">unsafe — top (status / account)</div>
    <div class="safezone-zone bottom">unsafe — bottom (captions / engagement bar)</div>
    <div class="safezone-zone right">unsafe — right (like / comment / share)</div>
    <div class="safezone-frame"></div>
  </div>

  <div id="end-screen">
    <h2 id="end-title"></h2>
    <p id="end-sub"></p>
    <button id="replay-btn" onclick="location.reload()">PLAY AGAIN</button>
  </div>
</div>


<script>
// SONGS is loaded from /data/wir/episodes.json based on the ?ep= URL param.
// See will-it-retail/build-episodes.py for the data pipeline. The game UI
// must not assume any particular episode — only the data shape:
//   { episodes: [{ id, number, title, format, songs: [{title,artist,art,preview}] }] }
let SONGS = [];
let CURRENT_EP = null;

const TIERS = [
  {id:'S',label:'S',sub:'OPTIMAL',color:'#FF2D55'},
  {id:'A',label:'A',sub:'STRONG',color:'#FF9500'},
  {id:'B',label:'B',sub:'ADEQUATE',color:'#8B7500'},
  {id:'C',label:'C',sub:'RISKY',color:'#30B0C7'},
  {id:'D',label:'D',sub:'HARMFUL',color:'#9B956B'},
];

const EMOJIS={
  S:['🎉','✨','🌟','⭐','🎊','💎','🔥'],
  A:['😊','😄','🙂','😁','🤩'],
  B:['👍','💪','✅','👌'],
  C:['😐','😑','🫤','😶','😒'],
  D:['💀','👎','😬','🚫','💩','☠️'],
};

// ========== STATE ==========
// New mechanic: songs DROP one at a time with physics. Preview audio plays
// for the full clip duration; missing the clip = buzzer + skip. Pick up by
// clicking the settled album (3x scale + glow), drag to a tier to place.
let audioCtx;
let gameStarted=false;
let queueIndex=0;
const placements=[]; // {song, tier} per song (tier=null = skipped on timeout)
let currentAudio=null;     // <Audio> playing the current drop
let timeoutTimer=null;     // fallback for songs without preview URL
let DROP=null;             // current drop: {song, el, x, y, vx, vy, settled, picked, placed}
let physicsInterval=null;  // setInterval id (not rAF — survives tab-hidden / iframe)
let lastPlaceTime=0,comboCount=0;
const GRAVITY=0.55;        // px per frame squared (scaled by vh below)
const BOUNCE=0.20;         // energy retained per bounce — aggressive damping for ~2 bounces max
const SETTLE_THRESHOLD=1.5;
const ALBUM_VH=12;         // falling album size, vh
const PICKED_SCALE=2.4;    // picked-up size relative to base (80% of the original 3x design)
const FLOOR_VH_FROM_TOP=82.29; // safe-bottom boundary

// ========== AUDIO ==========
function getAudioCtx(){
  if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended')audioCtx.resume();
  return audioCtx;
}

function playThump(){
  const ctx=getAudioCtx();
  const osc=ctx.createOscillator();
  const gain=ctx.createGain();
  osc.type='sine';
  osc.frequency.setValueAtTime(55,ctx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(28,ctx.currentTime+0.15);
  gain.gain.setValueAtTime(0.5,ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.2);
  osc.connect(gain);gain.connect(ctx.destination);
  osc.start();osc.stop(ctx.currentTime+0.25);
  const bufSize=Math.floor(ctx.sampleRate*0.025);
  const buf=ctx.createBuffer(1,bufSize,ctx.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<bufSize;i++)d[i]=(Math.random()*2-1)*(1-i/bufSize)*0.35;
  const ns=ctx.createBufferSource();ns.buffer=buf;
  const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=180;
  ns.connect(lp);lp.connect(ctx.destination);ns.start();
}

function playTick(){
  const ctx=getAudioCtx();
  const bufSize=Math.floor(ctx.sampleRate*0.006);
  const buf=ctx.createBuffer(1,bufSize,ctx.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<bufSize;i++){d[i]=(Math.random()*2-1)*Math.pow(1-i/bufSize,4)*0.1;}
  const ns=ctx.createBufferSource();ns.buffer=buf;
  const bp=ctx.createBiquadFilter();bp.type='bandpass';bp.frequency.value=4500;bp.Q.value=6;
  const g=ctx.createGain();g.gain.value=0.5;
  ns.connect(bp);bp.connect(g);g.connect(ctx.destination);ns.start();
  const osc=ctx.createOscillator();const g2=ctx.createGain();
  osc.type='sine';osc.frequency.value=2800;
  g2.gain.setValueAtTime(0.05,ctx.currentTime);
  g2.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.015);
  osc.connect(g2);g2.connect(ctx.destination);
  osc.start();osc.stop(ctx.currentTime+0.02);
}

function playDrop(tier){
  const ctx=getAudioCtx();const osc=ctx.createOscillator();const gain=ctx.createGain();
  const freqs={S:880,A:660,B:440,C:330,D:220};
  osc.type='sine';osc.frequency.setValueAtTime(freqs[tier]||440,ctx.currentTime);
  osc.frequency.exponentialRampToValueAtTime((freqs[tier]||440)*1.5,ctx.currentTime+0.08);
  gain.gain.setValueAtTime(0.2,ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.25);
  osc.connect(gain);gain.connect(ctx.destination);osc.start();osc.stop(ctx.currentTime+0.3);
}

function playGrab(){
  const ctx=getAudioCtx();const osc=ctx.createOscillator();const gain=ctx.createGain();
  osc.type='sine';osc.frequency.value=600;
  gain.gain.setValueAtTime(0.05,ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.07);
  osc.connect(gain);gain.connect(ctx.destination);osc.start();osc.stop(ctx.currentTime+0.08);
}

function playCombo(){
  const ctx=getAudioCtx();
  [0,0.08,0.16].forEach((t,i)=>{
    const osc=ctx.createOscillator();const gain=ctx.createGain();
    osc.type='triangle';osc.frequency.value=880*(i+1)/2;
    gain.gain.setValueAtTime(0.1,ctx.currentTime+t);
    gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+t+0.15);
    osc.connect(gain);gain.connect(ctx.destination);
    osc.start(ctx.currentTime+t);osc.stop(ctx.currentTime+t+0.2);
  });
}

function playClear(){
  const ctx=getAudioCtx();
  [0,0.1,0.2,0.3,0.4].forEach((t,i)=>{
    const osc=ctx.createOscillator();const gain=ctx.createGain();
    osc.type='sine';osc.frequency.value=440*Math.pow(2,i/3);
    gain.gain.setValueAtTime(0.12,ctx.currentTime+t);
    gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+t+0.3);
    osc.connect(gain);gain.connect(ctx.destination);
    osc.start(ctx.currentTime+t);osc.stop(ctx.currentTime+t+0.35);
  });
}

function playBuzzer(){
  const ctx=getAudioCtx();const osc=ctx.createOscillator();const gain=ctx.createGain();
  osc.type='sawtooth';osc.frequency.value=110;
  gain.gain.setValueAtTime(0.4,ctx.currentTime);
  gain.gain.setValueAtTime(0.4,ctx.currentTime+0.6);
  gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.9);
  osc.connect(gain);gain.connect(ctx.destination);osc.start();osc.stop(ctx.currentTime+1);
}

// (previewSong removed — audio is now lifecycle-managed by the drop sequence)

// ========== INTRO ==========
function runIntro(){
  const words=['WILL','IT','RETAIL?'];
  const container=document.getElementById('intro-words');
  let delay=400;
  words.forEach((w,i)=>{
    setTimeout(()=>{
      const prev=container.querySelector('.intro-word');
      if(prev)prev.style.animation='wordFade 0.2s ease-in forwards';
      setTimeout(()=>{
        container.innerHTML='';
        const el=document.createElement('div');
        el.className='intro-word';
        el.textContent=w;
        el.style.animation='wordPop 0.3s cubic-bezier(0.34,1.56,0.64,1) forwards';
        container.appendChild(el);
        playThump();
      },i===0?0:250);
    },delay+i*750);
  });
  setTimeout(()=>{
    document.getElementById('play-btn').style.animation='fadeIn 0.6s ease-out forwards';
  },delay+words.length*750+500);
}

function startGame(){
  getAudioCtx();
  document.getElementById('intro').style.display='none';
  document.getElementById('game').style.display='block';
  gameStarted=true;
  queueIndex=0;
  placements.length=0;
  buildTiers();
  updateCounter();
  // Brief beat then first drop
  setTimeout(dropNext, 400);
}

// ========== BUILD ==========
function buildTiers(){
  const container=document.getElementById('tiers');
  container.innerHTML='';
  TIERS.forEach(t=>{
    const row=document.createElement('div');row.className='tier-row';
    const label=document.createElement('div');label.className='tier-label';
    label.style.background=t.color;
    label.innerHTML=t.label+'<span class="tier-sublabel">'+t.sub+'</span>';
    const drop=document.createElement('div');drop.className='tier-drop';drop.dataset.tier=t.id;
    row.appendChild(label);row.appendChild(drop);container.appendChild(row);
  });
}

function updateCounter(){
  document.getElementById('song-counter').textContent=
    Math.min(queueIndex+1,SONGS.length)+'/'+SONGS.length;
}

// ========== DROP SEQUENCE ==========
// One song at a time: spawn album above viewport, gravity + bounce, settle.
// Audio starts at spawn; if it ends before you place it -> buzzer + skip.
function dropNext(){
  if(queueIndex>=SONGS.length){endGame();return;}
  const song=SONGS[queueIndex];
  updateCounter();
  spawnDrop(song);
  startCurrentAudio(song);
}

function spawnDrop(song){
  // Clear any leftover element
  const stage=document.getElementById('drop-stage');
  stage.innerHTML='';
  const vp=document.getElementById('viewport').getBoundingClientRect();
  const albumPx=vp.height*ALBUM_VH/100;
  // Spawn x: center ± 12% jitter, kept inside safe-x
  const safeLeftPx=vp.width*0.0556;
  const safeRightPx=vp.width*0.8333;
  const usableW=safeRightPx-safeLeftPx-albumPx;
  const jitter=(Math.random()*0.24-0.12)*usableW;
  const x=safeLeftPx + usableW*0.5 + jitter;
  const el=document.createElement('div');
  el.className='drop-album';
  el.innerHTML='<img src="'+song.art+'" alt="'+song.title+' by '+song.artist+'"><div class="drop-label"><span class="dl-title">'+song.title+'</span><span class="dl-artist">'+song.artist+'</span></div>';
  el.style.width=albumPx+'px';
  el.style.height=albumPx+'px';
  el.style.left=x+'px';
  el.style.top=(-albumPx*1.2)+'px';
  stage.appendChild(el);
  DROP={song,el,
    x:x, y:-albumPx*1.2,
    vx:(Math.random()*2-1)*1.5,
    vy:0,
    w:albumPx, h:albumPx,
    settled:false, picked:false, placed:false,
    vpW:vp.width, vpH:vp.height,
  };
  el.addEventListener('pointerdown',onAlbumPointerDown);
  startPhysics();
}

function startPhysics(){
  stopPhysics();
  // ~60fps via setInterval (rAF stalls when iframe/tab is hidden, which we
  // observed in preview and which would also bite a backgrounded recording).
  physicsInterval = setInterval(physicsStep, 16);
}
function stopPhysics(){
  if(physicsInterval){clearInterval(physicsInterval);physicsInterval=null;}
}

function physicsStep(){
  if(!DROP||DROP.placed){stopPhysics();return;}
  if(DROP.picked){return;}  // no physics while held — pointermove moves it
  // Apply gravity
  DROP.vy += GRAVITY * (DROP.vpH/800); // scale by viewport so motion is uniform
  DROP.x += DROP.vx;
  DROP.y += DROP.vy;
  // Floor (catch zone top = bottom of safe area)
  const floorY = DROP.vpH * (FLOOR_VH_FROM_TOP/100) - DROP.h;
  if(DROP.y >= floorY){
    DROP.y = floorY;
    if(Math.abs(DROP.vy) < SETTLE_THRESHOLD){
      DROP.vy = 0;
      if(Math.abs(DROP.vx) < SETTLE_THRESHOLD){
        DROP.vx = 0;
        if(!DROP.settled){
          DROP.settled = true;
          DROP.el.classList.add('settled');
        }
        stopPhysics();
      }
    } else {
      DROP.vy *= -BOUNCE;
      DROP.vx *= 0.85;
      playThud();
    }
  }
  // Side walls = canonical safe-x bounds
  const leftWall = DROP.vpW * 0.0556;
  const rightWall = DROP.vpW * 0.8333 - DROP.w;
  if(DROP.x < leftWall){DROP.x = leftWall; DROP.vx *= -BOUNCE;}
  if(DROP.x > rightWall){DROP.x = rightWall; DROP.vx *= -BOUNCE;}
  DROP.el.style.left = DROP.x + 'px';
  DROP.el.style.top = DROP.y + 'px';
}

function playThud(){
  const ctx=getAudioCtx();
  const osc=ctx.createOscillator();const gain=ctx.createGain();
  osc.type='sine';osc.frequency.setValueAtTime(120,ctx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(50,ctx.currentTime+0.1);
  gain.gain.setValueAtTime(0.18,ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.18);
  osc.connect(gain);gain.connect(ctx.destination);
  osc.start();osc.stop(ctx.currentTime+0.2);
}

// ========== AUDIO LIFECYCLE (per drop) ==========
function startCurrentAudio(song){
  stopCurrentAudio();
  const fill=document.getElementById('progress-fill');
  fill.style.transition='width 0.1s linear, background-color 0.6s';
  fill.style.width='100%';
  fill.style.background='#22c55e';
  if(!song.preview){
    // No preview available — give the player 15s default
    timeoutTimer=setTimeout(onClipEnded, 15000);
    // Drain the bar over 15s for visual urgency
    requestAnimationFrame(()=>{fill.style.transition='width 15s linear, background-color 0.6s';fill.style.width='0%';});
    return;
  }
  const a=new Audio(song.preview);
  a.volume=0.45;
  a.preload='auto';
  currentAudio=a;
  a.addEventListener('ended', onClipEnded);
  a.addEventListener('timeupdate', updateClipProgress);
  a.play().catch(()=>{});
}

function stopCurrentAudio(){
  if(currentAudio){
    try{currentAudio.pause();}catch(e){}
    currentAudio.removeEventListener('ended', onClipEnded);
    currentAudio.removeEventListener('timeupdate', updateClipProgress);
    currentAudio=null;
  }
  if(timeoutTimer){clearTimeout(timeoutTimer);timeoutTimer=null;}
}

function updateClipProgress(){
  if(!currentAudio||!currentAudio.duration)return;
  const pct=1 - (currentAudio.currentTime/currentAudio.duration);
  const fill=document.getElementById('progress-fill');
  fill.style.width = (pct*100) + '%';
  if(pct<=0.22)fill.style.background='#ef4444';
  else if(pct<=0.44)fill.style.background='#FF9500';
  else if(pct<=0.67)fill.style.background='#eab308';
  else fill.style.background='#22c55e';
}

function onClipEnded(){
  // Clip ran out before placement -> buzzer + skip
  if(!DROP||DROP.placed)return;
  playBuzzer();
  document.getElementById('game').style.animation='shake 0.4s ease-in-out';
  setTimeout(()=>document.getElementById('game').style.animation='',450);
  // Fade out the album visually then remove
  DROP.placed=true; // prevent re-place
  DROP.el.classList.add('skipped');
  placements.push({song:DROP.song,tier:null});
  stopCurrentAudio();
  setTimeout(()=>{
    if(DROP&&DROP.el)DROP.el.remove();
    DROP=null;
    queueIndex++;
    dropNext();
  }, 700);
}

// ========== PICKUP / DRAG / PLACE ==========
function onAlbumPointerDown(e){
  if(!DROP||DROP.placed)return;
  // Allow pickup even mid-fall (you can grab it before it lands)
  e.preventDefault();
  DROP.picked=true;
  DROP.vx=0;DROP.vy=0;
  DROP.el.classList.add('picked-up');
  document.querySelectorAll('.tier-drop').forEach(d=>d.classList.add('active-target'));
  playGrab();
  // Position so cursor is centered on the (now 3x) album
  movePickedToPointer(e.clientX, e.clientY);
}

function movePickedToPointer(x,y){
  if(!DROP||!DROP.picked)return;
  // Pointer coords are window-relative but the album's left/top is relative
  // to #viewport (the centered 9:16 container). Convert to local space.
  const vp = document.getElementById('viewport').getBoundingClientRect();
  const localX = x - vp.left;
  const localY = y - vp.top;
  // transform-origin is center center, so the visual center stays at
  // (left + w/2, top + h/2) regardless of scale. Subtract base half-size.
  DROP.x = localX - DROP.w/2;
  DROP.y = localY - DROP.h/2;
  DROP.el.style.left = DROP.x + 'px';
  DROP.el.style.top  = DROP.y + 'px';
  // Update target tier highlight (tier rects are window-coord, pointer is too)
  const hover = getTierUnderPoint(x, y);
  document.querySelectorAll('.tier-drop').forEach(d=>{
    d.classList.toggle('hover-target', d===hover);
  });
}

document.addEventListener('pointermove', (e)=>{
  if(!DROP||!DROP.picked)return;
  e.preventDefault();
  movePickedToPointer(e.clientX, e.clientY);
});

document.addEventListener('pointerup', (e)=>{
  if(!DROP||!DROP.picked)return;
  const tierDrop = getTierUnderPoint(e.clientX, e.clientY);
  if(tierDrop){
    placeInTier(tierDrop, e.clientX, e.clientY);
  } else {
    // Released over no tier -> let it fall again
    DROP.picked=false;
    DROP.el.classList.remove('picked-up');
    document.querySelectorAll('.tier-drop').forEach(d=>d.classList.remove('active-target','hover-target'));
    DROP.settled=false;
    DROP.el.classList.remove('settled');
    DROP.vy = 0;
    startPhysics();
  }
});

function placeInTier(tierDrop, x, y){
  if(!DROP||DROP.placed)return;
  DROP.placed = true;
  stopCurrentAudio();
  document.querySelectorAll('.tier-drop').forEach(d=>d.classList.remove('active-target','hover-target'));
  const tier = tierDrop.dataset.tier;
  // Create permanent placed card
  const card = document.createElement('div');
  card.className = 'song-card placed';
  card.innerHTML = '<img src="'+DROP.song.art+'" alt="'+DROP.song.title+'">';
  tierDrop.appendChild(card);
  // Remove the falling album element
  DROP.el.remove();
  placements.push({song: DROP.song, tier});
  // FX
  playDrop(tier); flashScreen(); spawnEmojis(x, y, tier);
  if(tier==='D'){
    document.getElementById('game').style.animation='shake 0.3s ease-in-out';
    setTimeout(()=>document.getElementById('game').style.animation='',350);
  }
  const now=Date.now();
  if(now-lastPlaceTime<2500){comboCount++;if(comboCount>=2)showCombo(comboCount);}
  else{comboCount=1;}
  lastPlaceTime=now;
  DROP=null;
  queueIndex++;
  // Beat then next drop
  setTimeout(dropNext, 700);
}

function getTierUnderPoint(x,y){
  const drops=document.querySelectorAll('.tier-drop');
  for(const d of drops){
    const r=d.getBoundingClientRect();
    if(x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom)return d;
  }return null;
}

// (Old DRAG / staging-tap listeners removed — pickup is now album-element-scoped)

// ========== EFFECTS ==========
function flashScreen(){
  const el=document.getElementById('flash-overlay');
  el.style.opacity='0.3';el.style.animation='flash 0.2s ease-out forwards';
  setTimeout(()=>{el.style.animation='';el.style.opacity='0';},250);
}

function spawnEmojis(x,y,tier){
  const set=EMOJIS[tier]||EMOJIS.B;
  const count=tier==='S'?8:tier==='D'?6:4;
  for(let i=0;i<count;i++){
    const el=document.createElement('div');el.className='emoji-particle';
    el.textContent=set[Math.floor(Math.random()*set.length)];
    el.style.left=(x+Math.random()*80-40)+'px';
    el.style.top=(y+Math.random()*50-25)+'px';
    document.body.appendChild(el);setTimeout(()=>el.remove(),1400);
  }
}

function showCombo(n){
  playCombo();const el=document.getElementById('combo-text');
  el.textContent=n+'x COMBO';
  el.style.animation='comboFlash 0.8s ease-out forwards';
  setTimeout(()=>{el.style.animation='';},900);
}

function endGame(){
  gameStarted=false;
  stopCurrentAudio();
  stopPhysics();
  const placed=placements.filter(p=>p.tier).length;
  const skipped=placements.length - placed;
  const title = placed===SONGS.length ? 'CLEAR!' : (placed===0 ? 'TIME’S UP' : 'DONE');
  document.getElementById('end-title').textContent=title;
  document.getElementById('end-sub').textContent=placed+' placed · '+skipped+' missed';
  if(placed===SONGS.length){playClear();}
  setTimeout(()=>{document.getElementById('end-screen').style.display='flex';},600);
}

// ========== EPISODE LOADER ==========
// Reads ?ep=N from URL (default 1), fetches episodes.json, populates SONGS,
// updates the game header, then kicks off the intro. Single code path —
// ep-1 uses the same loader as every other episode.
function getEpParam(){
  const params=new URLSearchParams(window.location.search);
  const raw=params.get('ep');
  if(!raw)return 1;
  const n=parseInt(raw,10);
  return isNaN(n)?1:n;
}

async function loadEpisode(){
  const epNum=getEpParam();
  let data;
  try{
    const resp=await fetch('data/wir/episodes.json',{cache:'no-store'});
    if(!resp.ok)throw new Error('HTTP '+resp.status);
    data=await resp.json();
  }catch(e){
    showLoadError('Could not load episode data: '+e.message);
    return;
  }
  const ep=(data.episodes||[]).find(x=>x.number===epNum);
  if(!ep){
    showLoadError('Episode '+epNum+' not found. Available: '+
      (data.episodes||[]).map(x=>x.number).join(', '));
    return;
  }
  CURRENT_EP=ep;
  SONGS=ep.songs||[];
  // Update header text dynamically (game-title + ep-info)
  const titleEl=document.getElementById('game-title');
  const epInfoEl=document.getElementById('ep-info');
  if(titleEl)titleEl.textContent='WILL IT RETAIL?';
  if(epInfoEl)epInfoEl.textContent='EP '+ep.number+' — '+ep.title.toUpperCase();
  // Preload art for snappier card render
  SONGS.forEach(s=>{const i=new Image();i.src=s.art;});
  // Kick off intro now that data is ready
  runIntro();
}

function showLoadError(msg){
  const intro=document.getElementById('intro');
  if(!intro)return;
  intro.innerHTML='<div style="color:#fff;text-align:center;padding:4vh;font-size:2vh;line-height:1.5;font-family:Inter,sans-serif;">'+msg+'</div>';
}

// Toggle safe-zone debug overlay via ?safezone=1
if(new URLSearchParams(window.location.search).get('safezone')==='1'){
  document.body.classList.add('show-safezone');
}

setTimeout(loadEpisode,100);
</script>
