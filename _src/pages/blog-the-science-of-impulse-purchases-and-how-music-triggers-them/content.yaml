- type: subhead
  level: 2
  text: Does music really affect impulse purchases?
- type: prose
  body: 'Yes — and the mechanism is well-documented. A 1997 Psychology & Marketing study established the chain: store environment creates emotional state, and emotional state drives impulse buying. The 1994 Journal of Retailing study showed that pleasure in the first 5 minutes is the strongest predictor of unplanned spending. Music is the fastest environmental lever to shape that pleasure response.

    '
- type: subhead
  level: 2
  text: Isn't impulse buying more about product placement and sale signs?
- type: prose
  body: 'The research says otherwise. Environmental variables don''t directly predict impulse buying — they predict *emotion*, and emotion predicts impulse buying (Sherman et al., 1997). Product placement matters, but it matters less than how the customer *feels*. The 1982 grocery study showed a 38% sales lift from tempo changes alone, with identical product placement. The emotional environment outweighs the visual merchandising.

    '
- type: subhead
  level: 2
  text: What's the simplest thing I can do to increase impulse purchases through music?
- type: prose
  body: 'Focus on the first 5 minutes. Play pleasant, unfamiliar, moderate-tempo music that matches your brand — the research shows this creates the positive emotional state that opens the impulse window. Avoid recognizable hits (they shorten dwell time via the familiarity paradox) and avoid volume that''s too high (it triggers faster movement, not browsing). Entuned is built around this chain — try it free at entuned.co. Full citations in the description. This is video 8 of 50 in this series.

    '
