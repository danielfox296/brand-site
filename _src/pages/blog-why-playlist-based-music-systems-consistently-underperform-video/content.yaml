- type: video
- type: prose
  body: 'Professionally curated playlists showed no significant sales effect across a 140-store field study — the largest retail music experiment ever conducted. The playlist model has four structural flaws that no amount of curation can fix: static tempo, repetition, preference mismatch, and congruence drift.


    In this video I break down why the entire playlist-based approach to retail music is fundamentally broken, regardless of how good the curation is, and what the research says about the alternative.

    '
- type: transcript
  chapters: *id001
- type: subhead
  level: 2
  text: Do curated playlists actually underperform?
- type: prose
  body: 'A 2025 field study across 140 stores — the largest ever conducted — found that professionally curated, brand-matched playlists produced no significant overall effect on sales. The only customers who responded were existing loyalty members. The playlist format has structural problems no amount of curation can fix.

    '
- type: subhead
  level: 2
  text: What's structurally wrong with playlists?
- type: prose
  body: 'Four things. They''re static in a dynamic environment (can''t adjust tempo for crowd density). They repeat (torturing staff and degrading the experience). They can''t match individual preferences across a diverse customer base. And they drift out of brand congruence over time — and even slight incongruence reverses the positive effects.

    '
- type: subhead
  level: 2
  text: What's the alternative to playlists?
- type: prose
  body: 'Generative music — music created in real time for your specific environment. No repetition, no congruence drift, no static tempo locked to the wrong conditions. That''s what Entuned does. It''s not a better playlist — it''s the end of playlists. Free tier at entuned.co. Full citations in the description. This is video 26 of 50 in this series.

    '
