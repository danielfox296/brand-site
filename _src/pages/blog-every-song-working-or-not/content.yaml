h1_1: Every Song In Your Store Is Either Working Or It Isn't
meta_1: Daniel Fox &middot; April 2026 &middot; 5 min read
btn_1: Ask About a Pilot Program

p_1: Imagine pulling up a scatter plot of every track that played in your store last week.
p_2: On one axis, how aligned the song was to your brand. On the other, whether the words and the mood were moving customers toward a purchase or away from one. Each track is a dot. A week of music is a cloud of dots.
p_3: Most retailers have never seen this chart. The chart above is what one looks like. 400 tracks, 100 from each of the four dominant sources of retail audio, plotted by how much brand alignment the track has and how much behavioral lift it produces in the store. The red band at the bottom is the zone where a track is actively working against the transaction &mdash; familiar research on semantic priming and mode-driven mood effects says this zone is real and measurable.
p_4: <span class="highlight">The gap between "we chose this music carefully" and "we know this music is working" is where most retail audio investment disappears.</span>

h2_1: Where the Dots Land Depends on Where the Music Comes From
p_5: If the store is on a <strong>licensed radio station</strong>, a good portion of those dots land in the bottom left. Radio wasn't designed for retail. The format was built around interruption &mdash; music, then a commercial for a car dealership or a competing brand. Whoever sold the ad slot had a goal in that moment, and the goal wasn't yours. A customer in a fitting room is being pitched a mattress sale happening across town.
p_6: <strong>Mood Media, CloudCover</strong>, and services like them improve on that. A playlist means no competing ads, a more consistent sound. The dots shift toward the middle. But a curated playlist is still a static object. Someone built it, probably with taste, based on a sense of the brand's identity. It plays. Nothing about it adjusts for who's actually in the store, what they came in for, what a given track is doing to their behavior in that moment. The dots scatter across the middle of the chart with no particular logic. (If this is you, here are the <a href="../blog/mood-media-alternatives.html">alternatives worth looking at</a>.)
p_7: <strong>Spotify for Business</strong> moves the intentionality up. You're closer to the brand, closer to the vibe. The dots cluster in the right half. But the measurement problem persists. Something is being chosen. Nobody's watching what it does. <a href="../blog/what-spotify-gets-wrong.html">More on what Spotify misses</a>.

h2_2: Chosen Carefully Is Not the Same as Working
p_8: A track that's brand-aligned but lyrically inert is a missed opportunity. A track that's sonically pleasant but semantically pointing the customer somewhere else is a liability. Both get counted as "music was playing." Neither tells you anything about what happened in the store while it played.
p_9: This is the measurement gap that every major playlist service shares. The track gets chosen, queued, delivered, paid for. What it did once it left the speaker is nobody's job.
p_10: Retail audio is one of the only customer experience variables that runs continuously, touches every visitor, and goes completely unmeasured. A retailer will A/B test a subject line in an email to three percent of their list. They won't question what the room sounds like during the transaction.

h2_3: What the Right Side of the Chart Looks Like
p_11: The tracks Entuned deploys are specified at the compositional level. Tempo, key, arrangement density, lyrical content &mdash; all of it is set against a target behavioral state for the customer segment in the store. And because the music is <a href="../blog/ai-generated-music-retail.html">created rather than pulled from a catalog</a>, the lyrical layer can be pointed at something specific: a discovery mindset, a quality orientation, a willingness to spend. Those outcomes are correlated against sensor data already in the store. The chart updates.
p_12: That's what the cluster on the right side of the scatter looks like. Tracks built to move a specific metric, playing in a store where someone is watching whether they did.

h2_4: Pull the Chart
p_13: Most retailers have no idea what's happening in their speakers. Not because nobody thought to ask, but because until recently there wasn't a way to get an answer. The music played. Customers came and went. The two things were assumed to be unrelated.
p_14: That assumption has a cost. Every one of those 400 dots represents a moment a customer was being moved somewhere &mdash; toward a purchase, away from one, or nowhere at all. A week of retail audio is a week of those moments, and for most stores, nobody has ever looked.
p_15: Pull the scatter plot. See where the dots land.

