  - type: prose
    body: |
      Imagine pulling up a scatter plot of every track that played in your store last week.

      On one axis, how aligned the song was to your brand. On the other, whether the words and the mood were moving customers toward a purchase or away from one. Each track is a dot. A week of music is a cloud of dots.

      Most retailers have never seen this chart. 400 tracks, 100 from each of the four dominant sources of retail audio, plotted by how much brand alignment the track has and how much behavioral lift it produces in the store. The red band at the bottom is the zone where a track is actively working against the transaction — familiar research on semantic priming and mode-driven mood effects says this zone is real and measurable.

  - type: pullquote
    text: "The gap between 'we chose this music carefully' and 'we know this music is working' is where most retail audio investment disappears."
    accent: gold

  - type: subhead
    level: 2
    text: "Where the Dots Land Depends on Where the Music Comes From"

  - type: prose
    body: |
      If the store is on a **licensed radio station**, a good portion of those dots land in the bottom left. Radio wasn't designed for retail. The format was built around interruption — music, then a commercial for a car dealership or a competing brand. Whoever sold the ad slot had a goal in that moment, and the goal wasn't yours. A customer in a fitting room is being pitched a mattress sale happening across town.

      **Mood Media, CloudCover**, and services like them improve on that. A playlist means no competing ads, a more consistent sound. The dots shift toward the middle. But a curated playlist is still a static object. Someone built it, probably with taste, based on a sense of the brand's identity. It plays. Nothing about it adjusts for who's actually in the store, what they came in for, what a given track is doing to their behavior in that moment. The dots scatter across the middle of the chart with no particular logic. (If this is you, here are the [alternatives worth looking at](../blog/mood-media-alternatives.html).)

      **Spotify for Business** moves the intentionality up. You're closer to the brand, closer to the vibe. The dots cluster in the right half. But the measurement problem persists. Something is being chosen. Nobody's watching what it does. [More on what Spotify misses](../blog/what-spotify-gets-wrong.html).

  - type: subhead
    level: 2
    text: "Chosen Carefully Is Not the Same as Working"

  - type: prose
    body: |
      A track that's brand-aligned but lyrically inert is a missed opportunity. A track that's sonically pleasant but semantically pointing the customer somewhere else is a liability. Both get counted as "music was playing." Neither tells you anything about what happened in the store while it played.

      This is the measurement gap that [every major playlist service shares](../blog/commercial-music-services-compared.html). The track gets chosen, queued, delivered, paid for. What it did once it left the speaker is nobody's job.

      Retail audio is one of the only customer experience variables that runs continuously, touches every visitor, and goes completely unmeasured. A retailer will A/B test a subject line in an email to three percent of their list. They won't question what the room sounds like during the transaction.

  - type: stat_callout
    number: "400"
    label: "Tracks plotted across four retail audio sources — showing where brand alignment and behavioral lift actually land"
    source: "Entuned analysis framework"
    accent: teal

  - type: subhead
    level: 2
    text: "What the Right Side of the Chart Looks Like"

  - type: prose
    body: |
      The tracks Entuned deploys are specified at the compositional level. Tempo, key, arrangement density, lyrical content — all of it is set against a target behavioral state for the customer segment in the store. And because the music is [created rather than pulled from a catalog](../blog/ai-generated-music-retail.html), the lyrical layer can be pointed at something specific: a discovery mindset, a quality orientation, a willingness to spend. Those outcomes are correlated against [sensor data already in the store](../blog/closing-the-loop-on-retail-analytics.html). The chart updates.

      That's what the cluster on the right side of the scatter looks like. Tracks built to move a specific metric, playing in a store where someone is watching whether they did.

  - type: stat_callout
    number: "0%"
    label: "Of major playlist services that measure the behavioral impact of what they play"
    source: "Industry analysis, 2026"
    accent: gold

  - type: subhead
    level: 2
    text: "Pull the Chart"

  - type: prose
    body: |
      Most retailers have no idea what's happening in their speakers. Not because nobody thought to ask, but because until recently there wasn't a way to get an answer. The music played. Customers came and went. The two things were assumed to be unrelated.

      That assumption has a cost. Every one of those 400 dots represents a moment a customer was being moved somewhere — toward a purchase, away from one, or nowhere at all. A week of retail audio is a week of those moments, and for most stores, nobody has ever looked.

      Pull the scatter plot. [See where the dots land](../how-it-works.html).

