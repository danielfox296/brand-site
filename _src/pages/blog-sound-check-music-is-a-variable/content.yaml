  - type: prose
    body: |
      *This is Part 4 of the Sound Check series, exploring the science and structure behind retail music.*

      Walk into a well-designed retail space and count the decisions someone made before you arrived.

      The lighting hits at a specific color temperature. Somebody chose that number. The fixtures sit at heights calculated to guide sightlines toward focal merchandise. The floor plan channels traffic through a sequence that puts discovery before destination. The color palette on the walls went through rounds of review. If there's a scent, it was selected from a vendor catalog, diluted to a target intensity, and diffused through an HVAC system on a timed schedule.

      Every one of those inputs got specified. Documented. Reviewed. Revised.

      Now: what's playing on the speakers?

  - type: subhead
    level: 2
    text: "The Toolkit That Already Includes Music"

  - type: prose
    body: |
      Somebody's Spotify playlist, maybe. A licensing service set to "chill." Whatever the morning manager felt like. The answer, in most retail environments, is that nobody specified the music with anything close to the rigor they applied to the paint color. And that gap between intention and neglect is stranger than it looks, because the research on music's effect in commercial environments is older and more robust than the research behind half the design decisions retailers already take seriously.

      In 1974, Philip Kotler published a paper in the [*Journal of Retailing*](https://scholar.google.com/scholar?q=Kotler+Atmospherics+as+a+Marketing+Tool+1974) that gave this whole category a name. He called it "atmospherics," and he defined it as the conscious design of space to produce specific emotional effects in buyers. Music was in the original toolkit. It has been sitting there, explicitly named, for fifty years.

  - type: stat_callout
    number: "1974"
    label: "Year Kotler named music as a design variable in the atmospherics toolkit — fifty years ago"
    source: "Kotler, Journal of Retailing, 1974"
    accent: teal

  - type: prose
    body: |
      That same year, [Mehrabian and Russell published their model](https://scholar.google.com/scholar?q=Mehrabian+Russell+Approach+Environmental+Psychology+1974) of environmental psychology, built around three emotional dimensions: pleasure, arousal, and dominance. Environmental stimuli produce emotional states in the people exposed to them, and those emotional states predict behavior — specifically, approach or avoidance.

      [Donovan and Rossiter took the Mehrabian-Russell model into retail stores in 1982](https://scholar.google.com/scholar?q=Donovan+Rossiter+Store+Atmosphere+Environmental+Psychology+Approach+1982) and tested it directly. They confirmed that the emotional states produced by store atmosphere mediated shopping behavior. The environment shaped how people felt, and how people felt shaped what they did.

      Music sits squarely inside that mechanism. The research confirmed this over forty years ago. And yet most retailers treat music with less intentionality than they treat shelf talkers.

  - type: subhead
    level: 2
    text: "Why Single-Channel Thinking Sells Short"

  - type: prose
    body: |
      [Mattila and Wirtz published a study in 2001](https://scholar.google.com/scholar?q=Mattila+Wirtz+Congruency+Scent+Music+Driver+In-Store+Evaluations+Behavior+2001) that looked at what happens when you combine atmospheric elements. When the arousal levels of the scent and the music matched, consumer evaluations were significantly higher than when either element was presented alone or when the two were mismatched.

      [Spence and colleagues reinforced this in 2014](https://scholar.google.com/scholar?q=Spence+store+atmospherics+multisensory+2014), arguing that human perception is fundamentally multisensorial and holistic. People do not experience a store's lighting separately from its music separately from its scent. The brain integrates those inputs before conscious evaluation even begins.

  - type: pullquote
    text: "You can spend real money on scent strategy. You can hire a lighting designer. And a random playlist can work against both of those investments simultaneously."
    accent: teal

  - type: prose
    body: |
      A retailer who specifies lighting, scent, visual merchandising, and layout with precision but leaves music unspecified is building a multi-sensory environment with a hole in it. The unmanaged input interacts with every managed one, and the interaction is not neutral. The Mattila and Wirtz data suggests mismatched arousal between music and the rest of the environment actively degrades the experience those other investments were designed to create.

  - type: subhead
    level: 2
    text: "The Evidence Is Not the Problem"

  - type: prose
    body: |
      [Turley and Milliman published a review in the *Journal of Business Research* in 2000](https://scholar.google.com/scholar?q=Turley+Milliman+Atmospheric+Effects+Shopping+Behavior+Review+Experimental+Evidence+2000) that surveyed decades of atmospherics research. They found statistically significant relationships between atmospheric variables and consumer behavior across study after study. Their conclusion was not that more research was needed.

      What Turley and Milliman noted, and what remains true today, is that a gap exists between what the research demonstrates and what practitioners actually do. The evidence for music as a behavioral variable has been accumulating since the 1970s. The gap is not a knowledge problem. The gap is a specification problem.

  - type: stat_callout
    number: "50+"
    label: "Years of peer-reviewed evidence that music is a behavioral variable — still unspecified in most retail environments"
    source: "Kotler, 1974; Turley & Milliman, 2000"
    accent: teal

  - type: subhead
    level: 2
    text: "What Specification Actually Looks Like"

  - type: prose
    body: |
      Lighting got promoted from "turn the lights on" to a design discipline with its own consultants, technologies, and line items in the construction budget. Scent followed a similar path. Music, for most retailers, is still sitting in the "turn the lights on" phase.

      The research points to specific variables that matter. [Tempo](../blog/science-of-tempo-retail.html). Mode. Genre congruence with brand identity. Arousal level matched to the desired behavioral outcome and coordinated with other [sensory inputs](../blog/sensory-marketing-for-retail.html). Volume calibrated to the space, the time of day, the customer density. These are measurable, adjustable parameters — the same kind of parameters that lighting designers and visual merchandisers work with every day.

      The capability to treat music this way is becoming real. What has been missing is the operational infrastructure to turn research into practice at scale.

  - type: stat_callout
    number: "6 figures"
    label: "Annual visual merchandising analytics spend — while the audio environment gets a $35/month subscription"
    source: "Entuned market analysis, 2026"
    accent: gold

  - type: subhead
    level: 2
    text: "The Question That Is Already Answered"

  - type: prose
    body: |
      There is a version of this conversation that asks whether music affects consumer behavior in retail environments. That question was answered empirically in 1982. Donovan and Rossiter closed it.

      The real question is narrower and more practical. Are you specifying your music, or are you letting it happen?

      Every other sensory input in your store has a spec. Somebody chose the light temperature. Somebody approved the scent. Somebody laid out the floor plan with traffic flow in mind. If your music is the one atmospheric variable that nobody specifies, you have an uncontrolled input interacting with every controlled one. The research says that interaction matters. It has been saying so for fifty years.

      The paint color has a spec. The music should too. [See how Entuned specifies music at the parameter level](../how-it-works.html).

