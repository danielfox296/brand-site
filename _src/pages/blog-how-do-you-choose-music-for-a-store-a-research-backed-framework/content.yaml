- type: video
- type: prose
  body: 'Choosing music for a store requires starting with customer preference — not brand identity. A 1996 study found that customer preference was the only statistically significant predictor of positive shopping outcomes. From there, the research says to control tempo based on traffic, think in parameters not genres, and match the music to your product category.


    In this video I break down a systematic, research-backed framework for choosing store music — covering tempo dynamics, the mode-versus-genre distinction, category matching, and why familiar music can actually backfire.

    '
- type: prose
  body: Most store owners choose music the same way they choose what to eat for lunch — gut feel, whatever sounds good at the moment. That’s a problem. Because the research on this is shockingly specific. And your instincts are probably wrong.
- type: subhead
  text: The Instinct Trap
- type: prose
  body: 'Here’s the first thing to know. A study in the Journal of Services Marketing from 1996 found that the single most significant predictor of positive shopping outcomes was whether customers liked the music. Not tempo. Not genre. Not volume. Preference. Sounds obvious, right? Just play good music. But here’s the catch: your preference and your customer’s preference are probably different things. And a follow-up study in the same journal in 2008 confirmed it — the combination of happy-sounding music that customers actually enjoyed produced the best outcomes. Happy and liked. You need both. So “I like this playlist” is not a strategy. “My customers respond to this playlist” is.'
- type: subhead
  text: Start With Brand, Not Genre
- type: prose
  body: 'Before you think about specific songs, you need to answer a harder question: what does your brand sound like? Research published in the Journal of Business Research in 2006 showed that music-brand misfit didn’t just fail to help — it actively damaged how customers perceived the brand. This isn’t neutral territory. Wrong music is worse than no music. Think about it in terms of congruence. A 2005 study in the same journal found that pine scent — which should feel pleasant — actually backfired in a retail setting when it wasn’t paired with Christmas music. The sensory cues contradicted each other. Your music has to match the story your store is already telling through design, product, and service.'
- type: subhead
  text: The Variables That Actually Matter
- type: prose
  body: Once you’ve nailed brand fit, here are the levers the research says you should pull. Tempo. The classic Journal of Marketing study from 1982 showed slow music increased supermarket sales by 38 percent. But — and this is critical — a 2017 study in the Journal of Retailing analyzing over 43,000 baskets found that fast tempo actually helps when the store is crowded, lifting sales roughly 8 percent. So tempo isn’t a fixed setting. It depends on traffic. Mode. Major key versus minor key. Research in Marketing Letters from 2012 found that slow tempo in a minor key produced about a 12 percent spending lift. But slow tempo in a major key killed the effect. Minor mode is underrated. Volume. A foundational study from the Journal of Applied Psychology in 1966 showed that loud music made people leave faster without increasing sales. And more recent research in the Journal of the Academy of Marketing Science in 2019 found that lower volume actually nudged customers toward healthier food choices. Volume shapes behavior in ways most people don’t think about.
- type: subhead
  text: The Practical Framework
- type: prose
  body: 'So here’s how to actually choose. Step one: define your brand’s emotional territory. Are you calm and premium? Energetic and accessible? Earthy and grounded? This determines your baseline. Step two: match your music’s arousal level to your environment. Research in the Journal of Retailing from 2001 showed that music and ambient scent need to match in arousal level — when they didn’t, the positive effect collapsed. Your music should match the energy of everything else in the space. Step three: adapt. Your Wednesday morning crowd is not your Saturday afternoon crowd. The research is screaming that context matters more than any fixed playlist. This is exactly why we built Entuned to be adaptive — because every study we read told us that one playlist for all conditions leaves money on the table.'
- type: subhead
  text: The Shortcut
- type: prose
  body: Look — you can do all of this manually. Curate playlists, schedule by time of day, swap them seasonally, hope the tempo-mode interaction is right. Or you can use a system that already has the research baked in and adjusts automatically. Entuned generates original music tuned to your brand and responsive to your store’s conditions. No guessing. No licensing headaches. Just the science, applied.
- type: transcript
  chapters: *id001
- type: subhead
  level: 2
  text: How should I choose music for my store?
- type: prose
  body: 'Start with your customer, not your brand. A 1996 study found customer preference was the only statistically significant predictor of positive shopping outcomes. Then control tempo based on traffic (slow when quiet, fast when crowded), think in sonic parameters instead of genres, match music to your product category''s purchase psychology, and be cautious with familiar songs.

    '
- type: subhead
  level: 2
  text: Doesn't genre matter? I've always chosen by genre.
- type: prose
  body: 'Genre is a crude tool. A 2012 study found that the interaction between tempo and mode (major vs. minor key) is what drives spending — producing a ~12% lift. Two songs can both be "indie chill" and have completely different behavioral effects. The variables that move sales are tempo, mode, harmonic density, and instrumentation, not genre labels.

    '
- type: subhead
  level: 2
  text: What's the simplest way to get this right?
- type: prose
  body: 'If you want to do it manually, match your music''s sonic characteristics to your customer and your product category, then adjust tempo based on how busy you are. If you want to skip the guesswork, Entuned generates music from parameters and adapts in real time — try the free tier at entuned.co. Full citations in the description. This is video 33 of 50 in this series.

