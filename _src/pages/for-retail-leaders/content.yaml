# for-retail-leaders — editable text content
# Persona: Regional VP of Retail Ops / Director of Retail Operations
# at a mid-market multi-store transactional retailer, sales-performance bonused.

hero:
  eyebrow: "For retail directors"
  h1: "If you carry the P&L, the audio in your stores is on it."
  subline: "You already track dwell, basket, conversion, traffic. The one variable affecting all four — and changing every minute the store is open — is the one nobody is measuring."

# The gap
gap:
  eyebrow: "The Gap"
  h2: "Music has been a vendor line item, not an operating variable."
  p1: "Your visual merchandising team is well-staffed, well-funded, and well-strategized. Your real estate team has a model for every storefront. Your store ops team owns staffing rotation, day-parting, and the operating hours your floor is open for business. The audio environment those teams operate inside is whatever the music vendor sent over."
  p2: "Forty years of peer-reviewed research says that audio environment is doing measurable work on the variables you are bonused on. Tempo affects the pace customers move through the store. Music a customer reads as belonging to them moves their willingness to pay. Familiar songs cut perceived dwell. Mismatched music actively reduces basket size. The variable is doing work in the room. The question is whether you chose what."

# Two questions
questions:
  eyebrow: "Two Questions"
  h2: "Ask your current vendor these."
  q1: "What did the music in our stores contribute to store performance last quarter?"
  a1: "Catalogue vendors cannot answer this. Their selection logic is genre alignment and licensing compliance. They do not connect to your reporting and they do not measure outcomes. If the answer is 'we do not know,' you are paying for an unmeasured environmental variable that is affecting your performance numbers whether your team chose its effect or not."
  q2: "How is the music in our stores tailored to the customer our stores are built to serve?"
  a2: "Catalogue vendors pick from a library written for an artist's self-expression. The customer profile of the listener was the artist's audience, not your store's customer. There is no parameter-level fit between the music and the customer your reporting tracks. Engineered audio starts from your customer and produces music against that profile on purpose."

# What changes
changes:
  eyebrow: "What Changes"
  h2: "Same engine. Three deployment shapes."

  card1_title: "Test in one store"
  card1_text: "Spin up Entuned Free in a single store this week — no credit card, no time limit. Pick Linger or Lift Energy and watch what your existing reporting shows for that store against its own trailing baseline. Useful as the first look before a multi-store Ideal Customer Profile (ICP) build."

  card2_title: "Deploy across the format"
  card2_text: "Move to Core ($99/location/month) once you want music tailored to a specific customer profile rather than a general catalogue. Most regional retailers run Core in stores that share a customer profile and deploy multiple ICPs through Professional in stores that don't."

  card3_title: "Measure across your locations"
  card3_text: "Professional ($399/location/month) integrates with your POS, day-parts the audio against your traffic profile, and refines the music against your store's outcomes as the dataset grows. The lift shows up in the reports you already run."

  card4_title: "Roll out the network"
  card4_text: "Enterprise is for across all locations deployments. Custom ICP design, performance guarantees where lift can be cleanly measured, dedicated success contact, white-glove rollout. Standard entry shape is a 12-week pilot in a paired set of test and control stores."

# How to bring this in
buy_in:
  eyebrow: "Getting Buy-In"
  h2: "What your CFO will want to see."
  body: "Most retail finance teams approve a single-store Entuned Free trial without a procurement conversation — there is no spend. Core and Professional move on standard SaaS approval ($99 or $399 per location per month, monthly, no long-term contract). Enterprise gets a structured pilot with a written readout against your existing reporting before any across all locations commitment. The financial case sits on the <a href=\"for-cfos.html\" style=\"color: #50929c;\">CFO page</a>."

# Pilot anchor (un-named)
anchor:
  eyebrow: "What's Already Running"
  h2: "Currently in pilot with an 80+ store retailer."
  body: "Entuned is currently running a deployment with a major mid-market men's fashion retailer with 80+ stores. Multi-store deployment, ICP-tailored audio against the retailer's existing reporting stack. Pilot data accumulating; brand name not yet authorized for public reference."

