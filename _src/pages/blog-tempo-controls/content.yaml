sections:
  - type: key_takeaways
    items:
      - "Tempo entrains the nervous system with a strong meta-analytic effect size of r=.40 across eight studies"
      - "A 2025 experiment across 140 stores found no overall sales effect from tempo manipulation alone"
      - "Cultural alignment of the music is what converts dwell time into purchase behavior"

  - type: prose
    body: |
      The single most replicated finding in the entire field of retail music research is this: tempo controls motor behavior. How fast the music is playing determines how fast people move through a space, how quickly they eat, how rapidly they drink. The meta-analytic effect size across eight studies is r=.40. In behavioral science, that is a strong effect. It is not ambiguous. It is not marginal. Tempo literally entrains the nervous system to its pulse.

  - type: stat_callout
    number: "r = .40"
    label: "Meta-analytic effect size for tempo on motor behavior across eight studies"
    source: "Meta-analysis of retail music tempo studies"
    accent: teal

  - type: prose
    body: |
      The mechanism is neural entrainment. The body's internal rhythms (gait, respiration, even heart rate to a degree) synchronize to a dominant external pulse. This is why a 65 BPM ambient track produces slower walking than a 120 BPM pop track. The customer is not making a decision to walk slower. Their legs are following the beat.

      This means any retailer with a speaker and a playlist can slow their customers down. Drop the tempo below 75 BPM and people will browse longer. This is a real, measurable, free intervention. No technology required. No subscription. Just [slower music](../blog/science-of-tempo-retail.html).

  - type: subhead
    level: 2
    text: "Why Doesn't Slower Music Automatically Mean Higher Sales?"

  - type: prose
    body: |
      Here is where the story gets complicated. Slowing people down does not automatically make them spend more. A 2024 field study in restaurants found that tempo controlled dwell time with precision, exactly as the literature would predict. Customers stayed longer when the music was slower. But the effect on bill amount was zero. They sat there longer and spent the same.

  - type: stat_callout
    number: "140"
    label: "Retail stores in a 2025 experiment that found no overall sales effect from tempo alone"
    source: "Field experiment, 2025"
    accent: gold

  - type: prose
    body: |
      This is not a failure of the tempo research. The tempo research is solid. It is a failure of the assumption that dwell time and spending are the same variable. They are not. Tempo gives you the first one for free. The second one requires something else entirely.

  - type: subhead
    level: 2
    text: "What the Second Thing Is"

  - type: subhead
    level: 2
    text: "Identity, Not Just Atmosphere"

  - type: pullquote
    text: "The customer who stays longer but does not spend more is a customer whose body has been slowed but whose identity has not been addressed."
    accent: teal

  - type: prose
    body: |
      The music has the right tempo. It might have the wrong everything else: wrong production era for their age, wrong harmonic language for their taste, wrong cultural signals for their sense of who they are and what brands belong in their life.

      Tempo gets them to stay. The cultural fit of the music is what gets them to buy. Both are measurable. Both are specifiable. But only one of them is free, and it is the one that does not move the revenue line on its own. This is why [flow factors](../blog/what-are-flow-factors.html) matter -- the full stack of musical variables, not just tempo.

      Entuned builds both layers. The tempo and arousal controls that the research validates. And the cultural alignment that converts dwell time into purchase behavior. The first layer is necessary. The second is what makes it work.

