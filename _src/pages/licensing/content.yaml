# licensing — editable text content

h1_1: PRO-free, fully indemnified.
subline: The in-store music your competitors play is licensed. Entuned is not. Here is exactly what that means for your store, and what we cover if anyone questions it.

h2_1: What "indemnified" means here.
p_1: Every track Entuned plays in your store is original. That means no ASCAP, BMI, SESAC, or SoundExchange royalties, and no public performance license required to play it commercially. Every Entuned subscription includes a written indemnification certificate that states our music is original, commercial-use cleared, and that Entuned underwrites your store's use of it. If a performing rights organization questions what is playing in your store, you have documentation in hand.

h2_2: Why this matters.
p_2: Performing rights organizations visit retail stores and verify whether music in commercial use is licensed. They are entitled to do this under federal copyright law. The statutory damages for unlicensed commercial play of catalog music range from $750 to $30,000 per song per occurrence, with willful infringement raising the ceiling to $150,000. Most retailers do not know they are exposed because their current vendor handles the licensing inside the subscription, until they switch vendors, lapse on a fee, or play something outside the licensed catalog.

h2_3: What every other in-store music vendor carries.
p_3: Mood Media, Soundtrack Your Brand, Cloud Cover, and the rest of the catalog vendors license your store's music from PROs and pass the cost through your subscription. That license is real, and it is part of what you pay them for. If your store plays Spotify Premium or a personal streaming account through the speakers, the consumer license explicitly forbids commercial use, and the store is unlicensed. Either way, the music in your store sits inside an existing licensing system that someone is paying for or someone is exposed by.

h2_4: How Entuned is structured.
p_4: Entuned composes original music for your store. Original means nothing pulled from a catalog, nothing licensed from an artist, nothing requiring a royalty paid to a performing rights organization. The composer of every track Entuned plays is Entuned. We hold the underlying rights, and we grant your store a commercial use license as part of your subscription. There is no third-party rights holder in the chain.

h2_5: The legal backing.
p_5: Every Entuned subscription includes a written indemnification certificate. If a performing rights organization or other third party asserts that music played through Entuned in your store requires a license, Entuned defends the claim and covers any associated costs. This is documented in your subscription terms, not just stated in marketing. Multi-location operators on the Professional or Enterprise tier receive a bulk certificate covering the full fleet.

h2_6: Common questions.

q_1: A PRO inspector walked in and asked for documentation. What do I show them?
a_1: Your Entuned indemnification certificate. It identifies the music source as original Entuned compositions, confirms commercial-use clearance, and lists Entuned as the indemnifying party. The inspector has no further recourse.

q_2: Does the indemnification apply to every tier?
a_2: Yes. Entuned Free, Boost, Professional, and Enterprise all carry the same indemnification language. The certificate is issued at the start of the subscription and remains active as long as the subscription is active.

q_3: What about music my staff plays personally during off-hours?
a_3: Outside Entuned's coverage. Personal listening through Entuned hardware is not commercial play and is the staff member's own license question. Entuned indemnifies music played through the Entuned system during operating hours.

q_4: How is this different from "royalty-free" stock music libraries?
a_4: Stock libraries license tracks to many subscribers under specific use terms, and the rights holder is usually the original composer. If those terms are violated, exposure flows back to the subscriber. Entuned holds the rights to every track outright. There is no separate composer to litigate against and no usage terms that the customer can violate.

q_5: What if I add my own playlist alongside Entuned?
a_5: Anything outside the Entuned stream is outside Entuned's coverage. If you mix in Spotify, an external playlist, or a vendor catalog alongside Entuned, you are responsible for the licensing on the non-Entuned content.

h2_7: Get the certificate.
p_6: Indemnification documentation is included with every subscription. Single-location and multi-location businesses alike receive a written certificate at the start of service. Multi-location retailers on Professional or Enterprise tiers receive a bulk certificate covering all their locations.
