btn_1: Contact Us
p_1: What we collect, how we protect it, and why your data stays yours.
p_2: Entuned works with a small set of retailer data. Point-of-sale transaction records show us what customers purchased and when. Foot traffic and dwell time records show how people move through your space. Audio records document what was playing when each of those behaviors occurred.
p_3: We do not collect personal customer information. We do not use cameras or facial recognition. We do not track individual shoppers. The data we work with describes aggregate behavioral patterns, not individual people.
p_4: All retailer data is encrypted in transit and at rest. Access is restricted to authorized personnel on a need-to-know basis. We maintain strict access controls and audit logs for every data interaction.
p_5: Data retention follows your contract terms. We do not retain retailer data beyond what is necessary to deliver the service and fulfill our reporting obligations. When a contract ends, we return or delete your data at your direction.
p_6: Your data serves two purposes. First, it informs the audio produced for your stores. We use your behavioral data to refine what plays.
p_7: Second, anonymized and aggregated signals contribute to the broader research program. That aggregate contains no retailer-identifiable information. Individual retailer data is never shared with or exposed to other retailers. Retailers keep their competitive position intact.
p_8: Retailers own their data. This is not a qualified statement. Your transaction records, your traffic data, your behavioral measurements belong to you. Entuned uses this data to inform your audio and to contribute anonymized aggregate signal to the research program.
p_9: On contract termination, we return your data or delete it entirely, at your direction. No lock-in. No ambiguity about who owns what.
p_10: We are happy to discuss our data practices in detail. Transparency is the point.
