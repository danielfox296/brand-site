title: "You Hired a Lighting Designer. Why Not a Sound Designer?"
slug: "sound-designer"
eyebrow: "FIELD NOTES"
dek: "Lighting and sound operate on the same nervous-system mechanisms. The industry treats one as design and the other as a subscription."
