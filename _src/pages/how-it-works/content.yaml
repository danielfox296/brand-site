# How It Works — editable text content

hero:
  headline: "Three minutes from sign-up to music in your store."
  subline: "Pick an outcome. Stream from the speakers you already have. Add your customer profile when you're ready. Each tier adds specificity without changing the engine underneath."

step1:
  label: "Step 01 — Entuned Free"
  title: "Pick a starting outcome."
  text: "Two outcome modes — Linger or Lift Energy — built from the research on tempo, key, and density. Pick one, the music starts. No card required, no time limit. The Entuned Free catalogue covers the floor while you decide what comes next."

step2:
  label: "Step 02 — Any tier"
  title: "Stream from the speakers you already have."
  text: "Sonos, AirPlay, Bluetooth, line-in, hardwired — whatever audio system is already running in the store. No new hardware, no installer. The stream plays from a URL we hand you. Every track is original, commercial-use cleared, and PRO-indemnified the moment it plays."

step3:
  label: "Step 03 — Boost"
  title: "Add your customer profile."
  text: "When you upgrade to Boost, the music shifts from a general catalogue to original tracks built around your single Ideal Customer Profile. Tempo range, lyrical density, instrumentation, energy arc, cultural reference set — specified on purpose to fit the customer your store is built to serve. About 420 tracks in the first month, refreshed and culled regularly against what holds the floor."

step4:
  label: "Step 04 — Professional"
  title: "Connect your store data."
  text: "Professional integrates with your POS, reads sales and traffic data tied to specific environmental conditions, and refines the music against your store's outcomes as the dataset grows. Outcome Scheduling rotates outcomes by hour. Multiple ICPs cater to distinct customer types instead of homogenizing them. Self-improving refinement compounds over weeks of data, not days. The lift shows up in the report your CFO already runs."

# What changes per tier
tiers:
  eyebrow: "What Changes Per Tier"
  headline: "Same engine, deeper specificity."

card1:
  title: "Entuned Free"
  text: "General catalogue, two outcome modes, manual selection. Indefinite free access. The floor has music engineered for an outcome instead of whatever the vendor sent over."

card2:
  title: "Boost"
  text: "One ICP. Music built around your specific customer. All research-backed outcomes unlocked. Manual control. Sales-associate-friendly web interface. ICP edit as the business evolves."

card3:
  title: "Professional"
  text: "Multiple ICPs, distinct customer types catered to specifically. POS integration. Outcome Scheduling. Interstitial messaging — you write and approve store messages that play in rotation. Self-improving refinement against your store's data."

card4:
  title: "Enterprise"
  text: "Custom ICP design and brand voice consultation. Negotiated per-location pricing. Performance guarantees where lift can be cleanly measured. Dedicated success contact and white-glove rollout across your locations."

# Science underneath
science:
  headline: "The behavioral variable underneath."
  description: "Forty years of peer-reviewed work say in-store audio measurably affects customer behavior. Entuned engineers around that work — every parameter the research identifies as load-bearing is something we specify on purpose."

science1:
  stat: "+15–25%"
  label: "DWELL TIME"
  title: "Tempo affects pace through the store."
  desc: "Slower tempo holds shoppers in the room longer. Milliman's 1982 supermarket study found shoppers walked more slowly to slower music; sales rose with extended dwell."
  cite: "Milliman, R. E. (1982). Journal of Marketing."

science2:
  stat: "+8–12%"
  label: "WILLINGNESS TO PAY"
  title: "Music customers read as theirs moves how they value the product."
  desc: "Areni and Kim found classical music in a wine store raised the price tier customers selected. North, Hargreaves, and McKendrick replicated the effect across categories. The tag didn't change. The customer's read on the product did."
  cite: "Areni &amp; Kim (1993); North, Hargreaves &amp; McKendrick (1999)."

science3:
  stat: "−8%"
  label: "PERCEIVED DWELL"
  title: "Familiar songs make time feel shorter — and the visit shorter."
  desc: "Yalch and Spangenberg measured shoppers' perception of dwell against actual dwell. Familiar music compressed the perceived stay. The songs your customers already know are working against you."
  cite: "Yalch &amp; Spangenberg (2000). Journal of Business Research."

science4:
  stat: "1.9B"
  label: "WHAT THE INDUSTRY MEASURES"
  title: "Footsteps, heatmaps, dwell zones — but no one measures the audio."
  desc: "In-store analytics is a $1.9B industry that counts everything except the one variable a manager can change while a customer is still in the store. We are filling the gap the measurement industry never filled."
  cite: "Industry analyst data, 2024."

