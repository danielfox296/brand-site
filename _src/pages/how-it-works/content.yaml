# How It Works — editable text content
# Edit this file to change copy on the page without touching HTML.

hero:
  headline: "How It Works"
  subline: "What a pilot looks like, from first conversation to measurable store outcomes."

step1:
  label: "Step 01"
  title: "We talk about your stores."
  text: "A short intake call covers the basics. Who shops your stores. What you already measure. What you would want to see move. The conversation gives us enough to build audio that fits the room and the customer, and gives you a clear picture of what the pilot will and will not do."

step2:
  label: "Step 02"
  title: "Original music, made for your space."
  text: "We produce original music for your stores. No catalog. No licensing fees. No track repeats across a full operating day. The music is made for the people who walk into your stores, not for whatever audience a licensing catalog was originally built around."

step3:
  label: "Step 03"
  title: "Stream it from your existing hardware."
  text: "Connect to whatever speaker setup you already have. Bluetooth, AirPlay, or a hardwired system. No new hardware. No installation. The pilot runs alongside your current vendor if you prefer, or replaces them outright."

step4:
  label: "Step 04"
  title: "See what it does to your numbers."
  text: "The pilot runs long enough to produce data you can act on. You get a report at the end that looks at how the pilot stores moved on dwell time, conversion, and basket size against the baseline. If the numbers moved, we talk about what comes next. If they did not, you go back to what you had."

includes:
  eyebrow: "What Every Pilot Includes"
  headline: "Built into every pilot."

card1:
  title: "Intake and audio brief"
  text: "A short, structured conversation that captures what your stores need the audio to do. The output is a brief we work against, not a questionnaire that gets filed."

card2:
  title: "Original music"
  text: "Every track is original, made for your pilot stores. No licensed catalog. No performing-rights exposure. No repetition across a full operating day."

card3:
  title: "Pilot report"
  text: "At the end of the pilot, a report that looks at your dwell time, conversion, and basket size in the pilot stores against a baseline. You keep the data either way."

card4:
  title: "No lock-in"
  text: "You are not signing a two-year contract to see what the audio does. The pilot is a pilot. If it works, we talk about what comes next. If it does not, you keep the data."

card5:
  title: "Simple setup"
  text: "Works with any Bluetooth or AirPlay speaker system. No special hardware. Streaming starts the day you are ready."

pilot:
  headline: "Pilots are structured to produce an answer."
  description: "The pilot runs long enough that weather, staffing, and promotion noise average out. At the end, you have data specific to your stores showing whether the audio environment moved dwell time, basket size, or return visits. If the numbers move, we talk about what comes next. If they do not, you go back to what you had."

pilot1:
  title: "Baseline your current numbers."
  text: "Before anything changes, we look at the data you already have. Traffic, conversion, dwell, basket. That baseline is what the pilot numbers get compared against at the end."

pilot2:
  title: "Stream the pilot music."
  text: "The pilot stores run on the music we produce for them. Any speaker setup already in the store. No new hardware."

pilot3:
  title: "Measure the difference."
  text: "The pilot runs on a timeline long enough to separate signal from noise. You see what the audio did for the stores that ran it compared to stores that did not."

pilot4:
  title: "Decide what comes next."
  text: "If the pilot produced the kind of numbers that justify continuing, we talk about that. If it did not, nothing is locked in. The data is yours either way."

cta:
  headline: "See what the pilot looks like for your stores."
  subline: "A short conversation tells us whether the pilot is a fit and tells you what to expect from the process."
  button_text: "Ask About a Pilot Program"
