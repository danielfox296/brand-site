btn_1: Contact Us
p_1: Company background, founder information, and media resources.
p_2: "Entuned makes original music for multi-location lifestyle retailers. Each store gets its own soundtrack, composed for the customers who actually walk through the door. The premise is simple. Store operators measure traffic, conversion, dwell time, and basket size. They do not measure the music, even though decades of peer-reviewed research (Milliman, North, Hargreaves, and others) show that music changes all four. Entuned is the company that treats in-store audio as an operational variable rather than background. Patent pending."
p_3: Founder
p_4: "Daniel Fox is a musician, producer, and two-time founder. His previous ventures include an ecommerce custom apparel platform and an AI marketing services company. He started Entuned after three months working on the floor of a high-end retail store, where he watched customers respond to music in real time and then looked at the research."
p_5: "Daniel is available for interviews on retail audio, music and shopper behavior, and the economics of in-store experience. Reach out via the contact page for company information, founder commentary, or media resources."
