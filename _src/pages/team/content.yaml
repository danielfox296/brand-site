p_1: A small team building retail audio that can be measured.
p_2: Daniel bootstrapped Skreened to eight-figure annual revenue in six years. 180 employees, multiple production facilities, and dual recognition in 2013 as one of Ohio's fastest-growing and best places to work. After exiting, he spent years on the technical side of music, the question of why particular sounds produce particular responses in people. Entuned is where retail and music meet. Denver, CO.
