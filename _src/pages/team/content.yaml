card_subtitle_6: Data Scientist
p_8: Mrinmayi builds the data infrastructure. At Loxo, she designed distributed migration workflows processing 200K+ records per run at 99%+ integrity, connected seven external data sources, and shipped containerized pipelines on Kubernetes. Her work at Reliance Jio put her inside A/B testing at scale, where her pipelines contributed to an 18% retention lift. At Entuned, she owns the pipeline that connects in-store behavior to transaction data. B.S. Data Science, NJIT, 3.8 GPA. Dean's List. Merit Scholar.
p_7: We are building at the intersection of music, psychology, and retail operations. If that sounds like your kind of problem, say hello.
