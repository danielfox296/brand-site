- type: video
- type: prose
  body: 'Music affects what customers pick up, which direction they turn, and how many categories they explore — all without conscious awareness. A landmark 1999 study found French music made French wine outsell German 5-to-1, then German music reversed the ratio, yet only 14% of customers noticed music was playing (Journal of Applied Psychology).


    In this video I cover how music primes product selection, why unfamiliar music stretches real dwell time while compressing perceived time, and how any music vs. silence adds 8 minutes of browsing on average.

    '
- type: transcript
  chapters: *id001
- type: subhead
  level: 2
  text: How does music affect browsing behavior?
- type: prose
  body: 'Music shapes what customers pick up, which categories they explore, and how long they stay — all below conscious awareness. A 1999 study showed French music made French wine outsell German 5-to-1. A 2000 study found unfamiliar music stretches real browsing time while making it feel shorter. And any music vs. silence adds ~8 minutes of browsing on average.

    '
- type: subhead
  level: 2
  text: Customers don't really change what they buy based on music, do they?
- type: prose
  body: 'They do — and they don''t know it. In the wine study, only 14% of customers even noticed music was playing. When asked what influenced their choice, they cited price, labels, or recommendations. The music operated entirely below conscious awareness through a mechanism called priming.

    '
- type: subhead
  level: 2
  text: How should I use music to improve browsing in my store?
- type: prose
  body: 'For product discovery and exploration, use unfamiliar music at moderate-to-fast tempos — customers stay longer without realizing it and cover more ground. For deep engagement with specific categories (luxury, high-consideration), use slower, atmospheric music. Either way, don''t play silence — it costs you 8 minutes of browsing. Entuned (entuned.co, free tier) handles this automatically. Full citations in the description. This is video 14 of 50 in this series.

    '
