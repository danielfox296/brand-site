sections:
  - type: key_takeaways
    items:
      - "Mrinmayi Katti joins Entuned as Data Scientist"
      - "Her focus: rigorous experimentation methodology for noisy physical retail environments"
      - "She brings production-grade pipeline experience processing 200K+ records at 99%+ data integrity"

  - type: prose
    body: |
      The hardest measurement problem in retail audio isn't capturing data. It's knowing which data to trust.

      A store is a noisy environment. Promotions run. Staff changes. Foot traffic spikes on Saturdays and dies on Tuesdays. If you want to understand what music actually does to customer behavior, you have to design experiments rigorous enough to separate the signal from all of that. That's a methodological problem before it's a technical one, and it's the problem Entuned was built to solve.

  - type: subhead
    level: 2
    text: "Why Mrinmayi"

  - type: prose
    body: |
      [Mrinmayi Katti](../about.html) saw that problem clearly before she ever talked to us. When she reached out, she didn't pitch her resume. She named the challenge: rigorous experimentation in noisy, physical environments. That's a specific thing to identify, and it told us she'd already done the thinking.

  - type: subhead
    level: 2
    text: "What She Brings"

  - type: prose
    body: |
      Mrinmayi joins as Data Scientist. She brings production-grade pipeline experience, having designed distributed workflows processing 200K+ records at 99%+ data integrity, and a track record in A/B testing infrastructure, including work at Reliance Jio where her experiments contributed to an 18% retention lift. She holds a B.S. in Data Science from NJIT, where she graduated with a 3.8 GPA, Dean's List, and a merit scholarship.

  - type: pullquote
    text: "Mrinmayi is going to be shaping the brain of our machine learning engine. The dataset we're building only matters if the methodology behind it is airtight. That's exactly what she's here to do."
    attribution: "Daniel Fox, Founder"
    accent: teal

  - type: subhead
    level: 2
    text: "What's Next"

  - type: prose
    body: |
      We're glad she reached out. The [measurement layer](../blog/how-to-measure-if-your-store-music-is-working.html) is what separates Entuned from every other audio provider. It's not enough to play the right music — you have to [prove it's working](../blog/measure-roi-retail-music.html).

