title: "What Music Should a Supermarket Play? When It's Crowded, Speed Up"
slug: "what-music-should-a-supermarket-play"
eyebrow: "FIELD NOTES"
dek: "The famous rule says slow music makes shoppers linger and spend more. In a packed supermarket, the rule flips — and a study of 43,676 baskets shows exactly how."
