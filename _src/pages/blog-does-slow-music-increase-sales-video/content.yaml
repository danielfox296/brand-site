- type: video
- type: prose
  body: 'Slow music does not reliably increase sales on its own. The original 1982 study showed a 38% sales lift, but subsequent research found slow music only works when paired with a minor key — slow major-key music had zero effect (Marketing Letters, 2012). More dwell time without the right emotional state produces no extra revenue.


    In this video I trace the full research arc from the foundational 1982 grocery store experiment through restaurant studies and the critical discovery that musical mode — major vs. minor key — is what makes or breaks the slow-tempo effect.

    '
- type: transcript
  chapters: *id001
- type: subhead
  level: 2
  text: Does slow music increase sales?
- type: prose
  body: 'Sometimes, but not reliably. The classic 1982 study showed a 38% lift, but a 2012 study found slow tempo only lifts sales (~12%) when played in a minor key. Slow music in a major key — the typical bright, cheerful background — had zero effect. And a 1999 restaurant study found slow music increased dwell time by 15 minutes with no additional spending.

    '
- type: subhead
  level: 2
  text: So the original study was wrong?
- type: prose
  body: 'No — the 1982 result was real. But it was one study in one grocery store. Later research revealed the mechanism: slow music works through emotional depth, not just speed. A 1990 study found that emotionally complex (sad/minor) music generated stronger purchase intentions than happy music. Most stores playing "slow music" are playing the wrong kind.

    '
- type: subhead
  level: 2
  text: What kind of slow music should I play?
- type: prose
  body: 'Slow tempo paired with atmospheric, minor-key instrumentation — music with depth and a sense of contemplation. Skip the bright, cheerful slow songs. And match it to context: slow-minor works best for quiet periods with browsing customers. Entuned (entuned.co, free tier) composes for emotional signatures, not just tempo. Full citations in the description. This is video 12 of 50 in this series.

    '
