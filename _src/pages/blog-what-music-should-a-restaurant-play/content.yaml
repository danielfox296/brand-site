title: "What Music Should a Restaurant Play? It Changes How the Food Tastes"
slug: "what-music-should-a-restaurant-play"
eyebrow: "FIELD NOTES"
dek: "Sound is closer to an ingredient than a backdrop. The right music can make a dish taste sweeter than it is, nudge diners toward indulgence, and quietly pour an extra round."
