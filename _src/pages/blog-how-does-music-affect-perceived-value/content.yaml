- type: prose
  body: 'Music reframes how customers perceive the value of products — the right soundtrack makes inventory feel worth more, while the wrong one makes it feel cheap. A 1993 wine store study found classical music shifted customers toward significantly more expensive bottles without changing inventory or prices, and a 2006 study showed mismatched music actively damaged perceived value (Journal of Business Research).


    In this video I break down how environmental framing through music shifts value perception, why silence is not neutral, and how genre choice positions your brand''s price point in customers'' minds.

    '
- type: prose
  body: Two identical bottles of wine. Same vineyard, same vintage. One is sitting on a shelf with Top 40 playing overhead. The other is in a store with classical music. Which one feels more expensive? You already know the answer. And so does the research. I’m Daniel Fox. I build Entuned, and the relationship between music and perceived value is one of the most underused advantages in retail.
- type: subhead
  text: The Wine Store Experiment
- type: prose
  body: The foundational study here was published in Advances in Consumer Research in 1993. Researchers alternated between classical music and Top 40 in a wine store. Same inventory, same prices, same staff. When classical music was playing, customers selected more expensive wines. Not more wines — more expensive ones. The total number of bottles purchased stayed flat. The price point shifted up. Now, the study didn’t measure perceived value directly. But the behavior tells the story. Shoppers were reaching for higher-end bottles when the music signaled a higher-end environment. The music changed how they perceived the store — and by extension, what quality tier felt appropriate.
- type: subhead
  text: The Restaurant Confirmation
- type: prose
  body: 'A decade later, a study published in Environment and Behavior in 2003 tested this in restaurants. Three conditions: classical music, pop music, and no music. Classical: roughly 32 and a half pounds per head. Pop: 29 and a half. No music: 29 pounds 73. Pop music and silence produced almost identical spending. Classical added about 10 percent. But here’s the insight that matters: the researchers noted that it wasn’t that classical music made people order different menu items. It shifted their willingness to order premium options — the better wine, the nicer appetizer, the extra course. The music elevated the perceived occasion, and spending followed.'
- type: subhead
  text: Volume and Value
- type: prose
  body: There’s a subtler finding about perceived value that most people miss. A 2003 study published in Perceptual and Motor Skills tested volume in restaurants. Soft music — not a specific genre, just lower volume — increased the average check by about $3.05. That’s about a 15 percent lift. And genre didn’t significantly matter. It was the volume that did the work. Why? Because soft music signals quality. Think about the difference between a restaurant where you can barely hear each other and one where conversation flows easily. The quiet one feels more expensive. More refined. More worth spending money in. Volume is a value signal, and most stores have it set too high.
- type: subhead
  text: When Music Damages Value
- type: prose
  body: Now here’s the other side. A study published in the Journal of Business Research in 2006 showed that music doesn’t just build perceived value — it can actively destroy it. When the music doesn’t fit the brand, customers don’t just ignore it. They perceive the brand as less authentic, less coherent, less trustworthy. Perceived value drops. The researchers found that brand fit in music works like brand fit in any other element of the experience. If your store sells premium leather goods and the music sounds like a college dorm party, the music isn’t just neutral — it’s eroding the brand equity you’ve built through every other touchpoint. The products look cheaper because the soundscape is cheap. This is why “any music is better than silence” is only half true. Any decent music is better than silence. Bad-fit music might actually be worse.
- type: subhead
  text: The Entuned Angle
- type: prose
  body: 'At Entuned, this is one of the clearest value propositions we have. Generative music can be tuned to match a brand’s positioning — not by picking a playlist someone vibed to, but by actually parameterizing the music to match the perceptual tier the brand occupies. Tempo, mode, instrumentation, density — every dimension can be aligned to the price point and identity of the store. Because the research is unambiguous on this: music either elevates perceived value or undermines it. There’s no neutral.'
- type: subhead
  text: The Takeaway
- type: prose
  body: Music shapes perceived value through at least three channels. Genre creates quality associations — classical signals premium. Volume signals refinement — soft signals worth spending on. And brand fit either reinforces or contradicts the value proposition of everything else in the store. If your music is an afterthought, your perceived value has a leak you haven’t found yet.
- type: transcript
  chapters: *id001
- type: subhead
  level: 2
  text: How does music affect perceived value?
- type: prose
  body: 'Music reframes how customers perceive the worth of your products. A 1993 wine store study found classical music shifted customers toward more expensive bottles — same inventory, same prices. A 2003 restaurant study showed classical music drove spending to 32.52 pounds/head vs. significantly less for pop or silence. Music is an environmental frame that makes premium choices feel appropriate.

    '
- type: subhead
  level: 2
  text: Isn't this just tricking people into overspending?
- type: prose
  body: 'No — it''s context. A painting looks more valuable in a gallery than at a garage sale. The product is identical; the perceived value changes with context. Music creates environmental framing that aligns the shopping experience with the product''s actual quality. And mismatched music hurts: a 2006 study found music-brand misfit actively damaged product evaluations.

    '
- type: subhead
  level: 2
  text: What should I do about my store's music and value perception?
- type: prose
  body: 'Your music is a value signal whether you intend it or not. (1) Match genre to your price point — if you sell premium, music must signal premium. (2) Silence is not neutral — it performed the same as pop music, both well below classical. (3) Consistency matters — random playlists send a fuzzy brand signal. Entuned (entuned.co, free tier) generates music matched to your brand''s value proposition. Full citations in the description. This is video 17 of 50 in this series.

    '
