h1: Music licensing compliance for your retail tenants.
subline: Most small retailers play music from a personal Spotify account. Under federal copyright law, that's infringement carrying fines of $750 to $30,000 per song. When a performing rights organization enforces, your tenant's business is at risk. So is your lease.

eyebrow_1: The problem
h2_1: Your retail tenants are probably playing unlicensed music right now.
p_1a: "Under U.S. copyright law, playing copyrighted music in a commercial space requires a public performance license from organizations like ASCAP, BMI, and SESAC. Personal streaming accounts from Spotify, Apple Music, and Pandora explicitly prohibit commercial use in their terms of service. A personal subscription does not cover playing music through store speakers."
p_1b: "Performing rights organizations actively enforce against small businesses. In 2019, ASCAP sued a Denver bar for $27,000 after it let its music license lapse. A Connecticut restaurant paid $18,000 for playing nine unlicensed songs. A bar in St. Louis permanently closed after a BMI enforcement action. BMI alone sued more than 160 businesses in a single year."

eyebrow_2: Why it matters to you
h2_2: A tenant's licensing problem becomes your vacancy problem.
p_2a: "A $15,000 demand from a PRO can be existential for a single-store retail operator. If that tenant closes, you absorb the vacancy, the carrying costs, and the expense of re-leasing the space. None of that shows up in the PRO's enforcement math, but it shows up in yours."
p_2b: "The legal question of whether a commercial landlord can be held directly liable for a tenant's music copyright infringement is fact-specific and not fully settled. But the practical risk to your portfolio doesn't require a lawsuit against you to materialize. It only requires a tenant who can't absorb an unexpected five-figure expense."

eyebrow_3: What you can do
h2_3: Three steps that cost you nothing.
step_1_title: "1. Add music compliance to your tenant communications."
step_1_text: "A one-page reference in your tenant welcome packet or lease signing package covers the basics: what the law requires, what the fines look like, and what their options are. Most tenants don't know they're doing anything wrong. Telling them is the simplest form of risk mitigation."
step_2_title: "2. Consider a music compliance clause in your lease."
step_2_text: "Language requiring tenants to maintain proper public performance licenses and to indemnify the landlord for any claims arising from unlicensed use creates a paper trail. It establishes that you took affirmative steps and that the tenant was informed."
step_3_title: "3. Give your tenants a free, compliant option."
step_3_text: "Entuned Free provides fully licensed, original music to retail stores at no cost. Because every track is composed and owned by Entuned, there are no PRO fees, no licensing requirements, and no compliance risk. Your tenants can switch from their personal Spotify to Entuned Free in minutes."

