  - type: prose
    body: |
      *This is Part 2 of the Sound Check series, exploring the science and structure behind retail music.*

      There's a decent chance your store is breaking federal copyright law right now. Not in a dramatic way. In the way that feels like nothing. Someone logged into their personal Spotify account, connected it to the store speakers, and hit play.

      [Spotify's terms of service](https://www.spotify.com/us/legal/end-user-agreement/) are explicit: the platform is "only for personal, non-commercial use." Apple Music, Pandora, Amazon Music, same deal. Playing any of them in a commercial space violates the license agreement. But that's the minor problem.

      The larger issue is the U.S. Copyright Act. [Title 17, Section 106](https://www.law.cornell.edu/uscode/text/17/106) requires businesses to obtain public performance licenses from performing rights organizations before playing music in any commercial environment. A personal streaming subscription does not satisfy that requirement.

  - type: stat_callout
    number: "$150,000"
    label: "Maximum penalty per song for willful copyright infringement in a commercial space"
    source: "U.S. Copyright Act, 17 U.S.C. Section 504"
    accent: gold

  - type: prose
    body: |
      ASCAP has filed suit against individual bars and restaurants. In Chicago, two venues faced lawsuits seeking $150,000 in damages. Most retailers who stream personal accounts in-store aren't trying to steal anything. They just don't know. But "I didn't know" has never been a defense under copyright law.

  - type: subhead
    level: 2
    text: "The Employee DJ Problem"

  - type: prose
    body: |
      So the personal streaming account is off the table. The next instinct is usually to hand the music selection to someone on the floor. A manager, a shift lead, whoever seems to have decent taste.

      The problem is structural.

      [Yalch and Spangenberg published a study in the *Journal of Consumer Marketing* in 1990](https://scholar.google.com/scholar?q=Yalch+Spangenberg+effects+store+music+shopping+behavior+1990) that looked at how store music affects shopping behavior. The relationship between music and customer response depends on the match between the music and the customer demographic. Not the quality of the music. The match.

      Employees are almost never a demographic match for the ideal customer profile. They're typically younger. Their taste skews toward whatever is current in their own listening habits. When an employee picks the playlist, they're selecting music that makes an eight-hour shift more tolerable for themselves. That's a completely rational thing to do. It also has nothing to do with what a 44-year-old customer browsing for 20 minutes needs to hear.

  - type: pullquote
    text: "The person choosing the music is selecting for their own experience in a space that exists for someone else's experience."
    accent: teal

  - type: prose
    body: |
      This isn't about employees having bad taste. The bias is structural and consistent: the question they're answering is "what do I want to listen to?" The question that matters is "what should this room sound like for the person spending money in it?" Those are different questions with different answers.

  - type: subhead
    level: 2
    text: "The Familiarity Trap"

  - type: prose
    body: |
      The default assumption in retail music is that you should play songs people recognize. Familiar music. Hits. The logic seems obvious: people like songs they know, they'll feel good, they'll stay longer.

      [Yalch and Spangenberg tested this directly](https://scholar.google.com/scholar?q=Yalch+Spangenberg+music+retail+setting+real+perceived+shopping+times+2000). Their 2000 study, published in the *Journal of Business Research*, measured how familiar versus unfamiliar music affected actual shopping duration.

  - type: stat_callout
    number: "~8%"
    label: "Less time spent in store when shoppers heard familiar, recognizable music versus unfamiliar music"
    source: "Yalch & Spangenberg, Journal of Business Research, 2000"
    accent: teal

  - type: prose
    body: |
      The recognizable hits drove people out faster.

      The mechanism works like this. Familiar music increases arousal. Your brain recognizes the song, engages with it, processes it actively. That heightened arousal makes time feel like it's passing more slowly. You feel like you've been in the store longer than you have. So you leave.

      Unfamiliar music does something different. Because your brain isn't actively processing a song it knows, your subjective sense of time compresses. Time feels like it's moving faster. Shoppers perceive a shorter visit. But the clock says otherwise. They actually stay longer.

      This is a clean inversion of the common intuition. Playing "good songs people know" is probably costing you floor time with every customer who walks in.

  - type: subhead
    level: 2
    text: "The Calendar Problem"

  - type: prose
    body: |
      Set aside the legal question. Set aside who picks the music. Set aside whether the songs are familiar or not. There's a more fundamental problem with how most retail environments handle music.

      A playlist is a fixed object. Someone builds it on a Tuesday in April. It reflects the mood of that Tuesday, the energy of that week, whatever felt right at the time. Then it plays. In May. In August. On a rainy Wednesday when foot traffic is half of normal. During the holiday rush. During a slow Sunday morning when three people are in the store.

      The playlist doesn't know any of that. A static sequence of songs has no mechanism to respond to what's actually happening in the space where it's playing.

      The research on music and consumer behavior consistently shows that context determines effect. The same song at the same volume can produce different behavioral outcomes depending on time of day, customer density, and pace of movement. A playlist that works well at 11am on a Saturday might be wrong for 3pm on a Tuesday.

  - type: subhead
    level: 2
    text: "What This Means"

  - type: prose
    body: |
      Most retailers have settled on a music approach by default rather than by decision. Someone plugged in a phone. Someone made a playlist. It felt close enough to fine, so it stayed.

      The problem with "close enough to fine" is that you can't see what it costs you. You can't watch a customer leave eight minutes earlier than they would have. You can't measure the sale that didn't happen because the room felt slightly wrong in a way nobody could articulate. The losses are invisible, which makes them easy to ignore.

      The [licensing risk](../blog/retail-music-licensing-2026.html) is visible, if you look. The demographic mismatch between employee taste and customer need is measurable, if you measure it. The familiarity effect on [dwell time](../blog/retail-dwell-time.html) is documented, if you read the research. The static playlist problem is obvious, if you think about it for ten seconds.

      Four failure modes. All of them common. All of them running right now in stores that care deeply about every other aspect of their customer experience. [See how Entuned solves them](../how-it-works.html).

