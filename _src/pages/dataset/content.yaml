h1_1: The Evidence Base
h2_1: More details coming as pilots return results.
h2_2: Interested in the Research Program?
btn_1: Contact Us
p_1: A growing body of evidence about how retail audio moves retail outcomes.
p_2: Pilots produce measurements that the commercial category has never collected. What happens in a real store. Which customers linger. Which transactions close. What was playing when it all happened.
p_3: As pilot partners complete their data collection windows, this page will describe what the research has found. The methodology follows peer-reviewed work on music and consumer behavior going back to Milliman 1982. The rigor is the product.
p_4: Until the evidence base reaches a scale worth describing publicly, the details stay internal. Retailers who run a pilot get their own results either way.
p_5: If you are an investor or a retail operator interested in the research program, reach out.
