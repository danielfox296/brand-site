  text: How much should I spend on music for my store?
- type: prose
  body: 'Retail music services range from $15-100/month per location. But the better question is ROI. Even a conservative 5% sales lift on $500K annual revenue produces $25,000 in additional revenue against a ~$600-1,200 annual cost. The research supports lifts of 12-38% when music parameters are properly optimized.

    '
- type: subhead
  level: 2
  text: Can't I just play Spotify? It's basically free.
- type: prose
  body: 'Spotify and Apple Music are not licensed for commercial use — playing them in a store violates terms of service and exposes you to fines from performance rights organizations. Beyond the legal risk, a 2025 study across 140 stores found no measurable sales effect from generic, unadapted music. You need a system that adapts to conditions, not just a playlist.

    '
- type: subhead
  level: 2
  text: What's the most cost-effective approach?
- type: prose
  body: 'Don''t compare music costs to each other — compare them to the revenue opportunity. Prioritize adaptability and measurement over catalog size. Run a free trial (Entuned offers one at entuned.co), measure the results against your baseline for a few weeks, and let the data make the budget decision for you. Full citations in the description. This is video 35 of 50 in this series.

    '
