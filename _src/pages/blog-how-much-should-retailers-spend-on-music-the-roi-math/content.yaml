- type: prose
  body: 'Retail music services cost $15-100/month per location, but the real question is ROI, not cost. A conservative 5% sales lift on $500K in annual revenue produces $25,000 in additional revenue — against a $600-1,200 annual music cost, that''s a 20-to-1 return. The research supports lifts of 12-38% when music is properly optimized.


    In this video I break down the actual cost landscape for retail music (from consumer streaming to custom scoring), run the ROI math against peer-reviewed findings, explain where most retailers waste money on music, and give you a framework for thinking about your budget.

    '
- type: prose
  body: 'Retailers ask me this all the time: “What should I budget for music?” And my honest answer is — you’re asking the wrong question. The right question is: what’s the cost of getting it wrong? Because the research puts a number on that, and it’s way bigger than any subscription fee.'
- type: subhead
  text: The Cost of Silence
- type: prose
  body: 'Let’s start with the baseline. What happens when you play nothing? A study published in the Journal of Retailing and Consumer Services in 2012, with 550 participants, found that any music — compared to silence — added roughly 8 minutes of dwell time. Eight minutes. In retail, dwell time correlates directly with spending. If your average transaction is $40 and music keeps a customer browsing long enough to add one more item, that’s real revenue. And a study in Environment and Behavior from 2003 found that classical music in a restaurant drove average spend to about £32 per head — while pop music performed roughly the same as silence. The gap between the right music and no music is enormous. So step one: silence is not free. Silence has a cost, and it’s measured in lost dwell time and lower tickets.'
- type: subhead
  text: The Cost of Wrong Music
- type: prose
  body: Worse than silence? The wrong music. Research in the Journal of Business Research from 2006 showed that music-brand misfit didn’t just fail to generate lift — it actively damaged brand perception. Customers noticed the disconnect and it lowered their opinion of the store. That’s not a neutral outcome. That’s negative ROI on your music spend. And a 1966 study from the Journal of Applied Psychology demonstrated that cranking volume too high pushed customers out the door faster without increasing how much they bought. Same sales, fewer minutes in the store, worse experience. You paid for that music, and it worked against you. So the cost of wrong music isn’t just the subscription — it’s the damage it does while playing.
- type: subhead
  text: What the Right Music Is Worth
- type: prose
  body: Now let’s look at the upside. The original supermarket tempo study from the Journal of Marketing in 1982 found a 38 percent increase in daily gross sales just from slowing the tempo. The restaurant study in Journal of Consumer Research a few years later showed 11 extra minutes and three additional drinks per table. A study in Perceptual and Motor Skills from 2003 found that soft background music added about $3.05 per check in a restaurant. Genre didn’t even matter — just keeping it soft. Run the math on your own numbers. If music adds even 5 percent to your average ticket across hundreds of transactions per week, what’s that worth annually? For most retailers, it’s thousands. For multi-location operators, tens of thousands. The music subscription is almost certainly the cheapest line item generating the highest percentage lift in your entire operating budget.
- type: subhead
  text: How to Think About Pricing
- type: prose
  body: Here’s how I’d frame the budget decision. There are really three cost tiers in the market. The low end — $15 to $30 a month — usually gets you a basic commercial license and pre-built playlists. Better than silence, but no adaptation, no brand customization, and you’re playing the same catalog as everyone else. The mid tier — $30 to $100 a month — adds scheduling, some curation, and maybe genre filtering. Better, but still static. The upper tier — $100-plus — is where you start seeing adaptive systems, brand-specific sound design, analytics, and generative music. This is where the ROI research actually starts to apply, because these are the tools that can control for the variables the studies identify. At Entuned, we built a free tier because we believe the product should prove its value before you pay. If you can hear the difference in your store — and your data confirms it — the investment case makes itself. We didn’t want the pricing conversation to happen before the experience.
