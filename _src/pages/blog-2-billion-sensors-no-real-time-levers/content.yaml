sections:
  - type: key_takeaways
    items:
      - "The $1.8B in-store analytics market has mature measurement but almost no real-time intervention tools"
      - "Every available store response — remerchandising, retraining, relighting — takes days to weeks"
      - "Audio is the only environmental variable that changes instantly, costs nothing per adjustment, and reaches every person in the space"
      - "Analytics platforms will eventually acquire the action layer that makes their data more valuable — audio is that layer"

  - type: prose
    body: |
      The global in-store analytics market is valued at roughly $1.8 billion and growing toward $2.8 billion by 2033. The companies in this space — [RetailNext](https://retailnext.net/), Sensormatic (Johnson Controls), Standard AI, V-Count, Kepler Analytics, and their competitors — have deployed millions of sensors across hundreds of thousands of retail locations worldwide. The measurement layer is mature. The data is clean. The dashboards are dense with signal.

      The question that has not been adequately answered is: what does the retailer do with the signal?

  - type: stat_callout
    number: "$1.8B"
    label: "Global in-store analytics market value, growing toward $2.8B by 2033"
    source: "Industry estimates, 2026"
    accent: gold

  - type: subhead
    level: 2
    text: "The Intervention Toolkit"

  - type: prose
    body: |
      A VP of Store Operations opens the analytics dashboard and sees that dwell time in the east wall zone dropped 14% last week. Conversion is flat. Traffic is up slightly. The data is clear. The question it raises is obvious: what do you change?

      The available responses are all slow. Remerchandise the fixture: two to six weeks to plan, source, and execute. Retrain the floor staff on engagement in that zone: days, plus the opportunity cost of pulling them from other tasks. Adjust the lighting: a capital expense, assuming the store even has zone-level lighting control. Test a new layout: six weeks minimum to run, compare, and draw conclusions.

      Every intervention available to a store operator today requires either a capital expense, a labor reallocation, or a merchandise cycle. None of them respond to what the data is showing while it is still showing it. By the time the remerchandised fixture is in place, the behavioral pattern that triggered the change may have shifted for entirely different reasons.

  - type: subhead
    level: 2
    text: "The Variable Nobody Is Touching"

  - type: prose
    body: |
      There is one environmental variable in a retail store that changes the moment you change it. It costs nothing per adjustment. It requires no labor to deploy. It reaches every person in the space simultaneously. It has documented effects on walking speed, [dwell time](../blog/the-dwell-time-variable-nobodys-tracking.html), emotional state, [perceived price point](../blog/luxury-priming-is-real-and-you-dont-have-to-be-a-luxury-brand-to-use-it.html), and purchase behavior, supported by decades of research in environmental psychology.

      It is the sound. And in most retail environments, the sound is controlled by a playlist someone chose based on personal taste or a licensed feed from a provider whose product is songs, not outcomes.

  - type: pullquote
    text: "The infrastructure to respond to what is happening in real time barely exists. Audio is the first real-time response surface, and nobody in the analytics ecosystem has built the connection."
    accent: teal

  - type: subhead
    level: 2
    text: "Why This Gap Persists"

  - type: prose
    body: |
      The measurement platforms did not build audio intervention because they are sensor companies. Their expertise is in capturing and analyzing data, not in generating music. The music providers did not build the measurement connection because they are catalog companies. Their expertise is in licensing and curating songs, not in correlating musical variables with commercial outcomes. Each side of the gap has a clear reason for not crossing it, and the result is that the gap persists.

      The retailer sits in the middle, paying for analytics that tell them what happened and paying for music that is unrelated to what happened. Two vendor relationships, one physical space, zero data connection.

  - type: subhead
    level: 2
    text: "What a Real-Time Lever Looks Like"

  - type: prose
    body: |
      Music that is specified at the variable level — every track has a known [tempo](../blog/science-of-tempo-retail.html), key, production era, harmonic profile, groove feel, dynamic range — and correlated with the behavioral data the analytics platform is already producing. Traffic surges, the tempo shifts. Dwell drops in a zone, the production character adjusts. A particular sonic profile correlates with higher conversion during afternoon hours, and the system leans into that profile during those hours without anyone telling it to.

      That is an intervention that responds in real time, costs nothing per adjustment, and generates data with every cycle that makes the next cycle more precise. The store measures behavior, the audio responds, the store measures again. The $1.8 billion sensor infrastructure finally has something to drive.

  - type: stat_callout
    number: "$2.8B"
    label: "Projected in-store analytics market value by 2033"
    source: "Industry estimates, 2026"
    accent: gold

  - type: subhead
    level: 2
    text: "Who Builds This"

  - type: prose
    body: |
      The analytics platforms will eventually need this capability. Their acquisition histories tell the story: RetailNext bought Pikato to add a triggered action layer. Standard AI bought Pathr.ai to add spatial intelligence. The pattern is consistent. The platform that owns the measurement data acquires capabilities that make the data more actionable.

      Audio is the next surface. The company that builds the connective layer between musical variables and commercial outcomes, and deploys it across enough stores to prove the correlations, is building the capability that [the analytics platforms will need to add](../blog/next-retail-tech-acquisition.html). The measurement industry is mature. The intervention industry is the next market. And audio is the first real-time intervention surface with forty years of research behind it.

      [Entuned](../how-it-works.html) is building that layer. We generate music to specification, deploy it in stores, and correlate it with what the sensors already measure. The $2 billion in sensors gets a lever.

