btn_1: Ask About a Pilot Program
p_1: A customer walks into your living room section on a Saturday afternoon. They pick up a throw pillow, put it down, drift toward the lamps, circle back. Somewhere in that five minutes they decide whether to buy. The music playing behind that decision was picked two years ago by someone who does not work for you anymore.
p_2: Home goods is a slow-decision category. Customers compare options, imagine rooms, walk away and come back. The music is the one element of your store environment nobody on your team is measuring, and Knoferle et al. (2011) showed that the right choice and the wrong choice produce different sales numbers in the same store, same product, same week. Entuned measures what happens to customer behavior when the music actually fits the customer in front of it.
p_3: How long customers spend in each department. In home goods, the customer who lingers in the living room section buys from it. Milliman (1982) established that slower music increases shopping duration, and Smith and Curnow (1966) showed that tempo directly affects time spent in store. The public research points toward meaningful dwell time gains in considered-purchase areas.
p_4: Whether customers who came for one category discover another. North, Hargreaves, and McKendrick (1999) showed that French music tripled French wine sales and German music doubled German wine sales on the same shelf. In home goods, that principle maps to lifestyle congruence. Music that matches the modern Scandinavian furniture primes the customer to look at the Scandinavian-influenced textiles two aisles over.
p_5: Whether customers trade up. Areni and Kim (1993) found that classical music shifted customers toward higher-priced wine by changing quality perception, not by changing the wine. Your $400 option and your $200 option sit in the same environmental signal. Audio is one of the loudest pieces of that signal, whether anyone on your team is thinking about it or not.
p_6: How many product interactions happen before the register. Deeper browsing means bigger baskets. Your staff work long shifts in large stores, and a short catalog loop means they hear the same songs dozens of times a month. That fatigue shapes how they show up on the floor, and customers pick up on it.
p_7: The research on music and consumer behavior in considered-purchase retail is decades old and consistent. Generic catalog music treats every shopper the same. Original music built for your specific customer does not.
p_8: Every track is original and license-free. No ASCAP exposure, no risk of a song's lyrics cutting against your brand, no playlist curator somewhere else deciding what your customers hear.
p_9: We work with retail analytics platforms like RetailNext where you already have them. When music changes and dwell time changes in the same store the same week, you have a measurement connected to a decision, not a guess.
p_10: We learn your customer and your store. Who the store is for, what the brand stands for, what the floor is trying to do. You share any existing analytics access and a floor plan if you have one.
p_11: First soundtrack built and shared for your team to review. You give notes. We refine before anything goes live in a store.
p_12: Go live. Streaming via Bluetooth or AirPlay to your existing speaker hardware. Measurement through POS and analytics begins the day the music starts.
p_13: Fresh music on a monthly cadence informed by what the numbers did the month before. Seasonal adjustments as traffic and product mix shift. Reporting on your schedule.
p_14: What we need from you
p_15: POS access for measurement. A floor plan if you have one. RetailNext or equivalent analytics access if available. Any brand guidelines or audio direction you want us to work inside.
p_16: Walk the floor of your best store this week and write down every song that plays for twenty minutes. Read the lyrics. Ask whether this is the soundtrack you would choose for the customer you are trying to reach. If the answer is no, we should talk.
