h2_6: Is Retail Audio Worth the Investment?
p_1: Your VP of Store Experience came in asking for budget. They'd been reading about psychographic targeting, or they walked into a competitor's store and noticed something they couldn't quite name but could feel, or somebody pitched them a demo and now they want money for music.
p_2: And you're looking at a line item that didn't exist last year, wondering what the return looks like.
p_3: That's a reasonable question. The answer is surprisingly clean once you lay out the variables.
p_4: Retail audio moves four things in your reporting. All of them are things you already track.
p_5: <strong>Dwell time.</strong> How long a customer stays in the store. This is the most sensitive variable and the easiest to measure. Slower tempo music in the 60 to 80 BPM range, matched to a customer's psychology, extends the average visit. The research puts the lift somewhere between 15 and 25 percent. A customer who stays twelve minutes instead of ten is a customer who touches more product, asks more questions, and gets further through the purchase decision.
p_6: <strong>Basket size.</strong> Dwell time and basket size run together closely enough that most retail analytics teams already track them as a pair. A customer who lingers in a section doesn't just look at one more thing. They reconsider what they came in for. They add. Customers who stay longer spend more, at roughly the same rate the dwell time went up.
p_7: <strong>Willingness to pay.</strong> This is the one most CFOs haven't seen yet. When music matches a customer's identity and values, their read on the product changes. <a href="https://scholar.google.com/scholar?q=areni+kim+1993+wine+store+music" target="_blank" rel="noopener">Areni and Kim</a> published the foundational study in 1993. <a href="https://scholar.google.com/scholar?q=north+hargreaves+mckendrick+1999+wine+music" target="_blank" rel="noopener">North, Hargreaves, and McKendrick</a> replicated it in 1999. The finding holds across both. <span class="highlight">Customers in an environment with identity-congruent music pay 8 to 12 percent more for the same product.</span> The price on the tag didn't change. The customer's read on what it was worth did.
p_8: <strong>Return visits.</strong> Harder to isolate, but the mechanism is direct. A store that feels like it was built for a specific person makes that person want to come back. The audio environment is part of that signal. When it's right, the store earns a kind of loyalty that has nothing to do with a rewards program.
p_9: Take your actual numbers. Not aspirational ones. Trailing twelve months from your P&amp;L and your store analytics.
p_10: Say you run 10 locations. Average transaction value is $250. Each store sees 2,000 transactions a month. That's $5 million in monthly revenue across the portfolio.
p_11: <span class="highlight">A 5 percent lift in willingness to pay on the same traffic, same conversion, same product mix. $250,000 per month. Three million a year.</span> And 5 percent is the conservative end of the range.
p_12: Now look at what the audio currently costs. Generic licensing from a catalog provider runs $15 to $50 per location per month. You pay that for music that could play in any store in your category. During the Entuned founding pilot, the cost is zero.
p_13: <span class="highlight">Even a 1 percent lift against that baseline is $50,000 per month across the portfolio.</span> Against a free pilot, the ratio isn't meaningful to calculate.
p_14: Most capital allocation decisions in retail don't produce those ratios. Visual merchandising, lighting retrofits, new POS hardware, loyalty program software. Each of them justified. Each of them useful. None of them are free to test.
p_15: The reason your company hasn't spent real money on retail audio strategy is that until recently, there was nothing to buy that warranted it.
p_16: Mood Media and Soundtrack Your Brand are the incumbents. They sell access to a catalog of licensed music, organized by mood or genre. Someone on the retail team picks a playlist. The playlist runs until someone remembers to change it.
p_17: The first problem with that model is that it doesn't solve the actual problem. A playlist organized by mood is a different thing from a playlist organized by your customer's psychology. "Upbeat" is a mood. It's not a customer profile. "Indie rock" is a genre. It's not a psychographic strategy. The catalog treats audio as atmosphere. The research treats it as a behavioral variable.
p_18: The second problem is licensing at scale. Music fees are per-location, and they come with ASCAP, BMI, and SESAC compliance attached. For a 50-location chain, licensing alone can run $50,000 to $200,000 per year before the curation service fee. You pay all of that for music that had nothing to do with your customer in the first place.
p_19: Entuned generates original music. Every track is built for a specific retailer's customer profile. No licensing fees. No per-stream costs. No PRO compliance. The retailer owns the music. That changes the cost structure, and it changes what you can do with audio in your stores.
p_20: If you're the financial decision-maker being asked to approve this spend, the reasonable move is to test it before committing.
p_21: That's what the founding pilot is for. Matched treatment and control locations, running long enough to produce clean data.
p_22: At the end, you have actual numbers. Your data, from your stores, with your customers. Dwell time comparison. Transaction value comparison. Traffic patterns. Whatever you already measure, measured against a single variable change.
p_23: The pilot costs nothing. The music streams free for the full duration. If the numbers don't move, you walk away. If they do, you have the cleanest ROI case you've ever presented to your board, because you're not projecting from somebody else's study. You're reporting from your own stores.
p_24: For the finance team that needs to model this properly, here's what the retail audio ROI numbers look like in a standard investment analysis.
p_25: During the founding pilot, there is no cost. Zero. Entuned replaces your existing streaming spend and runs for the full pilot duration at no charge.
p_26: The return model is straightforward. If the pilot shows a 3 percent lift in average transaction value, calculate the incremental revenue per location per month and multiply across the portfolio. Post-pilot terms get discussed only after you've seen the data.
p_27: At 3 percent lift on a $250 average transaction value with 2,000 monthly transactions per location, a single store generates <span class="highlight">$15,000 in incremental monthly revenue</span>. During the pilot, that's pure upside at zero cost.
p_28: At 5 percent, it's $25,000 per location.
p_29: At 8 percent, it's $40,000.
p_30: These numbers come straight out of your own P&amp;L. Arithmetic applied to research that's been replicated for thirty years. The pilot confirms which number is yours.
p_31: When a CFO pushes back on a new line item for audio, the question under the question is whether this is real. Whether somebody on the retail team got excited about a vendor demo and is now trying to justify an expense that will produce nothing measurable.
p_32: That's a fair concern. The answer is in the data. Run the pilot. Measure it the same way you measure every other store-level initiative. If the lift is there, the case writes itself. If it isn't, you've lost nothing but background music you were going to play anyway.
p_33: The stores that have already done this stopped treating audio as a utility bill. They started tracking it the way they track the lighting spec or the store layout. The difference between those two categories is the difference between a $50 monthly subscription and a quarter million dollars in annual incremental revenue.
p_34: <span class="highlight">Your current music has a cost. Nobody has measured it.</span>
