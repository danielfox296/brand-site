p_1: Every retail store plays music. Almost no one measures it. We are building the company that does.
p_2: Forty years of peer-reviewed research shows that music moves the variables retailers care about. Dwell time. Willingness to pay. Conversion. Basket size. The findings are consistent and well-replicated. The companies selling music to retail have largely ignored them.
p_3: The academic literature is clear on direction. Milliman showed tempo changes pace. Areni and Kim showed genre changes spend. North and Hargreaves mapped style to choice. No commercial operator has built on top of that work in any rigorous way. The in-store audio category still sells catalogs and dayparting.
p_4: Entuned is a retail performance company. The audio is the surface. The outcomes are the product. Longer dwell time. Bigger baskets. Stronger brand perception.
p_5: A small category we displace. A much larger one we ride on top of. The opportunity is the intersection, not either market alone.
p_6: Entuned replaces the commercial background music line item on a retailer's P&L. That category is growing steadily through 2030. The real story is that we sit on top of the in-store analytics category, which is expanding as retailers instrument their stores with RetailNext, ShopperTrak, and similar sensor platforms. Those stores already collect behavioral data. Very little of it changes anything on the sales floor.
p_7: The streaming giants have the music. The sensor companies have the data. Almost nobody has connected them. Even a small reliable lift applied across retail audio is a very large number.
p_8: Entuned produces original music at a level of specificity catalog providers cannot match, then deploys it through an adaptive player in retail environments. The retail chain sees conversion rate and dwell time in their existing analytics stack. Daniel sees a measurement surface nobody has had before.
p_9: Daniel is a working music producer and multi-instrumentalist. The product reflects that background without advertising it. Retail operators do not need a lecture on music theory. They need their numbers to move.
p_10: Generative AI music hit production quality in 2024. Retail analytics platforms opened behavioral data over API. Those two things happening in the same year is what makes this company possible in 2026 and not five years ago.
p_11: <strong>A provisional patent was filed in April 2026.</strong> Methodology beyond the patent is held as trade secret. The category has consolidated around music delivery. Nobody is competing on retail outcomes.
p_12: Mood Media and Soundtrack Your Brand sell catalogs. RetailNext sells measurement. QSIC sells programmed playlists to QSR. None of them connect a sound decision to a sales outcome. Our position sits between them and depends on neither.
p_13: This company sits at the intersection of music theory, retail behavior, and applied machine learning. That intersection requires a founder who understands music structurally, has operated retail firsthand, and has shipped generative AI products before. Daniel Fox is all three.
p_14: "He bootstrapped Skreened, an award-winning online custom apparel platform, to 180 employees and thousands of monthly active users. He later built Deep Avatar, a generative AI marketing platform that produced original content calibrated to specific audiences. His background as a music producer gives him a working model of how music drives behavior."
p_15: Music theory. Retail operations. Generative AI. Entuned sits at the intersection. So does the founder. See the full <a href="about.html" style="color: #50929c;">team</a>.
p_16: <strong>Pre-seed round open on a YC post-money SAFE. Eighteen months of runway.</strong>
p_17: "The raise funds the first pilot cohort and the production infrastructure that supports it. The window is long enough to run real studies in real stores and short enough to force discipline. At the end of the window, we either have evidence that retail audio moves the numbers, or we have a clean answer that it does not in the conditions we tested."
p_18: Either outcome is worth the raise. The positive case opens Series A on real data. The null case saves five years of category misallocation for every operator and investor watching.
