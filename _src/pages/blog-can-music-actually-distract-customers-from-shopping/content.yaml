  text: Can music distract customers from shopping?
- type: prose
  body: 'Yes. Music with catchy hooks and familiar melodies creates cognitive absorption — the brain locks onto the music and allocates resources to processing it instead of evaluating products. Research shows customers who hear recognizable songs stay shorter but perceive their visit as longer. The music is creating a false sense of "I''ve been here long enough."

    '
- type: subhead
  level: 2
  text: Isn't some distraction good — like creating a fun vibe?
- type: prose
  body: 'There''s a key difference between shaping mood (unconscious, helpful) and capturing attention (conscious, harmful). Mood influence works precisely because customers aren''t aware of it. The moment music demands conscious attention — through familiarity, volume, or emotional mismatch — it starts competing with the shopping experience instead of supporting it.

    '
