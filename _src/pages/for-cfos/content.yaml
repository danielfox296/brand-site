btn_1: See the Numbers for Your Stores
p_1: Your stores play music every hour they are open. Ask your current provider one question. What did the music contribute to revenue this quarter. If they cannot answer, you are paying for an uncontrolled variable on your P&L.
p_2: The public research is direct on this. Areni and Kim (1993) and North, Hargreaves, and McKendrick (1999) measured willingness-to-pay lift when music fit the customer and the category. Andersson et al. (2012) watched 601 real transactions and found the opposite condition, music that clashed with the store, actively reduced what customers spent. Your current audio is probably not neutral. Neutral is not the baseline. Neutral is the outcome you would get if nobody was playing anything at all, and that is not what is happening in your stores.
p_3: Run the math against your own portfolio. Your average ticket, your transactions per store per month, the number of active locations you operate. Apply a conservative lift assumption from the public research. Then apply a more aggressive one. The spread between the two is what the audio layer is worth on your P&L today, whether anyone in the building is measuring it or not.
p_4: Mood Media and similar catalog providers charge multi-year contracts, with termination penalties, no measurement, and no targeting beyond genre tags. Entuned builds original music for your specific customer and measures the result against your existing POS and analytics. One question eliminates most incumbents. What did the music contribute to revenue this quarter.
p_5: The founding pilot starts small and validates against your own store data. Same product mix, same promotional calendar, same time window, measured through the POS and analytics infrastructure you already pay for.
p_6: If the numbers do not move, you walk away with the data. No financial risk. No contractual obligation.
p_7: We will walk through the ROI arithmetic against your own store portfolio, your transaction volume, and your average ticket. No deck. Just numbers.

