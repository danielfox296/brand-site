btn_1: "Start a measured pilot"
p_1: "Your stores play music every hour they are open. Ask your current vendor one question. What did the music contribute to store performance this quarter. If they cannot answer, you are paying for an unmeasured environmental variable that is affecting the line items you are measured on."
p_2: "The public research is direct on this. Areni and Kim (1993) found that when the music fit the setting, shoppers reached for higher-priced items — not more of them, pricier ones. North, Hargreaves, and McKendrick (1999) found that matching the music to a product shifted what people actually bought toward it. North, Shilcock and Hargreaves (2003) found prestige-fit music lifted spend per head. The throughline is that audio is a live variable in your stores, not a neutral one. Neutral is the outcome you would get if nobody was playing anything at all — and that is not what is happening on your floor."
math_explainer: "Every input is a number your reporting already holds. The only figure you supply is the lift assumption — and the free pilot exists to measure that against your stores instead of asking you to take it on faith."
math_example: "Say a location runs a $45 average ticket and 6,000 transactions a month — $270,000 in monthly revenue. A 1% lift is $2,700 a month; a 3% lift is $8,100. Across ten locations that spread is $27,000 to $81,000 a month, against an audio line item that does not move with it. These numbers are placeholders for the formula, not a forecast — the pilot replaces the lift assumption with a measured one."
p_3: "Run the math against your own portfolio. Your average ticket, your transactions per location per month, the number of active locations you operate. Apply a conservative lift assumption, then a more aggressive one. The spread between the two is what the audio layer is worth on your P&L today, whether anyone in the building is measuring it or not — and the pilot is how you replace the assumption with your own number."
p_4: "Mood Media and similar catalogue providers charge multi-year contracts, with termination penalties, no measurement, and no customer fit beyond genre tags. Entuned engineers original music for your specific customer and measures the result against your existing reporting infrastructure. One question eliminates most incumbents. What did the music contribute to store performance this quarter."
p_5: "The pilot is a structured experiment — typically 12 weeks across matched test and control stores. Same product mix, same promotional calendar, same time window, measured through the reporting infrastructure your operators already use. The pilot itself is free."
p_6: "If the numbers do not move against the metrics you set, you walk away with the data and the relationship ends cleanly. Pricing for the wider rollout is settled after the pilot, per location, structured around the deployment shape — number of stores, number of ICPs, integration depth, performance terms."
p_7: "We will walk through the ROI arithmetic against your own store portfolio, your transaction volume, and your average ticket. No deck. Just numbers."

