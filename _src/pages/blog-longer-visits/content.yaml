sections:
  - type: key_takeaways
    items:
      - "Customers who stay longer do not automatically spend more. Multiple field studies confirm the gap."
      - "Slow tempo keeps people in the store. Whether they buy depends on something else entirely."
      - "Most multi-location retailers track dwell time without tracking what converts that time into revenue."
