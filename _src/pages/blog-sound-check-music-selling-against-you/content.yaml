  - type: prose
    body: |
      *This is Part 1 of the Sound Check series, exploring the science and structure behind retail music.*

      I was standing in a retail store last month, the kind of place that sells $200 candles and wants you to feel good about it. The playlist was running through a CloudCover channel. And the song playing, loud enough to hear every word, was a track whose chorus repeats the word "mistake" — belted, impossible to ignore. Customers were browsing shelves, picking things up, putting them back. Deciding. And the room was telling them, over and over, that something here was a mistake.

      Nobody in that store chose the song. Nobody approved it. It was just on. Which is the problem.

  - type: subhead
    level: 2
    text: "What the Research Actually Says"

  - type: prose
    body: |
      There's a well-documented phenomenon in consumer psychology called semantic priming. The short version: when you hear a word or concept, related ideas become temporarily more accessible in your memory. You don't have to notice it happening. You almost certainly won't. But it shifts what you think about next, and how you evaluate what's in front of you.

      Adrian North and his colleagues published a study in the [*Journal of Retailing*](https://scholar.google.com/scholar?q=North+Sheridan+Areni+Music+Congruity+Effects+Product+Memory+Perception+Choice+2016) in 2016 that laid this out clearly. Background music primes related concepts in memory, and those concepts influence how people perceive products and make choices. The priming wasn't subtle in its effect. It was subtle in its delivery. People didn't know it was happening, but it shaped what they reached for.

  - type: stat_callout
    number: "5 sec"
    label: "Participants given only five seconds to evaluate price after priming were willing to pay significantly more — less time to think means more influence from the prime"
    source: "North et al., Journal of Retailing, 2016"
    accent: teal

  - type: prose
    body: |
      North's team also found that the effect gets stronger under cognitive load and time pressure. In one experiment, participants who were given only five seconds to evaluate price after being primed with classical music and luxury imagery were willing to pay significantly more than those given a full minute. Retail floors are full of distraction and decision fatigue. That's the exact condition where priming hits hardest.

  - type: subhead
    level: 2
    text: "The Cost of the Wrong Song"

  - type: prose
    body: |
      North's 2016 paper states it directly: music that is incongruent with the product image can lead to a reduction in the maximum price consumers are willing to pay. Not a neutral effect. A negative one. The wrong music doesn't just fail to help. It actively pushes the customer's willingness to pay downward.

  - type: pullquote
    text: "Incongruent music doesn't just fail to help. It actively reduces willingness to pay."
    accent: gold

  - type: prose
    body: |
      [Andersson and colleagues confirmed this in a 2012 study](https://scholar.google.com/scholar?q=Andersson+Kristensson+Let+the+Music+Play+background+music+consumer+behavior+2012) published in the *Journal of Retailing and Consumer Services*. They ran the experiment in real stores, with real customers, tracking real sales data across 601 observed transactions. Congruent background music increased average sale value. It improved brand perception. It raised customer satisfaction scores. Incongruent music produced the opposite pattern across every measure.

  - type: stat_callout
    number: "601"
    label: "Real transactions observed in Andersson's field study — congruent music lifted sales, incongruent music decreased them"
    source: "Andersson et al., Journal of Retailing and Consumer Services, 2012"
    accent: teal

  - type: prose
    body: |
      [Demoulin's work from 2011](https://scholar.google.com/scholar?q=Demoulin+music+congruency+service+setting+mediating+role+2011) added another layer. When music and environment are congruent, customers experience lower arousal, which leads to more positive responses. When the fit breaks, arousal increases in the wrong direction. The customer becomes more critical, less comfortable, less willing to spend.

  - type: subhead
    level: 2
    text: "Lyrics Are Doing More Than You Think"

  - type: prose
    body: |
      Lyrics carry semantic content. They prime specific concepts, just like any other language the customer hears. [Yeoh and North found in 2011](https://scholar.google.com/scholar?q=Yeoh+North+effect+musical+fit+consumers+memory+2011) that lyrics with strong musical fit deliver more powerful and direct messages to the listener. The words land harder when the music sells them well.

      Every dimension of fit matters simultaneously. A menswear store targeting professional men around 40, playing a late-90s R&B track about two women fighting over a man — the genre didn't match the brand, the cultural reference point didn't match the customer, and the lyrical content had nothing to do with anything that store was trying to communicate. Every dimension of fit was broken simultaneously.

      Nobody chose that song for that room. It was just in rotation. And for the three and a half minutes it played, it was the loudest claim the brand was making about itself.

  - type: subhead
    level: 2
    text: "The Mechanism You're Ignoring"

  - type: prose
    body: |
      Every song playing in your store is making claims. About your brand, about your products, about the kind of person who shops there, about whether the price on the tag is reasonable. Those claims are being made in words, in genre associations, in tempo, in cultural signals. They are being processed by your customers below the threshold of awareness, in exactly the conditions where priming is most effective: divided attention, time pressure, decision fatigue.

      You probably haven't audited what those claims are.

      The playlist running in your store right now was probably assembled by someone selecting genres or moods from a dropdown menu. The individual tracks were almost certainly never screened for lyrical content, semantic associations, or cultural fit with your specific customer. The research says it does far more than set a vague mood. It primes concepts. It shifts price perception. It tells your customer a story about your brand that you never approved.

      When the fit is wrong, the effect isn't zero. The customer doesn't just ignore the music. Their willingness to pay drops. Their perception of the brand shifts. Their satisfaction decreases. Andersson's team measured this with receipts, not surveys.

      The song playing in your store right now is saying something about your brand. You should probably find out what. Start with [reading the lyrics](../blog/read-the-lyrics-on-your-speakers-right-now.html). Then ask whether the [music matches your customer](../blog/what-your-music-is-saying-about-your-brand.html). [See how Entuned works](../how-it-works.html).

