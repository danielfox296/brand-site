sections:
  - type: key_takeaways
    items:
      - "Customers use audio intentionality as a proxy for overall brand quality and attention to detail"
      - "Refined audio signals increase perceived product quality independent of the products themselves"
      - "The brand halo effect runs on very little information -- one incongruent track can create a credibility deficit"

  - type: prose
    body: |
      Most retail brands spend real money on visual identity. The logo, the fixtures, the lighting temperature, the color palette on the walls, the materials on the shelving. Every visual element in a well-run store is a deliberate signal about who the brand is and who it's for.

      Then they pipe in a Spotify playlist and call it done.

  - type: subhead
    level: 2
    text: "The Proxy Effect"

  - type: prose
    body: |
      The research on this is fairly blunt. When the audio environment of a store feels intentional, customers attribute that intentionality to the brand broadly. They assume the same care went into the product selection, the quality standards, the training of the staff. The music acts as a proxy for the brand's overall attention to detail. Customers don't reason through this consciously. The inference runs below the surface and shapes how they perceive [everything else in the space](../blog/retail-atmospherics-2026.html).

  - type: stat_callout
    number: "100%"
    label: "Of the time the audio environment is running -- it never stops influencing perception"
    source: "Common-sense observation of retail operating hours"
    accent: teal

  - type: prose
    body: |
      Chebat and Michon's research on ambient environment and product quality perception showed that refined audio signals increased customers' perceived quality of products in the store, independent of the products themselves. The products didn't change. The assessment of them did. A store that sounds considered produces customers who trust it.

  - type: pullquote
    text: "The music that could belong to any store signals that this is any store."
    accent: teal

  - type: prose
    body: |
      The inverse has the same mechanism running in the other direction. Generic music tells customers something too. It tells them the store didn't think about this. And if the store didn't think about the audio environment, the customer's brain quietly extends that inference to the merchandise, the curation, the price-to-quality ratio.

  - type: subhead
    level: 2
    text: "The Brand Halo in Luxury and Near-Luxury"

  - type: prose
    body: |
      This is the brand halo effect, and it runs on very little information. Customers build impressions quickly and defend them. A customer who walks into a high-end boutique and hears a track that feels right for the space starts building a positive halo from the first minute. One who hears something that feels incongruous starts with a credibility deficit that the product has to overcome.

  - type: stat_callout
    number: "8-12%"
    label: "Willingness-to-pay lift from music aligned to customer identity"
    source: "Areni & Kim, 1993; replicated by North, Hargreaves & McKendrick, 1999"
    accent: gold

  - type: prose
    body: |
      The specific mechanism in luxury and near-luxury retail is particularly well-documented. Music with refined instrumental character primes luxury perception. Areni and Kim's wine store work showed that classical music caused customers to select more expensive bottles, not because they consciously decided to spend more, but because the environment had primed them to perceive premium quality. The music was doing brand positioning work that no visual element can replicate.

      Most brand teams think about this problem after the fact, if they think about it at all. The visual identity gets a design brief, a brand standards guide, a rollout plan. The audio environment gets a genre tag on a [licensing platform](../blog/the-hidden-cost-of-your-licensing-fee.html). That asymmetry shows up in the store in ways that are measurable if you're looking for them, and felt by customers even when they're not.

  - type: subhead
    level: 2
    text: "What Is Your Store's Music Actually Saying?"

  - type: prose
    body: |
      Your brand has a sound. Right now, it's probably someone else's. [What is your music saying about your brand?](../blog/what-your-music-is-saying-about-your-brand.html)

