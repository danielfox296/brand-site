      - ["Sporting Goods / Outdoor", "80-100", "< 65 dB", "Organic textures, indie, cinematic"]

  - type: subhead
    level: 2
    text: "What Most Guides Get Wrong"

  - type: prose
    body: |
      Most retail music guides are written by music service providers. Their recommendations end where their product begins: pick a genre, subscribe to a service, choose a mood channel. The guide exists to sell the subscription.

      What they leave out is measurement. None of these guidelines matter if you cannot verify their effect in your store. A tempo recommendation is useful. A tempo recommendation validated against your sales data is actionable. The gap between useful and actionable is where most retailers spend years without improving.

      The other omission is customer psychology. Every guide organizes music by store type. None of them organize music by customer type. Two apparel stores with different customer demographics and psychographic profiles should be running [different audio](../blog/psychographic-profiling-retail.html), even if they sell similar products at similar price points. Store type is a proxy. Customer identity is the real input.

  - type: pullquote
    text: "Store type is a proxy. Customer identity is the real input."
    accent: teal

  - type: subhead
    level: 2
    text: "Making It Work"

  - type: prose
    body: |
      Start with your customer. Define who they are at the psychological level, not just the demographic level. Then map the musical parameters to that profile. Then [measure](../blog/measure-roi-retail-music.html).

      If your current music service gives you genre channels and play logs, you can implement the tempo and volume recommendations immediately. Set the channel to match the tempo range for your store type. Calibrate volume below 64 dB. Bias toward unfamiliar material.

      If you want to go further — to psychographic targeting, parameterized music, and behavioral measurement — that requires a [different kind of service](../how-it-works.html).

