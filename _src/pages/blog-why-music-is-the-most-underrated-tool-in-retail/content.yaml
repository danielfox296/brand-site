  chapters: *id001
- type: subhead
  level: 2
  text: Why is music important in retail?
- type: prose
  body: 'Music is the only environmental variable that simultaneously controls walking speed (volume), dwell time (tempo), product selection (cultural priming), emotional state (mode/genre), and time perception (familiarity). It deploys instantly, costs almost nothing, and works subconsciously. The 1982 grocery study showed a $4,627/day revenue increase from a single tempo change. No other tool in retail gives you that many levers at that low a cost.

    '
- type: subhead
  level: 2
  text: If music is so important, why do most stores just play a random playlist?
- type: prose
  body: 'Because the research lives in academic journals that most store owners never read. Big-box chains pay consultants six figures to summarize this data. Independent retailers don''t have that access — until now. The gap between what the science says and what stores actually do is the single biggest missed opportunity in retail operations.

    '
- type: subhead
  level: 2
  text: Where do I start if I want to take store music seriously?
- type: prose
  body: 'Start with three things: (1) Stop playing whatever the opener likes — the research shows personal taste is irrelevant; brand fit is what matters. (2) Turn volume down slightly — multiple studies show softer music increases spending. (3) Move away from recognizable hits — they shorten dwell time. For a system that handles all of this based on the research, try Entuned free at entuned.co. Full citations in the description. This is video 9 of 50 in this series.

    '
