  - type: subhead
    level: 2
    text: "The Integration, Not the Competition"

  - type: prose
    body: |
      This isn't a competitive play against RetailNext or any analytics platform. It's the opposite. [Entuned](../how-it-works.html) requires measurement infrastructure to function. Without traffic data, dwell data, and conversion data, there's nothing to close the loop against. RetailNext, Sensormatic, Standard AI, V-Count — any platform producing reliable in-store behavioral data is a potential integration partner, because Entuned turns their data into a new category of outcome.

      A retailer running RetailNext who adds Entuned doesn't replace anything. They add an action layer that makes their existing analytics investment produce a return it couldn't produce before. The measurement gets more valuable because something is finally responding to it.

  - type: subhead
    level: 2
    text: "What's Next"

  - type: prose
    body: |
      We're building the integration. RetailNext's public API documentation gives us the data surface. Our generative audio engine gives us the intervention surface. The connection between them is the product.

      If you're a retailer running RetailNext or any in-store analytics platform, and you want to be part of the first live test of a [closed-loop audio environment](../blog/after-ninety-days.html), we're looking for pilot partners.

      If you're at RetailNext or Battery Ventures and this caught your attention, that's the point. Your data layer is the best in the industry. We think we know what to build on top of it.

