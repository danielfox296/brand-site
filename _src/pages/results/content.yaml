p_1: "Findings from peer-reviewed retail studies. Anchor pilot data accumulating from a multi-store deployment."

p_2: "Forty years of controlled experiments in real retail settings. These are not projections. They are published findings with named researchers, sample sizes, and effect magnitudes. Entuned engineers against them — every parameter the research identifies as load-bearing is something the engine specifies on purpose."

p_3: "Milliman (1982) found slow-tempo music increased grocery dwell by 38%. Knoferle et al. (2011) refined the finding. Tempo on its own did not move sales. The lift came when tempo and other musical choices fit together. Most retail music vendors have the thermostat. They do not have the room."

p_4: "Areni and Kim (1993) found classical music in a wine store lifted average transaction value from $6.93 to $12.31. North et al. (1999) found French music tripled French wine sales. When music matches how the customer reads herself, willingness to pay rises 8 to 12 percent."

p_5: "Yalch and Spangenberg (2000) tested familiar and unfamiliar music in a department store. Shoppers exposed to familiar music left 8 percent sooner. They enjoyed it more. They left faster. Original music is unfamiliar by definition. That is why it works."

p_6: "Gueguen and Jacob (2013) played romantic music in a flower shop and measured a 28.6 percent increase in spending. Andersson et al. (2012) ran 601 real transactions and found the inverse. Music that did not fit the shopper actively reduced willingness to pay. Getting it wrong costs you money."

p_7: "Entuned is currently running a deployment with a major mid-market men's fashion retailer with 80+ stores. Anecdotal positive signal. The narrative is the first multi-store deployment of engineered audio against a real Ideal Customer Profile."

p_8: "Specific lift data from the deployment will be published once the dataset clears the threshold for clean attribution and the brand authorizes naming. Treat current language as case-study-in-progress, not as proven lift at statistical significance. The published research above is what we stand behind for outcome claims today."

p_9: "Enterprise pilots deploy in your stores against your existing reporting, with a written readout against the metrics you set. If you want what the research predicts to show up in the report your operators already run, the entry is a structured pilot."

p_10: "Milliman (1982)"
p_11: "Slow-tempo music increased grocery dwell by 38 percent and daily gross receipts by 32 percent. Tempo alone did not predict the lift. Knoferle et al. (2011) later showed the effect depends on tempo being paired with the right tonal choice."
p_12: "Smith &amp; Curnow (1966)"
p_13: "One of the earliest controlled studies of music volume in retail. Loud music reduced shopping time without increasing sales. Volume is a blunt tool."
p_14: "Areni &amp; Kim (1993)"
p_15: "Classical music in a wine cellar nearly doubled average transaction value, from $6.93 to $12.31. Customers chose more expensive bottles, not more bottles. The music changed perceived value, not purchase intent."
p_16: "North et al. (1999)"
p_17: "French music tripled French wine sales over a two-week period. German music had the same effect on German wine. Customers denied being influenced. The effect happened below conscious awareness."
p_18: "Chebat &amp; Michon (2003)"
p_19: "Tested how music shapes perceived product quality through affect. Music shifted shoppers' emotional state, which shifted how they evaluated what they were looking at. The audio environment changed what the product felt like it was worth."
p_20: "Engineered audio in your stores. Free to start with Entuned Free. Talk to Enterprise about a structured pilot in your fleet."

