p_1: "Findings from peer-reviewed retail studies. Pilot data accumulating now."

p_2: "Forty years of controlled experiments in real retail settings. These are not projections. They are published findings with named researchers, sample sizes, and effect magnitudes. Entuned engineers against them — every parameter the research identifies as load-bearing is something the engine specifies on purpose."

p_3: "Milliman (1982) found shoppers walked more slowly under slow-tempo music and daily sales rose. Knoferle et al. (2011) refined the finding. Tempo on its own did not move sales. The lift came when tempo and other musical choices fit together. Most retail music vendors have the thermostat. They do not have the room."

p_4: "Areni and Kim (1993) found classical music in a wine store led customers to choose more expensive bottles, not more bottles. North et al. (1999) found shoppers chose French wine over German roughly three-to-one when French music played. When music matches how the customer reads herself, willingness to pay rises (North, Sheridan & Areni, 2016)."

p_5: "Yalch and Spangenberg (2000) tested familiar and unfamiliar music in a department store. Shoppers exposed to familiar music left 8 percent sooner. They enjoyed it more. They left faster. Original music is unfamiliar by definition. That is why it works."

p_6: "Jacob, Guéguen and colleagues (2009) played romantic music in a flower shop and measured a 28.6 percent increase in spending. The inverse holds too: when the music does not fit the shopper, that lift is forfeited. North, Shilcock and Hargreaves (2003) found prestige-fit music lifted spend per head, while music that did not fit landed level with no music at all. Getting it wrong costs you money."

p_7: "Entuned runs live today across an 80+ store deployment with a major mid-market men's fashion retailer &mdash; Entuned's first multi-store rollout of engineered audio against a defined customer profile."

p_8: "That deployment proves the system at scale: engineered audio holding 80+ floors every trading day. Outcome numbers on this page come from the published research above and from measured pilots read in your own reporting &mdash; and when deployment data clears the same named-source bar, it joins this page."

p_9: "A measured pilot deploys in a matched subset of your stores against your existing reporting, with a written readout against the metrics you set. If you run 5&ndash;50 locations and want what the research predicts to show up in the report your operators already run, the entry is a free twelve-week pilot."

p_10: "Milliman (1982)"
p_11: "Slow-tempo music slowed shoppers' pace and lifted daily gross sales meaningfully. Tempo alone did not predict the lift. Knoferle et al. (2011) later showed the effect depends on tempo being paired with the right tonal choice."
p_12: "Smith &amp; Curnow (1966)"
p_13: "One of the earliest controlled studies of music volume in retail. Loud music reduced shopping time without increasing sales. Volume is a blunt tool."
p_14: "Areni &amp; Kim (1993)"
p_15: "Classical music in a wine cellar led customers to choose more expensive bottles, not more bottles. The music changed perceived value, not purchase intent."
p_16: "North et al. (1999)"
p_17: "Shoppers chose French wine over German roughly three-to-one when French music played, and the pattern reversed for German wine under German music. Customers denied being influenced. The effect happened below conscious awareness."
p_18: "Chebat &amp; Michon (2003)"
p_19: "Tested how music shapes perceived product quality through affect. Music shifted shoppers' emotional state, which shifted how they evaluated what they were looking at. The audio environment changed what the product felt like it was worth."
p_20: "Engineered audio in your stores. Running 5&ndash;50 locations? Start a measured pilot &mdash; free, twelve weeks, read in your own reporting. Single store or just a few? Start free with Entuned Free."

