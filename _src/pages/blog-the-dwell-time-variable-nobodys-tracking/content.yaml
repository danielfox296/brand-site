  - type: prose
    body: |
      Retail operations teams have gotten sophisticated about dwell time. Heat mapping, people counters, POS correlation, zone analytics. The tools have gotten good. The list of variables that operations leaders consider when dwell time shifts -- layout changes, staffing density, seasonal traffic patterns, promotional placement, window treatment -- has gotten long.

      Audio environment is almost never on that list.

  - type: subhead
    level: 2
    text: "Why Audio Is Missing from Your Analysis"

  - type: prose
    body: |
      This isn't because the effect isn't real. The research connecting music to dwell time is among the most consistently replicated findings in retail psychology, going back to Smith and Curnow's 1966 work and running through dozens of studies since. The effect is real, measurable, and large enough to be operationally significant. The reason it's missing from most dwell time analysis is simpler: the music in most stores never changes in a way that would let you isolate it as a variable.

  - type: pullquote
    text: "If the same licensing playlist runs at the same volume at the same tempo profile day after day, you can't see its effect in your data because it's a constant."
    accent: teal

  - type: prose
    body: |
      Constants don't show up in variance analysis. The audio environment becomes invisible to the measurement apparatus precisely because nobody's treating it as a lever.

  - type: subhead
    level: 2
    text: "What Happens When You Treat Audio as a Variable"

  - type: stat_callout
    number: "1966"
    label: "Year the first study linking volume to dwell time was published"
    source: "Smith & Curnow, 1966"
    accent: teal

  - type: prose
    body: |
      The stores that have tested music as an independent variable have found effects worth measuring. Slower tempo correlates with longer dwell times across store categories. [Genre congruence](../blog/the-8-12-youre-leaving-on-the-table.html) with customer identity correlates with longer dwell and higher basket size. Volume reduction in considered-purchase environments correlates with increased browsing depth. These aren't small effects buried in statistical noise. They're large enough that operations leaders who've run the pilots come away asking why they waited.

      The practical problem is that isolating the audio variable is harder than isolating a layout change. You can't A/B test music in a single store on a single day. What you can do is run different audio profiles across comparable locations over comparable periods, control for traffic and weather and promotional variables, and look at the dwell and basket data in aggregate.

  - type: stat_callout
    number: "60+"
    label: "Years of replicated research connecting music variables to retail behavior"
    source: "Smith & Curnow, 1966 through present"
    accent: gold

  - type: subhead
    level: 2
    text: "What Should Retailers Do About Their Audio Environment?"

  - type: prose
    body: |
      Most operations leaders have exhausted the obvious dwell time levers. Layout optimization has limits. Staffing ratios have limits. Merchandising has limits. The audio environment is probably the last high-impact variable that hasn't been treated as a variable at all.

      That's more experimental rigor than most operations teams are set up for. But the baseline question doesn't require a controlled study. If your stores have never had music that was designed to extend dwell time, the question of whether it would work is worth asking. The research says it would. The only remaining question is by how much, for which customer, in which format. [Start measuring](../blog/the-metrics-your-audio-environment-should-be-producing.html).

