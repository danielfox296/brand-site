  - type: prose
    body: |
      If your audio environment is doing its job, you should be able to see it in your data.

      Most retail operations leaders have never been able to say that. The audio environment has been a fixed constant in their stores -- same licensing service, same genre profile, same volume settings -- which means it's invisible to any analysis built on variance. You can't see the effect of something that never changes.

      That's starting to shift as more operators treat audio as an active variable rather than a background condition. And when they do, the metrics that track the effect cluster around four areas.

  - type: subhead
    level: 2
    text: "Dwell Time by Zone and Period"

  - type: prose
    body: |
      Average dwell time is the most direct metric. Customers in a well-tuned audio environment stay longer, which means more time for browsing, more chances for staff interaction, more likelihood of a purchase decision. The useful analysis here is dwell time segmented by store zone and time period, correlated against the audio profile running in each. If you run a lower-tempo, lower-volume profile in the afternoon and see dwell time increase relative to morning sessions at higher energy, you're seeing the mechanism at work.

  - type: subhead
    level: 2
    text: "Basket Size and Transaction Value"

  - type: stat_callout
    number: "8-12%"
    label: "Expected basket size lift when audio matches customer identity"
    source: "Areni & Kim, 1993; replicated by North, Hargreaves & McKendrick, 1999"
    accent: gold

  - type: prose
    body: |
      This is the [8 to 12 percent question](../blog/the-8-12-youre-leaving-on-the-table.html) from the genre congruence research. Basket size should trend up when the audio environment is matched to customer identity and calibrated for the purchase psychology of the category. The challenge is isolating this from promotional effects, staffing variations, and seasonal patterns. The cleanest signal comes from comparing comparable periods before and after an audio environment change, controlling for the obvious confounds. A meaningful lift in average transaction value in the absence of other changes points at the audio variable.

  - type: subhead
    level: 2
    text: "Conversion Rate by Session"

  - type: prose
    body: |
      Foot traffic to purchase is the metric most directly connected to the purchase confidence research. An audio environment that creates congruence and primes appropriate quality perception should produce customers who are more likely to complete a purchase once they're in the store. This is harder to attribute than dwell time because conversion depends on many variables, but sustained directional improvement over a period where the audio environment is the primary operational change is evidence worth noting.

  - type: subhead
    level: 2
    text: "Return Visit Rate"

  - type: stat_callout
    number: "60-90"
    label: "Days before the repeat visit signal from audio environment changes becomes clear"
    source: "Entuned pilot observations, 2026"
    accent: teal

  - type: prose
    body: |
      The longest-horizon metric and probably the most meaningful for brand-building. Customers who felt the space was right for them -- who experienced the brand halo effect produced by intentional audio -- return at higher rates. This is a 60 to 90 day signal, not a weekly one. It requires a customer tracking mechanism to measure cleanly. But in stores that have the data infrastructure, repeat visit rate is where the cumulative effect of a well-designed audio environment shows up most clearly over time.

  - type: subhead
    level: 2
    text: "What Should Retailers Do If They Have No Audio Data Yet?"

  - type: pullquote
    text: "The audio environment in your stores has been producing metrics all along. Until now, nobody's been reading them."
    accent: teal

  - type: prose
    body: |
      Start with dwell time. It's the most accessible metric, it responds most directly to audio variables, and it's a leading indicator for the others. Set up a 30-day baseline on your current audio environment if you don't have one. Then change the audio environment and [measure again](../blog/measure-roi-retail-music.html). The comparison doesn't need a controlled study. It needs a directional signal.

