# for-furniture-mattress — editable text content
# Vertical landing for furniture, mattress, and large-format home retail.
# Voice: PLG-primary, single-store and small-chain owner-operator.

hero:
  eyebrow: "For furniture &amp; mattress retail"
  h1: "Music to extend the comfortable browse."
  subline: "Furniture and mattress visits are long, high-ticket, and often joint &mdash; the customer brought a partner and a question they need to feel good about answering. Entuned produces original music tuned to soften the room, ease the consideration, and make the lifestyle fit feel right. Free, no credit card."

# The gap
gap:
  eyebrow: "The Gap"
  h2: "The longer she stays in the room, the more likely she is to buy from it."
  p1: "Furniture and mattress retail share an unusual operating shape: the customer is making a single multi-thousand-dollar decision, often with a partner in the room, and the visit can stretch from twenty minutes to over an hour. Dwell is the load-bearing variable for basket. The customer who lies on the bed for the second time buys it. The customer who feels rushed off it walks."
  p2: "Your floor staff have a model for that interaction. Your visual merchandising has a model for that interaction. The audio environment shaping the room has been delivered by a vendor who has never been in your store, with selection logic built around licensing compliance and complaint avoidance. Two of the three layers of the room are intentional. The third is on a default."

# What changes per tier
tiers:
  eyebrow: "Three places to start"
  h2: "Three places to start, sized to where you are."

  card1_title: "Entuned Free"
  card1_text: "Free, indefinite. Pick Linger from the floor of your store and the catalogue starts streaming through the speakers you already have. Useful as the first look before you decide to specify the audio more deliberately for the customer your floor is built around."

  card2_title: "Boost ($99/location/mo)"
  card2_text: "Music tailored to your single Ideal Customer Profile. For most furniture and mattress retailers, that is the customer your buyer is already merchandising for &mdash; the considered shopper who came in with a partner and a budget and needs the room to feel calm enough to think. About 420 tracks in the first month, refreshed against what holds the floor."

  card3_title: "Professional ($399/location/mo)"
  card3_text: "POS integration. Outcome Scheduling against your traffic profile (the Saturday-afternoon couples browse is a different mood than the Tuesday-morning replacement-mattress run). Multiple ICPs for stores that draw distinct customer types. Self-improving refinement against your basket and dwell data."

  card4_title: "Enterprise"
  card4_text: "Multi-store rollouts where you operate more than a handful of locations. Custom ICP design and brand voice consultation. Performance terms where lift can be cleanly measured against your existing reporting. Standard entry shape is a 12-week pilot in matched test and control stores."

# What the research says
research:
  eyebrow: "Forty years of evidence"
  h2: "Forty years of evidence on the audio levers that matter for high-ticket dwell."

  card1_title: "Tempo affects pace through the store."
  card1_text: "Milliman (1982) measured slower music increasing grocery dwell by ~38%. The mechanism &mdash; tempo affects walking pace &mdash; maps cleanly to furniture and mattress retail, where slower pace means more sit-tests, more lie-downs, more product interactions per visit."

  card2_title: "Music customers read as theirs moves willingness to pay."
  card2_text: "Areni and Kim (1993) found that in a wine cellar, customers chose more expensive bottles &mdash; not more of them &mdash; when the music matched the customer&rsquo;s frame. North, Shilcock and Hargreaves (2003) found the same prestige-fit effect lifted spend per head in a restaurant. Same product on the floor, different customer read &mdash; and on a $2,400 sofa or a $1,800 mattress, the difference is not trivial."

  card3_title: "Familiar songs cut perceived dwell."
  card3_text: "Yalch and Spangenberg (2000) found that familiar music made shoppers leave 8% sooner. Original music is unfamiliar by definition &mdash; that is part of why it works. Catalogue vendors play the songs that minimize complaints. That is exactly the wrong objective for a category that monetizes dwell."

  card4_title: "Mismatched music forfeits the lift."
  card4_text: "Music that fits the customer category lifts what shoppers will pay; music that clashes gives that lift back (Areni and Kim 1993; North, Shilcock and Hargreaves 2003). Neutral is not the default. The audio environment is doing work in the room whether you chose its effect or not."

# CTA
cta:
  eyebrow: "Get Started"
  h2: "Hear it on your floor."
  subline: "Start free at Entuned Free in your store. Move to Boost or Professional once you want music tailored to your specific customer."
  cta_primary: "Start Free"

