  - type: prose
    body: |
      A BMI music license for a small retail store starts at a published minimum of about $294 per year for a single location under 2,000 square feet. The exact figure depends on your business type, square footage, the number of speakers, and how the music is used. Larger venues with higher occupancy pay more, and multi-location retail scales to roughly $2,500 a year.

      But here's the part that catches most operators off guard: BMI is only one of four performing rights organizations you'd need to deal with. ASCAP, SESAC, and GMR each represent different songwriters and publishers, and you need a blanket license from each to be fully compliant. Licensing all four directly runs roughly $1,059 to $1,552 per year for a small store (published rate cards plus observed SESAC and GMR ranges, as of May 2026).

      That's before you've paid for the music itself.

  - type: subhead
    level: 2
    text: "How BMI pricing works"
    anchor: "how-pricing-works"

  - type: prose
    body: |
      BMI doesn't publish a simple flat price. Fees come from rate schedules that vary by business category — a footwear shop is priced differently than a home-goods store, which is priced differently than a jewelry counter or an apparel boutique (food-service venues sit on a separate schedule entirely). Within each category, the fee scales on factors like square footage, the number of speakers or audio devices, and the size of the potential audience.

      For a small retail store, you're generally at the lower end of the range: a few hundred dollars a year. But the number rarely sits alone. BMI represents over 1.4 million songwriters, composers, and publishers and the rights to more than 22 million songs — and a single song often has co-writers registered with different PROs. So the BMI license covers the BMI writers on a track, and you need the others to cover the rest.

      BMI licenses also renew annually. Miss the renewal and you're technically operating unlicensed, which exposes you to statutory damages.

  - type: stat_callout
    number: "$750–$30,000"
    label: "Statutory damages per infringed work under U.S. copyright law for unlicensed public performance — rising to as much as $150,000 per work for willful infringement"
    source: "17 U.S.C. § 504(c)"
    accent: gold

  - type: subhead
    level: 2
    text: "Why BMI is only part of the bill"
    anchor: "only-part"

  - type: prose
    body: |
      This is the single most common misunderstanding about PRO fees. Paying BMI does not make you compliant. It makes you compliant for the songs whose writers BMI represents.

      There are four PROs in the United States — BMI, ASCAP, SESAC, and GMR — and they represent different rosters. ASCAP is the other large one, with a published retail rate of $365 to $402 a year for the smallest stores, so a small store paying both BMI and ASCAP is looking at roughly $659 to $752 a year just for the two majors. SESAC and GMR are negotiated rather than published — small retailers typically land $200 to $400 a year with each (observed ranges). To legally play a typical mix of commercial tracks, where any given song might have writers across multiple PROs, you technically need all four.

  - type: comparison_table
    title: "The four U.S. PROs"
    columns: ["PRO", "Represents", "Small-store cost (annual, approx.; as of May 2026)"]
    rows:
      - ["BMI", "1.4M+ writers, 22M+ songs", "$294 published minimum (under 2,000 sq ft)"]
      - ["ASCAP", "Comparable roster", "$365 to $402 (published rate card)"]
      - ["SESAC", "Smaller, invitation-only roster", "Negotiated; ~$200 to $400 observed"]
      - ["GMR", "Smaller, high-profile roster", "Negotiated, not published; ~$200 to $400 observed"]

  - type: subhead
    level: 2
    text: "Why this system exists"
    anchor: "why-it-exists"

  - type: prose
    body: |
      BMI's job is to make sure songwriters and publishers get paid when their work is performed publicly — including in commercial spaces. The blanket license lets a business access a large catalog without negotiating rights song by song. The system is legitimate; songwriters deserve to be paid for their work.

      The friction is that the machinery built for radio stations and concert halls lands, unchanged, on a 1,500-square-foot shop. The result is a layer of cost and four separate relationships that feel wildly out of proportion to the simple act of having some music on while customers browse.

  - type: subhead
    level: 2
    text: "The way to opt out entirely"
    anchor: "opt-out"

  - type: prose
    body: |
      PRO licensing applies only to copyrighted music where a third-party rights holder exists. If you play music that isn't registered with BMI, ASCAP, SESAC, or GMR, there is nothing for them to collect on, and the licensing requirement doesn't apply.

      This is exactly how Entuned works. We create original music for retail and own every track outright — no third-party songwriters, no publishers, no PRO affiliation. When you stream our music in your store, there's no public performance license required. No blanket fee. No annual renewal. No letters.

      Entuned Free gives you mood-tuned in-store audio with no credit card and no time limit, PRO-indemnified the moment it plays. The music is engineered for retail, original compositions rather than licensed catalog tracks.

  - type: pullquote
    text: "Remove the third-party rights holder and the BMI bill disappears along with the other three. No registration, no renewal, no letter."
    accent: teal

  - type: subhead
    level: 2
    text: "What to do about a BMI bill"
    anchor: "what-to-do"

  - type: prose
    body: |
      If you've received an invoice or letter from BMI, you have three honest options.

      You can negotiate a blanket license with BMI directly, then repeat with ASCAP, SESAC, and GMR — roughly $1,059 to $1,552 a year total for a small store (published rate cards plus observed ranges, May 2026), plus a source of music to actually play.

      You can sign up for a commercial streaming service that bundles PRO licensing into the subscription, like Soundtrack Your Brand or Cloud Cover — roughly $17 to $54 a month (vendor published pricing, 2026), with the paperwork handled for you.

      Or you can switch to music that no PRO represents, which removes the obligation entirely. If you stop playing copyrighted music, you can respond to the letter by explaining that you no longer play music that falls under their jurisdiction.

