- type: prose
  body: 'Dwell time — total time a customer spends in your store — is one of the strongest predictors of unplanned purchases, but only when paired with the right emotional state. A 1994 Journal of Retailing study found that pleasure measured at the five-minute mark predicted unplanned spending, while a 1999 restaurant study showed 15 extra minutes of dwell time produced zero additional revenue.


    In this video I explain why dwell time alone is a vanity metric, how music extends quality dwell time, and why the first five minutes of a shopping trip matter more than the total duration.

    '
- type: prose
  body: There’s a metric in retail that predicts spending better than foot traffic, better than conversion rate, and better than average basket size. It’s called dwell time — how long someone stays in your store. And music is the single most accessible lever you have to control it. I’m Daniel Fox, founder of Entuned, and dwell time is basically why our company exists.
- type: subhead
  text: What Dwell Time Actually Is
- type: prose
  body: 'Dwell time is simple: it’s the total minutes a customer spends in your space from entry to exit. And the reason it matters so much is that almost every study on in-store behavior shows the same pattern — more time equals more spending. Not always proportionally. Not always linearly. But the correlation is one of the most robust findings in retail research. A 2012 study in the Journal of Retailing and Consumer Services made this dead simple. They measured 550 shoppers in stores with music versus stores in silence. Music — any music — added 8 minutes of dwell time on average. And those extra 8 minutes corresponded to more spending. Not because the music hypnotized anyone. Just because more time in the store means more products seen, more impulse triggers, more purchase decisions. Eight minutes. That’s the gap between music and no music. Now imagine what happens when the music is actually optimized.'
- type: subhead
  text: The Perception Gap
- type: prose
  body: Here’s where it gets psychologically interesting. A study from the Journal of Business Research in 2000 uncovered something counterintuitive about dwell time and time perception. When shoppers heard unfamiliar music, they stayed longer — but they perceived their visit as shorter. When they heard familiar music, they left sooner — but thought they’d been there longer. Read that again. Unfamiliar music stretches real time while compressing perceived time. This is a massive insight. The ideal retail scenario is a customer who browses for 45 minutes but feels like it was 20. They’ve seen your full inventory, they’ve made more purchase decisions, and they leave feeling like it was a quick, pleasant trip. That’s the dwell time sweet spot. And it only happens with unfamiliar music. Familiar music — the hits, the playlists, the songs people recognize — actually works against you. It compresses real time and inflates perceived time. People leave sooner and feel like they overstayed.
- type: subhead
  text: Dwell Time in Restaurants
- type: prose
  body: The restaurant version of this is even more direct. A 1986 study published in the Journal of Consumer Research tested slow versus fast music in a restaurant. Slow music extended the average meal by 11 minutes. That extra time translated directly into 3 additional drinks ordered per table and roughly a 40 percent increase in bar revenue. In that context, dwell time isn’t just correlated with spending — it’s the mechanism. More time at the table means more rounds. The music didn’t make people thirstier. It made them comfortable enough to not rush. But there’s a limit. A restaurant study from European ACR in 1999 found that slow jazz extended stays by about 15 minutes — but the spending didn’t scale proportionally. People sat longer but didn’t keep ordering. So dwell time has diminishing returns. The relationship isn’t infinite.
- type: subhead
  text: The Repetition Dimension
- type: prose
  body: There’s a theoretical angle here from cognitive science that hasn’t been tested in retail yet — but it’s too relevant to ignore. A book published by Oxford University Press in 2014 lays out the case that musical repetition creates a state of absorption. When you hear repeated musical structures, your brain enters a kind of flow state — you lose track of time. And 94 percent of the world’s music uses repetition. No one has tested this in a store. Zero retail evidence. But the mechanism maps perfectly onto what the familiarity studies found — unfamiliar but structured music creates time distortion. Generative music, the way we build it at Entuned, is inherently repetitive in structure but novel in surface detail. Every listen is new, but the underlying patterns create that absorption state. That’s the dwell time play. Not just longer visits. Visits that feel shorter while they’re actually longer.
- type: subhead
  text: The Takeaway
- type: prose
  body: Dwell time matters because time is the container for every other retail metric. You can’t convert a browser who left after 90 seconds. You can’t upsell a diner who’s already asking for the check. Music extends that container — 8 minutes at baseline, more with the right approach. And the research points clearly toward unfamiliar, well-structured music as the optimal way to do it.
