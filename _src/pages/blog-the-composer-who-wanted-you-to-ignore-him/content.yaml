title: "The Composer Who Wanted You to Ignore Him"
slug: "the-composer-who-wanted-you-to-ignore-him"
eyebrow: "FIELD NOTES"
dek: "Erik Satie invented furniture music in 1917 to disappear. His first performance failed because the audience kept listening. The problem he identified on the first try is still here."
