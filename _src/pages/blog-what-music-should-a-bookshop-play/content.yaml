title: "What Music Should a Bookshop Play? The Research Is Counterintuitive"
slug: "what-music-should-a-bookshop-play"
eyebrow: "FIELD NOTES"
dek: "Music can change how long people browse, or what they pick up, or neither — and the obvious choice is rarely the effective one. What the research says about sound and the unplanned browse."
date: "2026-06-05"
