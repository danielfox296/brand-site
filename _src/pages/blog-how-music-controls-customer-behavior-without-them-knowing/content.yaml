- type: video
- type: prose
  body: 'Music controls customer behavior through at least four mechanisms: it changes walking speed (volume), dwell time (tempo), product selection (cultural priming), and impulse purchases (emotional state). In one study, 86% of customers had no idea music was influencing their buying decisions.

    In this video I break down the full behavioral chain — from a 1966 study on volume and foot traffic to the subconscious priming effect, the emotional pathway that drives impulse buying, and the critical finding that mismatched sensory cues can backfire and drive customers away.

    '
- type: transcript
  chapters: *id001
- type: subhead
  level: 2
  text: How does music affect customer behavior?
- type: prose
  body: 'Music controls behavior through four documented mechanisms: (1) Volume controls walking speed — loud music makes people move faster (Smith & Curnow, 1966). (2) Tempo controls dwell time — slow music increased grocery sales by 38% (Milliman, 1982). (3) Cultural associations prime product selection — French music drove 5:1 French wine purchases (North et al., 1999). (4) Emotional state drives impulse buying — pleasure in the first 5 minutes predicts unplanned spending (Donovan et al., 1994).

    '
- type: subhead
  level: 2
  text: If 86% of customers don't notice the music, how can it really be that powerful?
- type: prose
  body: 'That''s exactly why it''s powerful. Music works below conscious awareness. Customers don''t think "the music is making me buy this" — they think "I just feel like this one." The 1999 wine study proved this: customers chose French wine 5:1 when French music played, but when asked, they attributed it to personal preference. Subconscious influence is stronger than conscious persuasion because it bypasses skepticism.

    '
- type: subhead
  level: 2
  text: What's the biggest mistake I'm probably making with my store music right now?
- type: prose
  body: 'The most common mistake is sensory mismatch. If your music''s energy level clashes with your scent, lighting, or brand identity, it actively hurts — satisfaction drops below baseline (Mattila & Wirtz, 2001). Start by checking whether your music''s energy matches the rest of your environment. If you want a system that handles this automatically, try Entuned free at entuned.co. Full citations in the description. This is video 3 of 50 in this series.

    '
