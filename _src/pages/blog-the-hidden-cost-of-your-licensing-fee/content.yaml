sections:
  - type: key_takeaways
    items:
      - "The licensing fee buys access to music created for a general audience, not your customer specifically"
      - "A licensing catalog cannot be organized by customer psychology because the tracks predate any knowledge of your customer"
      - "The identical-store problem means your competitor with the same profile sounds exactly like you"

  - type: prose
    body: |
      The licensing fee looks like the cost of music. It's actually the cost of a constraint.

      What the licensing model buys is access to a catalog of music that was created by artists who had no idea your store existed. The tracks were written for personal expression, for radio play, for streaming engagement, for sync licensing in film and television. A small fraction were written as background music for commercial environments. None were written for your customer specifically. The licensing fee is a toll for borrowing someone else's creative intentions and pointing them at your store.

      The dollar amount is almost beside the point. The more significant cost is what the model prevents.

  - type: subhead
    level: 2
    text: "What the Catalog Model Can't Do"

  - type: stat_callout
    number: "8-12%"
    label: "Willingness-to-pay lift that lives in the gap between 'approximately right' and 'engineered specifically'"
    source: "Areni & Kim, 1993; replicated by North, Hargreaves & McKendrick, 1999"
    accent: gold

  - type: prose
    body: |
      A licensing catalog is a finite set of fixed objects. Every track in it was made for a general audience or for no audience in particular. The catalog can be organized by mood, by genre, by tempo, by era -- but it can't be organized by customer psychology, because the tracks predate any knowledge of your customer. The best result the model can produce is a playlist that's approximately right for approximately who you serve. The gap between "approximately right" and "engineered specifically" is where the [8 to 12 percent willingness-to-pay lift](../blog/the-8-12-youre-leaving-on-the-table.html) lives.

  - type: subhead
    level: 2
    text: "The Artist Rights Dimension"

  - type: prose
    body: |
      There's also an artist rights dimension that doesn't get talked about in operations contexts. Licensing agreements constrain how music can be used, where it can play, and in what combinations. An artist can pull their catalog from commercial licensing. A track can become unavailable. A rate renegotiation can change what you have access to at a given price point. The store's audio environment is dependent on decisions made by labels and rights holders who are optimizing for their own interests, not for what your store needs on a Tuesday afternoon in November.

  - type: pullquote
    text: "If your competitor serving a similar customer selected the same profile, both stores sound the same. The audio environment that was supposed to differentiate your brand becomes indistinguishable from it."
    accent: teal

  - type: subhead
    level: 2
    text: "The Identical-Store Problem"

  - type: prose
    body: |
      The catalog model also creates the identical-store problem. A licensing playlist running in your boutique is probably running in other stores in the same genre category. [Mood Media's](../blog/mood-media-alternatives.html) "upscale contemporary" profile serves whoever selected it. If your competitor serving a similar customer selected the same profile, both stores sound the same. The audio environment that was supposed to differentiate your brand from the generic becomes indistinguishable from it.

      Retail brands spend significant resources on visual differentiation. The fixtures, the layout, the lighting, the signage, the window treatment -- all of it is designed to make the store feel specific to the brand. Then the audio environment, which runs continuously and never stops influencing customer perception, is sourced from the same pool of catalog music that any other store can access for the same monthly fee.

  - type: stat_callout
    number: "$200-$960"
    label: "Typical annual cost of a retail audio licensing subscription"
    source: "Industry pricing, 2026"
    accent: gold

  - type: subhead
    level: 2
    text: "What Does Your Licensing Fee Actually Prevent?"

  - type: prose
    body: |
      The licensing fee isn't expensive. But the thing it prevents access to is. What it prevents is music that was built for your customer, measured against your outcomes, and [differentiated from every other store](../blog/the-real-cost-of-retail-music.html) in your category.

