sections:
  - type: key_takeaways
    items:
      - "A trained ear catches things in a recording that a casual listener never consciously registers"
      - "Repetition legitimizes. The store manager has heard the playlist enough times that the rough edges have smoothed out in their head"
      - "The customer walks in fresh and judges the room on a completely different basis"
