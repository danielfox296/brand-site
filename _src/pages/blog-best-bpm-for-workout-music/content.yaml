  - type: key_takeaways
    items:
      - "Across the research synthesized by sport psychologist Costas Karageorghis, the useful tempo band for exercise music is roughly 125-140 BPM, and preference plateaus around 140 — faster than that stops adding benefit"
      - "Music reduces perceived effort by about 10%, but only at low-to-moderate intensity (Szmedra & Bacharach, 1998). Push past your threshold and the effect fades, because the body's fatigue signals take over"
