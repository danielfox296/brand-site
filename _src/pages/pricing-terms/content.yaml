h1_1: "Founding Retailer Terms"
p_1: "Last updated: April 16, 2026"
p_intro: "These terms apply when you subscribe to the Founding Retailer plan on entuned.co. They form a binding agreement between you and Entuned LLC (\"Entuned,\" \"we,\" \"us\"), a Colorado limited liability company. If you do not agree to these terms, do not subscribe."

h2_1: "1. The service"
p_2: "Entuned delivers an original audio stream built for your store. The stream plays over your existing in-store audio system via a streaming URL we provide. We refresh the composition monthly. You control playback."

h2_2: "2. Subscription and billing"
p_3: "Pricing, billing, and related terms:"
li_1: "<strong>Price.</strong> $99 per location per month, billed monthly in advance through Stripe."
li_2: "<strong>Automatic renewal.</strong> Your subscription renews every month until cancelled."
li_3: "<strong>Per-location.</strong> One subscription covers one physical retail location. Multiple locations require multiple subscriptions; you can set quantity at checkout."
li_4: "<strong>Taxes.</strong> Sales and use taxes are added where applicable and collected at checkout."
li_5: "<strong>Payment failures.</strong> If a payment fails we will retry and notify you. Access to the stream may be suspended if a payment remains unresolved for 14 days."

h2_3: "3. Founding Retailer benefits"
p_4: "Three things set the Founding plan apart from our standard offering:"
li_6: "<strong>Price lock.</strong> The $99 per location per month rate is locked for 12 months from your subscription start date."
li_7: "<strong>After 12 months.</strong> Your subscription continues at our then-standard rate unless we agree otherwise in writing."
li_8: "<strong>Cap.</strong> The Founding Retailer program is limited to the first 20 locations. Once filled, new subscriptions move to standard pricing."

h2_4: "4. Cancellation and refunds"
p_5: "You may cancel at any time from your customer portal or by emailing hello@entuned.co. Cancellation takes effect at the end of the current billing period, and you retain access through that date. We do not pro-rate or refund unused portions of a billing period. If you believe you were charged in error, email hello@entuned.co within 14 days and we will review."

h2_5: "5. License to the music"
p_6: "During an active subscription, Entuned grants you a non-exclusive, non-transferable, revocable license to play the audio we deliver in the physical retail location or locations covered by your subscription. You may play it for customers, staff, and anyone present in the store. You may not re-stream or rebroadcast the audio outside your store, record or distribute it, resell it, or use it in advertising, video content, or other media without our written permission. When your subscription ends, the license ends and you must stop playing the audio."

h2_6: "6. Ownership"
p_7: "Entuned retains all right, title, and interest in the audio, the underlying compositions, the generation system, and the analytic framework (including the flow factors model). You retain all right, title, and interest in your brand, store data, and customer data. Feedback you provide — suggestions, requests, notes during intake — may be used by Entuned to improve the service without further obligation to you."

h2_7: "7. Music licensing and PRO fees"
p_8: "All audio Entuned delivers is generated by Entuned and is cleared for commercial in-store use. You do not owe separate performing rights organization fees (ASCAP, BMI, SESAC, GMR) for the music Entuned provides. If a rights organization questions this, contact us and we will provide supporting documentation."

h2_8: "8. Data"
p_9: "If you share transaction, traffic, or sensor data with us during the Founding program, we use it in aggregated, anonymized form to improve the audio and the product. We collect basic stream usage data — start time, duration, location — to operate the service. We do not sell your data. Our general data practices are described in our <a href=\"../privacy-policy.html\">privacy policy</a>."

h2_9: "9. No guaranteed outcomes"
p_10: "The research underpinning Entuned supports meaningful improvement in in-store customer behavior, and our approach is designed against that research. We do not guarantee any specific outcome, sales lift, or revenue result for your store. Results vary by category, traffic, customer base, and execution."

h2_10: "10. Warranty disclaimer"
p_11: "The service is provided \"as is\" and \"as available.\" To the maximum extent permitted by law, Entuned disclaims all warranties, express or implied, including merchantability, fitness for a particular purpose, and non-infringement."

h2_11: "11. Limitation of liability"
p_12: "To the maximum extent permitted by law, Entuned's total liability arising out of or related to your subscription will not exceed the amount you paid to Entuned in the 12 months preceding the event giving rise to the claim. Entuned is not liable for indirect, incidental, consequential, special, or punitive damages."

h2_12: "12. Changes to these terms"
p_13: "We may update these terms from time to time. If a change materially affects your rights, we will email you at least 30 days in advance. Continued use of the service after the effective date constitutes acceptance."

h2_13: "13. Governing law"
p_14: "These terms are governed by the laws of the State of Colorado, without regard to conflict-of-laws principles. Any dispute arising under these terms will be resolved in the state or federal courts located in Denver County, Colorado."

h2_14: "14. Contact"
p_15: "Questions about these terms: <a href=\"mailto:hello@entuned.co\">hello@entuned.co</a>. Entuned LLC, Colorado, USA."
