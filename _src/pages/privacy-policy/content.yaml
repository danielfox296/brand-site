# Covers Entuned, LLC and every venture it runs (rewritten 2026-11-12).

h1_1: "Privacy Policy"
p_updated: "Last updated: November 12, 2026"
h2_1: "What this policy covers"
p_1: "This policy covers Entuned, LLC, a Wyoming limited liability company, and everything it runs: Signet Artists (signetartists.com), fractional CMO consulting (daniel-fox.com), Music Behaviorist (danielchristopherfox.com) and this site (entuned.co). It also covers the records we still hold from the Entuned retail music service, which has ended. &ldquo;We&rdquo; and &ldquo;us&rdquo; mean Entuned, LLC."
h2_2: "1. What we collect"
li_1: "<strong>Booking inquiries.</strong> When you ask Signet Artists about an event, through the website form, by email or by phone, we keep your name, email address, phone number, the date and place of the event and what you tell us about it."
li_2: "<strong>Website chat.</strong> Signet&rsquo;s website chat keeps the messages you send, the contact details you give and the page you started the chat on."
li_3: "<strong>Artist and vendor submissions.</strong> When a musician applies through Signet&rsquo;s For Artists form, or a vendor applies to Signet&rsquo;s Preferred Vendor List, we keep what they send: name, contact details, links, recordings, photographs and details of their work."
li_4: "<strong>Consulting inquiries.</strong> When you get in touch through daniel-fox.com or danielchristopherfox.com, or book a call there, we keep your name, email address and what you write."
li_5: "<strong>Clients and payments.</strong> When you hire us, we keep the agreement, the invoices and the payment records. Card payments go through Stripe. We see the amount, the date, the name on the card and its last four digits, and never the full card number."
li_6: "<strong>Former Entuned service subscribers.</strong> We keep the account and billing records from the Entuned retail music service for as long as tax and accounting law requires."
li_7: "<strong>Newsletter subscribers.</strong> If you subscribe to a newsletter on Substack, Substack holds your email address under its own privacy policy, and we can see the subscriber list."
li_8: "<strong>Website visits.</strong> Our websites use Google Analytics, which records the pages you visit, the site that sent you, your browser and device type, and an approximate location worked out from your IP address."
h2_3: "2. How we use it"
li_9: "To answer you, send a quote and plan and run your event or project."
li_10: "To book and pay the artists and vendors who work on it, and to invoice and collect payment from clients."
li_11: "To keep our books and meet our tax and legal obligations."
li_12: "To see which pages people read, so we can fix what isn&rsquo;t working."
p_2: "We don&rsquo;t sell or rent personal information, and we don&rsquo;t share it for anyone else&rsquo;s advertising."
h2_4: "3. Who we share it with"
li_13: "<strong>The people working on your event.</strong> Signet gives the artists and vendors booked for your event your name, the event details and the contact on the day."
li_14: "<strong>Companies that run parts of the business for us.</strong> Stripe (card payments), Mercury (banking and invoices), Google (email, documents, forms and website analytics), Crisp (website chat), FormSubmit (website forms), Calendly (call booking), Substack (newsletters), GitHub (website hosting) and Railway (hosting for the former Entuned service). Each one handles the information to provide its service to us."
li_15: "<strong>When the law requires it,</strong> for example in response to a court order, or to protect someone&rsquo;s safety."
h2_5: "4. Cookies"
p_3: "Google Analytics sets cookies to tell one visit from the next. Signet&rsquo;s chat sets a cookie so a conversation can carry on from page to page. Videos on our sites play from YouTube in its privacy-enhanced mode, and YouTube may set cookies once you press play. You can block cookies in your browser settings, and you can turn off Google Analytics with the <a href=\"https://tools.google.com/dlpage/gaoptout\" target=\"_blank\" rel=\"noopener\">Google Analytics opt-out add-on</a>."
h2_6: "5. How long we keep it"
p_4: "We keep agreements, invoices and payment records for as long as tax law requires. We keep inquiries, chats and submissions while they&rsquo;re useful for the work, and we delete them sooner if you ask."
h2_7: "6. Security"
p_5: "We keep personal information in accounts protected by passwords and two-step sign-in where the service offers it, and we give access only to the people who need it for the work. No storage or transmission over the internet is completely secure, so we can&rsquo;t guarantee it."
h2_8: "7. Your choices"
p_6: "You can ask us what we hold about you, ask us to correct it or ask us to delete it, and you can unsubscribe from any email we send. Depending on where you live, the law there may give you more rights, and we&rsquo;ll honor them. Write to the address below and we&rsquo;ll answer within 30 days."
h2_9: "8. Children"
p_7: "Our sites and services are for adults. We don&rsquo;t knowingly collect personal information from children under 13, and we delete it if we learn we have."
h2_10: "9. Other websites"
p_8: "Our sites link to other websites, including artists&rsquo; and vendors&rsquo; own sites. Their privacy practices are their own."
h2_11: "10. Changes"
p_9: "When we change this policy, we post the new version here with a new date at the top."
h2_12: "11. Contact"
p_10: "Questions or requests about your information: <a href=\"mailto:{{contact_email}}\">{{contact_email}}</a>. Entuned, LLC, a Wyoming limited liability company, Colorado, USA."
