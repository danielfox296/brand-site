h1_1: "Help build the first design system for retail audio."
h2_1: We're Always Looking for Great Talent
h2_2: Reach Out
btn_1: Say Hello
p_1: Hard problems, small team, outsized impact. We're looking for people who want to build something that doesn't exist yet.
p_2: Entuned sits at the intersection of music psychology, data science, and retail operations. We're connecting what plays in a store to what customers actually do. The people we want tend to show up before the roles do, and we want to hear from them.
p_3: The work is to take what research says about music and behavior and make it hold up in real stores, at real scale, against real transaction data. Most of that work is new. A lot of it is unglamorous. None of it is boring.
p_4: Where the work lives
p_5: "Music psychology and psychoacoustics: turning published research into production rules that survive noisy retail environments. Data science and behavioral analytics: connecting what plays to what sells, visit by visit. Retail operations and go-to-market: selling into a category where buyers have been burned by vendors who never proved anything. Full-stack engineering and generative audio: shipping a product that writes, schedules, and delivers original music to physical locations in real time."
p_6: If one of those is your area and this problem sounds like the right kind of hard, send a note. Tell us what you work on and why this caught your attention.
p_7: Learn more: <a href="about.html" style="color: #50929c;">About Entuned</a>
