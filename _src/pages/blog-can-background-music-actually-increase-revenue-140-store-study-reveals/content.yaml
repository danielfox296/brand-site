- type: video
- type: prose
  body: 'Yes — background music can increase revenue, but the effect is conditional. A landmark 1982 study showed a 38% daily revenue lift from slow music. But a 2025 field study across 140 real stores found tempo alone showed no overall effect — until they looked at loyalty members and context variables, revealing that music''s revenue impact depends on who''s in the store.

    In this video I reconcile the positive findings (38% grocery lifts, 40% bar revenue increases, 12% tempo-mode effects) with the nuanced 140-store null result, and explain the context-dependency principle that determines whether music moves your revenue.

    '
- type: transcript
  chapters: *id001
- type: subhead
  level: 2
  text: Can background music actually increase revenue?
- type: prose
  body: 'Yes, but the size of the effect depends on context. The 1982 grocery study showed a 38% daily revenue lift ($4,627/day) from slow music. The 1986 restaurant study showed a 40% bar revenue lift. But a 2025 study of 140 stores found that tempo alone didn''t produce a significant overall effect — the lift appeared primarily among loyalty members and depended on other variables like crowd density, mode, and sensory alignment.

    '
- type: subhead
  level: 2
  text: If a 140-store study found no overall effect, doesn't that disprove the earlier research?
- type: prose
  body: 'No — it refines it. Think of it like aspirin: it works on headaches, but if you test it on 140 people and only some have headaches, the average effect looks small. The 2017 study (43,676 transactions) showed the same thing — fast music helped revenue in crowded stores but hurt it in empty ones. The effect is real but conditional. You have to manage the full set of variables.

    '
- type: subhead
  level: 2
  text: So what variables do I actually need to get right?
- type: prose
  body: 'The research identifies six: tempo, volume, mode (major/minor key), brand fit, crowd density, and sensory alignment (music + scent + lighting should match energy level). Getting one right and the others wrong can produce zero effect. For a system that manages all of these together, try Entuned free at entuned.co. Full citations in the description. This is video 7 of 50 in this series.

    '
