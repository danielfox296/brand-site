h1_1: "Can You Play Spotify in Your Store? The Legal Answer"
meta_1: Daniel Fox &middot; April 2026 &middot; 8 min read

p_takeaway: "<strong>TL;DR:</strong> No. Spotify, Apple Music, Amazon Music, and every other consumer streaming service are licensed for personal use only. Playing them in a retail store is copyright infringement. Fines start at $750 per song and can reach $150,000 per willful violation. Commercial music services run $17 to $80 per location per month and include the licensing you need."

p_1: "This is probably the most common question in retail music, and the answer is straightforward. You cannot legally play Spotify in your store. Same goes for Apple Music, Amazon Music, YouTube Music, Tidal, and every other consumer streaming platform. Their terms of service explicitly prohibit commercial use, and the distinction matters more than most retailers realize."

p_2: "The number of stores doing it anyway is substantial. And the number of stores that get caught is growing."

h2_1: How Consumer Streaming Licensing Actually Works

p_3: "When you pay $10.99 a month for Spotify Premium, you are purchasing a personal, non-commercial license. Spotify's terms of service (Section 3) state that the service is for 'personal, non-commercial, entertainment use only.' Apple Music's terms contain equivalent language. So does every other consumer platform."

p_4: "The reason is mechanical, not philosophical. Consumer streaming services pay royalties to rights holders based on per-stream rates negotiated for individual listeners. A retail store with 200 customers per day is not an individual listener. The royalty structure does not account for public performance, and the platform has not secured the public performance rights that commercial use requires."

p_5: "Public performance rights in the United States are administered by three performing rights organizations: ASCAP, BMI, and SESAC. Any music played in a commercial space, whether from a streaming service, a CD, a vinyl record, or a radio, requires a public performance license from each PRO whose catalog is represented. Consumer streaming subscriptions do not include these licenses."

p_6: "A retail store playing Spotify is, in the legal sense, performing copyrighted music publicly without authorization. The fact that you are paying for a subscription does not change this. The subscription covers personal listening. Public performance is a separate right under U.S. copyright law (17 U.S.C. &sect; 106(4)), and it requires separate authorization."

h2_2: What the Fines Look Like

p_7: "Copyright infringement penalties under U.S. law are structured to be painful. Statutory damages range from $750 to $30,000 per work infringed. For willful infringement, meaning you knew or should have known it was illegal, courts can award up to $150,000 per work."

p_8: "Per work. Not per incident. Every song played without authorization is a separate infringement. A store playing a 40-song playlist on repeat has 40 potential violations running simultaneously."

p_9: "In practice, most enforcement actions result in settlements rather than court judgments. BMI and ASCAP send cease-and-desist letters first, then escalate. Settlements for small retailers typically land in the $3,000 to $15,000 range. A juice bar in Oregon settled with ASCAP for $12,500 after refusing to stop using a consumer Pandora account. A gym in Texas paid $8,000 to BMI for similar use."

p_10: "These are not hypothetical scenarios. ASCAP, BMI, and SESAC employ field investigators who visit commercial establishments to verify licensing compliance. They also use automated monitoring tools. If your store is playing recognizable music and you do not have a commercial license on file, you will eventually receive a letter."

h2_3: The Small Retailer Exemption (and Why It Probably Does Not Apply to You)

p_11: "There is a narrow exemption in U.S. copyright law for small establishments. Under the Fairness in Music Licensing Act (Section 110(5)(B)), retail stores under 2,000 square feet can play radio or television broadcasts without a performance license, provided they use no more than six external speakers."

p_12: "Two important limitations. First, this exemption covers over-the-air radio and television broadcasts only. Streaming services, satellite radio, CDs, and digital playlists are not covered. Second, 2,000 square feet is small. Most retail locations exceed this threshold."

p_13: "If your store is under 2,000 square feet and you are playing FM radio through six or fewer speakers, you are probably fine. If you are doing anything else, the exemption does not apply."

h2_4: What Legal Commercial Music Actually Costs

p_14: "Commercial music services exist specifically to solve this problem. They bundle music streaming with the required performance licenses, so the retailer's legal exposure is covered by the subscription."

p_15: "Here is what the market looks like in 2026. Pandora CloudCover starts at $16.95 per month per location when prepaid annually. StoreStreams starts at $20 per month. SiriusXM for Business runs $26.95 to $80 per month depending on features and volume. Soundtrack Your Brand is $35 per month. Mood Media contracts typically land between $30 and $80 per location per month, often with multi-year commitments."

p_16: "For a single-location boutique, compliant music costs somewhere between $200 and $960 per year. Compare that to a single ASCAP settlement of $12,500 and the math is not complicated."

p_17: "For a 10-location chain, the annual cost for a service like CloudCover is roughly $2,000 to $3,600. SiriusXM or Soundtrack runs $3,200 to $9,600. Mood Media, with contracts and add-ons, can push past $10,000 annually. The price range is wide, but every option in it is cheaper than one enforcement action."

h2_5: What These Services Do Not Do

p_18: "Commercial music services solve the legal problem. They give you licensed music at a predictable monthly cost. Most of them also give you some control over genre, mood, and scheduling."

p_19: "What they do not do is tell you whether the music is working. They log what was scheduled to play. They do not measure what happened when it played. You get compliance and convenience. You do not get data connecting your audio environment to customer behavior, dwell time, or sales."

p_20: "For many retailers, compliance and convenience are enough. The store needs legal background music and the problem is solved. But if you are spending $300 to $600 per month per location on audio and you cannot answer the question 'is this music helping or hurting my sales,' that is a gap worth noticing."

h2_6: The AI-Generated Alternative

p_21: "There is a category of music that sidesteps the entire licensing infrastructure. AI-generated original music has no songwriters, no publishers, no PRO affiliations. It was not written by a human artist, so there are no performance rights to clear. No ASCAP fees. No BMI fees. No SESAC fees."

p_22: "This is not a loophole. The Copyright Office has consistently held that works created by AI without substantial human authorship are not eligible for copyright protection. No copyright means no infringement claim. The legal landscape is still evolving, but in 2026, multiple jurisdictions have issued guidance supporting commercial use of AI-generated music provided the underlying training data was properly licensed."

p_23: "The practical implication for retailers: AI-generated music can be played in commercial spaces without performance licenses, without PRO fees, and without the legal exposure that comes with every licensed catalog. The music can also be created specifically for your store's customer profile rather than selected from a generic catalog. That is a different proposition than picking a mood channel."

p_24: "Entuned generates original music from your customer's psychographic profile. No licensing fees. No catalog. Every track is created for your specific customer. The founding pilot is free."

