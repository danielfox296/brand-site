  - type: subhead
    level: 2
    text: "What these services don't do"
    anchor: "services-gap"

  - type: prose
    body: |
      Commercial music services solve the legal problem. They give you licensed music at a predictable monthly cost. Most of them also give you some control over genre, mood, and scheduling.

      What they do not do is tell you whether the music is working. They log what was scheduled to play. They do not measure what happened when it played. You get compliance and convenience. You do not get data connecting your audio environment to customer behavior, dwell time, or sales.

      For many retailers, compliance and convenience are enough. The store needs legal background music and the problem is solved. But if you are spending $300 to $600 per month per location on audio and you cannot answer the question "is this music helping or hurting my sales," that is a gap worth noticing. We wrote about this measurement gap in [The Metrics Your Audio Environment Should Be Producing](../blog/the-metrics-your-audio-environment-should-be-producing.html).

  - type: subhead
    level: 2
    text: "The AI-generated alternative"
    anchor: "ai-generated"

  - type: prose
    body: |
      There is a category of music that sidesteps the entire licensing infrastructure. AI-generated original music has no songwriters, no publishers, no PRO affiliations. It was not written by a human artist, so there are no performance rights to clear. No ASCAP fees. No BMI fees. No SESAC fees.

      This is not a loophole. The Copyright Office has consistently held that works created by AI without substantial human authorship are not eligible for copyright protection. No copyright means no infringement claim. The legal landscape is still evolving, but in 2026, multiple jurisdictions have issued guidance supporting commercial use of AI-generated music provided the underlying training data was properly licensed. For a side-by-side comparison of how this stacks up against traditional catalog services, see [AI vs. Traditional In-Store Music: What's Changed](../blog/ai-vs-traditional-retail-music.html).

  - type: prose
    body: |
      The practical implication for retailers: AI-generated music can be played in commercial spaces without performance licenses, without PRO fees, and without the legal exposure that comes with every licensed catalog. The music can also be created specifically for your store's customer profile rather than selected from a generic catalog. That is a different proposition than picking a mood channel.

      Entuned generates original music from your customer's psychographic profile. No licensing fees. No catalog. Every track is created for your specific customer.

