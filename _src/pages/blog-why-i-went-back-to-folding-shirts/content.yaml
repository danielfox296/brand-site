h1_1: Why I Went Back to Folding Shirts
h2_1: The Music Was a Problem
h2_2: Too Hard a Problem
h2_3: Being the New Guy
meta_1: Daniel Fox &middot; April 2026 &middot; 3 min read
btn_1: Ask About a Pilot Program

p_tldr: "<strong>TL;DR:</strong> Daniel Fox took a retail floor job at UNTUCKit after seeing a hiring sign at Park Meadows Mall. The music was wrong from day one. A conversation on the sales floor led to a question: what if the music was designed for the customer? Entuned came out of that."

p_1: "I was at Park Meadows Mall on a Friday evening, sitting in a chair designed for retired men waiting for their spouses, writing on my MacBook Air about what it costs a founder to build their identity inside their company."

p_2: I know. The irony is not lost on me.

p_3: "Park Meadows has these high, cabin-like ceilings. Wood and light and a particular kind of quiet that you don't expect from a mall. I never feel peaceful in malls. I felt peaceful there. So I kept going back, finding that chair, and working. That evening I was somewhere in the middle of an idea I'd lived personally: how the need to have your validation met through your business actually undermines your ability to serve its economic purpose. It's a piece I'm still writing."

p_4: "I had bought a black button-down from UNTUCKit a few months earlier. A Gironde tall slim, performance fabric. I didn't know any of that at the time. I just knew it fit and I liked it."

p_5: "When I got up to leave, I caught a sign out of the corner of my eye. \"Now Hiring.\""

p_6: "I didn't stop. I kept walking. But over the next few days it wouldn't leave me alone. It kept growing, the way certain things do when your intuition has decided something before your brain has caught up. By Sunday night it was loud enough that I made a deal with myself: go talk to them Monday."

p_7: "Monday came and went. Tuesday I walked in, browsed for a few minutes, and told someone I'd seen the sign and it had been in my head for days and I'd like to learn more. By Thursday I'd completed my second interview and they'd taken a chance on someone who, for nearly his entire career, had either been the boss or worked alone."

p_8: The first four weeks were genuinely disorienting. I didn't know where anything was, what anything was called, or why certain things were done certain ways. I asked a lot of questions. Probably too many. I may have gotten a reputation for it.

p_9: But the music was a problem from day one.

p_10: "The store used a service called Cloud Cover. It played songs that seemed specifically chosen to be incongruent with everything the store was trying to do, and then it repeated them, on a loop, every day. I started wondering whether the selection was driven by licensing cost rather than intention. Whether the songs nobody wanted were cheaper to clear. I asked an AI about it and got a non-answer, which felt about right."

p_11: "The incongruence wasn't subtle. Here was a store that had thought carefully about its fit, its fabric, its customer, its floor layout, its staff presentation. And then: whatever this was, on a loop, every shift."

p_12: "I'd spent years as a producer. I know what it sounds like when the wrong lever gets pulled. This was a lot of wrong levers, every day, in a room that deserved better."

p_13: "A few months in, I was on the floor with a coworker named Chance. We were somewhere between a task and a conversation and one of us said: what if the music was actually designed for the customer? What if it made them feel like this place was built for them?"

p_14: I sat on it for a week or two before doing anything with it. Then I ran it by a musical collaborator of mine, Jordan. He said it honestly sounded like too hard a problem to solve.

p_15: That's usually a good sign.

p_16: "There's something I had to reckon with during those early months at the store. I came in having scaled a company to 180 people. I knew how to run things, how to read a room at the organizational level, how to make decisions at speed. What I didn't know how to do was be the new guy."

p_17: "Being the boss, especially early and with some success behind you, forms habits in how you interact with people. Some of those habits aren't good. I wanted to get people in the door. But foot traffic was out of scope. I had to learn, slowly, how to operate without taking responsibility for everything. That recalibration is ongoing."

p_18: Some people thought I tried too hard. They were right. I was still learning what it felt like to just do the job in front of me.

p_19: The shirt job is about following my intuition into something, and discovering new things about the world and people and myself along the way.

p_20: Entuned came out of that. So did a few other things I'm still figuring out.

p_byline: Daniel<br>Founder, Entuned

p_bio: "<strong>Daniel Fox</strong> is the founder of Entuned, where he builds music systems engineered for retail customer psychology. Background in music theory, behavioral research, and data-driven product design. <a href=\"../about.html\">More about Daniel</a>"

p_cta: "Entuned was born in a store where the music didn't match the room. We built a way to make sure it does."
