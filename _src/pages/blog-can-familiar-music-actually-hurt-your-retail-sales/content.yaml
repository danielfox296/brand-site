- type: video
- type: prose
  body: 'Yes — familiar music makes customers leave faster. A study in the Journal of Business Research found that shoppers who heard recognizable songs stayed for less time but perceived their visit as longer, while unfamiliar music extended real dwell time and compressed perceived time.


    In this video I break down the familiarity paradox — why the songs your customers know are costing you sales, how cognitive hijack pulls attention from merchandise to music, and what the research says about the difference between music people like and music people recognize.

    '
- type: transcript
  chapters: *id001
- type: subhead
  level: 2
  text: Can familiar music hurt retail sales?
- type: prose
  body: 'Yes. Research shows familiar music shortens real dwell time while making customers feel like they''ve been in the store longer. Unfamiliar music does the opposite — customers stay longer but perceive the visit as shorter. The songs your customers know are pulling them toward the exit.

    '
- type: subhead
  level: 2
  text: But don't customers want to hear music they recognize?
- type: prose
  body: 'There''s a difference between music customers like and music customers recognize. The research found that preference — not familiarity — predicts shopping behavior. You can like unfamiliar music. That enjoyment drives positive behavior without the cognitive hijack that comes from recognition.

    '
- type: subhead
  level: 2
  text: So what should I actually play?
- type: prose
  body: 'Music your customers enjoy but don''t recognize. Music that matches the mood and pace of your store without triggering sing-along brain. That''s the exact problem Entuned solves — original music designed for your retail environment. Free tier at entuned.co. Full citations in the description. This is video 21 of 50 in this series.

    '
