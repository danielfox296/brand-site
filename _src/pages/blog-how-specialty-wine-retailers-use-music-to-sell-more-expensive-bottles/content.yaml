title: "How Wine Retailers Use Music to Sell Premium Bottles"
slug: "how-specialty-wine-retailers-use-music-to-sell-more-expensive-bottles"
eyebrow: "FIELD NOTES"
dek: "A 1993 study found that classical music in a wine shop moved customers toward more expensive bottles. Same wine, same prices, different receipts."
