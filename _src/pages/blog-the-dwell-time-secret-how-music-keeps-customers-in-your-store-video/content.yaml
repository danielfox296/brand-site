- type: video
- type: prose
  body: 'Music increases dwell time by up to 15 minutes per visit. A 2012 study found music (vs. silence) added 8 minutes of browsing time. A 1986 restaurant study found slow music added 11 minutes per table and lifted bar revenue by 40%.

    In this video I break down the tempo-dwell connection, the surprising "familiarity paradox" (familiar music actually shortens visits), and how musical repetition warps time perception — backed by research from the Journal of Marketing, Journal of Consumer Research, and Oxford University Press.

    '
- type: transcript
  chapters: *id001
- type: subhead
  level: 2
  text: Does store music actually affect how long customers stay?
- type: prose
  body: 'Yes, significantly. A 2012 study of 550 customers found music added 8 minutes of dwell time vs. silence. A 1986 restaurant study found slow music added 11 minutes per table and increased bar revenue by 40%. A 1999 study found slow jazz added 15 minutes per restaurant visit. The tempo-dwell connection is one of the most replicated findings in retail music research.

    '
- type: subhead
  level: 2
  text: Shouldn't I play popular songs that customers know and like?
- type: prose
  body: 'Counterintuitively, no. A 2000 study in the Journal of Business Research found that familiar music makes customers *perceive* more time passing and leave sooner. Unfamiliar music does the opposite — customers actually stay longer while feeling like less time has passed. This "familiarity paradox" means your Top 40 playlist may be shortening visits and making the store feel like a waiting room.

    '
- type: subhead
  level: 2
  text: What kind of music maximizes dwell time?
- type: prose
  body: 'The research points to slow-tempo, unfamiliar music that creates a pleasant emotional state. Avoid recognizable hits (they trigger the familiarity paradox), keep volume moderate, and match the music''s energy to your brand. Generative music platforms like Entuned are built around this — every track is unique, so the familiarity paradox never kicks in. Free to try at entuned.co. Full citations in the description. This is video 4 of 50 in this series.

    '
