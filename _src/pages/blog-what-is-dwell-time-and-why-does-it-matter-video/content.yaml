- type: video
- type: prose
  body: 'Dwell time — total time a customer spends in your store — is one of the strongest predictors of unplanned purchases, but only when paired with the right emotional state. A 1994 Journal of Retailing study found that pleasure measured at the five-minute mark predicted unplanned spending, while a 1999 restaurant study showed 15 extra minutes of dwell time produced zero additional revenue.


    In this video I explain why dwell time alone is a vanity metric, how music extends quality dwell time, and why the first five minutes of a shopping trip matter more than the total duration.

    '
- type: transcript
  chapters: *id001
- type: subhead
  level: 2
  text: What is dwell time and why does it matter?
- type: prose
  body: 'Dwell time is the total time a customer spends in your store. It matters because it predicts unplanned purchases — but only when the customer is in a positive emotional state. A 1994 study found pleasure at the five-minute mark predicted unplanned spending. Music vs. silence adds ~8 minutes of dwell time on average.

    '
- type: subhead
  level: 2
  text: Doesn't more time always mean more spending?
- type: prose
  body: 'No. A 1999 restaurant study found slow music added 15 minutes of dwell time with zero additional revenue. The extra time was passive — waiting, not emotionally engaged. Dwell time without emotional activation is just time. The feeling matters more than the duration.

    '
- type: subhead
  level: 2
  text: How do I increase quality dwell time?
- type: prose
  body: 'Three things: (1) Use curated, somewhat unfamiliar music — it stretches real time while making it feel shorter. (2) Prioritize the first five minutes — that emotional window predicts the whole visit. (3) Skip top-40 hits customers tune out and skip silence (it costs you 8 minutes). Entuned (entuned.co, free tier) engineers the emotional texture of dwell time, not just the duration. Full citations in the description. This is video 15 of 50 in this series.

    '
