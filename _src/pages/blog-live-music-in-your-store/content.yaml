sections:
  - type: key_takeaways
    items:
      - "Live music pays off on an occasion: a grand opening, a holiday open house, a customer appreciation night, a loyalty event. A performance gives people a reason to be in the store at a set hour and something to tell each other about afterward."
      - "The ordinary day belongs to the soundtrack. A band moves the tempo on the performer's terms, and a soundtrack moves it on the store's, at the level the store set, for every hour the doors are open. Entuned Free runs the ordinary day at no fee."
      - "The radio exemption in 17 U.S.C. § 110(5) covers a broadcast. A band playing copyrighted songs in your store is a public performance, and ASCAP's own FAQ says the business owner obtains the license, because the business owner is the one who benefits from the performance."
      - "Plan the night as a handoff. The soundtrack fills the set break at a level that matches the band, and the closing hour comes back down to the tempo the store plays on a regular Tuesday."

  - type: prose
    body: |
      Every so often a store has a reason for people to show up at six o'clock instead of whenever they happen to pass: a grand opening, the holiday open house, or the night you thank the customers who kept you in business all year. The question on those nights is whether to bring in a musician or let the soundtrack run.

      The answer is both, in a particular order, and it starts with what a performance does in a store full of people who came for it.

  - type: subhead
    level: 2
    text: "When does live music beat the store soundtrack?"
    anchor: "when-live-wins"

  - type: prose
    body: |
      A performance has a start time. The soundtrack is on when the doors open and off when they lock, and nobody plans a Tuesday around it. A duo playing from six to eight is an event, and an event is something a customer can put on a calendar and mention on Thursday to someone who missed it.

      Four occasions come up again and again. The grand opening, where the store has no regulars yet and the first hundred people through the door decide what they will say about it. The holiday open house, where every calendar is crowded and a live set is the reason to pick your store over the one across the street. The customer appreciation night, where the people in the building already like you and the music is how you show it. And the loyalty event, the trunk show, the product launch, any night the store invited people to, where the crowd came for something and a performer gives them that.

      There's research behind the instinct. In 2024, Wiebke Trost and colleagues, writing in <a href="https://doi.org/10.1073/pnas.2316306121" target="_blank" rel="noopener noreferrer">PNAS</a>, had pianists perform live for listeners lying in an MRI scanner and compared the response with comparable recorded music. The live performances produced higher and more consistent activity in the amygdala, the part of the brain that handles emotional response, and the listeners' brain activity locked to the music only when it was live. A 2019 study from McMaster University's LIVELab, published in <a href="https://doi.org/10.3389/fpsyg.2018.02682" target="_blank" rel="noopener noreferrer">Frontiers in Psychology</a>, measured a different signal from the outside: audience members moved their heads about twice as fast during a live concert as during playback of the same band's album, and self-described fans moved the most.

      Fans moved more whether the band was in the room or on the speakers, and everyone moved more when it was live. That is the argument for booking an act on a night people are already coming for. Notice, too, what the scanner rewarded. The pianists in Trost's study were playing to the listeners' responses as they happened, and the coupling between the music and the brain showed up only when they could. That responsiveness is the same thing <a href="../blog/the-pianist-in-the-store.html">Nordstrom's pianists</a> were prized for, from 1985 until the last one closed the lid in 2019 or 2020.

  - type: subhead
    level: 2
    text: "When is the soundtrack still the better tool?"
    anchor: "when-the-soundtrack-wins"

  - type: prose
    body: |
      Every ordinary day. A store is open something like ten hours, and the person behind the register hears every minute of it, five days a week. Nordstrom put pianists on its floors in 1985 and spent more than a decade taking them off: recorded music in the Seattle stores by 2007, two days a week in thirty stores by 2013, the last one gone by 2020. The company's stated reason was that recorded music was "more modern." Whatever the reason, the ordinary day was what the live program lost first.

      Milliman showed in <a href="../blog/the-supermarket-study.html">1982</a> that slower music slowed shoppers down and lifted daily sales. What a store needs from that finding is control of the tempo, and control is where the two tools differ. An act booked for a party drifts upward on purpose, because a performance is built to lift a crowd, and the drift is the point of a Friday night in December. On a Tuesday afternoon in March the same drift moves customers out the door faster than they came in. The soundtrack moves the tempo on the store's terms: it plays the tempo the store chose and changes when the store says so, which is the whole reason a store can run one tempo in the morning and another at closing.

      Then there's recognition. Cover bands play songs the crowd knows, because that is what a crowd wants from a band. In 2000, Yalch and Spangenberg found that shoppers browsing under familiar music left sooner while believing they had stayed longer. On event night that recognition is what the crowd came for. On an ordinary afternoon a song the shopper knows tells her roughly how long she has been standing in the aisle, and <a href="../blog/why-hit-songs-make-bad-store-music.html">our post on why hit songs make bad store music</a> goes through the mechanism.

      And the cost is shaped differently. A booking is one evening's fee with a date on it; the soundtrack is a monthly fee for every hour the store is open, and Entuned Free streams its shared catalogue for nothing.

  - type: subhead
    level: 2
    text: "Does the radio exemption cover a live band?"
    anchor: "exemption"

  - type: prose
    body: |
      No, and this is the part operators miss. The store takes on the obligation the moment the band starts, whether anyone planned for it or not.

      The exemption most small stores lean on, <a href="https://www.law.cornell.edu/uscode/text/17/110" target="_blank" rel="noopener noreferrer">17 U.S.C. § 110(5)(B)</a>, covers the communication of a transmission: a licensed radio or television broadcast played in a store under 2,000 square feet, or in a larger store that stays inside the statute's loudspeaker limits. The operative word is transmission. A guitarist playing Van Morrison by the register is a public performance of a copyrighted song, and the exemption says nothing about her.

      Who holds the license is settled too. <a href="https://www.ascap.com/help/ascap-licensing" target="_blank" rel="noopener noreferrer">ASCAP's licensing FAQ</a> takes the question head on: some people assume the musicians must obtain the license, the law says everyone who participates in or is responsible for a performance is liable, and since the business owner gets the benefit of the performance, the business owner obtains the license. A band that plays covers in your store exposes the store to the statutory damages below, unless your license already covers live performance or the act plays material no performing rights organization (PRO) represents.

  - type: stat_callout
    number: "$750–$30,000"
    label: "Statutory damages per infringed work for an unlicensed public performance, rising to as much as $150,000 per work when the infringement is willful"
    source: "17 U.S.C. § 504(c)"
    accent: gold

  - type: aside
    title: "Quick test: does the band need you to hold a license?"
    body: |
      Ask the act two things: what they play, and whether their own songs are registered with a PRO. Covers of songs you would hear on the radio are public performances of someone else's work, and the store is the party the PROs license for them. Originals by a writer who is an ASCAP or BMI member are performances the store licenses too. Originals by a writer with no PRO affiliation are one of the two cases no PRO can collect on; the other is music in the public domain. The first is the same reason Entuned's catalogue carries no PRO fee. The radio exemption applies to none of it, because nothing is being broadcast.

  - type: pullquote
    text: "The radio exemption covers a broadcast. A band playing in your store is a performance, and the store is the party the PROs license."
    accent: teal

  - type: subhead
    level: 2
    text: "What to settle before the band arrives"
    anchor: "before-you-book"

  - type: prose
    body: |
      Settle four things a few weeks out.

      Volume comes first. <a href="../retail-music-decibel-guide.html">Our decibel guide</a> puts an apparel floor at 60 to 68 dB, under the 70 dB line it marks as the World Health Organization's threshold, and an acoustic drum kit plays well above that in any store. Ask for a lineup that fits the floor, such as a solo guitarist, a duo or a drummerless jazz trio, and ask what level they play at when they are booked as background for a dinner.

      The handoff comes next. A band plays a set and takes a break, and the break is when your soundtrack has to be ready at a level that matches, so the floor does not go from a trio to silence to a jolt. Tell the act what will be playing when they stop, and set the closing hour to come back down to the store's everyday tempo before the last customers leave.

      Power and floor space are the third question, and the act will tell you if you ask: how many outlets and how much floor they need, and how long they need in the store before the doors open.

      The last question is the act itself. A local booking agency will know who plays at conversation volume, and so will the events desk at a hotel you already use. On Colorado's Front Range, <a href="https://signetartists.com/corporate/">Signet Artists, a Denver live music agency</a>, books acts for business events in the city and the mountain towns, and it is our founder's company.

  - type: subhead
    level: 2
    text: "Where Entuned fits"
    anchor: "where-entuned-fits"

  - type: prose
    body: |
