llms_description: "When a retail store should bring in live music instead of its soundtrack: grand openings, holiday open houses, customer appreciation nights and loyalty events. Why recorded music runs the ordinary day (tempo the store controls, volume, familiarity, cost), and why the 17 U.S.C. 110(5) radio exemption does not cover a live band: the business owner, not the musician, obtains the license (ASCAP FAQ). Cites Trost et al. 2024 (PNAS) and Swarbrick et al. 2019 on live versus recorded music."
