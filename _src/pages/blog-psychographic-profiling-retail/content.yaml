  - type: subhead
    level: 2
    text: "How to start"

  - type: prose
    body: |
      The right questions are simpler than most retailers expect. What values drive your customer to choose you over the alternatives? What aesthetic universe do they inhabit at home? What emotional state do they want to feel in your space? What would feel wrong or inauthentic to them?

      Honest answers to those questions give you a psychographic profile. Translating that profile into a musical specification that produces the right behavioral effects in your store is the hard part. It requires the right framework, the right generation technology, and the right [measurement infrastructure](../blog/measure-roi-retail-music.html).

