- type: video
- type: prose
  body: 'Music increases dwell time by up to 15 minutes per visit. A 2012 study found music (vs. silence) added 8 minutes of browsing time. A 1986 restaurant study found slow music added 11 minutes per table and lifted bar revenue by 40%.

    In this video I break down the tempo-dwell connection, the surprising "familiarity paradox" (familiar music actually shortens visits), and how musical repetition warps time perception — backed by research from the Journal of Marketing, Journal of Consumer Research, and Oxford University Press.

    '
- type: prose
  body: What if your background music is literally pushing customers out the door faster — and you have no idea? The research says there’s a version of your store where customers stay 11 minutes longer, order 3 extra drinks, and feel like they were there for less time. Same store. Same staff. Different music.
- type: subhead
  text: The Restaurant Study
- type: prose
  body: 'That 11-minute figure comes from a study published in the Journal of Consumer Research in 1986. Researchers ran a controlled experiment in a restaurant, alternating between slow-tempo and fast-tempo background music across different service periods. When slow music played, diners stayed an average of 11 minutes longer per table. But here’s where the money is: those extra minutes translated into roughly 3 additional drinks per table — pushing bar revenue up by approximately 40%. The food spending was essentially the same. The music didn’t make people hungrier. It made them comfortable enough to linger, and that lingering turned into beverage purchases.'
- type: subhead
  text: Music Versus Silence
- type: prose
  body: Now you might wonder — is any music better than no music at all? Emphatically yes. A 2012 study published in the Journal of Retailing and Consumer Services tracked 550 shoppers and found that stores playing music — regardless of genre or tempo — saw customers dwell an average of 8 minutes longer than stores operating in silence. Eight minutes. And that extended dwell time came with increased spending. Silence isn’t neutral. Silence is uncomfortable. It makes people self-conscious, aware of their own footsteps, aware they’re being watched. Music fills that void and gives people permission to browse.
- type: subhead
  text: The Time Distortion Paradox
- type: prose
  body: But here’s where it gets genuinely weird. A study in the Journal of Business Research discovered that music doesn’t just change how long people stay — it warps how long they think they stayed. When shoppers heard unfamiliar music, they actually spent more time in the store. But they perceived their visit as shorter. Familiar music did the exact opposite — people left sooner but felt like they’d been there longer. Read that again. Unfamiliar music creates a time distortion where customers browse longer but feel less fatigued by the experience. You’re essentially getting free dwell time — time that doesn’t cost the customer any patience.
- type: subhead
  text: Tempo As a Dial, Not a Switch
- type: prose
  body: 'A massive study from the Journal of Retailing analyzed 43,676 shopping baskets and found something retailers need to understand: tempo’s effect on dwell time isn’t universal — it depends on store density. When a store was crowded, fast-tempo music actually improved outcomes by roughly 8%. Why? Because in a dense environment, slow music creates a bottleneck. People feel stuck. Fast music gives them energy to navigate the crowd efficiently and still buy. But in an empty store, slow tempo wins because you want people to decelerate and explore. Tempo isn’t a set-it-and-forget-it decision. It’s a dial you should be adjusting based on real-time conditions.'
- type: subhead
  text: The Entuned Connection
- type: prose
  body: 'This is exactly the problem Entuned solves. Most stores pick one playlist and run it all day — same tempo at 10 AM when the store is empty as at 2 PM when it’s packed. We built a system that adapts. Because the research is clear: the optimal music for dwell time at low traffic is the opposite of what works at high traffic. Entuned generates music that shifts with your store’s actual conditions, so you’re always running the right tempo for the right moment. No manual playlist swapping. No guessing.'
- type: transcript
  chapters: *id001
- type: subhead
  level: 2
  text: Does store music actually affect how long customers stay?
- type: prose
  body: 'Yes, significantly. A 2012 study of 550 customers found music added 8 minutes of dwell time vs. silence. A 1986 restaurant study found slow music added 11 minutes per table and increased bar revenue by 40%. A 1999 study found slow jazz added 15 minutes per restaurant visit. The tempo-dwell connection is one of the most replicated findings in retail music research.

    '
- type: subhead
  level: 2
  text: Shouldn't I play popular songs that customers know and like?
- type: prose
  body: 'Counterintuitively, no. A 2000 study in the Journal of Business Research found that familiar music makes customers *perceive* more time passing and leave sooner. Unfamiliar music does the opposite — customers actually stay longer while feeling like less time has passed. This "familiarity paradox" means your Top 40 playlist may be shortening visits and making the store feel like a waiting room.

    '
- type: subhead
  level: 2
  text: What kind of music maximizes dwell time?
- type: prose
  body: 'The research points to slow-tempo, unfamiliar music that creates a pleasant emotional state. Avoid recognizable hits (they trigger the familiarity paradox), keep volume moderate, and match the music''s energy to your brand. Generative music platforms like Entuned are built around this — every track is unique, so the familiarity paradox never kicks in. Free to try at entuned.co. Full citations in the description. This is video 4 of 50 in this series.

    '
- type: prose
  body: 'For how those longer visits convert into sales, see <a href="../how-to-improve-retail-conversion-rate.html">the conversion side of the same visit</a>.'
