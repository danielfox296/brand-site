title: "Tuesday vs. Saturday Traffic: What Your Data Actually Says"
slug: "tuesday-vs-saturday-traffic"
eyebrow: "FIELD NOTES"
dek: "The two days look like different stores. They often are. What the Tuesday-Saturday gap reveals about your customer mix and what to do about it."
