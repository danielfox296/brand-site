  text: Can the wrong music actually reduce sales?
- type: prose
  body: 'Absolutely. In a controlled study, pop music in a restaurant produced spending statistically identical to silence — zero lift. Meanwhile, mismatched music actively damages brand perception and reduces customers'' intention to return. The wrong music isn''t neutral. It costs money.

    '
- type: subhead
  level: 2
  text: What about playing it safe with something upbeat and slow?
- type: prose
  body: 'That combination — slow tempo, major key — actually cancels itself out. Research shows slow tempo with minor key produces about a 12% spending lift, but switching to major key completely eliminates the benefit. The "safe" choice turns out to be the one that neutralizes your best lever.

    '
- type: subhead
  level: 2
  text: So how do I know what's right for my store?
- type: prose
  body: 'It depends on your products, your brand, and your customer context. Classical works for hedonic luxury products but not for utilitarian ones. The answer isn''t guessing — it''s using music generated for your specific retail environment. Entuned builds this from scratch. Free tier at entuned.co. Full citations in the description. This is video 25 of 50 in this series.

