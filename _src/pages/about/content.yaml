p_1: Why Entuned Exists
p_2: Walk into most multi-location retailers and the music sounds like it was chosen by a vendor who never visits the store. Mood Media, Soundtrack Your Brand, the rest of the catalog incumbents, all sell the same thing. A customer picks a genre, picks a mood, pipes it through the ceiling speakers. Whether any of it moves a shopper to stay longer or spend more, nobody is asked, and nobody answers. Retail analytics vendors wire up thousands of stores with sensors that count every footstep. The audio running over those shoppers has never been part of the conversation.
p_3: Researchers have known for decades that music changes how customers behave in stores. Areni and Kim showed in 1993 that shoppers in a wine store spent more when the background music matched the merchandise. Milliman ran the foundational tempo studies in 1982 and 1986. North and Hargreaves kept adding to the literature through the 1990s and 2000s. These are cited, replicated, public findings. They sat in peer-reviewed journals while an entire industry kept selling playlists.
p_4: In late 2024, two things happened at once.
p_5: Generative music got good. A composer working with the current tools can produce a finished track that sounds like a record, not a toy. Daniel can compose original pieces without licensing constraints, without catalog limits, and without the lyrical content a family retailer cannot put over its speakers. This is original music made for a specific purpose, not a track pulled from a library someone else also pays to use.
p_6: At roughly the same time, retail analytics platforms opened their store-level behavioral data through API. Foot traffic, dwell, conversion, transaction counts. The sensor infrastructure was already there. What was missing was anyone doing anything with the audio side of the store that could be measured against it.
p_7: The pieces were on the table. Somebody needed to understand both sides well enough to connect them.
p_8: Daniel Fox bootstrapped Skreened to eight-figure annual revenue in six years. 180 employees, multiple production facilities, and in 2013 dual recognition as one of Ohio's fastest-growing companies and one of its best places to work. After exiting, he went back to a long-standing interest in music as a technical discipline. Working as a producer and composer, he built a working model of how specific musical choices shape how customers feel and behave in stores.
p_9: That model became the basis of Entuned. We make original music for multi-location lifestyle retailers and measure whether it moves the numbers that already matter to their operators. There is a <a href="science.html">patent-pending</a> element to the work. We are not publishing the details.
p_10: He also noticed something the music business kept missing. The value was never in the songs. The value was in proof that a store's music changed how the store performed. Denver, CO.
p_11: Entuned makes and streams original soundtracks inside retail stores and reads the behavioral data the retailer already collects. The pilot starts with an intake that produces a brand brief — the ceiling the system never operates outside of. Tempo range, mood vocabulary, lyrical guidelines, what the brand should never sound like. The brand's point of view is the starting point. The measurement proves it's working.
p_12: The pilot is free. The music is original. The retailer owns the result.
p_13: Every pilot answers one question the current music industry cannot. Does this music make this store perform better than the music it had before. That is the question multi-location operators have been asking quietly for years.
p_14: Mood Media has 500,000 locations under contract and no measurement story to tell any of them. The missing piece has always been proof.
p_15: That is the work.
