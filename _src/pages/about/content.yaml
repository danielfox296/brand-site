h2_2: Mrinmayi Katti
p_17: Mrinmayi builds the infrastructure that makes data credible. At Loxo, she designed distributed migration workflows processing 200K+ records per run at 99%+ data integrity and shipped containerized pipelines on Kubernetes for production-grade reliability. At Reliance Jio, her A/B testing pipelines contributed to an 18% retention lift at scale.
p_18: At Entuned, she owns the measurement layer — the system connecting behavioral and environmental signals to verified commercial outcomes. Every store-hour of playback produces correlation data, and she is the person making sure that data holds up.
