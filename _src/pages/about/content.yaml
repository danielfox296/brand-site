h2_2: Mrinmayi Katti
p_17: Mrinmayi builds the data pipes that make the measurement trustworthy. At Loxo she designed distributed migration workflows that moved 200K+ records per run at 99%+ data fidelity and shipped containerized pipelines on Kubernetes for production reliability. At Reliance Jio her A/B testing work contributed to an 18% retention lift at scale.
p_18: At Entuned she owns the measurement side of the pilot. When a retailer asks whether the music moved conversion in a specific store on a specific Tuesday, she is the person who can answer.
