  <!-- First-touch signup attribution. Stamps a `.entuned.co` cookie on the
       FIRST page view so the original source (referrer + UTM) survives the
       entuned.co -> app.entuned.co/start hop. The dashboard's /start reads the
       same cookie (same name + shape) and forwards it to the server. Runs
       early + first-touch-wins so it never overwrites the true upstream. -->
  <script>
    (function () {
      try {
        if (/(?:^|; )entuned_attr=/.test(document.cookie)) return;
        var p = new URLSearchParams(window.location.search);
        var payload = {
          r: document.referrer || undefined,
          lp: (window.location.pathname + window.location.search) || undefined,
          us: p.get('utm_source') || undefined,
          um: p.get('utm_medium') || undefined,
          uc: p.get('utm_campaign') || undefined,
          ut: p.get('utm_term') || undefined,
          un: p.get('utm_content') || undefined,
          t: new Date().toISOString()
        };
        var host = window.location.hostname;
        var domain = (host === 'entuned.co' || /\.entuned\.co$/.test(host)) ? '; domain=.entuned.co' : '';
        document.cookie = 'entuned_attr=' + encodeURIComponent(JSON.stringify(payload)) +
          '; path=/' + domain + '; max-age=' + (30 * 24 * 60 * 60) + '; SameSite=Lax';
      } catch (e) { /* best-effort */ }
    })();
  </script>

  <style>
/* WIR Studio — creator-only episode picker. Dark, dense, keyboard-friendly. */
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  background: #0a0a0a; color: #eaeaea;
  font-family: 'Inter','Helvetica Neue',Arial,sans-serif;
  min-height: 100vh;
}
body { padding: 0 !important; margin: 0 !important; }
main, .main { padding: 0 !important; margin: 0 !important; max-width: none !important; width: 100% !important; }

.studio-wrap {
  max-width: 1100px;
  margin: 0 auto;
  padding: 36px 28px 80px;
}

.studio-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 24px;
  margin-bottom: 24px;
  border-bottom: 1px solid #222;
  padding-bottom: 16px;
}
.studio-head h1 {
  font-size: 22px;
  font-weight: 800;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  margin: 0;
}
.studio-head .ep-count {
  font-size: 13px;
  color: #888;
  font-variant-numeric: tabular-nums;
}

.studio-search {
  width: 100%;
  background: #141414;
  border: 1px solid #2a2a2a;
  color: #fff;
  padding: 10px 14px;
  font-size: 14px;
  border-radius: 6px;
  margin-bottom: 18px;
  font-family: inherit;
}
.studio-search:focus { outline: none; border-color: #ff2d55; }

.ep-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.ep-row {
  display: grid;
  grid-template-columns: 56px 1fr auto;
  align-items: center;
  gap: 14px;
  padding: 12px 14px;
  background: #141414;
  border: 1px solid #1f1f1f;
  border-radius: 6px;
  transition: border-color 0.12s, background 0.12s;
}
.ep-row:hover { border-color: #333; background: #181818; }

.ep-num {
  font-size: 13px;
  font-weight: 700;
  color: #ff2d55;
  letter-spacing: 0.05em;
  font-variant-numeric: tabular-nums;
}
.ep-meta { min-width: 0; }
.ep-title {
  font-size: 15px;
  font-weight: 600;
  color: #fff;
  margin: 0 0 2px;
  letter-spacing: 0.01em;
}
.ep-sub {
  font-size: 12px;
  color: #888;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.ep-actions { display: flex; gap: 8px; }

  font-family: inherit;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  border: 1px solid #2a2a2a;

  color: #fff;

<body>
  

  <main>
  <div class="studio-wrap">
  <div class="studio-head">
    <h1>WIR Studio</h1>
    <div class="ep-count" id="ep-count">— episodes</div>
  </div>

  <input type="text" id="studio-search" class="studio-search" placeholder="Search episodes…" autofocus>

  <div class="ep-list" id="ep-list">
    <div class="empty">Loading episodes…</div>
  </div>
</div>

<script>
(async()=>{
  const list = document.getElementById('ep-list');
  const search = document.getElementById('studio-search');
  const count = document.getElementById('ep-count');
  let episodes = [];
  try{
    const resp = await fetch('data/wir/episodes.json', {cache: 'no-store'});
    const data = await resp.json();
    episodes = (data.episodes || []).slice().sort((a,b)=>a.number-b.number);
  }catch(e){
    list.innerHTML = '<div class="empty">Failed to load episode data: '+e.message+'</div>';
    return;
  }
  count.textContent = episodes.length + ' episodes';

  function render(filter){
    const q = (filter||'').trim().toLowerCase();
    const filtered = q ? episodes.filter(e =>
      String(e.number).includes(q) ||
      (e.title||'').toLowerCase().includes(q) ||
      (e.songs||[]).some(s => (s.title||'').toLowerCase().includes(q) || (s.artist||'').toLowerCase().includes(q))
    ) : episodes;
    if(filtered.length === 0){
      list.innerHTML = '<div class="empty">No matches.</div>';
      return;
    }
    list.innerHTML = filtered.map(e => {
      const songs = (e.songs||[]).map(s=>s.title).join(' · ');
      const num = String(e.number).padStart(2,'0');
      const notesBtn = (e.notes && e.notes.length)
        ? '<button class="btn btn-notes" data-ep="'+e.number+'">Notes</button>'
        : '<button class="btn" disabled title="No notes for this episode">Notes</button>';
      return ''
        + '<div class="ep-row">'
        +   '<div class="ep-num">EP '+num+'</div>'
        +   '<div class="ep-meta">'
        +     '<div class="ep-title">'+escapeHtml(e.title||'')+'</div>'
        +     '<div class="ep-sub">'+escapeHtml(songs)+'</div>'
        +   '</div>'
        +   '<div class="ep-actions">'
        +     notesBtn
        +     '<a class="btn btn-play" href="will-it-retail-game.html?ep='+e.number+'">Play</a>'
        +   '</div>'
        + '</div>';
    }).join('');
  }
  function escapeHtml(s){return s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

  list.addEventListener('click', (e)=>{
    const btn = e.target.closest('.btn-notes');
    if(!btn) return;
    const ep = btn.dataset.ep;
    // Pop into its own window so it lives separately from the recording surface
    window.open('wir-notes.html?ep='+ep, 'wir-notes-'+ep, 'width=520,height=900');
  });

  search.addEventListener('input', e => render(e.target.value));
  render('');
})();
</script>
  </main>

  <script>
    // Navigation active state
    const navLinks = document.querySelectorAll('.nav-links a');
    navLinks.forEach(link => {
      if (link.href === window.location.href) {
        link.classList.add('active');
        link.setAttribute('aria-current', 'page');
      }
    });

    // Intersection Observer for fade-up animations
    const observerOptions = {
      threshold: 0.1,
      rootMargin: '0px 0px -50px 0px'
    };

    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
          observer.unobserve(entry.target);
        }
      });
    }, observerOptions);

    document.querySelectorAll('.fade-up, .fade-in').forEach(el => {
      observer.observe(el);
    });

    // Mobile menu toggle
    const menuToggle = document.querySelector('.mobile-menu-toggle');
    const navLinksEl = document.querySelector('.nav-links');
    if (menuToggle && navLinksEl) {
      menuToggle.addEventListener('click', () => {
        const isOpen = navLinksEl.classList.toggle('mobile-open');
        menuToggle.textContent = isOpen ? '✕' : '☰';
        menuToggle.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
      });
    }

    // Nav dropdown toggle (mobile)
    document.querySelectorAll('.nav-dropdown-trigger').forEach(trigger => {
      trigger.addEventListener('click', (e) => {
        e.preventDefault();
        const dropdown = trigger.closest('.nav-dropdown');
        dropdown.classList.toggle('open');
      });
    });

    // Accordion toggle
    document.querySelectorAll('.accordion-trigger').forEach(trigger => {
      trigger.addEventListener('click', () => {
        const accordion = trigger.parentElement;
        const isOpen = accordion.getAttribute('data-open') === 'true';
        accordion.setAttribute('data-open', isOpen ? 'false' : 'true');
        trigger.setAttribute('aria-expanded', isOpen ? 'false' : 'true');
      });
    });

  </script>
